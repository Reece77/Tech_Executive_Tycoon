# The Playwright flows (`make e2e`) on every pull request into main and every push to main, so main
# can't merge with broken browser flows (product manager, 2026-11-08, after M15a merged with
# failing e2e flows). Free now that the repository is public. Also on demand from the Actions tab.
#
# M59: four shards in parallel (`playwright test --shard=N/4`, split by measured file time:
# frontend/e2e/shard-reporter.ts and e2e/durations.json), each with its own API, launcher, Vite
# server and save folder, as `make e2e` has on one machine. The summary job `e2e` is the check
# the "Main" ruleset requires: it fails unless all four shards succeeded. docs/ci.md.
name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # M59: 45 minutes a shard (the brief; 150 for the single job before). The guard in
    # backend/tests/unit/test_ci_shards.py warns at 70% of it and fails at 90%.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: make e2e-shard SHARD=${{ matrix.shard }}
        env:
          TST_E2E_DURATIONS_OUT: ${{ github.workspace }}/e2e-durations/shard-${{ matrix.shard }}.json
        run: make e2e-shard SHARD=${{ matrix.shard }}

      - name: Upload file times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-durations-${{ matrix.shard }}
          path: e2e-durations/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  e2e:
    name: e2e
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "e2e shards: $RESULT"
          test "$RESULT" = success
