# Runs `make check` (backend lint, types, tests; API client sync; frontend lint, types,
# tests) on every push and pull request, as two matrix jobs on 2-core runners: `make check-ci-1`
# (backend lint, types, test shard 1) and `make check-ci-2` (API sync, frontend, test shard 2).
# Shards are balanced by tests/durations.json. The Playwright smoke test (`make e2e`) stays local.
# Shard 1 then runs the turn-time budgets alone (`make check-timing`).
name: check

on:
  push:
  pull_request:

concurrency:
  # Runs on main each get their own group, so a later push (a docs commit, say) never cancels a
  # milestone merge's check: tag-milestone tags only after that check succeeds. Branch runs
  # still cancel their older runs.
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: make check-ci-${{ matrix.shard }}
        run: make check-ci-${{ matrix.shard }}

      # The turn-time budgets (1.0 s a turn), alone and without xdist once the parallel suite is
      # done, so they measure on an otherwise idle runner (M14, product manager 2026-11-06).
      - name: make check-timing
        if: matrix.shard == 1
        run: make check-timing
