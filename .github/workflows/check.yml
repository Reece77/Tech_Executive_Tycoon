# Runs `make check` (backend lint, types, tests; API client sync; frontend lint, types,
# tests) on every push and pull request, as two matrix jobs on 2-core runners: `make check-ci-1`
# (backend lint, types, test shard 1) and `make check-ci-2` (API sync, frontend, test shard 2).
# Shards are balanced by tests/durations.json. The Playwright smoke test (`make e2e`) stays local.
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: make check-ci-${{ matrix.shard }}
        run: make check-ci-${{ matrix.shard }}
