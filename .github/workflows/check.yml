# Runs `make check` (backend lint, types, tests; API client sync; frontend lint, types, tests;
# the turn-time budgets) on every push and pull request. M59: four matrix jobs on 2-core runners,
# `check (shard N/4)` running `make check-ci-N` (backend tests split by tests/durations.json;
# lint and types in shard 1, the API sync in 2, the front end in 3), and `check (timing)` running
# `make check-timing` alone on its own runner. The summary job `check` is the check the "Main
# protection" ruleset requires: it fails unless all five succeeded. The Playwright flows are
# e2e.yml. docs/ci.md.
name: check

on:
  push:
  pull_request:

concurrency:
  # Runs on main each get their own group, so a later push (a docs commit, say) never cancels a
  # milestone merge's check: tag-milestone tags only after that check succeeds. Branch runs
  # still cancel their older runs.
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shard:
    name: check (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # M59: 30 minutes a shard (the brief; 60 for each of two shards before). The guard in
    # backend/tests/unit/test_ci_shards.py warns at 70% of it and fails at 90%.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: make check-ci-${{ matrix.shard }}
        run: make check-ci-${{ matrix.shard }}

  # The turn-time budgets (1.0 s a turn), without xdist and alone on their runner, so they
  # measure on an otherwise idle machine (M14, product manager 2026-11-06). No `needs:`: a job
  # has its runner to itself either way (M59).
  timing:
    name: check (timing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      # M60: the late v6 saves (January 2069 and December 2100) built by timing-saves.yml, the
      # newest kept for this branch or main; without one its guard skips (docs/ci.md).
      - name: Restore the 2069 save
        uses: actions/cache/restore@v4
        with:
          path: /tmp/tst-timing/m60_2069.tst.sqlite
          key: timing-save-2069-${{ github.sha }}
          restore-keys: timing-save-2069-

      - name: Restore the 2100 save
        uses: actions/cache/restore@v4
        with:
          path: /tmp/tst-timing/m60_2100.tst.sqlite
          key: timing-save-2100-${{ github.sha }}
          restore-keys: timing-save-2100-

      - name: make check-timing
        run: make check-timing TIMING_SAVE_DIR=/tmp/tst-timing

  check:
    name: check
    needs: [shard, timing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the timing job passed
        env:
          SHARDS: ${{ needs.shard.result }}
          TIMING: ${{ needs.timing.result }}
        run: |
          echo "check shards: $SHARDS, timing: $TIMING"
          test "$SHARDS" = success && test "$TIMING" = success
