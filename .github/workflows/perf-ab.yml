# TEMPORARY (M35a): main and this branch timed on one runner, on one 2039 full_integrator save,
# alternately, so a runner's speed cannot decide the comparison. Removed before the merge.
name: perf-ab

on:
  push:
    paths: [.github/workflows/perf-ab.yml]

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install both
        run: |
          git worktree add ../main-wt origin/main
          uv sync --project backend --locked
          uv sync --project ../main-wt/backend --locked
      - name: Build the save (main's code)
        working-directory: ../main-wt
        run: uv run --project backend python tools/v6_save.py /tmp/tst-v6 v6i --strategy full_integrator
      - name: Alternate main and branch, three times each
        run: |
          for i in 1 2 3; do
            for d in ../main-wt/backend backend; do
              (cd $d && TST_V6_SAVE=/tmp/tst-v6/v6i.tst.sqlite TST_M30_MEDIAN_MS=5000 uv run pytest -q -n 0 -s -m weekly tests/integration/test_m30_perf.py tests/integration/test_v6_perf.py 2>&1 | grep -E "^(V6|\.?M30):" | sed "s#^#$d #") || true
            done
          done
