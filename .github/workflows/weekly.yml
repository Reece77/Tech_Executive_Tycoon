# The v2 30-year balance targets (M15a, docs/formulas.md 30.7): V1 over 30 seeds, V5's
# steady_regions and research_heavy runs to December 2039, and V6's turn time on a 2039
# stage-4 save built from a 30-year run, and (from 2026-11-08) V1-V4's 10-year run over 11
# strategies, which pushed the nightly past two hours. The nightly keeps the milestone guards. Sundays, and on
# demand from the Actions tab. M23b adds the v3 targets (tst.balance.v3): the chain's shocks, 20
# years of the founder-played strategies, the v3 scripts to 2039, and V6 on a full_integrator save.
# M27b adds its chain targets (full_integrator automated from 2025 to 2039). M35b adds the v4
# targets (tst.balance.v4) in three seed shards, each uploading its runs, and M31-M34's targets.
# M43 adds the v5 targets (tst.balance.v5): every strategy to 2039 in three seed shards and the
# v5 strategies to 2069 with a family, each uploading its runs.
name: weekly

on:
  schedule:
    - cron: "41 4 * * 0" # 04:41 UTC on Sundays
  workflow_dispatch:
    inputs:
      parts:
        description: 'JSON list of make targets to run (M36p: e.g. ["weekly-v6", "weekly-v6-integrator"]); empty runs all'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  weekly:
    name: weekly (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub-hosted maximum (M43: the v5 shards)
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts || '["weekly-v1to4", "weekly-v1", "weekly-v5", "weekly-v6", "weekly-v3-shocks", "weekly-v3-integration", "weekly-v3-long", "weekly-v6-integrator", "weekly-m37", "weekly-m45", "weekly-m52", "weekly-m27b", "weekly-v4-a", "weekly-v4-b", "weekly-v4-c", "weekly-v4-systems", "weekly-m43-a1", "weekly-m43-a2", "weekly-m43-b1", "weekly-m43-b2", "weekly-m43-c1", "weekly-m43-c2", "weekly-m43-d1", "weekly-m43-d2", "weekly-m43-d3", "weekly-m43-d4"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make ${{ matrix.part }}
        run: make ${{ matrix.part }}

      - name: Upload the v4 runs (M35b)
        if: always() && startsWith(matrix.part, 'weekly-v4-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.part }}
          path: /tmp/tst-v4/*.json
          if-no-files-found: ignore

      - name: Upload the v5 runs (M43)
        if: always() && startsWith(matrix.part, 'weekly-m43-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.part }}
          path: /tmp/tst-v5/*.json
          if-no-files-found: ignore
