# TEMPORARY (M33): records M30's state hashes on CI's Linux runner (the fixture's platform),
# comparing each month without M33's fields against main's fixture first. Removed in the next commit.
name: m33-record
on:
  push:
    branches: [m33-equipment]
    paths: [.github/workflows/m33-record.yml, tools/m33_state_record.py]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --locked
      - run: uv run --project backend python tools/m33_state_record.py --write --workers 4 | tee record.log
      - uses: actions/upload-artifact@v4
        with:
          name: m33-state
          path: |
            backend/tests/fixtures/m30_state_hashes.json
            record.log
