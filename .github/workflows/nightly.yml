# The long balance runs (M7a, Reece's D4a): `make balance` prints the docs/balance-targets.md table,
# then `make nightly` runs every test marked `nightly` (on CI: three matrix jobs, M10d) (the balance targets in full and the
# statistical tests that PR CI skips). Every night, and on demand from the Actions tab.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    # M10d: `make balance` alone (it gates S2, the run's worker-minutes, on a machine it does not
    # share) and the nightly tests in two shards, so no job nears the time limit.
    name: nightly (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [balance, nightly-ci-1, nightly-ci-2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make ${{ matrix.part }}
        run: make ${{ matrix.part }}
