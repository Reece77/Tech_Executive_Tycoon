# The long balance runs (M7a, Reece's D4a): `make balance` prints the docs/balance-targets.md table,
# then `make nightly` runs every test marked `nightly` (on CI: three matrix jobs, M10d) (the balance targets in full and the
# statistical tests that PR CI skips). Every night, and on demand from the Actions tab.
# M59: it also measures every `check` test and every Playwright file on CI and uploads fresh
# duration files as the `durations` artifact (no pull request; docs/ci.md).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the scheduled run when `main` has not changed in the last 25 hours (Reece, 2026-11-04):
  # the results would only repeat the last night's. A manual run (workflow_dispatch) always runs.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since="25 hours ago" --oneline | wc -l)
          echo "commits on main in the last 25 hours: $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    # M10d: `make balance` alone (it gates S2, the run's worker-minutes, on a machine it does not
    # share) and the nightly tests in four shards (two took over 45 minutes each on CI).
    name: nightly (${{ matrix.part }})
    runs-on: ubuntu-latest
    # M15a: 60 -> 120; shard 1 passed 60 minutes with V1-V4's nine strategies and AI arms
    # M43: 120 -> 180; listed companies from 2015 (the real-listings IPO floor) lengthen the balance
    # runs, and shard 3 already passed 120 on main (six shards: a v6 follow-up)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # M46: six shards, balanced by the nightly tests' measured durations (tests/durations.json)
        part: [balance, "nightly-ci SHARD=1", "nightly-ci SHARD=2", "nightly-ci SHARD=3", "nightly-ci SHARD=4", "nightly-ci SHARD=5", "nightly-ci SHARD=6"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make ${{ matrix.part }}
        env:
          DURATIONS_OUT: ${{ github.workspace }}/durations/nightly-${{ strategy.job-index }}.json
        run: make ${{ matrix.part }}

      - name: Upload measured durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-backend-nightly-${{ strategy.job-index }}
          path: durations/
          if-no-files-found: ignore
          retention-days: 14

  # M59: the `check` tests measured on CI, as CI's four shards split them.
  check-durations:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: durations (check ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make check-durations-ci SHARD=${{ matrix.shard }}
        run: make check-durations-ci SHARD=${{ matrix.shard }} DURATIONS_OUT=${{ github.workspace }}/durations/check-${{ matrix.shard }}.json

      - name: Upload measured durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-backend-check-${{ matrix.shard }}
          path: durations/
          if-no-files-found: ignore
          retention-days: 14

  # M59: every Playwright file measured on CI, as e2e.yml's four shards split them, building
  # every fixture save (no cache: the slower case).
  e2e-durations:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: durations (e2e ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: make e2e-shard SHARD=${{ matrix.shard }}
        env:
          TST_E2E_DURATIONS_OUT: ${{ github.workspace }}/durations/e2e-${{ matrix.shard }}.json
        run: make e2e-shard SHARD=${{ matrix.shard }}

      - name: Upload measured file times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-e2e-${{ matrix.shard }}
          path: durations/
          if-no-files-found: ignore
          retention-days: 14

  # M59: the fresh duration files (backend/tests/durations.json and frontend/e2e/durations.json)
  # as one artifact, from whatever was measured (a failed shard's tests keep their old times).
  durations:
    needs: [changed, nightly, check-durations, e2e-durations]
    if: always() && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: measured
          merge-multiple: true

      - name: Merge the measurements
        run: |
          ls measured
          python tools/ci_durations.py backend fresh/backend/tests/durations.json measured/nightly-*.json measured/check-*.json
          python tools/ci_durations.py e2e fresh/frontend/e2e/durations.json measured/e2e-*.json

      - uses: actions/upload-artifact@v4
        with:
          name: durations
          path: fresh/
          retention-days: 30
