# The long balance runs (M7a, Reece's D4a): `make balance` prints the docs/balance-targets.md table,
# then `make nightly` runs every test marked `nightly` (on CI: three matrix jobs, M10d) (the balance targets in full and the
# statistical tests that PR CI skips). Every night, and on demand from the Actions tab.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the scheduled run when `main` has not changed in the last 25 hours (Reece, 2026-11-04):
  # the results would only repeat the last night's. A manual run (workflow_dispatch) always runs.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since="25 hours ago" --oneline | wc -l)
          echo "commits on main in the last 25 hours: $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    # M10d: `make balance` alone (it gates S2, the run's worker-minutes, on a machine it does not
    # share) and the nightly tests in four shards (two took over 45 minutes each on CI).
    name: nightly (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [balance, "nightly-ci SHARD=1", "nightly-ci SHARD=2", "nightly-ci SHARD=3", "nightly-ci SHARD=4"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make ${{ matrix.part }}
        run: make ${{ matrix.part }}
