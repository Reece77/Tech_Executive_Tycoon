[project]
name = "tst"
version = "0.0.0"
description = "Tech Startup Tycoon: simulation engine, persistence, API, and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.scripts]
tst = "tst.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx2>=2.15.1",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["tst"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tst.sim", "tst.sim.*", "tst.events", "tst.events.*"]
# Per-module equivalent of --strict (mypy does not allow `strict` in overrides).
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "nightly: long statistical balance runs; CI runs them nightly, `make check` runs everything (M7a, D4a)",
    "timing: turn-time budgets; run alone without xdist after the parallel suite (`make check-timing`, M14)",
    "weekly: the 30-year targets (V5, V6); run by .github/workflows/weekly.yml (M15a)",
]
