# Era milestones (docs/formulas.md 21.4, M11; ADR-0019 section 7). Each era arrives at its
# historical month, or earlier on the first month any company's level in its domain reaches
# its threshold: the domain's baseline at the end of the historical month (with the eras of
# that domain historically before it) + rnd.era_lead. On arrival the domain's baseline rises
# rnd.era_baseline and the boosts run from that month.
#
# Boosts: `growth` adds annual growth points (fraction) to the category's demand growth in the
# listed segments (all when omitted) for `months`; `adoption` multiplies the segments' monthly
# adoption for `months`. The categories an era boosts are the ones its first mover's window
# covers (21.4).
eras:
  - key: mobile_first
    label: Mobile-first
    domain: software_platform
    arrival: [2011, 1] # [year, month]
    boosts:
      - { category: consumer_apps, growth: 0.15, months: 36 }
      - { category: consumer_apps, segments: [consumer], adoption: 1.2, months: 24 }
  - key: deep_learning
    label: Deep learning
    domain: ai
    arrival: [2012, 10]
    boosts:
      - { category: ai_models, growth: 0.05, months: 60 } # fitted with base_growth (21.8 target 1)
  - key: cloud_native
    label: Cloud-native
    domain: infrastructure
    arrival: [2014, 6]
    boosts:
      - { category: dev_tools, growth: 0.10, months: 36 }
  - key: transformers
    label: Transformers
    domain: ai
    arrival: [2017, 6]
    boosts:
      - { category: ai_models, growth: 0.20, months: 60 } # fitted
  - key: open_banking
    label: Open banking
    domain: software_platform
    arrival: [2018, 1]
    boosts:
      - { category: fintech, growth: 0.10, months: 36 }
  - key: zero_trust
    label: Zero trust
    domain: infrastructure
    arrival: [2020, 1]
    boosts:
      - { category: cybersecurity, growth: 0.10, months: 36 }
  - key: large_language_models
    label: Large language models
    domain: ai
    arrival: [2022, 11]
    boosts:
      - { category: ai_models, growth: 1.80, months: 24 } # fitted
      - { category: ai_models, segments: [consumer], adoption: 1.5, months: 24 }
  - key: ai_agents
    label: AI agents
    domain: ai
    arrival: [2025, 3]
    boosts:
      - { category: ai_models, segments: [enterprise], growth: 0.40, months: 36 }
      - { category: b2b_saas, segments: [mid_market, enterprise], growth: 0.05, months: 24 }

  # --- M12b (formulas.md 26.4), appended: hardware and chips ---
  - key: smartphone_ubiquity
    label: Smartphone ubiquity
    domain: devices
    arrival: [2012, 1]
    boosts:
      - { category: devices, segments: [consumer], growth: 0.15, months: 36 }
  - key: ai_accelerators
    label: AI accelerators
    domain: chip_design
    arrival: [2016, 5]
    boosts:
      - { category: chips_ai_accelerator, growth: 0.40, months: 36 }
  - key: custom_silicon
    label: Custom silicon
    domain: chip_design
    arrival: [2020, 11]
    boosts:
      # devices with their own SoC: +5 on the quality cap for everyone, not first movers only
      - { category: devices, cap_points: 5, own_chip: true, months: 24 }
  # Future eras (26.4; Reece, 2026-11-02, ADR-0019 15): a public window instead of an
  # arrival; the scheduled month is drawn from the seed (stream era_window, key (era_index,))
  # and never shown. The threshold reads the window's midpoint.
  - key: chiplets
    label: Chiplets and advanced packaging
    domain: chip_design
    window: [[2026, 1], [2028, 12]]
    yield_cap: 0.95 # chips' yield cap from arrival, for everyone
    boosts:
      - { category: chips_server_cpu, growth: 0.15, months: 36 }
      - { category: chips_ai_accelerator, growth: 0.15, months: 36 }
  - key: edge_ai
    label: Edge AI
    domain: devices
    window: [[2027, 1], [2030, 12]]
    boosts:
      - { category: devices, segments: [consumer, smb], growth: 0.20, months: 36 }
      - { category: chips_mobile_soc, growth: 0.20, months: 36 }

  # --- M15a (formulas.md 30.8), appended: eras to 2039, seeded windows. Keys are positions in
  # this list (stream era_window, key (era_index,)), so earlier eras' months do not move. An
  # era has one domain: two-domain eras take the first named (M15a decision). Effects the era
  # model cannot express (a new segment, a data-centre cost cut) are left out (M15a decision).
  - key: post_quantum_security
    label: Post-quantum security
    domain: infrastructure
    window: [[2028, 1], [2031, 12]]
    boosts:
      - { category: cybersecurity, growth: 0.15, months: 36 }
  - key: ar_glasses
    label: AR glasses
    domain: devices
    window: [[2028, 1], [2032, 12]]
    boosts:
      - { category: devices, growth: 0.15, months: 36 }
  - key: humanoid_robotics
    label: Humanoid robotics
    domain: ai
    window: [[2030, 1], [2035, 12]]
    boosts:
      - { category: ai_models, growth: 0.20, months: 36 }
      - { category: devices, growth: 0.20, months: 36 }
  - key: photonic_interconnect
    label: Photonic interconnect
    domain: chip_design
    window: [[2031, 1], [2035, 12]]
    boosts:
      - { category: chips_server_cpu, growth: 0.10, months: 36 }
      - { category: chips_ai_accelerator, growth: 0.10, months: 36 }
  - key: practical_quantum
    label: Practical quantum computing
    domain: infrastructure
    window: [[2034, 1], [2039, 12]]
    boosts:
      - { category: cloud_hosting, growth: 0.15, months: 36 }

  # --- M37 (formulas.md 52.2), appended: the second wave, seeded windows 2040-2065 (dynasty
  # mode; docs/v5-research/dynasty-dossier.md's candidates, plausible rather than predicted).
  # Drawn like 26.4's (stream era_window, key (era_index,)), but none of them can arrive, or be
  # aimed at, before January 2040 (dynasty.start_year): a game to December 2039 never sees them.
  # Growth points are renewals of mature markets, 0.03-0.05 (M37 tuning: at 0.05-0.25 the largest
  # AI and cloud incumbents compounded past int64 cents of revenue by the 2050s).
  - key: fusion_power
    label: Fusion power
    domain: infrastructure
    window: [[2040, 1], [2048, 12]] # A: private fusion roadmaps' first plants in the 2030s-40s, widened
    boosts:
      - { category: cloud_hosting, growth: 0.03, months: 48 }
      - { category: chips_ai_accelerator, growth: 0.03, months: 36 }
  - key: brain_computer_interfaces
    label: Brain-computer interfaces
    domain: devices
    window: [[2041, 1], [2050, 12]] # A: first human implants 2024; consumer devices a generation later
    boosts:
      - { category: devices, segments: [consumer], growth: 0.04, months: 48 }
      - { category: consumer_apps, growth: 0.03, months: 36 }
  - key: general_humanoids
    label: General-purpose humanoids
    domain: ai
    window: [[2042, 1], [2052, 12]] # A: after 2030s humanoid robotics, robots that do most jobs
    boosts:
      - { category: ai_models, growth: 0.05, months: 48 }
      - { category: devices, segments: [smb, enterprise], growth: 0.03, months: 36 }
  - key: quantum_advantage
    label: Quantum advantage at scale
    domain: infrastructure
    window: [[2044, 1], [2054, 12]] # A: vendors' fault-tolerant roadmaps, at scale a decade later
    boosts:
      - { category: cloud_hosting, growth: 0.04, months: 48 }
      - { category: cybersecurity, growth: 0.04, months: 36 }
  - key: space_industry
    label: Space industry
    domain: devices
    window: [[2046, 1], [2058, 12]] # A: launch cost per kg falling toward $100
    boosts:
      - { category: devices, growth: 0.03, months: 48 }
      - { category: b2b_saas, segments: [enterprise], growth: 0.03, months: 36 }
  - key: molecular_manufacturing
    label: Molecular manufacturing
    domain: chip_design
    window: [[2050, 1], [2062, 12]] # A: atomic-scale manufacturing, the least certain
    yield_cap: 0.97 # chips' yield cap from arrival, for everyone
    boosts:
      - { category: chips_server_cpu, growth: 0.03, months: 48 }
      - { category: chips_ai_accelerator, growth: 0.03, months: 48 }
      - { category: chips_mobile_soc, growth: 0.03, months: 36 }
  - key: ambient_ai
    label: Ambient AI
    domain: ai
    window: [[2053, 1], [2065, 12]] # A: AI in every object and service
    boosts:
      - { category: ai_models, growth: 0.04, months: 48 }
      - { category: consumer_apps, growth: 0.03, months: 36 }
      - { category: b2b_saas, growth: 0.03, months: 36 }

# --- M52 (formulas.md 66.3): the third wave, for sandbox play past 2069. Windows 2070-2120, the
# same domain, boost and acceleration fields; the loader appends them after every era above (so
# no earlier era's stream key moves) and none can arrive, be aimed at or be shown before January
# 2070 (dynasty.beyond.start_year). Plausible rather than predicted (A); growth points are
# renewals of mature markets, as the second wave's (0.02-0.04).
beyond_2069:
  - key: room_temperature_superconductors
    label: Room-temperature superconductors
    domain: infrastructure
    window: [[2070, 1], [2082, 12]] # A: a materials breakthrough a generation after fusion
    boosts:
      - { category: cloud_hosting, growth: 0.03, months: 48 }
      - { category: devices, growth: 0.02, months: 36 }
  - key: synthetic_biology_compute
    label: Biological computing
    domain: chip_design
    window: [[2074, 1], [2088, 12]] # A: DNA and cell-based logic past atomic-scale silicon
    boosts:
      - { category: chips_ai_accelerator, growth: 0.03, months: 48 }
      - { category: ai_models, growth: 0.02, months: 36 }
  - key: autonomous_science
    label: Autonomous science
    domain: ai
    window: [[2078, 1], [2094, 12]] # A: AI that designs and runs its own experiments
    boosts:
      - { category: ai_models, growth: 0.04, months: 48 }
      - { category: b2b_saas, segments: [enterprise], growth: 0.02, months: 36 }
  - key: orbital_industry
    label: Orbital industry
    domain: devices
    window: [[2084, 1], [2102, 12]] # A: manufacturing in orbit after the space industry era
    boosts:
      - { category: devices, growth: 0.03, months: 48 }
      - { category: cloud_hosting, growth: 0.02, months: 36 }
  - key: post_scarcity_software
    label: Self-writing software
    domain: ai
    window: [[2092, 1], [2116, 12]] # A: software that maintains itself, the least certain
    boosts:
      - { category: dev_tools, growth: 0.03, months: 48 }
      - { category: consumer_apps, growth: 0.02, months: 36 }

# Base demand growth (fraction a year) for categories whose eras' boosts are already in the
# curves M8-M10 were tuned on (21.4, 21.8 target 1): it replaces categories.yaml's `growth`
# and `growth_by_year` for demand. By calendar year, the latest year at or before the month.
# With every era on its historical date, demand matches before M11: AI models' January 2024
# demand is 350x January 2010 (M8: 359x); consumer apps and developer tools match in January
# 2020, fintech in January 2021 (0.94 of before in January 2020). Zero trust and AI agents
# arrive after the tuned decade and add growth.
base_growth:
  ai_models: { 2010: 0.28, 2016: 0.35, 2020: 0.40, 2025: 0.50, 2030: 0.25 } # replaces M8's growth_by_year
  consumer_apps: { 2010: 0.2568, 2020: 0.30 } # mobile-first's +15 points for 2011-2013
  dev_tools: { 2010: 0.1457, 2020: 0.1650 } # M43a (54.2) x0.66 from 0.2208 / 0.25: main's 2025 served revenue was 3.7x the published $25B; cloud-native's +10 points from June 2014
  fintech: { 2010: 0.2235, 2021: 0.25 } # open banking's +10 points from January 2018
