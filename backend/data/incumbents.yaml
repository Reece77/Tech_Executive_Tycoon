# 2010 incumbents (docs/formulas.md 11.9, ADR-0017). Real names, approximate 2010 values,
# personal use (CLAUDE.md section 7). They diverge from reality after turn 0.
#
# Each company becomes a `company` row with is_player = false; from M5 it has workforce
# pools, key people, a ledger and decisions (formulas.md 15). Company ids follow this
# file's order after the player (2, 3, ...); product ids follow it too, so append new
# entries and never reorder.
# - stage: company stage (spec section 3); founded_year: shown only.
# - M5 (formulas.md 15.1): personality (aggressive, fast_follower, premium, cost_leader),
#   builder_skill (the builder pool's skill d, attribute points), target_margin_bp (the
#   margin its staff is sized for, bp of revenue) and cash_months (starting cash in months
#   of revenue).
# - products: fixed quality, feature score and brand (0-100). The feature score is held
#   constant: the product's feature points grow with the market's expectation.
# - segments: monthly price in cents and starting share of D0 in basis points (of the
#   category's addressable customers for that segment in January 2010).
# Starting shares (M3a tuning, recorded in the M3a brief): each segment keeps the total of
# the formulas.md 11.9 table, split in proportion to share* / churn, the steady state of
# the fixed scores, so no incumbent's share of served customers drifts by more than about
# a point over the first 24 turns.
companies:
  - name: Salesforce
    stage: 4
    founded_year: 1999
    personality: premium
    builder_skill: 14
    target_margin_bp: 1500
    cash_months: 24
    products:
