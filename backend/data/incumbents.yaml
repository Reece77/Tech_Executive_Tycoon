# 2010 incumbents (docs/formulas.md 11.9, ADR-0017). Real names, approximate 2010 values,
# personal use (CLAUDE.md section 7). They diverge from reality after turn 0.
#
# Each company becomes a `company` row with is_player = false; from M5 it has workforce
# pools, key people, a ledger and decisions (formulas.md 15). Company ids follow this
# file's order after the player (2, 3, ...); product ids follow it too, so append new
# entries and never reorder.
# - stage: company stage (spec section 3); founded_year: shown only.
# - listed_from (M14, formulas.md 28.1, optional): [year, month] the company is listed from,
#   following history (an IPO or a spin-off); listed rivals show a public market cap. Private
#   companies have no field and show an estimated value range.
# - M5 (formulas.md 15.1): personality (aggressive, fast_follower, premium, cost_leader),
#   builder_skill (the builder pool's skill d, attribute points), target_margin_bp (the
#   margin its staff is sized for, bp of revenue) and cash_months (starting cash in months
#   of revenue).
# - products: fixed quality, feature score and brand (0-100). The feature score is held
#   constant: the product's feature points grow with the market's expectation.
# - segments: monthly price in cents and starting share of D0 in basis points (of the
#   category's addressable customers for that segment in January 2010).
# Starting shares (M3a tuning, recorded in the M3a brief): each segment keeps the total of
# the formulas.md 11.9 table, split in proportion to share* / churn, the steady state of
# the fixed scores, so no incumbent's share of served customers drifts by more than about
# a point over the first 24 turns.
# - regions (M9, formulas.md 19.5, optional): the regions the product sells in, by default
#   north_america and europe. In each listed region it starts with the same share_bp of that
#   region's D0, at price_cents x the region's price index (relative to the home region);
#   the home region's rows are exactly v1's. The six regional incumbents appended for M9 list
#   only their own region; their price_cents are already that region's prices, and their
#   share_bp come from the M3a steady-state method run on the regional market (M9 brief,
#   "Decisions made").
# - M50 (ADR-0024, formulas.md 60.2), read only by a game begun before 2010 (a 2010 game is
#   unchanged): `launched` [year, month] a product went on sale after January 2008, so it joins
#   that month with no customers (one launched in 2010 joins in January 2010 with its share, as
#   a 2010 game has it); `early_scale` {start year: its customers that January over its January
#   2010 customers}, from its revenue (or users) then against 2010's. A product without one
#   keeps its share of the smaller 2008 market. Companies themselves all exist from the start
#   (their founding year is shown only). Tags: R recalled from the named filing or report (not
#   re-read in this session), A an assumption with its basis. The car, robot, medical, pharma
#   and space makers' 2008-2009 positions are their own systems' data (vehicles.yaml and the rest).
