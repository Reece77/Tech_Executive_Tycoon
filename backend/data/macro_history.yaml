# Macro history, 2008-2025 (docs/formulas.md 20.1, M10; 2008-2009 M50, 60.2). Every run shares this past; from
# January 2026 the indicators move in seeded cycles (stream `macro`, balance.yaml `macro.*`).
# Real figures, personal use (CLAUDE.md section 7); monthly values are approximate.
#
# - base_rate: the US effective federal funds rate, monthly average, % a year (12 per year).
# - confidence: the University of Michigan consumer sentiment index, monthly (12 per year).
#   The game rescales it so the 2010-2019 average is 100 (confidence_base_years).
# - climate: the venture funding climate by calendar year, a multiplier on the ARR multiple
#   investors pay and on each firm's chance of answering (14.3, 14.5, 15.4). Folded in from
#   M4's climate.yaml unchanged, so v1 rounds are unchanged.
# The AI compute index's history stays in compute_index.yaml (18.6), its one source.
#
# M50 (ADR-0024, formulas.md 60.2): 2008 and 2009 for a game begun in January 2008. A 2010
# game never reads them. Sources:
#   FRED  FEDFUNDS (effective federal funds rate, monthly) and UMCSENT (University of Michigan
#         consumer sentiment, monthly), fetched 2026-11-23 from
#         https://fred.stlouisfed.org/graph/fredgraph.csv?id=FEDFUNDS and ?id=UMCSENT; their
#         2010 rows equal this file's, so the two years join the series without a seam (V).
#   MT    PwC/NVCA MoneyTree (Thomson Reuters data): US venture investment $30.9B in 2007,
#         $28.3B in 2008 (Q1-Q3 about $7B a quarter, Q4 $5.4B), $17.7B in 2009 (Q1 $3.0B, the
#         lowest quarter since 1997; Q2 $4.3B, Q3 $4.8B, Q4 $5.6B), $21.8B in 2010 (R).
# The climate before 2010 is monthly (a list of 12): the 2010 multiplier (0.90) scaled by each
# quarter's dollars invested against 2010's average quarter ($5.45B) and held near 2007's level
# until September 2008, the collapse after Lehman's failure (15 September 2008) and the
# recovery from mid-2009 (D from MT; the months inside a quarter are interpolated, A).
