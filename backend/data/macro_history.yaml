# Macro history, 2010-2025 (docs/formulas.md 20.1, M10). Every run shares this past; from
# January 2026 the indicators move in seeded cycles (stream `macro`, balance.yaml `macro.*`).
# Real figures, personal use (CLAUDE.md section 7); monthly values are approximate.
#
# - base_rate: the US effective federal funds rate, monthly average, % a year (12 per year).
# - confidence: the University of Michigan consumer sentiment index, monthly (12 per year).
#   The game rescales it so the 2010-2019 average is 100 (confidence_base_years).
# - climate: the venture funding climate by calendar year, a multiplier on the ARR multiple
#   investors pay and on each firm's chance of answering (14.3, 14.5, 15.4). Folded in from
#   M4's climate.yaml unchanged, so v1 rounds are unchanged.
# The AI compute index's history stays in compute_index.yaml (18.6), its one source.
