# M43a (formulas.md 54.1): nominal GDP by region, trillions of US dollars, for market ceilings.
# Listed years only; months between them interpolate geometrically, and after the last year each
# region grows at balance.yaml markets.gdp_growth x its regional cycle (41.6). Regions are
# regions.yaml's: north_america US + Canada + Mexico; europe including the UK, Russia and Turkey;
# east_asia China, Japan, South Korea, Taiwan; south_southeast_asia India, ASEAN, Pakistan,
# Bangladesh, Sri Lanka; latin_america without Mexico; oceania Australia, New Zealand and the
# islands (the Middle East has no region). W: IMF World Economic Outlook (current dollars),
# recalled and summed by country, about +/-5%; not re-verified (the session could not reach
# imf.org). Their sum is about $64T in 2010 and $108T in 2025 against a world $66.5T and $117T.
# M50: 2008 the same way (IMF WEO, recalled and summed by country, R, about +/-5%: US 14.8,
# Canada 1.55, Mexico 1.11; the EU with the UK 18.4, Russia 1.66, Turkey 0.77 and the rest of
# Europe 1.5; China 4.6, Japan 5.04, South Korea 1.05, Taiwan 0.42; India 1.2, ASEAN 1.5 and
# the rest 0.3; Brazil 1.7 and the rest of Latin America 1.5; Africa 1.7; Australia 1.05 and
# New Zealand 0.13): about $63T against a world $64T. Months between 2008 and 2010
# interpolate, as later years do.
gdp:
  north_america: { 2008: 17.5, 2010: 17.7, 2015: 20.9, 2020: 24.1, 2025: 34.4 }
  europe: { 2008: 22.3, 2010: 21.2, 2015: 20.3, 2020: 22.0, 2025: 29.0 }
  east_asia: { 2008: 11.1, 2010: 13.4, 2015: 17.5, 2020: 22.1, 2025: 26.2 }
