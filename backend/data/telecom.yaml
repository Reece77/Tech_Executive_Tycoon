# M50 convention (ADR-0024): a series that starts in 2010 lists 2008 as its 2010 value (A), so a
# 2008 start has history; a series that starts later (a launch) needs none.
# --- Regions (62.1) ---------------------------------------------------------------------------------
# mobile / fixed: subscriptions at year end, millions, real world. 2017 is the S-sum of LSBB's ITU
# country rows in the game's regions (India's row is TRAI's February 2024; Mexico moved to north_america
# from the S-sum's latin_america: 114.3M mobile, 17.1M fixed, S). Other years: D from the 2017 sums and
# the regions' growth in TBB's per-100 series and the named countries' S figures, else R (ITU), as each
# row says. fibre_share: FTTH/B's share of fixed (R: FTTH Council and OECD, low confidence; A where
# marked). households: millions (R: UN and national censuses). arpu_*_usd: a subscription's revenue a
# month, blended across the region's countries (R: operators' reports and GSMA; no Wikipedia page gives
# ARPU, so every value is R). lte / nr: the region's first commercial 4G and 5G months (S or D from
# LLTE/L5G's earliest launch by country). nr_coverage: 5G population coverage at year end (R, Ericsson
# Mobility Report; shown only). sites_full: macro sites one operator's national low-band network needs
# (R/D, basis given). areas: licence areas and their population shares (R: World Bank 2020 populations,
# as platforms.yaml's region_parts); `closed` areas assign spectrum administratively (no auctions).
