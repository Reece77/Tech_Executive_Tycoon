# --- Generations (62.1) -----------------------------------------------------------------------------
# first: the world's first commercial launch (S). efficiency: bit/s/Hz a sector on mid-band (A: LTE
# about 1.5-2 and 5G with massive MIMO about 5-10, R from 3GPP targets; 3G HSPA about 0.6). radio_usd: a
# macro site's radios and baseband of the generation (R: industry estimates of a 5G radio upgrade $30k-70k
# a site, low confidence; A elsewhere). feature_points: what the generation adds to a mobile line's
# features where it covers (A, against the categories' features scale).
generations:
  - key: g3
    label: 3G
    first: "2001-10" # R: NTT Docomo's FOMA, 1 Oct 2001
    efficiency: [0.6, A]
    radio_usd: { 2008: [45000, 2008, A], 2015: [30000, 2015, A], 2025: [25000, 2025, A] }
    feature_points: [0, A]
  - key: g4
    label: 4G
    first: "2009-12" # LTE: TeliaSonera, 14 Dec 2009 (S)
    efficiency: [1.6, A]
    radio_usd: { 2008: [55000, 2008, A], 2010: [55000, 2010, A], 2015: [40000, 2015, A], 2025: [30000, 2025, A] }
    feature_points: [8, A]
  - key: g5
    label: 5G
    first: "2019-04" # 5G: South Korea and Verizon, 3 Apr 2019 (S)
    efficiency: [5.0, A]
    radio_usd: { 2019: [70000, 2019, R], 2022: [55000, 2022, R], 2025: [45000, 2025, A] } # R: $30k-70k a site upgrade
    feature_points: [18, A]
    mid_band_needed: true # A: 5G's capacity and speeds come from mid-band (C-band, 3.5 GHz); low-band 5G gives 4G-like service
  - key: g6
    label: 6G
    first: "" # seeded: 6G: "Commercial deployment of 6G is anticipated in the early 2030s" (S); balance telecom.g6_window
    efficiency: [10.0, A]
    radio_usd: { 2030: [60000, 2025, A], 2040: [40000, 2025, A] }
    feature_points: [28, A] # also balance telecom.g6_feature_points
    mid_band_needed: true

