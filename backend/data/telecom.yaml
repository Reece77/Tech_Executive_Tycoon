# --- Spectrum auctions (62.2) ---------------------------------------------------------------------------
# One game auction an auction (a multiband auction under its main band by MHz). gross_usd: proceeds
# (real); reserve_usd: the sum of reserves where published, else half the proceeds (A: Auction 73's
# aggregate reserve was just over $10B against $19.6B raised, US08 S; Slovakia 2013 15% above, SA S;
# France's 700 MHz 1.12x, FREE S). blocks: lots (A where not given), winners: blocks won by the game's
# operators (by their share of the proceeds); the rest went to bidders outside the game. term_years:
# R (the national rules) unless S. obligation: population coverage owed after obligation_years (A unless
# S).
auctions:
  - key: us_700_2008
    label: FCC Auction 73 (700 MHz)
    region: north_america
    area: united_states
    band: low
    mhz: [62, R] # blocks A-E, 698-806 MHz (US08 S); 62 MHz licensed (R)
    blocks: [10, A]
    month: "2008-03" # US08: bidding from 24 Jan 2008, concluded Mar 2008 (S)
    gross_usd: [19592000000, 2008, S] # US08: "In total, Auction 73 raised $19.592 billion" (S)
    reserve_usd: [10000000000, 2008, S] # US08: "just over $10 billion" for all five blocks (S)
    term_years: [10, R]
    obligation: [0.4, R] # R: 700 MHz build-out, 35-40% of population in 4 years
    obligation_years: [4, R]
    winners: { Verizon: 5, AT&T: 3 } # VZ: Verizon $9.4B; US08: AT&T 227 B-block licences $6.6B (S)
