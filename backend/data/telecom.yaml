# Telecom (docs/formulas.md 62, M53, v6 lane B). Research: M53 sub-task 1 (2026-11-25) from
# docs/v6-research/telecom-dossier.md. History holds to December 2025; seeded after (balance.yaml
# telecom.*). Every value carries a tag and a source, as space.yaml's:
#   S  a sourced figure, quoted from the named Wikipedia page (this session could open only
#      en.wikipedia.org: ITU, GSMA, the FCC, Ofcom, OECD, Dell'Oro and the operators' sites did not
#      resolve; the pages' raw text was read 2026-11-25),
#   D  derived from sourced figures (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session,
#   A  an assumption for gameplay where no public series was found (the basis is given).
# Money is [value, dollar year, tag] under keys ending _usd, converted to the game's 2010 dollars with
# `cpi` at load. Foreign currencies were converted at annual-average rates (FX below, R). Re-check the
# R and A rows against ITU's World Telecommunication/ICT Indicators, GSMA Intelligence, the regulators'
# auction pages and the operators' annual reports when those hosts are reachable (M53 follow-up).
#
# Scale (Reece, 2026-11-15: "markets and money at the game's scale", formulas.md 54): subscriptions,
# sites and auction proceeds here are real-world; the game's markets, networks and auction prices are
# x balance.yaml telecom.scale (0.085, the game's economy scale, as space.scale), at real prices.
#
# Regions follow the game's (platforms.yaml region_parts): north_america is the US, Canada and Mexico;
# europe includes Russia, Turkey and Ukraine; the Middle East and Central Asia are not game regions and
# are left out (about 229M and 78M mobile subscriptions around 2017, S-sum below).
#
# Corrections to the dossier (M53 brief, Decisions made): US Auction 97's net bids were $41.33B (S),
# its gross $44.9B (R); Auction 107 raised "over $81 billion" (S; $81.17B R), Verizon $45.5B on the 5G
# page and $52.9B on Verizon's (the larger with clearing costs, R); India's 2022 total (Rs 1,50,173
# crore) and Jio's Rs 88,078 crore are R (the India page's 2022 section is empty); the UK's 2018 auction
# raised GBP 1,369,879,000 (S), not about GBP 1.37B; Germany's 2019 total EUR 6.55B is R (only
# Telefonica's EUR 1.42B is on a page). The 2024 US net-neutrality order was stayed in July-August 2024
# and struck down on 2 January 2025 (S); it is not modelled as in force.
#
# Sources (Wikipedia pages, fetched 2026-11-25):
#   MT    Mobile telephony;  MP  Mobile phone;  MB  Mobile broadband;  LCMN  List of countries by number
#         of mobile numbers in use;  LSBB  List of sovereign states by number of broadband internet
#         subscriptions (ITU 2000-2017 tables, summed into the game's regions: the S-sum rows);
#         TBB   Template:Broadband subscriptions (ITU per 100 people by region, 2007/2010/2014/2019)
#   TIC   Telecommunications in China;  MPIC  Mobile phone industry in China;  TII  Telecommunications in
#         India;  CUS  Communications in the United States;  TUK  Telecommunications in the United Kingdom
#   LTE   LTE (telecommunication);  LLTE  List of LTE networks;  5G  5G;  L5G  List of 5G NR networks;
#         6G  6G;  VZW  Verizon (wireless service);  DCM  NTT Docomo;  TLS  Telstra;  JIO  Jio
#   LMNO  List of mobile network operators;  each operator's own page (VZ Verizon, ATT AT&T Mobility,
#         TMO T-Mobile US, SPR Sprint Corporation, ORA Orange Group, CM China Mobile, CT China Telecom,
#         CU China Unicom, AIR Bharti Airtel, VI Vodafone Idea, AMX America Movil, MTN MTN Group,
#         XF Xfinity, CHTR Charter Communications)
#   SA    Spectrum auction;  US08  2008 United States wireless spectrum auction;  US16  2016 United States
#         wireless spectrum auction;  AWS3  AWS-3 auction;  ITSA  Indian Telecom Spectrum Auction;
#         FREE  Free Mobile;  TDE  Telefonica Germany;  C700  700 MHz auction in Canada;  ROG  Rogers
#         Wireless;  TELE2  Tele2
#   CCI   Concerns over Chinese involvement in 5G wireless networks;  HUA  Huawei;  ZTE  ZTE;  STC
#         Secure and Trusted Communications Networks Act of 2019;  SEA  Secure Equipment Act;  CN  The
#         Clean Network;  NOK  Nokia;  ERI  Ericsson
#   SMC   Submarine communications cable, and each cable's page (MAREA, FASTER (cable system),
#         AEConnect, SEA-ME-WE 5, Hawaiki Cable, Havfrue, Dunant, Grace Hopper, Equiano, PEACE Cable,
#         Amitie, 2Africa, Southern Cross Cable);  GF  Google Fiber;  AMT  American Tower;  CS  Cell site
#   NNUS  Net neutrality in the United States;  NNEU  Net Neutrality Regulation 2015;  NNIN  Net
#         neutrality in India;  NNBC  Net neutrality by country;  MST  Merger of Sprint Corporation and
#         T-Mobile US;  O2UK  O2 (UK);  THREE  Three UK
#   CPI   US BLS CPI-U annual averages (R; 2025 A, preliminary), as space.yaml's
#   FX    annual averages (R: ECB, Bank of England, RBI, Bank of Canada): EUR 2010 1.327, 2012 1.285,
#         2015 1.110, 2018 1.181, 2019 1.120, 2020 1.142; GBP 2013 1.564, 2018 1.335, 2021 1.375; INR a
#         dollar 2010 45.7, 2014 61.0, 2015 64.2, 2021 73.9, 2022 78.6; SEK 2008 6.59; USD a CAD 2008 0.938,
#         2019 0.754, 2021 0.798; KRW 2018 1,100; USD an AUD 2018 0.748; BRL 2021 5.40

