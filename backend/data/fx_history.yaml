# Currencies and policy rates, 2008-2025 (docs/formulas.md 64.4, ADR-0025, M54). Every run shares this
# past; from fx.applies_from (January 2026, balance.yaml) each region's rate index walks, seeded (stream
# `fx`, keyed by region and month).
#
# Tags: S fetched from the named source in this session; D derived from S rows (the derivation is
# stated); A an assumption with its basis. Every series below is S: monthly averages of FRED's series
# (https://fred.stlouisfed.org/graph/fredgraph.csv?id=<series>), fetched 2026-11-26, which republish the
# Federal Reserve's H.10 release (exchange rates) and the OECD's Main Economic Indicators (immediate
# interbank rates, IRSTCI01*; China's 3-month interbank rate IR3TIB01CN, since its discount-rate series
# INTDSRCN stops in June 2025). The euro area's rate is the ECB deposit facility rate (ECBDFR, daily,
# averaged by month). The dossier's yearly table (R) is confirmed: each of its 35 yearly averages is
# within 1% of these series' (checked in this session), so it needs no correction.
#
# Regions (ADR-0025 point 2): a region's currency is a basket of `weights` (D/A: weights by 2020 GDP in
# US dollars, IMF World Economic Outlook, R): europe EUR 0.80, GBP 0.16, CHF 0.04; east_asia CNY 0.69,
# JPY 0.24, KRW 0.07; latin_america BRL 0.60, MXN 0.40 (ADR-0025 names Mexico's peso in Latin America's
# basket, although telecom's region_parts put Mexico in North America). africa (ZAR) and oceania (AUD)
# are not named in ADR-0025: A, each region's largest economy with a floating currency (M54 decision).
# A region's rate index in month t = sum over its basket of weight x (US dollars a unit in t / in
# January 2010), rounded to 6 decimals (D, exact decimals: ADR-0025 point 2). Its policy rate is the
# same weights' average of its countries' rates (D/A).
# M50b (formulas.md 60.4): 2000-2007 added the same way (S: the same FRED series, fetched 2026-11-28,
# rounded as the 2008 rows are; FRED's blank China row for January 2006 is the mean of the months either
# side, D). first_year moves to 2000 with them; every row from 2008 is unchanged.
first_year: 2000
regions:
  north_america: { weights: { USD: 1.0 }, rates: { US: 1.0 } }
  europe: { weights: { EUR: 0.80, GBP: 0.16, CHF: 0.04 }, rates: { EA: 0.80, GB: 0.16, CH: 0.04 } }
  east_asia: { weights: { CNY: 0.69, JPY: 0.24, KRW: 0.07 }, rates: { CN: 0.69, JP: 0.24, KR: 0.07 } }
  south_southeast_asia: { weights: { INR: 1.0 }, rates: { IN: 1.0 } }
  latin_america: { weights: { BRL: 0.60, MXN: 0.40 }, rates: { BR: 0.60, MX: 0.40 } }
  africa: { weights: { ZAR: 1.0 }, rates: { ZA: 1.0 } }
  oceania: { weights: { AUD: 1.0 }, rates: { AU: 1.0 } }
