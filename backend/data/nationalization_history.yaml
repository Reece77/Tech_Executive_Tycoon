# Resource nationalism to December 2025 (docs/formulas.md 35.4; docs/v3-research/v3-data-dossier.md
# section 5, whose V/R tags are kept in each source). The same on every seed. After last_month,
# events are seeded on stream region_risk (balance.yaml mining.nationalization).
#
#   kind: nationalization (a state takeover: the state asks for a stake in mines of the commodity
#     in the region, a critical event) or export_ban (the region's mines of the commodity may sell
#     only inside the region for `months`).
#   commodity: a geology.yaml commodity; null when the game has no such commodity (nickel,
#     bauxite): news on the Mines screen only.
#   region: the regions.yaml region of the country.
#
# Not here: DRC's 2018 Mining Code (cobalt a "strategic substance", 10% royalty: a royalty, in
# regions.yaml's africa royalty_rate) and China's processing-technology and rare-earth export
# controls (export controls as policy are M22's).
last_month: "2025-12"
events:
  - { month: "2014-01", region: south_southeast_asia, country: Indonesia, commodity: null, kind: export_ban, months: 36, title: "Indonesia bans raw mineral ore exports (nickel, bauxite)", source: "dossier 5, Jan 2014 (R); relaxed Jan 2017" }
  - { month: "2020-01", region: south_southeast_asia, country: Indonesia, commodity: null, kind: export_ban, months: 72, title: "Indonesia's nickel ore export ban, brought forward from 2022", source: "dossier 5, Jan 2020 (V year, R month)" }
