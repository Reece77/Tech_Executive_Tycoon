      - key: B
        label: "Say it will never happen again"
        effects: [{ type: press_step, target: company, stat: bold }]
      - key: C
        label: "No comment"
        effects: [{ type: press_step, target: company, stat: deflect }]

  - id: press_breach
    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "The breach is in the headlines"
    body: >-
      News of the security breach at {company} is spreading, and reporters want to know what {product}'s customers should expect.
    choices:
      - key: A
        label: "Give a measured answer"
        effects: [{ type: press_step, target: company, stat: measured }]
      - key: B
        label: "Say {company}'s security will be the best in the industry"
        effects: [{ type: press_step, target: company, stat: bold }]
      - key: C
        label: "No comment"
        effects: [{ type: press_step, target: company, stat: deflect }]

  - id: press_layoffs
