    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "The press asks about the deal"
    body: >-
      {company}'s acquisition is the story of the week, and reporters want to know why, and what changes now.
    choices:
      - key: A
        label: "Give a measured answer"
        effects: [{ type: press_step, target: company, stat: measured }]
      - key: B
