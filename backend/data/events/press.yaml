# Press moments (M14b, docs/formulas.md 29.1). The engine queues each by id (trigger press,
# press.moments.queue_moment); the director never draws them. Each is an interview with three
# tones: measured (first: Holiday and scripts take it), bold, or deflect, applied by the engine
# through press_step. A promise is made separately, in the same month, on the press item. The
# LLM may write a press event's words from these facts; its choices are always the template's.
templates:
  - id: press_launch
    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "{product} is out: the press wants a word"
    body: >-
      Reporters covering {company}'s launch of {product} want to know what it means for the market and what comes next. They have you down as {persona}; how you answer sets the tone for the coverage.
    choices:
      - key: A
        label: "Give a measured answer"
        effects: [{ type: press_step, target: company, stat: measured }]
      - key: B
        label: "Say {product} will lead the market"
        effects: [{ type: press_step, target: company, stat: bold }]
      - key: C
        label: "No comment"
        effects: [{ type: press_step, target: company, stat: deflect }]

  - id: press_earnings
    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "Analysts want more after the quarter"
    body: >-
      {company} reported a quarter that came in as {result}, and the business press wants your view on the next one.
    choices:
      - key: A
        label: "Give a measured answer"
        effects: [{ type: press_step, target: company, stat: measured }]
      - key: B
        label: "Promise the next quarter will be bigger"
        effects: [{ type: press_step, target: company, stat: bold }]
      - key: C
        label: "No comment"
        effects: [{ type: press_step, target: company, stat: deflect }]

  - id: press_era
    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "{company} is credited with a breakthrough"
    body: >-
      The press credits {company} with bringing {era} forward, and wants to know how far you think it goes.
    choices:
