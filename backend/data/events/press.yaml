    trigger: press
    severities: [major]
    weight: 1.0
    title: "The layoffs at {company} make the news"
    body: >-
      Word of the job cuts at {company} has reached the press, and staff and customers are reading every line of the coverage. Inside the company, people say their founder is {persona}.
    choices:
      - key: A
        label: "Give a measured answer"
