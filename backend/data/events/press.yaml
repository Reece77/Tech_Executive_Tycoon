        label: "Give a measured answer"
        effects: [{ type: press_step, target: company, stat: measured }]
      - key: B
        label: "Say {company} is a generation ahead"
        effects: [{ type: press_step, target: company, stat: bold }]
      - key: C
        label: "No comment"
        effects: [{ type: press_step, target: company, stat: deflect }]

  - id: press_outage
    category: press
    trigger: press
    severities: [major]
    weight: 1.0
    title: "Reporters ask about the outage"
    body: >-
      The outage that took {product} down has made the news, and journalists want to hear from you before they file.
    choices:
      - key: A
        label: "Give a measured answer"
