# Historical détentes (39.2): each suspends rules for `months` from its month (a suspended rule
# applies again afterwards unless a later détente suspends it). Busan's truce suspended
# October 2025's rare-earth rules, the gallium and germanium ban to the US and the affiliates
# rule for a year; the April 2025 controls remained (dossier 5, V; affiliates R).
detentes:
  - { key: busan_2025, title: "Busan truce: a year's pause on rare earths, gallium and the affiliates rule", month: "2025-11", suspends: [cn_re_oct_2025, cn_ga_ge_us_ban_2024, us_affiliates_2025], months: 12, tag: V, source: "dossier 5, 30 Oct-Nov 2025 (V)" }

# After 2025 (39.2): an escalation adds one of these, drawn uniformly among those not in force;
# its month is the escalation's month and it runs `months` (omitted: until a détente suspends it
# or for ever). A détente suspends one rule in force for geopolitics.detente.suspend_months.
seeded:
  - { key: s_us_ai_tighten, title: "US tightens AI chip thresholds again", actor: us, goods: [ai_chips], to: [china], regime: ban, threshold: 35, voids_variants: true, by_ownership: true }
  - { key: s_cn_ga_ge_ban, title: "China bans gallium and germanium exports to the US-aligned bloc", actor: china, goods: [gallium, germanium], to: [us_aligned], regime: ban, by_ownership: false }
  - { key: s_cn_re_ban, title: "China bans rare-earth magnet exports to the US-aligned bloc", actor: china, goods: [rare_earths], to: [us_aligned], regime: ban, by_ownership: false }
  - { key: s_us_fab_services, title: "US bars foundry services to Chinese designers", actor: us_aligned, goods: [fab_services, chip_equipment, euv_tools], to: [china], regime: ban, by_ownership: true }
  - { key: s_cn_cobalt_lithium, title: "China licenses cobalt and lithium chemical exports", actor: china, goods: [cobalt, lithium], to: [us_aligned], regime: licence, approval: 0.5, by_ownership: false }
  - { key: s_us_hbm_wide, title: "US extends HBM and AI chip controls to the China bloc", actor: us_aligned, goods: [ai_chips, hbm], to: [china], regime: licence, approval: 0.2, threshold: 50, by_ownership: true }

# M23a (39.3): rivals' compliant variants, from history. A rival in a rule's jurisdiction sells to
# its destinations only as a variant launched by then (at the variant's lower quality, keeping
# geopolitics.variant.keep of the buyers), and not at all once a rule voids variants launched
# before it. Rivals request no licences.
rival_variants:
  - { company: NVIDIA, chip_type: ai_accelerator, month: "2022-11", label: A800, tag: R } # R: A800 shipped to China from November 2022; closed by October 2023's rules
  - { company: NVIDIA, chip_type: ai_accelerator, month: "2024-01", label: H20, tag: R } # R: H20 for China from early 2024; licensed from April 2025 (us_h20_2025)
