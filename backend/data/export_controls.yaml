# Export controls (docs/formulas.md 39.2-39.3, M22; docs/v3-research/v3-data-dossier.md section 5).
# Every dossier 5 rule, with its effective month and the dossier's source tag: V = confirmed in a
# fetched source; R = widely reported, the day to be verified before it appears in game text
# (game text names the month only). The same on every seed. After last_month, new rules come
# from `seeded` with escalations (balance.yaml geopolitics.escalation).
#
#   key: stable id (saves store it). title: shown on the World screen and in events.
#   month: the month it takes effect. announced: the month it is announced (default: month);
#     nothing about a rule reaches the API before its announced month (39.3, M22 brief).
#   end: the last month it applies (omitted: in force until a détente suspends it).
#   actor: who imposes it: a countries.yaml key, or a bloc (us_aligned, china, non_aligned).
#   by_ownership: true when it also binds companies owned >= 50% by a company in the actor's
#     jurisdiction wherever they sit (39.3 regional entities); false: territorial, so a
#     subsidiary in another country can be the compliant seller.
#   goods: controlled goods (balance.yaml geopolitics.goods keys).
#   to: the destinations: countries (keys), blocs, entities (names), or [all] for every
#     country outside the actor's jurisdiction.
#   regime: ban, licence (approval: the base chance a licence request is approved) or quota
#     (quota: the share of normal volume allowed).
#   threshold: for ai_chips, the quality at and above which a chip is controlled.
#   voids_variants: compliant variants launched before this rule are controlled again (the
#     October 2023 update closed the A800/H800 route; April 2025's H20 licence).
#   via: m19 when the effect is M19's resource-nationalism event (nationalization_history.yaml);
#     the rule is shown here and nothing else applies it twice.
#   news: true for goods the game does not trade (nickel ore, bauxite, tungsten, technology):
#     shown on the World screen and in events, with no other effect.
last_month: "2025-12"
rules:
  - { key: cn_re_quota_2010, title: "China cuts rare-earth export quotas", month: "2010-07", actor: china, goods: [rare_earths], to: [all], regime: quota, quota: 0.6, end: "2014-12", by_ownership: false, tag: R, source: "dossier 5, Jul 2010 (R): H2 2010 quota cut, about 40% lower for the year" }
  - { key: cn_re_japan_2010, title: "Rare-earth shipments to Japan halted", month: "2010-09", actor: china, goods: [rare_earths], to: [japan], regime: ban, end: "2010-11", by_ownership: false, tag: V, source: "dossier 5, Sep 2010 (V): alleged unofficial halt after the Senkaku collision" }
