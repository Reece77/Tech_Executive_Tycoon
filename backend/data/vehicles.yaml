# Electric vehicles (docs/formulas.md 49, M38, v5 lane C). Research: M38 sub-task 1 (2026-11-16)
# from docs/v5-research/ev-dossier.md. History holds to December 2025; seeded after (balance.yaml
# vehicles.*). Every value carries a tag and a source:
#   S  a sourced figure, quoted from the named source (a search engine's excerpt of the source's
#      page counts and is marked "(search)": this session could open only en.wikipedia.org, and
#      the IEA, BNEF, SNE, IRS, EUR-Lex, USTR and USGS pages were refused),
#   D  derived from sourced figures (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session,
#   A  an assumption for gameplay where no public series was found (the basis is given).
# Re-check the R and A rows against the primary pages when www.iea.org and about.bnef.com are
# reachable (M38 follow-up).
#
# Scale (Reece, 2026-11-14: "market sizes and money follow the game's own scale"): car buyers
# here are real-world counts; the game multiplies them by balance.yaml vehicles.scale (0.085,
# the devices incumbents' in-game revenue over their real revenue: M34's economy_scale.money
# 0.0849, Apple 0.095), so a region's game market is a twelfth of its real one, at real prices.
# Money is converted to the game's 2010 dollars with `cpi` at load.
#
# Sources:
#   GEVO16..GEVO26  IEA Global EV Outlook, editions 2016-2026 (e.g.
#           https://www.iea.org/reports/global-ev-outlook-2025/executive-summary ,
#           https://www.iea.org/reports/global-ev-outlook-2026/trends-in-electric-cars ,
#           https://www.iea.org/reports/global-ev-outlook-2025/electric-vehicle-charging ,
#           https://www.iea.org/reports/global-ev-outlook-2024/outlook-for-electric-vehicle-charging-infrastructure)
#   WEVC    Wikipedia, Electric car use by country (share table citing the IEA):
#           https://en.wikipedia.org/wiki/Electric_car_use_by_country
#   WPEV    Wikipedia, Plug-in electric vehicle: https://en.wikipedia.org/wiki/Plug-in_electric_vehicle
#   BNEF23  BNEF, "Lithium-ion battery pack prices hit record low of $139/kWh" (Nov 2023):
#           https://about.bnef.com/blog/lithium-ion-battery-pack-prices-hit-record-low-of-139-kwh/
#   BNEF24  BNEF, pack prices fall to $115/kWh (Dec 2024):
#           https://about.bnef.com/insights/clean-energy/press-japanese-lithium-ion-battery-pack-prices-see-largest-drop-since-2017-falling-to-115-per-kilowatt-hour-bloombergnef/
#   BNEF25  BNEF, pack prices fall to $108/kWh despite rising metal prices (9 Dec 2025):
#           https://about.bnef.com/insights/clean-energy/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices-bloombergnef/
#   BNEF21  BNEF 2021 survey ("above $1,200/kWh in 2010", real 2021 $) and its 2019 chart:
#           https://about.bnef.com/blog/battery-pack-prices-fall-to-an-average-of-132-kwh-but-rising-commodity-prices-start-to-bite
#   MCK     McKinsey, "Battery chemistries powering the future of EVs" (cell and pack densities)
#   SNE     SNE Research EV battery installations via JW Insights https://jw.ijiwei.com/n/848387 ,
#           Electrek https://electrek.co/2023/02/08/catl-dominates-global-ev-battery-market-sixth-straight-year/ ,
#           KED Global https://www.kedglobal.com/newsView/ked202101040006 , Argus
#           https://argusmedia.com/en/news-and-insights/latest-market-news/2656583-global-ev-battery-installation-s-2024-growth-slows-sne ,
#           CnEVPost https://cnevpost.com/2026/2/4/global-ev-battery-market-share-2025/
#   TSLA    Tesla quarterly production and deliveries releases (ir.tesla.com), Electrek
#           https://electrek.co/2026/01/02/tesla-tsla-releases-q4-delivery-results/
#   BYD     BYD monthly filings; CleanTechnica https://cleantechnica.com/2025/01/02/rebirth-of-the-phev-what-do-byds-and-teslas-2024-vehicle-sales-tell-us ,
#           Electrek https://electrek.co/2026/01/02/byd-crushes-tesla-all-electric-sales-for-2025-secures-global-bev-crown/
#   OEM     InsideEVs top-OEM 2023 https://insideevs.com/news/707935/world-top-ev-oem-sales-2023q4/ ,
#           CleanTechnica https://cleantechnica.com/2025/02/05/the-automakers-selling-the-most-evs-in-the-world-are/ ,
#           J.D. Power https://www.jdpower.com/business/news/what-are-the-global-ev-markets-most-successful-brands/ ,
#           NIO https://www.nio.com/news/20260101001 , Rivian (Business Wire, 2 Jan 2026), Xiaomi (Gasgoo)
#   CARS    New car sales: CAAM (China), ACEA (Europe), BEA/Wards and GlobalData (US),
#           MarkLines https://www.marklines.com/en/report/global_report_202412 (R except 2024 S)
#   CPI     US BLS CPI-U annual averages (R; 2025 A, preliminary), as power.yaml's
#   CNEV    China subsidies and purchase tax: CnEVPost
#           https://cnevpost.com/2021/12/31/chinas-subsidies-for-nevs-will-be-reduced-by-30-starting-tomorrow-and-will-no-longer-be-available-starting-2023 ,
#           China Services Info https://www.chinaservicesinfo.com/s/202306/21/WS649ea2b9498ea274927c25c1/china-extends-nev-purchase-tax-breaks.html ,
#           SMM https://news.metal.com/newscontent/103527259-nev-purchase-tax-to-resume-in-2026-with-5-rate-and-15000-yuan-cap
#   IRS     IRC 30D (ARRA 2009 as amended; IRA 2022) and the OBBB termination FAQ:
#           https://www.irs.gov/newsroom/treasury-irs-issue-faqs-to-address-the-accelerated-termination-of-several-energy-provisions-under-obbb
#   AFO     EU Alternative Fuels Observatory, Germany's incentives:
