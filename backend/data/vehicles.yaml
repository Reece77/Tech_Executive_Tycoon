# --- Batteries (49.2) ----------------------------------------------------------------------------
# pack_usd: BNEF's volume-weighted average lithium-ion pack price, $/kWh, as [value, dollar year,
#   tag]: 2013 and 2015-2021 from BNEF23's restated real-2023 series (R: the chart, not re-read);
#   2022 161 and 2023 139 (S, BNEF23); 2024 115 (S, BNEF24, real 2024 $); 2025 108 (S, BNEF25,
#   real 2025 $); 2010 about 1,400 (D: BNEF21's "above $1,200 in 2010" in real 2021 $ x CPI to
#   2023); 2011, 2012 and 2014 D from BNEF's 2019 chart (917, 721, 588 real 2019 $) x CPI.
#   (The dossier's "about $1,100+ in 2010" is an older BNEF vintage.)
#   M50: 2008 1,600 and 2009 1,500 (D: NN15's industry-wide estimates of about $1,130 and $1,060
#   nominal, R, x CPI to 2023 (FRED); BNEF's survey starts in 2010). cell_share and lfp_share 2008
#   held at 2010's (A; BYD's F3DM and A123's cells were LFP).
#   M50b: 2000-2007 A, NN15's 2007 estimate run back about 7% a year in real terms (slower than the
#   13% a year Ziegler and Trancik (Energy Environ. Sci. 2021, R) found for all Li-ion cells, as a
#   hand-built EV pack's integration cost fell more slowly; Wikipedia's Lithium-ion battery page, S:
#   about 3 Wh a dollar (about $330/kWh nominal) for consumer cells in 2005). cell_share held at 0.70
#   (A); lfp_share 0 in 2000 (A: LFP was patented in 1996-1997 and A123's first cells sold in 2006).
# cell_share: the cells' share of the pack price: 2025 cells $74 of $108 (S, BNEF25: 0.685);
#   2024 about $78 of $115 (R: 0.68); 2010 0.70 (A: held back).
# lfp_share: LFP's share of EV cells (context; R from SNE and IEA's chemistry charts: about 5% in
#   2018, about 30% in 2021, about 45% in 2024).
battery:
  pack_usd:
    2000: [2800, 2023, A]
    2001: [2600, 2023, A]
    2002: [2400, 2023, A]
    2003: [2250, 2023, A]
    2004: [2100, 2023, A]
    2005: [1950, 2023, A]
    2006: [1800, 2023, A]
    2007: [1700, 2023, A]
    2008: [1600, 2023, D]
    2009: [1500, 2023, D]
    2010: [1400, 2023, D]
    2011: [1090, 2023, D]
    2012: [860, 2023, D]
    2013: [780, 2023, R]
    2014: [700, 2023, D]
    2015: [448, 2023, R]
    2016: [345, 2023, R]
    2017: [258, 2023, R]
    2018: [211, 2023, R]
    2019: [183, 2023, R]
    2020: [160, 2023, R]
    2021: [150, 2023, R]
    2022: [161, 2023, S]
    2023: [139, 2023, S]
    2024: [115, 2024, S]
    2025: [108, 2025, S]
  cell_share: { 2000: [0.70, A], 2008: [0.70, A], 2010: [0.70, A], 2024: [0.68, R], 2025: [0.685, S] }
  lfp_share: { 2000: [0.0, A], 2005: [0.0, A], 2008: [0.05, A], 2010: [0.05, A], 2018: [0.05, R], 2021: [0.30, R], 2024: [0.45, R], 2025: [0.50, A] }
  # chemistries: wh_per_kg cell-level 2024 (S, MCK (search): LFP 160-180, NMC 220-250; midpoints);
  #   cost_mult x the market's average cell price (D: BNEF25 LFP packs $81 and NMC $128 against
  #   the $108 average); range_mult (D: the 5-20% pack-level density gap (MCK) adds about 50 kg
  #   to a 60 kWh pack, about 3% of a car's energy use); inputs in commodities.yaml volume units
  #   (t) a kWh of cells: NMC as a mix of NMC811 and NMC622 (lithium as LCE 0.55 kg, nickel
  #   0.65 kg, cobalt 0.12 kg, manganese 0.12 kg, graphite 1.0 kg), LFP (LCE 0.45 kg, graphite
  #   1.1 kg); D from ICCT's lithium intensities (ICCT 2024 EV supply chain report, S (search):
  #   NMC 0.09-0.10 kg Li, LFP about 0.08 kg Li, 0.47 kg Li2CO3) x 5.32, the rest R from the
  #   BatPaC-derived figures the IEA quotes (Role of Critical Minerals, 2021).
  chemistries:
    nmc:
      label: NMC (nickel manganese cobalt)
      wh_per_kg: [235, S]
      cost_mult: [1.18, D]
      range_mult: [1.0, D]
      inputs: { lithium_carbonate: [0.00055, D], nickel: [0.00065, R], cobalt: [0.00012, R], manganese: [0.00012, R], graphite: [0.0010, R] }
    lfp:
      label: LFP (lithium iron phosphate)
      wh_per_kg: [170, S]
      cost_mult: [0.75, D]
      range_mult: [0.97, D]
      inputs: { lithium_carbonate: [0.00045, D], graphite: [0.0011, R] }

