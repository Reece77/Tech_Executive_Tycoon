#   with many PHEVs, 40 kWh by 2016, 50 kWh by 2018: A).
world_cells_gwh: { 2010: [0.3, D], 2012: [3, D], 2013: [5, D], 2014: [8, D], 2015: [22, D], 2016: [31, D], 2017: [55, D], 2018: [100, D], 2019: [116.6, R], 2020: [142.8, S], 2021: [296.8, R], 2022: [517.9, S], 2023: [705.5, S], 2024: [894.4, S], 2025: [1187, S] }

# km_per_kwh: a typical BEV's rated efficiency, km a kWh of pack (D: EPA and WLTP ratings, 150-200
#   Wh/km for cars in 2024 (5-6.5 km/kWh); the 2010 Nissan Leaf's 24 kWh and 117 km EPA, 4.9; the
#   2015 Model S 85's 426 km, 5.0; the 2020 Model 3 Long Range's 75 kWh and 518 km, 6.9; mixes A).
km_per_kwh: { 2010: [4.9, D], 2015: [5.1, D], 2020: [5.8, D], 2024: [6.0, D] }
# range_expected_km: the market's expected range (feature score, 49.1): 2010 the Leaf's 117 km
#   (S, EPA via Wikipedia's Nissan Leaf page), 2024 D from the IEA's 65 kWh global average BEV pack
#   (GEVO25, S (search)) x 6.0 km/kWh; between A.
range_expected_km: { 2010: [120, D], 2015: [200, A], 2018: [300, A], 2020: [350, A], 2024: [390, D] }
# charge_expected_kw: the market's expected DC charging peak: 2010 CHAdeMO's 50 kW (R), 2024 150-250
#   kW typical (E in the research; A midpoint 175), between A.
charge_expected_kw: { 2010: [50, R], 2015: [75, A], 2020: [120, A], 2024: [175, A] }
# software_attach: share of connected cars paying a software subscription (49.3). A: no public
#   series; Tesla's FSD take-rate estimates (about 37% in 2019, 22% in 2020, 12% in 2021, WPEV's
#   Tesla Autopilot page) bound the driver-assistance share, and Premium Connectivity ($9.99 a
