#           https://ec.europa.eu/commission/presscorner/api/files/document/print/en/ip_24_5589/IP_24_5589_EN.pdf
#   USTR    USTR Section 301 four-year review, final modifications (13 Sep 2024; 100% on EVs from
#           27 Sep 2024) (R: not re-read)
#   MB      Mercedes-Benz Drive Pilot approvals:
#           https://group.mercedes-benz.com/technology/autonomous-driving/driving/system-approval-for-conditionally-automated-driving.html ,
#           https://group.mercedes-benz.com/innovation/product-innovation/autonomous-driving/drive-pilot-nevada.html
#   WAYMO   Wikipedia, Waymo: https://en.wikipedia.org/wiki/Waymo
#   TN25    TechNode, China's first L3 market access (15 Dec 2025):
#           https://technode.com/2025/12/15/china-grants-market-access-to-its-first-batch-of-l3-autonomous-driving-vehicles/
#   NACS    Wikipedia, North American Charging Standard: https://en.wikipedia.org/wiki/North_American_Charging_Standard
#   KBB     Cox Automotive / Kelley Blue Book, December 2024 ATP report:
#           https://www.coxautoinc.com/insights/december-2024-atp-report/

