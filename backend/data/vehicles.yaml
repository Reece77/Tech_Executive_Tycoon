# --- Regions (49.1, 49.5) ------------------------------------------------------------------------
# car_sales: new cars a year in the game region, millions, real world (CARS). The game's regions
#   aggregate countries: north_america = US + Canada + Mexico (US light vehicles 11.6 / 17.4 /
#   17.0 / 16.0 M in 2010 / 2015 / 2019 / 2024, S 2024 GlobalData (search), R earlier; Canada
#   about 1.6-1.9 M and Mexico 0.8-1.5 M, R); europe = EU + EFTA + UK (ACEA, R; 2024 S from
#   H1 6.88 M x 2 less the usual H2 dip); east_asia = China passenger cars (CAAM domestic, R)
#   + Japan (4.4-5.2 M, R) + South Korea (1.5-1.8 M, R) + Taiwan (about 0.4 M, R); the rest A
#   from national totals recalled (India 2.5-4.3 M, ASEAN 2.5-3.5 M, Brazil 2.5-3.3 M, South
#   Africa about 0.5 M, Australia about 1.1 M).
# ev_share: electric (BEV + PHEV) share of the region's new cars. China, Europe and US: WEVC's
#   share table (S, citing the IEA), 2025 GEVO26 (S (search): China about 55%, Europe 28%, US just
#   under 10%), 2010-2012 D from the plug-in counts in WPEV over car sales. east_asia is D: China's
#   share x its sales plus Japan's (0.1-3%, WEVC) and Korea's (about 2-9%, R) over the region's.
#   south_southeast_asia, latin_america, africa and oceania are A: India about 2% in 2024 (GEVO25,
#   S (search)), Thailand about 10% and Brazil about 6% in 2024 (R), Australia about 9.6% (R).
# chargers: public charging points, thousands (GEVO16-GEVO25): 2015 and 2020 R, 2023-2024 S
#   (search) for the world (almost 4 M and over 5 M), China (about 70%), Europe (just over 1 M in
#   2024) and the US (just under 200k in 2024); other regions A (a few per hundred EVs on the road).
# segments: shares of new car buyers: consumer (private), fleet (rental, ride-hailing, company
#   cars) and commercial (vans and light trucks). A: US fleet sales are about a fifth of light
#   vehicles (R, Cox Automotive's fleet reports); Europe's company cars are more (R, about 30% of
#   registrations counting company-owned); light commercial vehicles 5-12% of new vehicles (R).
# M50 2008-2009: car_sales north_america D = US (FRED ALTSALES, S) + Canada + Mexico (CARS08, R);
#   europe R (ACEA via CARS08); east_asia D = China + Japan + Korea + Taiwan (CARS08, R; Taiwan
#   about 0.23 M and 0.29 M, R); the rest A from CARS08's national totals plus about 0.1-0.2 M for
#   the region's other countries. The 2009 crash shows in the US, Japan, Mexico and South Africa;
#   China's 2009 tax cut and Europe's scrappage schemes held their totals up. ev_share D/A from TS1's
#   counts: north_america about 200 (2008) and 1,300 (2009, Roadsters plus the MINI E trial) plug-in
#   cars; europe about 700 and 1,500 (A: Think City, Reva G-Wiz, Roadsters, conversions);
#   east_asia about 1,900 in 2009 (A: i-MiEV and Subaru Stella fleet cars, F3DM, China's pilots),
#   none of note in 2008. chargers 2008 A (legacy 1990s points in California, early city points in
#   London, Paris and Oslo, TEPCO's trial quick chargers).
# M50b 2000-2007: car_sales north_america D = US (FRED00 ALTSALES, S) + Canada + Mexico (CARS00, R);
#   europe R (ACEA, EU + EFTA with the 2004 entrants); east_asia D = China (2000-2004 A on CAAM's
#   2005 passenger-vehicle definition) + Japan + Korea + Taiwan (0.33-0.51 M, R); the rest A from
#   CARS00's national totals plus 0.1-0.2 M for other countries. ev_share A from EV00: north_america
#   about 2,000 plug-in cars in 2000 (RAV4 EV and Ranger EV fleets) falling to conversions only by
#   2004; europe about 2,500 (PSA, Think, Clio) falling with PSA's end in 2005, then G-Wiz and Think
#   about 700 a year; east_asia a few hundred Hypermini and e-com cars in 2000-2001, then none; the
#   rest 0 (REVAi's few hundred a year in India under 0.01%). chargers A: California's 1990s points
#   (about 1,500 in 2000, removed as the EV1s went), French city points, Japan's few.
