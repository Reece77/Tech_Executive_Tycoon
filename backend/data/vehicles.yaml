# --- Subsidies (49.5) -------------------------------------------------------------------------------
# steps: ("YYYY-MM", US dollars of that year) a buyer gets per eligible car in the scheme's country
#   (its countries.yaml demand share of the region's buyers); price_cap: cars above it get nothing;
#   rules: sourcing rules from their month. Amounts are the typical BEV's (D from the sources'
#   yuan and euro figures at the year's exchange rate: CNY 6.77 (2010), 6.20 (2013), 6.64 (2016),
#   6.90 (2020), 6.45 (2021), 6.73 (2022), 7.19 (2024), 7.20 (2026); EUR 1.33 (2010-2019), 1.14
#   (2020-2022), 1.08 (2023): R).
subsidies:
  - key: us_30d
    title: US federal EV tax credit
    region: north_america
    country: us
    # IRS: up to $7,500 from January 2010 (ARRA 30D, R); the 200,000-car phase-out per maker (Tesla
    # from 2019, GM from 2019) is not modelled (A: a credit for every eligible car); IRA from 18 April
    # 2023 with the North American assembly rule (S (search): from 17 August 2022), MSRP caps of
    # $55,000 for cars (R) and the FEOC rule on battery components from 1 January 2024 (R); terminated
    # for cars acquired after 30 September 2025 (S, IRS FAQ).
    steps: [["2010-01", [7500, R]], ["2025-10", [0, S]]]
    price_cap: [["2023-04", [55000, R]]]
    rules:
      - { start: "2022-08", made_in: [us, canada, mexico], label: "IRA: final assembly in North America" }
      - { start: "2024-01", cells_not_from: [china], label: "IRA: no battery components from a foreign entity of concern" }
  - key: cn_nev
    title: China NEV purchase subsidy and purchase-tax exemption
    region: east_asia
    country: china
    # CNEV: central subsidies of up to 60,000 yuan a BEV from 2010 (R: about $8,900), 35,000-60,000
    # by range 2013-2015 (R: about $7,500 for a typical BEV), 55,000 cap 2016 falling to 25,000
    # (2019), 22,500 (2020), 18,000 (2021) and 12,600 (2022, S), ended 31 December 2022 (S); plus the
    # 10% purchase-tax exemption from September 2014 (R: about $2,000 on a typical car), capped at
    # 30,000 yuan in 2024-2025 (S) and halved with a 15,000 cap in 2026-2027 (S).
    steps: [["2010-06", [8900, D]], ["2013-01", [7500, D]], ["2014-09", [9500, D]], ["2016-01", [9300, D]], ["2017-01", [8000, D]], ["2019-06", [5600, D]], ["2020-01", [5300, D]], ["2021-01", [4800, D]], ["2022-01", [3900, D]], ["2023-01", [2000, D]], ["2026-01", [1000, D]], ["2028-01", [0, S]]]
  - key: de_umweltbonus
    title: Germany's Umweltbonus
    region: europe
    country: germany
    # AFO: from 29 June 2016 (S), BEV EUR 4,000 to October 2019 (S), up to EUR 9,000 from July 2020 to
    # December 2022 (S, the Innovationspraemie), EUR 6,750 in 2023 (S); ended 18 December 2023 (S).
    steps: [["2016-07", [5300, D]], ["2019-11", [6600, D]], ["2020-07", [10300, D]], ["2023-01", [7300, D]], ["2024-01", [0, S]]]
    price_cap: [["2016-07", [65000, R]]]
  - key: fr_bonus
    title: France's bonus ecologique
    region: europe
    country: france
    # R: since 2008; BEVs up to EUR 6,000-7,000 in 2017-2023 (R); from 2024 EUR 4,000 with an
    # environmental score that excludes most China-built cars (R); cut further in 2025 (A: EUR 2,000).
    steps: [["2010-01", [6600, R]], ["2017-01", [6700, R]], ["2024-01", [4300, R]], ["2025-01", [2200, A]]]
    price_cap: [["2020-06", [50000, R]]]
    rules:
      - { start: "2024-01", cells_not_from: [china], label: "Environmental score: China-made cars and cells excluded" }

# --- Tariffs on imported cars (49.5, appended to tariffs.yaml's schedules for the vehicles good) ----
tariffs:
  - key: us_301_ev
    title: Section 301 tariffs on Chinese electric vehicles
    origin: china
    market: us
    # USTR: 25% from the 2018 lists (R) plus 2.5% MFN; 100% (plus 2.5%) from 27 September 2024 (R;
    # rates are capped at 100%, 39.3).
    steps: [["2010-01", 0.025], ["2018-07", 0.275], ["2024-09", 1.0]]
    tag: R
  - key: eu_cvd_ev
    title: EU countervailing duties on Chinese battery-electric cars
    origin: china
    market: rest_of_eu
    # EC24: 10% MFN (V); definitive duties from 30 October 2024 (S): BYD 17.0%, Geely 18.8%, SAIC
    # 35.3%, other cooperating 20.7%, Tesla 7.8%; a new maker pays the cooperating 20.7% (S); the
    # provisional duties from July 2024 (R) are folded into October.
    steps: [["2010-01", 0.10], ["2024-10", 0.307]]
    tag: V
  - key: eu_cvd_ev_de
    title: EU countervailing duties on Chinese battery-electric cars (Germany)
    origin: china
    market: germany
    steps: [["2010-01", 0.10], ["2024-10", 0.307]]
    tag: V
  - key: eu_cvd_ev_fr
    title: EU countervailing duties on Chinese battery-electric cars (France)
    origin: china
    market: france
    steps: [["2010-01", 0.10], ["2024-10", 0.307]]
    tag: V
  - key: eu_cvd_ev_nl
    title: EU countervailing duties on Chinese battery-electric cars (Netherlands)
    origin: china
    market: netherlands
    steps: [["2010-01", 0.10], ["2024-10", 0.307]]
    tag: V
  - key: eu_cvd_ev_ie
    title: EU countervailing duties on Chinese battery-electric cars (Ireland)
    origin: china
    market: ireland
    steps: [["2010-01", 0.10], ["2024-10", 0.307]]
    tag: V
  - key: ca_surtax_ev
    title: Canada's surtax on Chinese electric vehicles
    origin: china
    market: canada
    # S (search): 100% from 1 October 2024; the March 2026 quota deal is after the history.
    steps: [["2010-01", 0.061], ["2024-10", 1.0]] # tariffs.yaml rates are capped at 100% (39.3): the 6.1% MFN on top is dropped
    tag: V

# --- Automotive regulators (49.4) ---------------------------------------------------------------------
# approvals: the first month a level was approved for sale or service in the region. l2 (driver
# assistance) needs none. l2_plus (hands-off on highways): GM Super Cruise, September 2017 (R); the
# EU's UN-R171 DCAS from 2024 (R, A month); China's highway NOA from 2021 (R, A month). l3: MB's
# Drive Pilot under UN-R157, KBA approval 9 December 2021 (S); Nevada 26 January 2023 (S); Japan's
# Honda Legend, March 2021 (R); China's first L3 market access 15 December 2025 (S, TN25). l4
# (driverless in a zone): Waymo's public driverless service in Phoenix, 8 October 2020 (S, WAYMO);
# Baidu Apollo Go's driverless rides in Wuhan, August 2022 (R).
regulators:
  - key: nhtsa
    name: NHTSA and state DMVs
    region: north_america
    approvals:
      - { level: l2_plus, month: "2017-09", label: "Hands-off highway driving (Super Cruise)" }
      - { level: l4, month: "2020-10", label: "Driverless service in a zone (Phoenix)" }
      - { level: l3, month: "2023-01", label: "Conditional automation (Nevada, Drive Pilot)" }
  - key: unece_eu
    name: European type approval (UNECE WP.29)
    region: europe
    approvals:
      - { level: l3, month: "2021-12", label: "UN-R157 conditional automation (KBA, Drive Pilot)" }
      - { level: l2_plus, month: "2024-09", label: "UN-R171 driver control assistance" }
  - key: miit
    name: MIIT (China) and East Asian regulators
    region: east_asia
    approvals:
      - { level: l3, month: "2021-03", label: "Japan: conditional automation (Honda Legend)" }
      - { level: l2_plus, month: "2021-06", label: "China: highway navigate-on-autopilot" }
      - { level: l4, month: "2022-08", label: "China: driverless rides in a zone (Wuhan)" }
  - key: asean_regs
    name: South and Southeast Asian regulators
    region: south_southeast_asia
  - key: latam_regs
    name: Latin American regulators
    region: latin_america
  - key: africa_regs
    name: African regulators
    region: africa
  - key: oceania_regs
    name: Australian and New Zealand regulators
    region: oceania
    approvals:
      - { level: l2_plus, month: "2022-06", label: "Hands-off highway driving (A: after the US)" }
