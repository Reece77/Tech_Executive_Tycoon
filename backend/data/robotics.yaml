# Robotics and robotaxis (docs/formulas.md 53, M39, v5 lane F). Research: M39 sub-task 1 (2026-11-17)
# from docs/v5-research/robotics-dossier.md. History holds to December 2025; seeded after (balance.yaml
# robotics.*). Every value carries a tag and a source:
#   S  a sourced figure, quoted from the named source; "(search)" marks a search engine's excerpt of
#      the source's page (this session could open only en.wikipedia.org: ifr.org, bls.gov and
#      ark-invest.com did not resolve),
#   D  derived from sourced figures (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session,
#   A  an assumption for gameplay where no public series was found (the basis is given).
# Money is [value, dollar year, tag] under keys ending _usd, converted to the game's 2010 dollars with
# `cpi` at load. Re-check the R and A rows against IFR's World Robotics tables and BLS when those
# hosts are reachable (M39 follow-up).
#
# Scale (Reece, 2026-11-15: "markets and money at the game's scale"): robots, workers and trips here
# are real-world counts; the game multiplies them by balance.yaml robotics.scale (0.085, the game's
# economy scale, as vehicles.scale), at real prices.
#
# Corrections to the dossier (M39 brief, Decisions made): 2010 installations were first published as
# about 118,000 (120,585 is IFR's later revision); China's own makers held over half their home
# market by 2024 (57%, IFR), not ">40%"; Midea completed its KUKA bid in January 2017 (94.55%); the
# Unitree G1's price was announced in May 2024 and mass production began in August 2024; IFR's 2026
# edition adds 2025 (about 603,000 installations, China 59%).
#
# Sources:
#   WIR     Wikipedia, Industrial robot (IFR's yearly installations, stock and value):
#           https://en.wikipedia.org/wiki/Industrial_robot
#   IFR     IFR World Robotics press releases and executive summaries, editions 2011-2026 (e.g.
#           https://ifr.org/img/worldrobotics/Executive_Summary_WR_2024_Industrial_Robots.pdf ,
#           https://ifr.org/ifr-press-releases/news/robot-investment-reaches-record-16.5-billion-usd ,
#           https://thenextweb.com/news/industrial-robots-world-robotics-2026-china-59-eu-falls ,
#           evertiq and computer-automation.de syndications), S (search)
#   IFRD    IFR robot density releases (Nov 2024, via mmh.com and robotics247), S (search)
#   ARK     EY citing ARK Invest, robot cost per unit ~$47k (2011) to ~$23k (2022):
#           https://www.ey.com/en_kr/innovation/three-tailwinds-for-robotics-adoption-in-2024-and-beyond
#   IA      Interact Analysis via automation.com, average revenue a robot $31,100 (2018) -> $25,600 (2024)
#   VEND    integrator and vendor price guides (standardbots.com, automate.org's ROI guide), S (search)
#   MIR     MIR Databank via Yicai (China's domestic brands 51.6% Q1-Q3 2024), and Macquarie's 2024
#           China shares by supplier (FANUC 10.1%, Estun 9.9%, Inovance 8.9%), S (search)
#   MAKERS  ABB Robotics 2024 revenue ~$2.3bn (techrepublic, heise); FANUC IR reference202412_e.pdf;
#           KUKA (https://en.wikipedia.org/wiki/KUKA); Universal Robots
#           (https://en.wikipedia.org/wiki/Universal_Robots)
#   BLS     BLS International Labor Comparisons, hourly compensation in manufacturing 2012
#           (https://www.bls.gov/fls/ichccindustryreport.htm, US S (search), others R); Destatis 2023
#           (Germany EUR 46.00/h, S (search)); Eurostat 2023 (euro area industry EUR 38/h, S (search));
#           Supplyframe 2023 (China CNY 43.26/h, S (search)); INEGI via Trading Economics (Mexico)
#   HUM     Wikipedia: Optimus (robot), Figure AI, Agility Robotics, Unitree Robotics; UBTech order
#           releases (technode, Kyodo); IDC, Counterpoint and BofA 2025 shipments, S (search)
#   WAYMO   https://en.wikipedia.org/wiki/Waymo ; Engadget, TechCrunch, CNBC ride counts, S (search)
#   CRUISE  https://en.wikipedia.org/wiki/Cruise_(autonomous_vehicle)
#   APOLLO  https://en.wikipedia.org/wiki/Apollo_Go ; Baidu quarterly results (gasgoo), S (search)
#   PONY    Pony.ai and WeRide IPO coverage (ChinaTalk, TechCrunch), S (search)
#   ZOOX    https://en.wikipedia.org/wiki/Zoox_(company)
#   OBI     Obi ride-hail price studies via TechCrunch (2025-06-12, 2026-01-27), S (search)
#   SFCTA   SFCTA, "TNCs Today" (2016): https://www.sfcta.org/projects/tncs-today , S (search)
#   UBER    Uber FY2024 release (11,273M trips; 2023 9,448M), investor.uber.com, S (search)
#   CPI     US BLS CPI-U annual averages (R; 2025 A, preliminary), as vehicles.yaml's

cpi: # R (CPI), as vehicles.yaml
  2010: 218.056
  2012: 229.594
  2015: 237.017
  2016: 240.007
  2019: 255.657
  2020: 258.811
  2021: 270.970
  2022: 292.655
  2023: 304.702
  2024: 313.689
  2025: 322.0

# --- Industrial robots by region (53.1) ---------------------------------------------------------------
# installations: thousands of industrial robots installed a year in the game region, real world (IFR).
#   north_america = US + Canada + Mexico: 2010 about 16k (R, IFR "North America"); US 27.5k (2015),
#   40.4k (2018), 35.0k (2021), 39.6k (2022), 37.6k (2023), 34.2k (2024), about 38k (2025) (IFR, S
#   (search)) plus Canada and Mexico about 8-15k (R). europe: Germany 14.1k (2010), 26.7k (2018),
#   23.8k (2021), 25.6k (2022), 27.0k (2024) is about a third of Europe's (IFR, S (search) and R); 2025
#   EU -11% (IFR 2026, S (search)). east_asia = China + Japan + Korea + Taiwan: China 15.0k / 68.6k /
#   154.0k / 268.2k / 290.3k / 276.3k / 295k / 354k (2010 / 2015 / 2018 / 2021-2025), Japan 21.9k /
#   ~35k / 55.2k / 47.2k / 50.4k / ~46.1k / 44.5k / ~36.2k, Korea 23.5k / 38.3k / 37.8k / 31.1k /
#   31.7k / 31.4k / 30.6k / ~30.2k (IFR, S (search)), Taiwan 7-11k (R). The rest: IFR's "rest of
#   Asia" about 37k in 2024 (D: world less the named), split A by their manufacturing (India about
#   9k, Thailand and Vietnam about 7k); Latin America without Mexico (Brazil about 2k), Africa and
#   Oceania about 1k each (R). Sums: 2010 about 122k (world 118-121k, WIR S), 2024 about 537k (world
#   542,076, WIR S), 2025 about 592k (world about 603k, IFR 2026 S (search)).
# segments: buyer industry shares (A by region, matching IFR's world split: automotive 23% and
#   electronics 24% in 2024, automotive 30% and electronics 25% in 2018; S (search) and WIR S): North
#   America's and Latin America's are car plants, East Asia's electronics.
# labour_usd: hourly compensation in manufacturing, the region's typical plant (dollars of the year):
#   north_america US-weighted with Mexico (US $35.67 in 2012, BLS S (search); Mexico $5-6, R), europe
#   EU-weighted (euro area industry EUR 38 in 2023, S (search); Germany $45.79 in 2012, R), east_asia
#   China-weighted where most of the region's robots go (China $1.74 in 2009, BLS R; CNY 43.26 = $6.29
#   in 2023, S (search); Japan $35.34 and Korea $20.72 in 2012, R), south_southeast_asia (India and
#   ASEAN, $1.5-3, A from BLS's Philippines $2.10 in 2012, R), latin_america (Brazil $11.20 in 2012,
#   R, falling with the real), africa and oceania (A).
# density: robots per 10,000 manufacturing workers, the region's leading country (IFRD 2023 S
#   (search); 2010 and 2015 R): shown on the Robotics screen.
regions:
  north_america:
    installations: { 2010: [16.0, R], 2015: [38.0, D], 2018: [55.0, D], 2021: [46.0, D], 2022: [52.0, D], 2023: [50.0, D], 2024: [46.0, D], 2025: [49.0, D] }
