# --- Humanoids (53.2) ------------------------------------------------------------------------------------
# The market opens with the humanoid_robotics era (eras.yaml: window 2030-2035); before it these are
# announcements and pilots (shown as history), not sales. Shipments were ~3,000 in 2024 and 13,000-20,000
# in 2025 (BofA, IDC, Counterpoint, S (search)).
# price_usd: a business humanoid at the era's arrival: $50,000 in 2025 dollars (A: Tesla's stated
#   $20,000-30,000 target (October 2024, HUM S); Unitree G1 $16,000 (S (search)); Agility's
#   robots-as-a-service about $8,500 a month (S (search), weak); Unitree H1 about $90,000 (S (search),
#   weak)).
# actuator_usd: a humanoid's actuators (about 28-40 joints) in its first year: $20,000 in 2025 dollars
#   (A: about 40% of a $50,000 robot's cost of goods, as analysts' teardowns of Optimus, R).
# other_usd: frame, battery, sensors and wiring: $6,000 in 2025 dollars (A).
# workers: millions of workers in logistics (transport and warehousing), retail and manufacturing, by
#   region (A from national labour statistics recalled: US transport and warehousing about 6.5M, retail
#   about 15.6M, manufacturing about 12.9M (BLS, R); EU manufacturing about 30M (Eurostat, R); China
#   manufacturing over 100M (NBS, R)).
humanoids:
  era: humanoid_robotics
  makers:
    - { company: Tesla Optimus, origin: us, owner: Tesla }
    - { company: Figure AI, origin: us }
    - { company: Agility Robotics, origin: us }
    - { company: Unitree, origin: china }
    - { company: UBTech, origin: china }
    - { company: Boston Dynamics, origin: us, owner: Hyundai (from June 2021) }
  announcements:
    - { company: Tesla Optimus, month: "2021-08", label: "Tesla announces Optimus at AI Day (19 August 2021)" } # HUM S
    - { company: Tesla Optimus, month: "2022-09", label: "First Optimus prototypes walk on stage at AI Day 2" } # HUM S (30 September, R)
    - { company: Agility Robotics, month: "2023-10", label: "Amazon starts testing Digit in a warehouse" } # HUM S
    - { company: Figure AI, month: "2024-01", label: "Figure signs a deal with BMW for its Spartanburg plant" } # HUM S (Spartanburg R)
    - { company: Boston Dynamics, month: "2024-04", label: "Boston Dynamics retires the hydraulic Atlas and unveils an electric one" } # HUM S (search)
    - { company: Unitree, month: "2024-05", label: "Unitree announces the G1 at $16,000", price_usd: [16000, 2024, S] } # HUM S (search); mass production from August 2024 (S)
    - { company: Agility Robotics, month: "2024-06", label: "GXO signs the first humanoid robots-as-a-service contract for Digit" } # HUM R
    - { company: Tesla Optimus, month: "2024-10", label: "Tesla targets a $20,000-30,000 price for Optimus" } # HUM S
    - { company: UBTech, month: "2025-11", label: "UBTech begins mass delivery of Walker S2 to car plants, orders over RMB 800M" } # HUM S (search)
  price_usd: [50000, 2025, A]
  actuator_usd: [20000, 2025, A]
  other_usd: [6000, 2025, A]
  workers:
    north_america: { logistics: [7.5, A], retail: [18.0, A], manufacturing: [23.0, A] }
    europe: { logistics: [11.0, A], retail: [30.0, A], manufacturing: [32.0, A] }
    east_asia: { logistics: [30.0, A], retail: [60.0, A], manufacturing: [130.0, A] }
    south_southeast_asia: { logistics: [20.0, A], retail: [60.0, A], manufacturing: [80.0, A] }
    latin_america: { logistics: [6.0, A], retail: [20.0, A], manufacturing: [15.0, A] }
    africa: { logistics: [5.0, A], retail: [25.0, A], manufacturing: [15.0, A] }
    oceania: { logistics: [0.7, A], retail: [1.5, A], manufacturing: [1.0, A] }

# --- Robotaxis (53.3) ----------------------------------------------------------------------------------------
# trips_index: ride-hailing trips a year over 2025's, world (D from Uber's trips: about 1.1bn in 2015, 6.9bn
#   in 2019, 5.0bn in 2020, 7.6bn in 2022, 11.27bn in 2024 (UBER S (search); earlier years R), 2025 about
#   12.5bn (A)); held flat after 2025 (robotaxi acceptance grows instead).
# vehicle_usd: a robotaxi with its sensors and compute: Waymo's Jaguar over $120,000 (Morgan Stanley,
#   October 2024) or about $150,000, "over $100,000" by June 2025 (WAYMO S); $200,000 in 2018 (A);
#   Baidu's RT6 about $28,000 in 2024 (S (search)) is China's, not used for the game's one price.
# sensor_usd: the lidar, radar, camera and compute kit fitted to an own L4 car (A: falling with lidar
#   prices, about $100,000 in 2015 to $30,000 in 2025).
robotaxi:
  trips_index: { 2012: [0.01, A], 2015: [0.09, D], 2019: [0.55, D], 2020: [0.40, D], 2022: [0.61, D], 2024: [0.90, D], 2025: [1.0, A] }
  vehicle_usd: { 2018: [200000, 2018, A], 2024: [150000, 2024, S], 2025: [100000, 2025, S] }
  sensor_usd: { 2015: [100000, 2015, A], 2020: [60000, 2020, A], 2025: [30000, 2025, A] }
  # cities: trips = millions of ride-hailing trips a week in 2025 (real). San Francisco from SFCTA's
  #   170,000+ intra-city trips a weekday in 2016 (S (search)) grown with the index, and Waymo's 27% of the
  #   city's bookings in 2025 (YipitData via Bloomberg, S (search)) at its ~120,000 rides a week (D);
  #   New York's high-volume for-hire trips about 650,000 a day (R); the rest A by the research's rule
  #   (trips a day about 0.05-0.1 x metro population in dense cores, 0.01-0.03 in sprawling metros; China
  #   with Didi's ~29M rides a day in 2023, S (search)). fare_usd = a human ride-hail trip, 2025 dollars:
  #   San Francisco's Uber $15.58 (OBI, S (search)); the rest A. km_per_trip A (US ride-hail trips about
  #   10-13 km, Chinese cities' shorter).
  cities:
    - { key: phoenix, label: Phoenix, region: north_america, country: us, trips: [0.50, A], fare_usd: [16.0, 2025, A], km_per_trip: [12, A] }
    - { key: san_francisco, label: San Francisco, region: north_america, country: us, trips: [1.20, D], fare_usd: [15.58, 2025, S], km_per_trip: [8, A] }
    - { key: los_angeles, label: Los Angeles, region: north_america, country: us, trips: [1.80, A], fare_usd: [17.0, 2025, A], km_per_trip: [13, A] }
    - { key: austin, label: Austin, region: north_america, country: us, trips: [0.34, A], fare_usd: [14.0, 2025, A], km_per_trip: [11, A] }
    - { key: atlanta, label: Atlanta, region: north_america, country: us, trips: [0.66, A], fare_usd: [15.0, 2025, A], km_per_trip: [13, A] }
    - { key: las_vegas, label: Las Vegas, region: north_america, country: us, trips: [0.48, A], fare_usd: [15.0, 2025, A], km_per_trip: [9, A] }
    - { key: new_york, label: New York, region: north_america, country: us, trips: [4.50, R], fare_usd: [24.0, 2025, A], km_per_trip: [9, A] }
    - { key: wuhan, label: Wuhan, region: east_asia, country: china, trips: [1.80, A], fare_usd: [3.0, 2025, A], km_per_trip: [8, A] } # Apollo Go RMB 7.5 against Didi's RMB 11-15 for 5 km (S (search))
    - { key: beijing, label: Beijing, region: east_asia, country: china, trips: [4.60, A], fare_usd: [4.0, 2025, A], km_per_trip: [9, A] }
    - { key: guangzhou, label: Guangzhou, region: east_asia, country: china, trips: [4.00, A], fare_usd: [3.5, 2025, A], km_per_trip: [8, A] }
    - { key: shenzhen, label: Shenzhen, region: east_asia, country: china, trips: [3.80, A], fare_usd: [3.5, 2025, A], km_per_trip: [8, A] }
    - { key: tokyo, label: Tokyo, region: east_asia, country: japan, trips: [1.00, A], fare_usd: [20.0, 2025, A], km_per_trip: [7, A] }
    - { key: london, label: London, region: europe, country: uk, trips: [1.90, A], fare_usd: [18.0, 2025, A], km_per_trip: [9, A] }
    - { key: berlin, label: Berlin, region: europe, country: germany, trips: [0.26, A], fare_usd: [15.0, 2025, A], km_per_trip: [8, A] }
    - { key: singapore, label: Singapore, region: south_southeast_asia, country: singapore, trips: [1.26, A], fare_usd: [10.0, 2025, A], km_per_trip: [10, A] }
    - { key: sao_paulo, label: São Paulo, region: latin_america, country: brazil, trips: [2.50, A], fare_usd: [5.0, 2025, A], km_per_trip: [10, A] }
    - { key: sydney, label: Sydney, region: oceania, country: australia, trips: [0.74, A], fare_usd: [15.0, 2025, A], km_per_trip: [11, A] }
  # operators: each service's first public driverless rides (driverless), its end, its fleet (cars) and
  #   paid rides a week (thousands) by year (a year's value sits at its middle). Waymo: Phoenix October
  #   2020, San Francisco's CPUC permit 10 August 2023 (open to all 25 June 2024), Los Angeles 12 November
  #   2024, Austin 4 March 2025 and Atlanta 24 June 2025 with Uber (WAYMO S); all cities' paid rides about
  #   10,000 a week early 2023, 50,000 (May 2024), 100,000 (August 2024), 200,000 (February 2025), 250,000
  #   (April 2025), ~450,000 (December 2025) (S (search)); fleet ~1,500 (May 2025, S (search)); the split
  #   by city is A (San Francisco's from its 27% of bookings, D). Cruise: paid driverless rides in San
  #   Francisco from June 2022, suspended by the California DMV on 24 October 2023 after the 2 October
  #   pedestrian incident; GM ended the programme on 10 December 2024 (CRUISE S); its 950-car recall (S)
  #   bounds its fleet. Baidu Apollo Go: Wuhan's commercial driverless service from 8 August 2022 (APOLLO
  #   S); rides 988,000 (Q3 2024, R) and 2.2M (Q2 2025, S (search)) a quarter, so ~76,000 and ~169,000 a
  #   week (D), about 80% in Wuhan (A); Wuhan's fleet "over 500" in 2024 (S (search)). Pony.ai about 250
  #   robotaxis at its IPO (November 2024, S (search)); WeRide about 700 robotaxis (October 2025, S
  #   (search)); their Guangzhou start months A. Tesla: Austin, 22 June 2025, with safety monitors (S
  #   (search)). Zoox: Las Vegas, 10 September 2025, about 50 robotaxis by January 2026 (ZOOX S).
  operators:
    - key: waymo
      label: Waymo (Alphabet)
      origin: us
      services:
        - { city: phoenix, driverless: "2020-10", fleet: { 2020: [300, A], 2024: [300, A], 2025: [400, A] }, rides: { 2020: [1, A], 2022: [5, A], 2023: [8, D], 2024: [30, D], 2025: [80, D] } }
        - { city: san_francisco, driverless: "2023-08", fleet: { 2023: [200, A], 2024: [300, A], 2025: [500, A] }, rides: { 2023: [2, A], 2024: [35, D], 2025: [120, D] } }
        - { city: los_angeles, driverless: "2024-11", fleet: { 2024: [100, A], 2025: [400, A] }, rides: { 2024: [5, A], 2025: [80, D] } }
        - { city: austin, driverless: "2025-03", fleet: { 2025: [100, A] }, rides: { 2025: [25, A] } }
        - { city: atlanta, driverless: "2025-06", fleet: { 2025: [100, A] }, rides: { 2025: [15, A] } }
    - key: cruise
      label: Cruise (General Motors)
      company: General Motors
      origin: us
      ended: "2024-12"
      services:
        - { city: san_francisco, driverless: "2022-06", end: "2023-10", fleet: { 2022: [100, S], 2023: [400, A] }, rides: { 2022: [1, A], 2023: [10, A] } }
    - key: apollo_go
      label: Apollo Go (Baidu)
      company: Baidu
      origin: china
      services:
        - { city: wuhan, driverless: "2022-08", fleet: { 2022: [100, A], 2024: [500, S], 2025: [1000, A] }, rides: { 2022: [5, A], 2023: [20, A], 2024: [60, D], 2025: [135, D] } }
        - { city: beijing, driverless: "2023-03", fleet: { 2023: [100, A], 2025: [300, A] }, rides: { 2023: [3, A], 2024: [15, D], 2025: [34, D] } }
    - key: pony
      label: Pony.ai
      origin: china
      services:
        - { city: guangzhou, driverless: "2023-03", fleet: { 2023: [100, A], 2024: [250, S], 2025: [700, A] }, rides: { 2023: [3, A], 2024: [10, A], 2025: [25, A] } }
    - key: weride
      label: WeRide
      origin: china
      services:
        - { city: guangzhou, driverless: "2024-07", fleet: { 2024: [200, A], 2025: [700, S] }, rides: { 2024: [3, A], 2025: [15, A] } }
    - key: tesla
      label: Tesla Robotaxi
      company: Tesla
      origin: us
      services:
        - { city: austin, driverless: "2025-06", fleet: { 2025: [30, A] }, rides: { 2025: [1, A] } }
    - key: zoox
      label: Zoox (Amazon)
      origin: us
      services:
        - { city: las_vegas, driverless: "2025-09", fleet: { 2025: [50, S] }, rides: { 2025: [2, A] } }
  incidents:
    - { operator: cruise, city: san_francisco, month: "2023-10", label: "A Cruise robotaxi dragged a pedestrian; the California DMV suspended its driverless permits", suspended_months: 14 } # CRUISE S: 2 and 24 October 2023; never lifted before GM's end (D)
