# --- Prices (53.1) --------------------------------------------------------------------------------------
# robot_usd: a robot's average value (arm and controller): ~$47k (2011) and ~$23k (2022) (ARK via EY, S
#   (search)); IFR's $16.5bn for 422,271 robots in 2018 is ~$39k (D, WIR S); $16.7bn in 2024 for
#   542,076 is ~$30.8k (D, WIR S; IA's average revenue a robot $25,600, S (search)).
# cobot_usd: a collaborative arm, $15-35k (VEND, S (search)): $35k (2015, A), $25k (2024, A midpoint).
# system_mult: IFR's robot systems ($48.0bn with software, peripherals and engineering) over robot
#   sales ($16.5bn) in 2018 = 2.9 (D, WIR S).
# service_share: annual maintenance 5-8% of the purchase price (VEND, S (search)).
prices:
  robot_usd: { 2011: [47000, 2011, S], 2018: [39000, 2018, D], 2022: [23000, 2022, S], 2024: [30800, 2024, D] }
  cobot_usd: { 2015: [35000, 2015, A], 2024: [25000, 2024, A] }
  system_mult: [2.9, D]
  service_share: [0.07, S]

# --- Makers (53.1) --------------------------------------------------------------------------------------
# shares: of the region's installations by year (A from these anchors, no public table by region was
# reachable): the big four (FANUC, ABB, Yaskawa, KUKA) about half of the world's units through the
# 2010s (R); in China FANUC 10.1% and Estun 9.9% in 2024 (MIR, S (search)) and the big four from
# about 70% to about 40% (Yicai, S (search)); domestic brands 28-30% in 2015-2020 and 57% in 2024 (IFR,
# S (search)). Estun stands for the Chinese makers here (Estun, Inovance, Efort, Siasun: one rival keeps
# the turn inside its budget; M39 decision). Kawasaki, Epson, Nachi, Denso, Mitsubishi and the rest are
# not in the game: their share is the market no rival serves. ABB Robotics' revenue ~$2.3bn in 2024
# (S (search)); KUKA EUR 3.9bn in 2025 (S); Midea owns KUKA from January 2017 (S); Teradyne bought
# Universal Robots in 2015 for $285m (S).
# M50 2008 (A): each maker's 2010 share, a point more for the Japanese makers in East Asia (Japan was
# 58% of the region's 2008 installations, IFR09 R) and for ABB and KUKA in Europe (Germany's car plants);
# Universal Robots sold its first UR5s in Denmark in late 2008 (UR08, R); the Chinese makers smaller.
# M50b 2000 (A): the Japanese makers' share in East Asia higher still (Japan about 85% of the region's
# 2000 installations, IFR00 R), FANUC and Yaskawa (Motoman) a little higher in North America's car
# plants; Universal Robots not founded (2005) and no Chinese maker of note (Estun's first robots
# about 2005, R).
