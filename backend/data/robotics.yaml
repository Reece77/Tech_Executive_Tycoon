  north_america:
    installations: { 2000: [13.0, R], 2001: [10.8, R], 2002: [9.2, R], 2003: [12.6, R], 2004: [14.7, R], 2005: [19.5, R], 2006: [17.5, R], 2007: [18.0, R], 2008: [16.5, R], 2009: [8.5, R], 2010: [16.0, R], 2015: [38.0, D], 2018: [55.0, D], 2021: [46.0, D], 2022: [52.0, D], 2023: [50.0, D], 2024: [46.0, D], 2025: [49.0, D] }
