# --- Industrial robots by region (53.1) ---------------------------------------------------------------
# installations: thousands of industrial robots installed a year in the game region, real world (IFR).
#   north_america = US + Canada + Mexico: 2010 about 16k (R, IFR "North America"); US 27.5k (2015),
#   40.4k (2018), 35.0k (2021), 39.6k (2022), 37.6k (2023), 34.2k (2024), about 38k (2025) (IFR, S
#   (search)) plus Canada and Mexico about 8-15k (R). europe: Germany 14.1k (2010), 26.7k (2018),
#   23.8k (2021), 25.6k (2022), 27.0k (2024) is about a third of Europe's (IFR, S (search) and R); 2025
#   EU -11% (IFR 2026, S (search)). east_asia = China + Japan + Korea + Taiwan: China 15.0k / 68.6k /
#   154.0k / 268.2k / 290.3k / 276.3k / 295k / 354k (2010 / 2015 / 2018 / 2021-2025), Japan 21.9k /
#   ~35k / 55.2k / 47.2k / 50.4k / ~46.1k / 44.5k / ~36.2k, Korea 23.5k / 38.3k / 37.8k / 31.1k /
#   31.7k / 31.4k / 30.6k / ~30.2k (IFR, S (search)), Taiwan 7-11k (R). The rest: IFR's "rest of
#   Asia" about 37k in 2024 (D: world less the named), split A by their manufacturing (India about
#   9k, Thailand and Vietnam about 7k); Latin America without Mexico (Brazil about 2k), Africa and
#   Oceania about 1k each (R). Sums: 2010 about 122k (world 118-121k, WIR S), 2024 about 537k (world
#   542,076, WIR S), 2025 about 592k (world about 603k, IFR 2026 S (search)).
# segments: buyer industry shares (A by region, matching IFR's world split: automotive 23% and
#   electronics 24% in 2024, automotive 30% and electronics 25% in 2018; S (search) and WIR S): North
#   America's and Latin America's are car plants, East Asia's electronics.
# labour_usd: hourly compensation in manufacturing, the region's typical plant (dollars of the year):
#   north_america US-weighted with Mexico (US $35.67 in 2012, BLS S (search); Mexico $5-6, R), europe
#   EU-weighted (euro area industry EUR 38 in 2023, S (search); Germany $45.79 in 2012, R), east_asia
#   China-weighted where most of the region's robots go (China $1.74 in 2009, BLS R; CNY 43.26 = $6.29
#   in 2023, S (search); Japan $35.34 and Korea $20.72 in 2012, R), south_southeast_asia (India and
#   ASEAN, $1.5-3, A from BLS's Philippines $2.10 in 2012, R), latin_america (Brazil $11.20 in 2012,
#   R, falling with the real), africa and oceania (A).
# density: robots per 10,000 manufacturing workers, the region's leading country (IFRD 2023 S
#   (search); 2010 and 2015 R): shown on the Robotics screen.
# M50 2008-2009: installations from IFR09 (R): north_america = the Americas less Brazil; europe as IFR's
#   Europe; east_asia D = China + Japan + Korea + Taiwan (about 4.4k in 2008, 1.5k in 2009, R) = 57.0k and
#   27.6k; the rest A, scaled with the world's 2009 fall of 47% (IFR09). World sums about 116k (2008) and
#   60k (2009) against IFR's 113k and 60k. labour_usd 2008 (BLS09, R): north_america D = 2010's 30.0 x the
#   US's 2008/2010 ratio (about 0.95); europe R (Germany-weighted, the euro at $1.47); east_asia D = 2010's
#   4.0 x China's 2008/2010 ratio, Japan and Korea (the won fell in 2008) held; latin_america R (Brazil
#   $8.1, the real strong before the crash); the rest A, about 5% below 2010 nominal. density 2008
#   (IFR09D, R): US about 125, Germany about 253, Korea about 305 (Japan's 295-310); SSEA A.
# M50b 2000-2007: installations R (north_america, europe) and D (east_asia = Japan + Korea + China +
#   Taiwan) from IFR00, the rest A, each year's regions summing to WIR00's world total (S) within 1%:
#   the 2001-2002 fall and 2005's peak (Japan's and Korea's car and LCD plants). labour_usd (anchors
#   at 2000, 2002, 2004 and 2006) D from 2008's value run back with BLS00 (R): north_america and oceania about 3% a year nominal (oceania
#   with the Australian dollar), europe in euros (about 2.5% a year) x FRED00's EXUSEU, east_asia and
#   south_southeast_asia A (China's pay rising about 12% a year), latin_america with the real, africa
#   with the rand (A). density A: the leaders' counts rising to 2008's (US about 85 in 2000, Germany
#   about 155, Japan about 280, the world's highest until Korea passed it, R).
