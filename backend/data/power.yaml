# Power and owned plants (docs/formulas.md 46, M32, v4 lane A; ADR-0022). Research: M32 sub-task 1
# (2026-11-14) from docs/v4-research/power-dossier.md. Every value carries a tag and a source:
#   S  a sourced figure, read from the source itself (the report's table or the page's text),
#   D  derived from sourced figures (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session
#      (only where the source could not be opened: World Bank Pink Sheet annual gas prices,
#      ECB and FX annual rates, BLS CPI-U, Australia's fixed carbon price),
#   A  an assumption for gameplay where no public series was found.
# Search results quoted by a search engine but not opened count as S only where the number was
# quoted with its source; they are marked "(search)" in the comment.
#
# Money: plant costs are stored as published (value, dollar year) and the loader converts
# them to 2010 dollars with `cpi` (the game's money is in 2010 dollars: refining.power_cents_per_mwh
# is the 2010 US industrial price, and M17's power index is a ratio to North America). Carbon prices
# are stored in each scheme's currency and converted with `fx` (local units a US dollar) and `cpi`.
#
# Sources:
#   EIA13   EIA, Updated Capital Cost Estimates for Utility Scale Electricity Generating Plants,
#           April 2013, Table 1 (2012$): https://www.eia.gov/outlooks/capitalcost/pdf/updated_capcost.pdf
#   AEO23   EIA, Cost and Performance Characteristics of New Generating Technologies, AEO2023,
#           Table 1 (2022$; lead times): https://www.eia.gov/outlooks/aeo/assumptions/pdf/elec_cost_perf.pdf
#   SL24    EIA / Sargent & Lundy, Capital Cost and Performance Characteristics for Utility-Scale
#           Electric Power Generating Technologies, January 2024 (AEO2025), Table 1-2 (2023$):
#           https://www.eia.gov/analysis/studies/powerplants/capitalcost/pdf/capital_cost_AEO2025.pdf
#   LAZ25   Lazard, Levelized Cost of Energy+ v18.0, June 2025, key assumptions pp. 34-37 (2025$):
#           https://www.lazard.com/media/5tlbhyla/lazards-lcoeplus-june-2025-_vf.pdf
#   LBLS    Berkeley Lab, Utility-Scale Solar (2021, 2022, 2023 editions; news releases):
#           https://emp.lbl.gov/news/berkeley-lab-s-latest-utility-scale and .../utility-scale-1
#   LBLW    Berkeley Lab, Land-Based Wind Market Report (2016 and 2021 editions; news releases):
#           https://emp.lbl.gov/news/annual-wind-power-report-confirms , https://emp.lbl.gov/news/new-report-shows-technology
#   QU24    Berkeley Lab, Queued Up 2024 Edition (end of 2023): https://emp.lbl.gov/publications/queued-2024-edition-characteristics
#   QU25    Berkeley Lab, Queued Up 2025 Edition (end of 2024): https://eta-publications.lbl.gov/publications/queued-2025-edition-characteristics
#   OWID    Our World in Data from Ember, carbon intensity and generation CSVs:
#           https://ourworldindata.org/grapher/electricity-mix.csv (metric carbon_intensity),
#           https://ourworldindata.org/grapher/electricity-generation.csv
#   EIAC    EIA, carbon dioxide emission coefficients (natural gas 52.91 kg CO2 a million Btu):
#           https://www.eia.gov/environment/emissions/co2_vol_mass.php
#   HH      EIA Henry Hub spot price, annual (FRED AHHNGSP): https://alfred.stlouisfed.org/series?seid=AHHNGSP ,
#           2025: https://www.eia.gov/todayinenergy/detail.php?id=66984
#   PINK    World Bank Commodity Price Data (Pink Sheet), annual natural gas Europe (TTF) and
#           Japan LNG: https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Pink-Sheet-August-2025.pdf
#   DEHST   German Emissions Trading Authority, auctioning annual reports (volume-weighted average
#           EUA auction price): https://www.dehst.de/SharedDocs/downloads/EN/auctioning/2015/Auctioning_2015_annual-report.pdf ,
#           .../2021/2021_annual-report.pdf , .../2022/2022_annual-report.pdf , .../2024/2024_annual-report.pdf
#   EEA     ETC CM reports, Trends and projections in the EU ETS 2024 and 2025:
#           https://www.eionet.europa.eu/etcs/etc-cm/products/etc-cm-report-2024-09 , .../etc-cm-report-2025-06
#   ESMA    ESMA, Carbon markets report 2026 (2025 average EUR 74):
#           https://www.esma.europa.eu/sites/default/files/2026-07/ESMA50-481369926-34622_Carbon_markets_report_2026.pdf
#   CETS    China national ETS: Transition Asia (2023 average CNY 68), MEE progress report 2025
#           (2024 range 69-106, year-end 97.49), ICAP (2025 average CNY 70.78):
#           https://transitionasia.org/steel-enters-chinas-national-emissions-trading-scheme/ ,
#           https://xcoss.henan.gov.cn/typtfile/20251009/1613827be7d04b2aaa0cfc06b84f458e.pdf ,
#           https://icapcarbonaction.com/en/ets/china-national-ets
#   DB19    World Bank Doing Business 2020, Getting Electricity (SAIDI hours, SAIFI), via
#           https://statranker.org/economy/construction-infrastructure/top-100-countries-by-electricity-reliability-and-outage-time/ (search)
#   VOG     Vogtle 3 and 4: AP's $31 billion capital and financing (2024), 2 x 1,117 MW:
#           https://www.power-eng.com/nuclear/georgia-nuclear-rebirth-arrives-7-years-late-17-billion-over-cost/ ,
#           https://www.wrdw.com/2024/04/29/plant-vogtle-unit-4-enters-full-operation-serving-customers/
#   CFPP    NuScale/UAMPS Carbon Free Power Project, cancelled 8 November 2023: $9.3 billion for
#           462 MW ($20,139/kW), up from $5.3 billion:
#           https://www.cooperative.com/programs-services/bts/Documents/Advisories/Advisory-NuScale-and-UAMPS-End-SMR-Project-CFPP-Dec-2023.pdf
#   DOE24   DOE / Berkeley Lab, data centres 4.4% of US electricity in 2023, 6.7-12% by 2028:
#           https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers
#   WIKI    English Wikipedia company articles (read 2026-11-14), for producers' capacity:
#           https://en.wikipedia.org/wiki/<article> as named on each producer.
#   CPI     BLS CPI-U, US city average, annual average (1982-84 = 100): https://www.bls.gov/cpi/
#
# M50 (ADR-0024, formulas.md 60.2; 2026-11-23): 2008 and 2009 entries added before 2010 in every
# series that reaches 2010 (annual series both years; sparse series 2008, and 2009 where the crisis
# shows); 2010 onward is unchanged (interpolation is between neighbouring points). Same S/D/R/A tags.
# M50 (2008-2009) sources:
#   FRED    FRED CSVs read this session: CPIAUCNS (CPI-U annual means), EXUSEU (ECB USD/EUR,
#           annual means), AHHNGSP (Henry Hub annual): https://fred.stlouisfed.org/graph/fredgraph.csv?id=<id>
#   OWIDE   OWID energy data (Ember and EI), electricity_generation and carbon_intensity_elec, read
#           this session: https://raw.githubusercontent.com/owid/energy-data/master/owid-energy-data.csv
#   AEO10   EIA, Assumptions to the Annual Energy Outlook 2010, Table 8.2 (2008$; recalled)
#   LBLW08  Berkeley Lab, 2008 Wind Technologies Market Report (2008$; recalled)
#   EUA     EU ETS phase II allowance prices, 2008 about EUR 22 and 2009 about EUR 13 (BlueNext and
#           EEX spot, as reported by the EEA and ICAP; recalled)
# M50b (formulas.md 60.4; 2026-11-28): 2000-2007 added the same way (annual series every year;
# sparse series 2000, and 2004 where costs bend); each region's rows follow its 2008 rule and tag.
# M50b (2000-2007) sources:
#   FRED    as M50: CPIAUCNS, EXUSEU and AHHNGSP annual means, read this session
#   PINK    World Bank CMO Historical Data Annual, nominal, read this session:
#           https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Annual.xlsx
#   OWIDE   as M50, read this session (2000-2007 rows; the same countries and divisors as 2008)
#   AEO01   EIA, Assumptions to the AEO2001 and AEO2005, new plant overnight costs (recalled, +/-15%)
#   TTS     Berkeley Lab, Tracking the Sun (2009): PV installed cost about $9/W in 2000 (recalled)
#   LBLW08  as M50: projects built 2001-2004 about $1,300/kW, the trough before 2005-2008's rise
#   MIT03   MIT, The Future of Nuclear Power (2003): overnight $2,000/kW (2002$; recalled)
#   EUA1    EU ETS phase I (2005-2007) spot, about EUR 18 (2005), 17 (2006) and 0.7 (2007), when
#           unbankable phase I allowances fell to near zero (EEA and Point Carbon; recalled)

cpi: # R (CPI): annual averages; 2025 A (preliminary)
  2000: 172.2 # M50b S: FRED CPIAUCNS annual means 2000-2007
  2001: 177.067
