  EUR: { 2000: 1.083, 2001: 1.117, 2002: 1.058, 2003: 0.884, 2004: 0.804, 2005: 0.803, 2006: 0.796, 2007: 0.729, 2008: 0.680, 2009: 0.718, 2010: 0.754, 2011: 0.718, 2012: 0.778, 2013: 0.753, 2014: 0.753, 2015: 0.901, 2016: 0.903, 2017: 0.885, 2018: 0.847, 2019: 0.893, 2020: 0.876, 2021: 0.846, 2022: 0.950, 2023: 0.925, 2024: 0.924, 2025: 0.885 }
  CNY: { 2021: 6.45, 2022: 6.73, 2023: 7.08, 2024: 7.19, 2025: 7.20 }
  AUD: { 2012: 0.966, 2013: 1.036, 2014: 1.109 }
  # M50: EUR 2008 0.680 and 2009 0.718 are S (FRED EXUSEU 1.470 and 1.393, inverted); USD 2008 by definition
