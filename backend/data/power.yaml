  USD: { 2000: 1.0, 2008: 1.0, 2010: 1.0 }

# --- Plant types (46.2) ------------------------------------------------------------------------
# capex: $/kW overnight by build year as [value, dollar year, tag]; linear between the year points
#   (in 2010 dollars), held after the last point until the seeded learning curve (balance
#   power.learning) takes over from 2026.
# build_months: months from the order to completion before any overrun delay.
# capacity_factor: the share of the year it generates at full power (dispatchable gas: its
#   availability; it runs only when its marginal cost is under the grid price). By region for
#   solar and wind.
# fixed_om: $/kW-year [value, dollar year, tag] by year; variable_om: $/MWh; heat_rate: Btu/kWh
#   (gas: fuel and carbon follow from it and the region's gas price; nuclear's fuel is fuel_mwh).
# life_years: depreciation and the levelised cost's horizon.
plant_types:
  - key: gas
    label: Gas combined cycle
    capex:
      2000: [460, 1999, "R: AEO01 conventional combined cycle about $460/kW (1999$; M50b)"]
      2004: [560, 2004, "R: AEO05 conventional combined cycle about $560/kW, before the 2005-2008 cost escalation (M50b)"]
      2008: [984, 2008, "R: AEO10 conventional combined cycle overnight cost (M50)"]
      2010: [1019, 2010, "D: EIA13 says its CC overnight cost fell 10% from the 2010 study: 917 / 0.9"]
      2012: [917, 2012, "S: EIA13 conventional CC, 620 MW"]
      2022: [1176, 2022, "S: AEO23 combined-cycle multi-shaft, 1,083 MW"]
      2023: [921, 2023, "S: SL24 CC 1x1x1 single shaft, 627 MW"]
      2025: [1400, 2025, "S: LAZ25 gas combined cycle $1,200-1,600, midpoint (turbine shortage)"]
    build_months: [36, "S: AEO23 lead time 3 years (LAZ25 assumes 24 months)"]
    capacity_factor: { all: [0.90, "S: LAZ25 high end 90% (availability; dispatch decides the rest)"] }
    fixed_om:
      2012: [13.17, 2012, "S: EIA13"]
      2023: [15.51, 2023, "S: SL24"]
    variable_om:
      2012: [3.60, 2012, "S: EIA13"]
      2023: [3.33, 2023, "S: SL24"]
    heat_rate:
      2012: [7050, "S: EIA13"]
      2023: [6226, "S: SL24"]
    carbon_kg_per_mmbtu: [52.91, "S: EIAC natural gas"]
    life_years: [30, "S: LAZ25 facility life"]
  - key: solar_storage
    label: Solar with storage
    capex: # 150 MWac of single-axis PV with a 50 MW, 4-hour battery (SL24's AC-coupled case)
      2000: [13030, 2000, "D: TTS PV about $9,000/kW (2000$, R) x 1.448, SL24's hybrid / PV ratio; no utility PV or grid batteries yet (M50b)"]
      2008: [8740, 2008, "D: AEO10 solar PV $6,038/kW (2008$, R) x 1.448, SL24's hybrid / PV ratio (M50)"]
      2010: [7190, 2010, "D: EIA13 PV 150 MW $3,873 (2012$) was 22% below the 2010 study (/0.78), x 1.448, SL24's hybrid / PV ratio ($2,175 / $1,502)"]
      2012: [5608, 2012, "D: EIA13 PV 150 MW $3,873 x 1.448 (SL24's hybrid / PV ratio)"]
      2022: [1808, 2022, "S: AEO23 solar PV with storage"]
      2023: [2175, 2023, "S: SL24 PV with single-axis tracking and AC-coupled battery"]
      2025: [2175, 2023, "A: held at SL24; LBLS 2025 edition shows 2024 PV costs up 1%"]
