# Media and entertainment (docs/formulas.md 65, M55, v6 lane B). Research: M55 sub-task 1 (2026-11-26)
# from docs/v6-research/media-dossier.md. History holds to December 2025; seeded after (balance.yaml
# media.*). Every value carries a tag and a source, as telecom.yaml's:
#   S  a sourced figure fetched by the product manager for the dossier (GroupM, Newzoo; links there),
#   D  derived from other figures here (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session,
#   A  an assumption for gameplay where no public series was found (the basis is given).
# Values are [value, tag]; money is [value, dollar year, tag] under keys ending _usd and becomes the game's
# 2010 cents with `cpi` at load (robotics.yaml's conversion). Re-check the R and A rows against GroupM's This
# Year Next Year, Newzoo, Antenna, Ampere and the companies' filings when those hosts are reachable (M55
# follow-up).
#
# Scale (Reece, 2026-11-15, formulas.md 54): users, subscribers and money here are real-world; the game's
# markets are x balance.yaml media.scale (0.085, the economy scale, as telecom.scale), at real prices.
#
# Regions follow the game's (platforms.yaml region_parts): north_america is the US, Canada and Mexico;
# europe includes Russia and Turkey; Meta's "Asia-Pacific" is split over east_asia, south_southeast_asia and
# oceania, and its "Rest of world" over latin_america and africa (D, by internet users).
#
# Sources (named; R unless tagged S):
#   GM    GroupM This Year Next Year (global and regional ad revenue; 2024-2025 S, the dossier's link)
#   NZ    Newzoo Global Games Market Report (2024 S, the dossier's link)
#   ITU   ITU Facts and Figures (internet users by region)
#   META  Meta Platforms 10-K and quarterly reports (monthly users, ARPU by region)
#   NFLX  Netflix shareholder letters and 10-K (paid memberships by region, content cash spend)
#   DIS   Disney 10-K (Disney+, Hulu);  WBD  Warner Bros. Discovery reports (HBO Max, Max);
#   PARA  Paramount reports (CBS All Access, Paramount+);  CMCSA  Comcast reports (Peacock)
#   AMZN  Amazon releases (Prime Video);  GOOG  Alphabet releases (YouTube users, YouTube Premium and Music)
#   SPOT  Spotify reports;  SNAP  Snap reports (daily users);  TWTR  Twitter reports to 2022, X's claims after
#   BD    ByteDance and press reports (TikTok, Douyin);  TME  Tencent reports (WeChat, Tencent Video, games)
#   EA, ATVI, TTWO, UBI, NTDO, SONY, MSFT, NTES, RBLX  the publishers' annual reports (games revenue)
#   ANT   Antenna (streaming churn);  DTVR  Digital TV Research (SVOD subscriptions by region)
#   MPA   the MPA's THEME reports and Gower Street (global box office)
#   CPI   US BLS CPI-U annual averages (R; 2025 A, preliminary), as telecom.yaml

cpi: # R (CPI), as telecom.yaml
  # M50b (formulas.md 60.4): 2000-2007 added the same way (BLS CPI-U annual averages, R)
  2000: 172.192
  2001: 177.042
  2002: 179.867
  2003: 183.960
  2004: 188.883
  2005: 195.267
  2006: 201.558
  2007: 207.342
  2008: 215.303
  2009: 214.537
  2010: 218.056
  2011: 224.939
  2012: 229.594
  2013: 232.957
  2014: 236.736
  2015: 237.017
  2016: 240.007
  2017: 245.120
  2018: 251.107
  2019: 255.657
  2020: 258.811
  2021: 270.970
  2022: 292.655
  2023: 304.702
  2024: 313.689
  2025: 322.000

# --- 65.1 advertising ------------------------------------------------------------------------------------
ads:
