  # M50b (formulas.md 60.4): 2000-2007 added the same way; sources in docs/v6-research/start-2000/media.md.
  # 2000 R (about $450B at the dot-com peak; Zenith, GroupM), 2001 R (the ad recession, about -8%),
  # 2002-2007 A (the recovery at about 3-4% a year to 2008's level)
  spend_usd:
    2000: [450, 2000, R]
    2001: [415, 2001, R]
    2002: [418, 2002, A]
    2003: [432, 2003, A]
    2004: [455, 2004, A]
    2005: [468, 2005, A]
    2006: [486, 2006, A]
    2007: [500, 2007, A]
    2008: [480, 2008, R]
    2009: [445, 2009, R]
    2010: [490, 2010, R]
    2015: [560, 2015, R]
    2020: [630, 2020, R]
    2024: [1040, 2024, S] # GM: "$1.04 trillion", up 9.5%
    2025: [1100, 2025, S] # GM forecast
  digital_share: # GM
    # M50b: internet about 3% of ad spend in 2000 and about 10% by 2007 (R, GM and IAB); between A
    2000: [0.03, R]
    2001: [0.03, A]
    2002: [0.03, A]
    2003: [0.04, A]
    2004: [0.05, A]
    2005: [0.06, A]
    2006: [0.08, A]
    2007: [0.10, R]
    2008: [0.11, R]
    2010: [0.16, R]
    2015: [0.30, R]
    2020: [0.60, R]
    2024: [0.72, R]
    2025: [0.729, S]
  # Regional shares of global ad spend (GM by region, R; Asia-Pacific split by D as above). Each year sums to 1.
  region_share:
    # M50b: 2000 and 2004 A from GM's and Zenith's regional rows (R): North America's and Japan's larger shares
    2000: { north_america: [0.44, A], europe: [0.27, A], east_asia: [0.18, A], south_southeast_asia: [0.03, A], latin_america: [0.05, A], africa: [0.01, A], oceania: [0.02, A] }
    2004: { north_america: [0.41, A], europe: [0.28, A], east_asia: [0.19, A], south_southeast_asia: [0.03, A], latin_america: [0.05, A], africa: [0.02, A], oceania: [0.02, A] }
    2008: { north_america: [0.38, R], europe: [0.27, R], east_asia: [0.19, R], south_southeast_asia: [0.04, R], latin_america: [0.07, R], africa: [0.02, R], oceania: [0.03, R] }
    2020: { north_america: [0.36, R], europe: [0.21, R], east_asia: [0.27, R], south_southeast_asia: [0.06, R], latin_america: [0.05, R], africa: [0.02, R], oceania: [0.03, R] }
    2025: { north_america: [0.35, R], europe: [0.20, R], east_asia: [0.28, R], south_southeast_asia: [0.07, R], latin_america: [0.05, R], africa: [0.02, R], oceania: [0.03, R] }
  # The share of a region's people on iOS (A from StatCounter's mobile OS shares around 2021, R): the users
  # App Tracking Transparency's cut reaches, used only before M31's platforms exist (iOS's share in the game after)
  ios_share: { north_america: [0.55, R], europe: [0.30, R], east_asia: [0.25, R], south_southeast_asia: [0.05, R], latin_america: [0.12, R], africa: [0.05, R], oceania: [0.55, R] }
  # Privacy events (65.1): a cut to targeting quality from the month, in the listed regions, weighted by
  # where the impressions are delivered (M57r-A): ATT x iOS users not on the company's own platform; a
  # regional rule x the users not on the company's own platforms.
  privacy:
    - { key: gdpr, label: "GDPR", month: "2018-05", regions: [europe], cut: [0.10, A], source: "R: in force 25 May 2018 (EU); A: about a tenth of targeting lost to consent (Meta's 2018 European ARPU flat)" }
    - { key: att, label: "App Tracking Transparency", month: "2021-04", regions: [north_america, europe, east_asia, south_southeast_asia, latin_america, africa, oceania], cut: [0.30, A], ios_only: true, source: "R: iOS 14.5, April 2021; Meta put the 2022 cost at about $10B (Q4 2021 call), about 8% of revenue: a 30% cut on iOS's share (D)" }
    - { key: dsa, label: "Digital Services Act", month: "2023-08", regions: [europe], cut: [0.05, A], source: "R: very large platforms from 25 August 2023, all platforms 17 February 2024 (EU)" }

