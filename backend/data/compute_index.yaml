# AI compute price index by calendar year (docs/formulas.md 18.6, M8). Hosting in a category
# with `compute_indexed: true` (AI models and inference) is h x index(year).
# index(base_year) = base; each later year multiplies the year before by changes[year], or by
# default_change for a year not listed: falling 15% a year to 2016, x1.1 in 2017-2018, flat
# 2019-2022, the GPU shortage (x1.6 in 2023, x1.3 in 2024), then falling 15% a year.
base_year: 2010
base: 1.0
default_change: 0.85
changes:
  2017: 1.1
  2018: 1.1
  2019: 1.0
  2020: 1.0
  2021: 1.0
  2022: 1.0
  2023: 1.6
  2024: 1.3
