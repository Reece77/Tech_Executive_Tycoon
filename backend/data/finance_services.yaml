  # (IFR); before it about 0.8% credit and 0.4% debit, R. Blends: US 60% credit, 40% debit; EU 40% credit,
  # 60% debit (A, by card mix). Australia's RBA caps from 2003 about 0.5% (R). Elsewhere A.)
  interchange_bp:
    north_america: [{ from: "2008-01", bp: [156, D] }, { from: "2011-10", bp: [132, D] }]
    europe: [{ from: "2008-01", bp: [56, D] }, { from: "2015-12", bp: [24, D] }]
