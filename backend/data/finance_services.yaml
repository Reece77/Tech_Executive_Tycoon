  fraud_bp: [6.5, R] # card fraud about 6-7 cents a $100 of volume worldwide (Nilson Report)
  merchant_discount_bp: [230, R] # what a merchant pays its acquirer on a US card sale, about 2-3% (R: Federal Reserve, Nilson)
  # A merchant's yearly card volume (A: US card volume $3.1T / about 10M merchant locations, R), and a
  # network unit: $10M of yearly card volume (A, as M53's wholesale contract: a pay_networks customer).
  volume_per_merchant_usd: [300000, 2010, A]
  network_unit_usd: [10000000, 2010, A]
  # Real-time rails' share of a region's card and digital volume (R for the dates: India's UPI from April
  # 2016, NPCI; Brazil's Pix from November 2020, Banco Central do Brasil; the US's FedNow from July 2023,
  # Federal Reserve; the shares are A: UPI over 10 billion transactions a month by 2023, R, mostly small
  # tickets; Pix about 40% of Brazil's transactions by 2023, R). Rails pay no network fee.
  rails:
    - { name: UPI, region: south_southeast_asia, from: "2016-04", shares: { 2016: [0.0, A], 2018: [0.10, A], 2020: [0.30, A], 2022: [0.50, A], 2024: [0.62, A], 2025: [0.65, A] } }
    - { name: Pix, region: latin_america, from: "2020-11", shares: { 2020: [0.0, A], 2021: [0.15, A], 2022: [0.25, A], 2023: [0.32, A], 2025: [0.40, A] } }
    - { name: FedNow, region: north_america, from: "2023-07", shares: { 2023: [0.0, A], 2024: [0.002, A], 2025: [0.005, A] } }
  # Dated events (R): Apple Pay's US launch October 2014; Apple Card with Goldman Sachs August 2019; Affirm's
  # IPO January 2021; the CFPB's rule treating buy-now-pay-later as cards (May 2024, withdrawn 2025).
  notes:
    - { month: "2014-10", text: "Apple Pay launches in the US" }
    - { month: "2019-08", text: "Apple Card launches with Goldman Sachs" }
    - { month: "2021-01", text: "Affirm lists in New York" }

