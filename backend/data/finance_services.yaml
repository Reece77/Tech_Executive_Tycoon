# Financial services: banking, payments and insurance (docs/formulas.md 64.1-64.3 and 64.5, M54, v6 lane A).
# Research: M54 sub-task 1 (2026-11-26) from docs/v6-research/finance-dossier.md. History holds to December
# 2025; seeded after (balance.yaml finserv.*). Every value carries a tag and a source:
#   S  fetched in this session from the named source (FRED's CSV service,
#      https://fred.stlouisfed.org/graph/fredgraph.csv?id=<series>, fetched 2026-11-26, which republishes the
#      FDIC's and the Federal Reserve's series; yearly values are the means of the series' observations),
#   D  derived from other rows (the derivation is in the comment),
#   R  widely reported and recalled from the named source, not re-read in this session,
#   A  an assumption for gameplay where no public series was used (the basis is given).
# M50 convention (ADR-0024): a series that starts in 2010 lists 2008 as its 2010 value (A), so a 2008 game
# reads 2010's level; finance markets in a 2008 game are those of 2010 (a follow-up: 2008-2009's crisis).
# Money is [value, dollar year, tag] under keys ending _usd, converted to the game's 2010 cents with `cpi`
# at load (telecom.yaml's convention); rates and ratios are % a year unless named _share or _bp.
#
# Scale (Reece, 2026-11-15, formulas.md 54): counts here (accounts, merchants, policies, volume units) are
# real-world; the game's markets are x balance.yaml finserv.scale (0.085, the economy scale, as
# telecom.scale), at real prices.
#
# Corrections to the dossier (M54 brief, Decisions made): the US banks' net interest margin is S here
# (FRED USNIM, quarterly to Q3 2020): 3.76% (2010), 2.99% (2015), 2.92% (2020), not the dossier's 3.8, 3.3
# and 2.8; the all-loan net charge-off rate is S (CORALACBS): 2.67% (2010), 0.42% (2015), 0.24% (2021),
# 0.65% (2024), within the dossier's figures except 2015 (0.5 there). Card charge-offs (CORCCACBS) were
# 9.4% in 2010 and 2.1-4.6% from 2013, wider than the dossier's 3-5%.
cpi: # R (CPI-U, BLS), as telecom.yaml
  2008: 215.303
  2009: 214.537
  2010: 218.056
  2011: 224.939
  2012: 229.594
  2013: 232.957
  2014: 236.736
  2015: 237.017
  2016: 240.007
  2017: 245.120
  2018: 251.107
  2019: 255.657
  2020: 258.811
  2021: 270.970
  2022: 292.655
  2023: 304.702
  2024: 313.689
  2025: 322.0

# --- 64.1 Banking ---------------------------------------------------------------------------------------
banking:
  # US banks' net interest margin, % (S: FRED USNIM, FDIC, quarterly; 2021-2025 R: FDIC Quarterly Banking
  # Profile, the dossier's 2.5 (2021 low), 3.3 (2023), 3.2 (2024)). Rivals' net interest income reads it.
  nim:
    2008: [3.27, S]
    2009: [3.35, S]
    2010: [3.76, S]
    2011: [3.54, S]
    2012: [3.41, S]
    2013: [3.20, S]
    2014: [3.10, S]
    2015: [2.99, S]
    2016: [3.03, S]
    2017: [3.13, S]
    2018: [3.31, S]
    2019: [3.34, S]
    2020: [2.92, S]
    2021: [2.54, R]
    2022: [3.00, R]
    2023: [3.30, R]
    2024: [3.20, R]
    2025: [3.25, A] # A: 2024's level
  # US commercial banks' deposits and loans, $ trillion, yearly means (S: FRED DPSACBW027SBOG and TOTLL,
  # weekly, Federal Reserve H.8). A deposit account's average balance grows with deposits / accounts.
  deposits_trn:
    { 2008: [6.924, S], 2009: [7.474, S], 2010: [7.751, S], 2011: [8.204, S], 2012: [8.798, S], 2013: [9.482, S], 2014: [10.172, S], 2015: [10.771, S], 2016: [11.247, S], 2017: [11.763, S], 2018: [12.173, S], 2019: [12.790, S], 2020: [15.011, S], 2021: [17.151, S], 2022: [17.972, S], 2023: [17.386, S], 2024: [17.633, S], 2025: [18.240, S] }
  loans_trn:
    { 2008: [6.702, S], 2009: [6.705, S], 2010: [6.548, S], 2011: [6.528, S], 2012: [6.779, S], 2013: [7.004, S], 2014: [7.371, S], 2015: [7.951, S], 2016: [8.567, S], 2017: [8.925, S], 2018: [9.346, S], 2019: [9.822, S], 2020: [10.468, S], 2021: [10.430, S], 2022: [11.384, S], 2023: [12.152, S], 2024: [12.432, S], 2025: [12.948, S] }
  # Adults with an account, millions, by game region (D: World Bank Global Findex account ownership, % of
  # adults, 2011 and 2021 (R), x UN adult population (R); between and after the points interpolated and
  # held). north_america is the US (88% -> 95%), Canada (96% -> 99%) and Mexico (27% -> 49%); east_asia
  # China (64% -> 89%), Japan and Korea; south_southeast_asia India (35% -> 78%) and South-East Asia;
  # latin_america without Mexico (Brazil 56% -> 84%).
  accounts:
    north_america: { 2011: [257, D], 2021: [322, D] }
    europe: { 2011: [450, D], 2021: [550, D] }
    east_asia: { 2011: [815, D], 2021: [1152, D] }
    south_southeast_asia: { 2011: [380, D], 2021: [1000, D] }
    latin_america: { 2011: [117, D], 2021: [248, D] }
    africa: { 2011: [132, D], 2021: [343, D] }
    oceania: { 2011: [22, D], 2021: [23, D] }
  business_per_consumer: [0.08, A] # business accounts a consumer account (A: about 33M US small businesses, SBA, R, against about 400M US accounts)
  # A North American account's average balance in 2010 (D: deposits $7.751T (S) x half held by consumers
  # (A: FDIC's household share about 45-55%, R) / 209M US adults with accounts (D); business: the other
  # half / 8% as many accounts). Other regions x deposit_index (A: deposits per account against the US's,
  # from deposits / GDP and accounts, R: World Bank). Grows with deposits_trn / accounts.
  balance_usd:
    bank_consumer: [18500, 2010, D]
    bank_business: [188000, 2010, D]
  deposit_index:
    { north_america: [1.0, A], europe: [0.9, A], east_asia: [0.9, A], south_southeast_asia: [0.08, A], latin_america: [0.25, A], africa: [0.08, A], oceania: [1.0, A] }
  # A segment's share of deposits above the insured limit (A, calibrated to FDIC's estimate of about 47%
  # of US domestic deposits uninsured in 2021, R: half consumer at 0.2, half business at 0.85; Silicon
  # Valley Bank's 94%, R, is a business bank's).
  uninsured_share: { bank_consumer: [0.20, A], bank_business: [0.85, A] }
  # Deposit insurance limits, the local amount's US dollars at the date (R: FDIC $250,000, temporary from
  # October 2008 and permanent by Dodd-Frank in July 2010; EU EUR 100,000 from December 2010, Directive
  # 2009/14/EC, harmonised by 2014/49/EU; Japan JPY 10M; China CNY 500,000 from May 2015; India INR 100,000,
  # INR 500,000 from February 2020; Brazil's FGC BRL 250,000; Australia AUD 250,000 from February 2012;
  # South Africa ZAR 100,000 from April 2024). Shown on the Bank screen.
  insured_limit:
    north_america: [{ from: "2008-10", limit_usd: [250000, 2010, R] }]
    europe: [{ from: "2008-01", limit_usd: [70000, 2010, R] }, { from: "2010-12", limit_usd: [133000, 2010, R] }]
    east_asia: [{ from: "2008-01", limit_usd: [114000, 2010, R] }]
    south_southeast_asia: [{ from: "2008-01", limit_usd: [2200, 2010, R] }, { from: "2020-02", limit_usd: [7000, 2020, R] }]
    latin_america: [{ from: "2008-01", limit_usd: [40000, 2010, R] }, { from: "2013-05", limit_usd: [125000, 2013, R] }]
    africa: [{ from: "2024-04", limit_usd: [5500, 2024, R] }]
    oceania: [{ from: "2008-10", limit_usd: [1000000, 2010, R] }, { from: "2012-02", limit_usd: [250000, 2012, R] }]
  # Loan kinds (64.1): yield = policy rate + spread (R: typical book yields over the fed funds rate,
  # FDIC QBP and the Federal Reserve's G.19/G.20; A where noted), the Basel III standardised risk weight
  # (R: BIS), the average life in months (A), and the net charge-off rate by year, % (S: FRED, Federal
  # Reserve charge-off rates, all banks: CORSFRMACBS residential mortgages (net recoveries below 0 read as
  # 0), CORCACBS consumer, CORCCACBS credit cards, CORBLACBS business loans; corporate = business x 0.8,
  # A: large borrowers' lower losses).
  loan_kinds:
    - key: mortgage
      label: Mortgages
      spread: [2.6, R] # 30-year mortgage rates about 3.5-4.5% against fed funds 0.1-2.4% in 2010-2019 (Freddie Mac PMMS, R)
      fixed: true # R: US mortgages are mostly 30-year fixed; a book's yield is the rates it was written at (the others float, A)
      risk_weight: [0.35, R]
      term_months: [300, A]
      losses: { 2008: [1.37, S], 2009: [2.33, S], 2010: [2.11, S], 2011: [1.57, S], 2012: [1.35, S], 2013: [0.65, S], 2014: [0.29, S], 2015: [0.21, S], 2016: [0.10, S], 2017: [0.04, S], 2018: [0.0, S], 2019: [0.0, S], 2020: [0.0, S], 2021: [0.0, S], 2022: [0.0, S], 2023: [0.0, S], 2024: [0.0, S], 2025: [0.0, S] }
    - key: consumer
      label: Consumer loans
      spread: [5.0, A] # auto and personal loans about 5-9% (G.19, R)
      risk_weight: [0.75, R]
      term_months: [48, A]
      losses: { 2008: [3.55, S], 2009: [5.50, S], 2010: [5.89, S], 2011: [3.62, S], 2012: [2.53, S], 2013: [2.17, S], 2014: [1.93, S], 2015: [1.75, S], 2016: [1.91, S], 2017: [2.18, S], 2018: [2.25, S], 2019: [2.29, S], 2020: [2.00, S], 2021: [1.16, S], 2022: [1.26, S], 2023: [2.21, S], 2024: [2.92, S], 2025: [2.89, S] }
    - key: card
      label: Credit cards
      spread: [11.0, R] # card APRs about 13-21% (G.19, R)
      risk_weight: [0.75, R]
      term_months: [18, A] # revolving balances' average life
      losses: { 2008: [5.58, S], 2009: [9.44, S], 2010: [9.41, S], 2011: [5.68, S], 2012: [3.99, S], 2013: [3.48, S], 2014: [3.16, S], 2015: [2.94, S], 2016: [3.15, S], 2017: [3.56, S], 2018: [3.65, S], 2019: [3.71, S], 2020: [3.45, S], 2021: [2.16, S], 2022: [2.05, S], 2023: [3.51, S], 2024: [4.55, S], 2025: [4.22, S] }
    - key: small_business
      label: Small business loans
      spread: [3.5, A]
      risk_weight: [1.0, R]
      term_months: [60, A]
      losses: { 2008: [0.96, S], 2009: [2.30, S], 2010: [1.74, S], 2011: [0.86, S], 2012: [0.49, S], 2013: [0.30, S], 2014: [0.22, S], 2015: [0.24, S], 2016: [0.43, S], 2017: [0.35, S], 2018: [0.28, S], 2019: [0.35, S], 2020: [0.52, S], 2021: [0.20, S], 2022: [0.16, S], 2023: [0.35, S], 2024: [0.50, S], 2025: [0.56, S] }
    - key: corporate
      label: Corporate loans
      spread: [1.8, A]
      risk_weight: [1.0, R]
      term_months: [48, A]
      losses: { 2008: [0.77, D], 2009: [1.84, D], 2010: [1.39, D], 2011: [0.69, D], 2012: [0.39, D], 2013: [0.24, D], 2014: [0.18, D], 2015: [0.19, D], 2016: [0.34, D], 2017: [0.28, D], 2018: [0.22, D], 2019: [0.28, D], 2020: [0.42, D], 2021: [0.16, D], 2022: [0.13, D], 2023: [0.28, D], 2024: [0.40, D], 2025: [0.45, D] }
  # Capital rules (64.1; R: BIS Basel III, 2010, revised 2017): the CET1 minimum phased in 2013-2015
  # (3.5%, 4.0%, 4.5%), the capital conservation buffer 2016-2019 (0.625% a year to 2.5%), G-SIB
  # surcharges from 2016 (1.0-3.5%; the game's size surcharge is one step, balance finserv.bank.capital).
  # Before 2013 Basel II's 2% common equity minimum (R).
  capital:
    - { from: "2008-01", cet1_min: [2.0, R], buffer: [0.0, R], surcharge: [0.0, R] }
    - { from: "2013-01", cet1_min: [3.5, R], buffer: [0.0, R], surcharge: [0.0, R] }
    - { from: "2014-01", cet1_min: [4.0, R], buffer: [0.0, R], surcharge: [0.0, R] }
    - { from: "2015-01", cet1_min: [4.5, R], buffer: [0.0, R], surcharge: [0.0, R] }
    - { from: "2016-01", cet1_min: [4.5, R], buffer: [0.625, R], surcharge: [1.0, R] }
    - { from: "2017-01", cet1_min: [4.5, R], buffer: [1.25, R], surcharge: [1.0, R] }
    - { from: "2018-01", cet1_min: [4.5, R], buffer: [1.875, R], surcharge: [1.0, R] }
    - { from: "2019-01", cet1_min: [4.5, R], buffer: [2.5, R], surcharge: [1.0, R] }
  # Supervisory stress tests, results each June (R: the Federal Reserve's CCAR from 2011 and DFAST from
  # 2013; the EBA's EU-wide tests 2011, 2014, 2016, 2018, 2021, 2023 (A: read as every year from 2014);
  # the Bank of England's from 2014; A elsewhere from 2016).
  stress_from: { north_america: [2011, R], europe: [2014, R], east_asia: [2016, A], south_southeast_asia: [2016, A], latin_america: [2016, A], africa: [2016, A], oceania: [2016, A] }
  # Fintechs that took charters (R, OCC and company filings); shown as history in the Bank screen's notes.
  charters:
    - { name: Varo Bank, month: "2020-07", kind: national bank charter }
    - { name: Square (Block), month: "2021-03", kind: industrial bank }
    - { name: SoFi, month: "2022-01", kind: bank holding company (Golden Pacific Bancorp) }
  # Bank failures in the history (R: FDIC; Wikipedia "Collapse of Silicon Valley Bank"): SVB's rival record
  # closes then.
  failures:
    - { name: Silicon Valley Bank, month: "2023-03", withdrawn_usd: [42000000000, 2023, R] }
    - { name: Signature Bank, month: "2023-03" }
    - { name: First Republic Bank, month: "2023-05" }

# --- 64.2 Payments --------------------------------------------------------------------------------------
