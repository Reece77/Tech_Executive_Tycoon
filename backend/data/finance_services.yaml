  # billed business $0.71T, $1.04T, $1.04T, $1.55T. UnionPay's card purchase volume: A ($1.5T, $5T, $10T,
  # $11T: China's bank-card consumption payments in the PBoC's payment reports, recalled loosely, without
  # transfers). Regional splits of each network's volume: A (Visa about half in the US, R: Visa 10-K).
