# Inbox wording (M1b). The sim emits a template key plus parameters; persistence renders
# the title and body for the player company. Parameters ending in _cents are shown as money.
# "{role:a}" adds the indefinite article: "a Designer", "an Account executive".
# Tone: grounded business realism (ADR-0011). Every key the engine uses must exist here.
templates:
  candidates_arrived:
    title: "{count} candidates for {role}"
    body: "Your {channel} search for {role:a} turned up {count} candidates. They will consider offers for the next {shelf} months."
  offer_accepted:
    title: "{name} accepted your offer"
    body: "{name} joins as {level:a} {role} on {salary_cents} a year."
  offer_declined:
    title: "{name} declined your offer"
    body: "{name} has turned down the {role} role and is no longer a candidate."
  resigned:
    title: "{name} has resigned"
    body: "{name} has handed in their notice and will leave at the start of next month."
  retired:
    title: "{name} is retiring"
    body: "{name} has decided to retire and will leave at the start of next month."
  employee_left:
    title: "{name} has left"
    body: "{name} has left the company ({reason})."
  fired:
    title: "{name} was let go"
    body: "{name} has left the company. Severance of {severance_cents} was paid."
  culture_carrier_left:
    title: "{name}'s departure hit the team"
    body: "The team took {name}'s departure hard; they held the team together."
  tag_revealed:
    title: "You noticed something about {name}"
    body: "You have noticed that {name} {reveal_text}."
  out_of_cash:
    title: "You are out of cash"
    body: "Cash stands at {cash_cents}. Payroll will keep running, but the team will notice."
  # --- Organization (M2a) ---
  unit_leader_left:
    title: "{unit} has no leader"
    body: "{name} has left, so {unit} has no leader. Its members report one level up until you appoint one."
  plan_paused:
    title: "Hiring plan paused"
    body: "{name} has left, so the {role} hiring plan is paused. Give it a new owner to restart it."
  plan_filled:
    title: "Hiring plan filled"
    body: "{name} has made all {target} hires for the {role} plan."
  plan_activity:
    title: "{name} worked on the {role} plan"
    body: "{name} {activity}."
  # --- Products and markets (M3a) ---
  product_launched:
    title: "{product} has launched"
    body: "{product} is live in {segments}. Customers can find it from this month."
  first_customer:
    title: "{product} has its first paying customer"
    body: "{product} now has paying customers in {segment}. Revenue this month: {revenue_cents}."
  arr_milestone:
    title: "ARR passed {milestone_cents}"
    body: "Annual recurring revenue is now {arr_cents} ({mrr_cents} a month)."
  sales_capacity_limited:
    title: "Sales capacity limited {product}"
    body: "Sales capacity limited new customers in {segment}. More sellers on the product would close more deals."
  product_rotting:
    title: "{product} is slipping"
    body: "Nobody is working on {product}, so its quality is falling. Assign a unit to it."
  # M4a finance (formulas.md 14)
  safe_filled:
    title: "SAFE filled: {amount_cents} at a {cap_cents} cap"
    body: "Angels and seed funds put {amount_cents} into your SAFE at a {cap_cents} post-money cap. The money is in the bank; the holders get {pct} of the company at your next priced round."
  safe_declined:
    title: "Nobody took your SAFE at a {cap_cents} cap"
    body: "Angels and seed funds passed on raising {amount_cents} at a {cap_cents} post-money cap. A lower cap is likelier to fill; you can try again."
  term_sheets_arrived:
    title: "{count} term sheets for your {series}"
    body: "Investors answered your {series} for {target_cents}. Compare the term sheets on Finance and accept one by {deadline}; the round closes at the Continue after you accept."
  no_term_sheets:
    title: "No investor answered your {series}"
    body: "No firm sent a term sheet for your {series}, so the round has closed. You can start it again next month."
  round_lapsed:
    title: "Your {series} lapsed"
    body: "You did not accept a term sheet in time, so your {series} closed without money."
  round_closed:
    title: "{series} closed: {amount_cents} from {lead}"
    body: "{lead} led your {series} with {amount_cents} at a {pre_cents} pre-money valuation ({price} a share). You own {founder_pct} of the company; {lead} takes a board seat."
  board_seat_empty:
    title: "Name your board nominee"
    body: "Your second common board seat is empty. Name an employee to it on the Board tab; until then the seat still votes with you."
  nominee_left:
    title: "{name} has left the board"
    body: "{name} has left the company, so your nominee's board seat is empty. Name another employee to it on the Board tab; until then the seat still votes with you."
  board_meeting:
    title: "Board meeting: confidence {confidence}"
    body: "Your board met for the quarter. Average confidence is {confidence} ({label})."
  board_warning:
    title: "Formal warning from your board"
    body: "Average board confidence has fallen to {confidence}. The board expects growth closer to plan and a safer runway. Directors who stay below {removal} for {months} months will vote to remove you."
  founder_removed:
    title: "The board has removed you as CEO"
    body: "{votes} of {seats} directors voted to remove you. The game is over; your save stays open to look back on."
  insolvent:
    title: "Insolvent: {needed_cents} needed"
    body: "Cash is {cash_cents} after this month's costs. You need {needed_cents} to get back to zero. Three months in a row below zero means bankruptcy; this is month {month}."
  bridge_offered:
    title: "Your investors offer a {amount_cents} bridge"
    body: "Existing investors will bridge you on a SAFE at a {cap_cents} post-money cap: {amount_cents} if you accept today. The amount is set when you accept (three months of burn plus any deficit). Accept by {deadline}; the money arrives at that month's Continue."
  bridge_lapsed:
    title: "The bridge offer lapsed"
    body: "You did not accept your investors' {amount_cents} bridge in time."
  bridge_funded:
    title: "Bridge funded: {amount_cents}"
    body: "Your investors' {amount_cents} bridge SAFE at a {cap_cents} cap is in the bank."
  bankrupt:
    title: "Bankrupt"
    body: "Cash stayed below zero for {months} month ends in a row. The company is bankrupt and the game is over; your save stays open to look back on."
  stage_from_funding:
    title: "Now {stage_label}"
    body: "Closing your {series} makes {company} a {stage_label} company."
  rival_failed:
    title: "{company} has failed"
    body: "{company} ran out of money. Its products are gone and its customers are looking for something new."
  market_news:
    title: "Market news: {count} rival moves"
    body: "{lines}."
  rival_approach:
    title: "{rival} is trying to hire {name}"
    body: "{rival} has offered {name} {offer_cents} a year (they earn {salary_cents}). They will decide when you press Continue. You can counter with a raise first, or let them decide."
