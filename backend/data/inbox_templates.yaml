# Inbox wording (M1b). The sim emits a template key plus parameters; persistence renders
# the title and body for the player company. Parameters ending in _cents are shown as money.
# "{role:a}" adds the indefinite article: "a Designer", "an Account executive".
# Tone: grounded business realism (ADR-0011). Every key the engine uses must exist here.
templates:
  minority_complaint_filed: # M16 (31.6)
    title: "Minority complaint: {seller} to {buyer}"
    body: "The transfer price has been unfair to outside shareholders for months. Legal costs and a valuation discount apply until it is fair; answer the complaint."
  minority_complaint_settled: # M16 (31.6)
    title: "The minority complaint is settled"
    body: "The price from {seller} to {buyer} is fair again; the legal costs and the discount stop."
  stake_sold: # M16 (31.5)
    title: "Sold {pct} of {company}"
    body: "{buyer} paid {price_cents}. The group keeps control; {company}'s spare cash now goes up as dividends to every holder."
  minorities_bought_out: # M16 (31.5)
    title: "{company} is wholly owned again"
    body: "The group paid {price_cents} for the minorities' shares."
  carve_out_listed: # M16 (31.5)
    title: "{company} is listed"
    body: "The carve-out sold {pct} to the public for {price_cents}. The group keeps control; {company} now has its own share price."
  spun_off: # M16 (31.5)
    title: "{company} is spun off"
    body: "Its shares went to the holding company's shareholders: it is an independent listed company now. The group kept {kept}; you hold {yours} in your own name."
  stake_disclosed: # M16 (31.5)
    title: "Disclosure: your stake in {company} passed {pct}"
    body: "The market now knows how much of {company} the group holds."
  venture_invested: # M16 (31.5)
    title: "Venture investment in {company}"
    body: "The group invested {amount_cents} for {pct}. Information rights show its key people (as ranges)."
  group_review_met: # M16 (31.4)
    title: "{company}'s CEO met the mandate"
    body: "The board's December review: {measure}."
  group_review_missed: # M16 (31.4)
    title: "{company}'s CEO missed the mandate"
    body: "The board's December review: {measure}. Missed {misses} year(s) running."
  group_review_proposal: # M16 (31.4)
    title: "{company}'s board proposes a new CEO"
    body: "The mandate was missed {misses} years running ({measure}). Replace the CEO from the Group screen, or keep them."
  group_ceo_replaced: # M16 (31.4)
    title: "{company} has a new CEO"
    body: "The board replaced the CEO; the next leader takes over under the same mandate."
  group_pitch: # M16 (31.4)
    title: "{company}'s CEO asks for {amount_cents}"
    body: "A request for capital to the group; it {fit}. Approve or decline it on the Group screen before next quarter."
  holding_formed: # M16 (31.2)
    title: "{name} is formed"
    body: "The holding company now holds the listing, the cap table and the board, and owns {subsidiaries} subsidiaries. You chair it. Legal fees came to {fee_cents}."
  burnout_started: # M24 (32.1)
    title: "You are burning out"
    body: "Stress has reached {stress}. Your monthly energy is down by 30% until it falls below 40; answer the event to take a month off, delegate or push on."
  angel_invested: # M26 (37.2)
    title: "You invested in {company}"
    body: "Your cheque of {amount_cents} from personal cash bought {pct} of {company}. Information rights show its key people (as ranges), its cash and its rounds."
  angel_backed: # M26 (37.2)
    title: "You backed {company}"
    body: "{founder} has founded {company} with your {amount_cents} as its founding cash; you hold {pct}."
  angel_exit: # M26 (37.2)
    title: "{company} was acquired: your stake paid {amount_cents}"
    body: "Your angel stake in {company} reached your personal cash. A purchase by your own group is a related-party deal: {related}."
  angel_listed: # M26 (37.2)
    title: "{company} listed: your stake is now shares"
    body: "Your angel stake became {shares} shares, held in your own name."
  angel_written_off: # M26 (37.2)
    title: "{company} failed: your stake is written off"
    body: "The {amount_cents} you put into {company} is lost."
  conflict_found: # M26 (37.2)
    title: "Your hidden stake in {company} has come out"
    body: "The press found the personal stake you did not disclose. Credibility and the board's confidence fall."
  shares_traded: # M26 (37.3)
    title: "{side} {shares} {company} shares"
    body: "The trade was worth {amount_cents}, with your personal cash.{sensitive}"
  shares_filing: # M26 (37.3)
    title: "Your share sale is a public filing"
    body: "You sold {shares} of your own company's shares this month, more than 1% of them. The market has noticed."
  insider_investigation: # M26 (37.3)
    title: "Regulators investigate your trades in {company}"
    body: "An investigation into trading ahead of news has opened. A finding, if there is one, takes months."
  insider_finding: # M26 (37.3)
    title: "The regulator finds you traded on inside information"
    body: "You pay {amount_cents} in fines and disgorged gains. The board voted {votes} of {seats} to remove you. {outcome}"
  dividend_received: # M26 (37.3)
    title: "Dividend from {company}"
    body: "{amount_cents} on your shares reached your personal cash."
  family_office_formed: # M26 (37.4)
    title: "Your family office is formed"
    body: "{manager} manages it under a {mandate} mandate. Move personal cash in to invest it."
  family_office_moved: # M26 (37.4)
    title: "{memo}"
    body: "{amount_cents} moved between your personal cash and the family office."
  founder_shares_sold: # M24 (32.2): the founder sells their own shares once listed
    title: "You sold {shares} of your shares"
    body: "The sale raised {net_cents} after fees for your personal account. The company's cash does not change."
  foundation_created: # M24 (32.3)
    title: "{name} is founded"
    body: "Your foundation will give to {cause}. Gifts from your personal account fund it; each December it grants 5% of its endowment."
  foundation_gift: # M24 (32.3)
    title: "A gift to {name}"
    body: "You gave {amount_cents} from your personal account to the foundation's endowment."
  foundation_grants: # M24 (32.3)
    title: "{name} made its grants"
    body: "The foundation granted {amount_cents} to {cause} this year. The effects last 12 months."
  lobbying_set: # M24 (32.5)
    title: "Lobbying in {region}"
    body: "The company now spends {amount_cents} a month on lobbying in {region}. Influence builds slowly and decays when spending stops; so does the risk of a story."
  scandal_broke: # M24 (32.5)
    title: "Scandal: lobbying in {region}"
    body: "The press has the story of the company's lobbying in {region}. Credibility and every product's brand fall, influence there is gone, and the fine is {fine_cents}."
  scandal_second_story: # M24 (32.5): fighting the story brought a second one
    title: "The story runs again"
    body: "Fighting the lobbying story gave the press a second round. Credibility and brands fall again."
  replace_started: # M14b (29.5)
    title: "Replacing {name}"
    body: "Your recruiter is finding a {role} to replace {name}. Screened candidates arrive at the month end and get offers at once."
  promise_kept: # M14b (29.2)
    title: "Promise kept: {promise}"
    body: "You said you would {promise}, and you did. The brand and your credibility gain."
  promise_broken: # M14b (29.2)
    title: "Promise broken: {promise}"
    body: "You said you would {promise}. The press has noticed, and so have customers and staff."
  rival_statement: # M14b (29.4): a rival CEO speaks
    title: "{name} of {rival}: a public statement"
    body: "\"{text}\""
  promise_made: # M14b (29.2)
    title: "A public promise: {promise}"
    body: "You told the press you would {promise}. Track it on the Overview's Promises panel."
  banks_hired: # M13 (25.2 step 1): the IPO chain starts
    title: "{bank} will lead your IPO"
    body: "{bank} is hired as lead underwriter for a fee of {fee} of the money raised. The S-1 filing comes next month, then a roadshow and pricing."
  ipo_listed: # M13 (25.2 step 5): listing day
    title: "{ticker} is listed: {pop} on the first day"
    body: "Your shares priced at {price_cents} with {bank} and closed the first day at {close_cents} ({pop}). The IPO raised {gross_cents}, {net_cents} after fees. Your stake is worth {stake_cents}. Two independent directors join the board."
  ipo_pulled: # M13 (25.2 step 4)
    title: "IPO pulled"
    body: "You pulled the IPO on pricing night. {bank} is owed {fee_cents} in fees, and the board is not pleased."
  earnings_report: # M13 (25.4): a quarter's results against guidance
    title: "Quarterly results: a {result}"
    body: "Revenue came in at {actual_cents} against guidance of {guided_cents} ({surprise}); operating margin {margin} against {guided_margin} guided."
  guidance_set: # M13 (25.4)
    title: "Guidance for the quarter"
    body: "You guided revenue of {revenue_cents} and an operating margin of {margin} for the quarter; the consensus was {consensus_cents}."
  dividend_declared: # M13 (25.5)
    title: "Dividend declared"
    body: "The board declared a dividend of {per_share_cents} a share, {amount_cents} in all, paid at the month end."
  dividend_paid: # M13 (25.5)
    title: "Dividend paid"
    body: "{amount_cents} went to shareholders as this month's dividend."
  buyback_done: # M13 (25.5)
    title: "Shares bought back"
    body: "The company bought back {shares} shares for {amount_cents}."
  secondary_done: # M13 (25.5)
    title: "Secondary offering closed"
    body: "The company sold {shares} new shares and raised {net_cents} after fees."
  ceo_appointed: # M13 (25.6)
    title: "{name} is your CEO"
    body: "{name} takes over day-to-day operations as chief executive. You are Chair: capital, strategy, guidance and executive appointments stay with you, and you can override any decision the CEO takes."
  ceo_left: # M13 (25.6): the Chair dismissed the CEO, or the CEO left the company
    title: "{name} is no longer CEO"
    body: "You run the company day to day again."
  ceo_replaced: # M13 (25.6): the board's vote
    title: "The board replaced {name} as CEO"
    body: "The directors voted {name} out. You run the company day to day again."
  ceo_decisions: # M13 (25.6): what the CEO did this month
    title: "Your CEO this month"
    body: "{summary}"
  retained: # M10b (23.3): a counter-offer kept someone serving notice
    title: "{name} is staying"
    body: "{name} has accepted your counter-offer and withdrawn their notice."
  exec_report: # M10c (24.3): a seat holder's quarterly report
    title: "{seat} report: {name}"
    body: "{report}"
  exec_decisions: # M10c (24.1): what executives with authority did this month
    title: "Your executives this month"
    body: "{summary}"
  exec_pitch: # M13b (27.1): an executive's pitch waiting for Approve, Modify or Decline
    title: "{name} pitches {what}"
    body: "{detail} Approve, modify or decline it on the Executive team panel before you continue."
  pitch_went_ahead: # M13b (27.1): a pitch under the Holiday spend limit that went ahead
    title: "{name} went ahead: {what}"
    body: "{detail} It cost less than your auto-approve limit, so it went ahead while you were away ({cost_cents} over 12 months)."
  exec_proposal: # M10c (24.1): a proposal waiting for Approve or Decline
    title: "{name} proposes: {what}"
    body: "{detail} Approve or decline it on the Executive team panel before you continue."
  choices_month: # M10b (formulas.md 23.2): the month-end report's one line on event choices
    title: "Your choices this month"
    body: "{summary}"
  candidates_arrived:
    title: "{count} candidates for {role}"
    body: "Your {channel} search for {role:a} turned up {count} candidates. They will consider offers for the next {shelf} months."
  offer_accepted:
    title: "{name} accepted your offer"
    body: "{name} joins as {level:a} {role} on {salary_cents} a year."
  offer_declined:
    title: "{name} declined your offer"
    body: "{name} has turned down the {role} role and is no longer a candidate."
  resigned:
    title: "{name} has resigned"
    body: "{name} has handed in their notice and will leave at the start of next month."
  retired:
    title: "{name} is retiring"
    body: "{name} has decided to retire and will leave at the start of next month."
  employee_left:
    title: "{name} has left"
    body: "{name} has left the company ({reason})."
  fired:
    title: "{name} was let go"
    body: "{name} has left the company. Severance of {severance_cents} was paid."
  culture_carrier_left:
    title: "{name}'s departure hit the team"
    body: "The team took {name}'s departure hard; they held the team together."
  tag_revealed:
    title: "You noticed something about {name}"
    body: "You have noticed that {name} {reveal_text}."
  out_of_cash:
    title: "You are out of cash"
    body: "Cash stands at {cash_cents}. Payroll will keep running, but the team will notice."
  # --- Organization (M2a) ---
  unit_leader_left:
    title: "{unit} has no leader"
    body: "{name} has left, so {unit} has no leader. Its members report one level up until you appoint one."
  plan_paused:
    title: "Hiring plan paused"
    body: "{name} has left, so the {role} hiring plan is paused. Give it a new owner to restart it."
  plan_filled:
    title: "Hiring plan filled"
    body: "{name} has made all {target} hires for the {role} plan."
  plan_activity:
    title: "{name} worked on the {role} plan"
    body: "{name} {activity}."
  # --- Products and markets (M3a) ---
  product_launched:
    title: "{product} has launched"
    body: "{product} is live in {segments}. Customers can find it from this month."
  first_customer:
    title: "{product} has its first paying customer"
    body: "{product} now has paying customers in {segment}. Revenue this month: {revenue_cents}."
  arr_milestone:
    title: "ARR passed {milestone_cents}"
    body: "Annual recurring revenue is now {arr_cents} ({mrr_cents} a month)."
  sales_capacity_limited:
    title: "Sales capacity limited {product}"
    body: "{sellers} win up to about {cap} {segment} customers a month; {wanted} wanted to buy. Each extra seller adds about {per_seller}. Open a seller hiring plan or move sellers onto {product}."
  product_rotting:
    title: "{product} is slipping"
    body: "Nobody is working on {product}, so its quality is falling. Assign a unit to it."
  product_understaffed: # M10b (23.4): builders, but too few to hold quality
    title: "{product}'s team is too small"
    body: "{product}'s team is too small to maintain it (output about {output} of {needed} needed; full speed at {full_speed}), so its quality is falling. Add about {builders} to stop the slide."
  # M4a finance (formulas.md 14)
  safe_filled:
    title: "SAFE filled: {amount_cents} at a {cap_cents} cap"
    body: "Angels and seed funds put {amount_cents} into your SAFE at a {cap_cents} post-money cap. The money is in the bank; the holders get {pct} of the company at your next priced round."
  safe_declined:
    title: "Nobody took your SAFE at a {cap_cents} cap"
    body: "Angels and seed funds passed on raising {amount_cents} at a {cap_cents} post-money cap. A lower cap is likelier to fill; you can try again."
  term_sheets_arrived:
    title: "{count} term sheets for your {series}"
    body: "Investors answered your {series} for {target_cents}. Compare the term sheets on Finance and accept one by {deadline}; the round closes at the Continue after you accept."
  no_term_sheets:
    title: "No investor answered your {series}"
    body: "No firm sent a term sheet for your {series}, so the round has closed. You can start it again next month."
  round_lapsed:
    title: "Your {series} lapsed"
    body: "You did not accept a term sheet in time, so your {series} closed without money."
  round_closed:
    title: "{series} closed: {amount_cents} from {lead}"
    body: "{lead} led your {series} with {amount_cents} at a {pre_cents} pre-money valuation ({price} a share). You own {founder_pct} of the company; {lead} takes a board seat."
  board_seat_empty:
    title: "Name your board nominee"
    body: "Your second common board seat is empty. Name an employee to it on the Board tab; until then the seat still votes with you."
  nominee_left:
    title: "{name} has left the board"
    body: "{name} has left the company, so your nominee's board seat is empty. Name another employee to it on the Board tab; until then the seat still votes with you."
  board_meeting:
    title: "Board meeting: confidence {confidence}"
    body: "Your board met for the quarter. Average confidence is {confidence} ({label})."
  board_warning:
    title: "Formal warning from your board"
    body: "Average board confidence has fallen to {confidence}. The board expects growth closer to plan and a safer runway. Directors who stay below {removal} for {months} months will vote to remove you."
  founder_removed:
    title: "The board has removed you as CEO"
    body: "{votes} of {seats} directors voted to remove you. The game is over; your save stays open to look back on."
  insolvent:
    title: "Insolvent: {needed_cents} needed"
    body: "Cash is {cash_cents} after this month's costs. You need {needed_cents} to get back to zero. Three months in a row below zero means bankruptcy; this is month {month}."
  bridge_offered:
    title: "Your investors offer a {amount_cents} bridge"
    body: "Existing investors will bridge you on a SAFE at a {cap_cents} post-money cap: {amount_cents} if you accept today. The amount is set when you accept (three months of burn plus any deficit). Accept by {deadline}; the money arrives at that month's Continue."
  bridge_lapsed:
    title: "The bridge offer lapsed"
    body: "You did not accept your investors' {amount_cents} bridge in time."
  bridge_funded:
    title: "Bridge funded: {amount_cents}"
    body: "Your investors' {amount_cents} bridge SAFE at a {cap_cents} cap is in the bank."
  bankrupt:
    title: "Bankrupt"
    body: "Cash stayed below zero for {months} month ends in a row. The company is bankrupt and the game is over; your save stays open to look back on."
  stage_from_funding:
    title: "Now {stage_label}"
    body: "Closing your {series} makes {company} a {stage_label} company."
  rival_failed:
    title: "{company} has failed"
    body: "{company} ran out of money. Its products are gone and its customers are looking for something new."
  market_news:
    title: "Market news: {count} rival moves"
    body: "{lines}."
  rival_approach:
    title: "{rival} is trying to hire {name}"
    body: "{rival} has offered {name} {offer_cents} a year (they earn {salary_cents}). They will decide when you press Continue. You can counter with a raise first, or let them decide."
  poach_accepted:
    title: "{name} is leaving for {rival}"
    body: "{name} accepted {rival}'s offer and leaves at the end of next month."
  poach_declined:
    title: "{name} stays"
    body: "{name} turned down {rival}'s offer."
  # M8 (formulas.md 18)
  division_created:
    title: "{unit} division formed"
    body: "{unit} is a new division with its own P&L. Move departments and teams into it, appoint a president, and choose central or embedded shared services."
  exec_appointed:
    title: "{name} is your {seat}"
    body: "{name} now holds the {seat} seat at exec level. Their market rate is the exec rate from now on, so consider a raise."
  exec_removed:
    title: "{name} is no longer {seat}"
    body: "You removed {name} from the {seat} seat. They stay at exec level. The seat is vacant until you appoint someone."
  exec_left:
    title: "The {seat} seat is vacant"
    body: "{name} has left, so the {seat} seat is empty. A vacant seat costs the company until you fill it."
  # M10 (formulas.md 20.3)
  loan_signed:
    title: "{instrument} signed: {amount_cents}"
    body: "{lender} lent {amount_cents} at {rate} a year over {term} months. The money is in the bank."
  loan_repaid:
    title: "Loan repaid: {lender}"
    body: "The {amount_cents} borrowed from {lender} is paid off."
  covenant_breached:
    title: "Covenant broken: {lender}"
    body: "{covenant}: the test failed this month. {lender} will want an answer before next month closes."
  loan_called:
    title: "{lender} called the loan"
    body: "A second covenant breach within six months: {lender} took the remaining {amount_cents} from the bank account."
  # M9 (formulas.md 19): offices and regions
  office_leased:
    title: "New office in {city}"
    body: "You leased {seats} seats in {city} at {rent_cents} a month. The fit-out cost {fit_out_cents}. Move a unit there from Org to fill it."
  office_closed:
    title: "{city} office closed"
    body: "You ended the {city} lease early and paid {penalty_cents} to the landlord. Its teams moved to flexible space, or work remotely if {city} is not your HQ."
  region_launched:
    title: "{product} is localizing for {region}"
    body: "Localizing {product} for {region} cost {cost_cents}. It goes live there in {live}."
  deal_update: # M14 (28.2-28.5): diligence findings, an offer's answer, antitrust, a closing, an acquired person leaving
    title: "{title}"
    body: "{detail}"
  exit_sale: # M14 (28.6): the player's company was sold; the game ends with an exit
    title: "You sold the company to {buyer}"
    body: "{buyer} bought the company for {price}. Your stake came to {proceeds}. The game is over: this is your exit."
  rankings_published: # M15b (30.4): each January's industry rankings
    title: "The {year} industry rankings"
    body: "{leader} tops the revenue list at {revenue} a year.\n\nYour places: Top 50 by revenue {revenue_place}; Best places to work {places_place}; Most innovative {innovative_place}.\n\nTop 50 by revenue: {revenue_top}.\nBest places to work: {places_top}.\nMost innovative: {innovative_top}.\n\nOpen the Rankings screen for the full lists."
  founded_again: # M15b addendum 10: a serial founder's next company
    title: "You founded {name}"
    body: "After selling {old} to {buyer}, you put {cash} of your proceeds into {name} and kept {kept}. {old} carries on as part of {buyer}."
  rival_story: # M15b addendum 12: a press piece about a rival CEO (interview, feud reply, profile)
    title: "{title}"
    body: "{text}"
  rival_acquired: # M14 (28.6): a rival bought a startup
    title: "{acquirer} buys {target}"
    body: "{acquirer} bought {target} for about {price}. Its products and people are now {acquirer}'s."
  era_report: # M13b (27.3): at the end of a first-mover window
    title: "{era}: what the head start added"
    body: "Your {months}-month head start in {era} is over. {lines}. Against the pre-era trend, your products gained {added_cents} a month."
  era_arrived: # M11 (formulas.md 21.4): an era milestone arrived
    title: "{era} has arrived"
    body: "{era} arrived {when}. It accelerates {markets}.{note}"
  license_in: # M11 (21.5)
    title: "Licensed {domain} from {rival}"
    body: "You licensed {points} points of {rival}'s {domain} know-how for {price_cents}, paid once."
  license_out:
    title: "Licensed {domain} to {rival}"
    body: "{rival} licensed {points} points of your {domain} know-how and pays {royalty} of its revenue in {markets} each month for {months} months."
  research_leak:
    title: "{rival} gained some of your {domain} know-how"
    body: "{name} left for {rival} from a {domain} project and took about {points} points of your lead with them."
  region_live:
    title: "{product} is live in {region}"
    body: "{product} now sells in {region}. Check its prices and reach on the product's Regions tab."
  # M12a (formulas.md 22)
  facility_ordered:
    title: "{facility} ordered"
    body: "You ordered {units} in {region}. Capex of {capex_cents} is paid in equal parts over {months} months; it goes live in {ready}.{later} It needs {staff} infrastructure people from a unit you assign to it."
  facility_live:
    title: "{facility} is live"
    body: "{units} are working. Your own products use it first; sell the spare as Cloud hosting from Infrastructure.{later}"
  facility_sold:
    title: "{facility} sold"
    body: "You sold it for {proceeds_cents}, half its book value of {book_cents}. Its staff stay in their unit."
  contract_signed:
    title: "{good} contract signed"
    body: "{units} of builds are locked at index {index} until {end}, with full allocation. Any volume unused by then is charged at {take_or_pay} of its value."
  contract_settled:
    title: "{good} contract ended"
    body: "{used} of {volume} contracted units were built. Take-or-pay on the rest cost {charge_cents}."
  cloud_started:
    title: "{product} is selling your spare capacity"
    body: "Cloud hosting customers can now buy the compute your own products leave free. Its quality is your data centres' reliability; customers are capped by the spare capacity in each region and its neighbour."
  outage_hit:
    title: "Outage at {facility}"
    body: "{facility} went down. Hosted products lost {lost} customers and cloud customers churned three times as fast this month."

  # --- M12b (formulas.md 26.2, 26.3) ---
  production_contract_ended:
    title: "A {what} contract for {product} ended"
    body: "The contract for {units} a month has run its term. Sign a new one to keep making {product}."
  production_contract_signed:
    title: "{what} contract signed for {product}"
    body: "{supplier} will make {units} a month for {months} months at {price}. Unused volume is charged {take_or_pay} of the price each month."
  manufacturing_capacity_limited:
    title: "{product} sold out"
    body: "Demand was {wanted} units but {product} could make only {made}. The rest went to rivals. Sign a bigger contract or build a plant."
  cm_started:
    title: "Selling spare plant capacity"
    body: "{product} now sells your assembly plants' spare capacity to other device makers."
  # --- M17 (formulas.md 33.3) ---
  commodity_deal_signed:
    title: "{deal} signed"
    body: "{volume} at {price}, fixed until {end}. Volume you have not used by then is charged at {take_or_pay} of its value."
  offtake_signed:
    title: "{deal} signed"
    body: "{volume} until {end}, priced at spot inside a collar of {floor} to {ceiling}. You pay for at least {take_or_pay} of each month's volume. Prepaid: {prepaid_cents}."
  commodity_deal_ended:
    title: "{deal} ended"
    body: "It has run its term: {taken} units taken, saving {hedge_cents} against spot. Take-or-pay at the end: {charge_cents}."
  offtake_breached:
    title: "{deal} broken by the supplier"
    body: "The supplier stopped delivering after {taken} units, having saved you {hedge_cents} against spot. What is left of any prepayment has been returned. You now buy this commodity at spot."
  # --- M18 (formulas.md 34.2-34.3): exploration ---
  desk_study_done:
    title: "Desk study done: {commodity} in {region}"
    body: "The geologists have mapped {region} for {commodity}: {high} blocks look highly prospective. The heat map is on the Exploration screen."
  licence_taken:
    title: "Exploration licence: {block}"
    body: "The licence on {block} cost {fee} and runs five years, renewable once. A survey is the next step."
  survey_done:
    title: "Survey done: {block}"
    body: "The geophysics and geochemistry read a {reading} anomaly ({commodity}). See the stated chance of a deposit on the project."
  sampling_done:
    title: "Sampling done: {block}"
    body: "The first samples give a grade range of about ±{pct}%. Drilling narrows it."
  drilling_done:
    title: "Drilling done: {block}"
    body: "{holes} holes drilled; the grade estimate is now ±{pct}%."
  estimate_done:
    title: "Resource estimate: {block}"
    body: "The resource is classed {category}, with tonnage and grade ranges on the project."
  study_done:
    title: "{level} study done: {block}"
    body: "The study puts the project's NPV at about {npv} at the price deck, inside a range shown on the project."
  protest_started:
    title: "Trouble near {block}"
    body: "The community near {block} is organising against the project. Expect to answer it next month."
  injunction:
    title: "Injunction: {block}"
    body: "Pushing on brought a court injunction: legal costs, and the permit decision moves back months."
  permit_granted:
    title: "Permit granted: {block}"
    body: "{block} is permitted: a project ready to build (from M19) or to sell."
  permit_refused:
    title: "Permit refused: {block}"
    body: "The regulator refused the permit for {block}. The project is over."
  licence_lapsed:
    title: "Licence lapsed: {block}"
    body: "The licence on {block} ran out and the block is free again."
  bonanza_intercept:
    title: "Bonanza intercept: {block}"
    body: "Hole {hole} on {block} came back far above the running estimate. The news is out."
  dry_streak:
    title: "Dry holes: {block}"
    body: "The last {holes} holes on {block} came back well under the running estimate."
  drilling_accident:
    title: "Drilling accident: {block}"
    body: "An accident on {block}'s rig brought a {fine} fine; drilling pauses a month."
  project_sold:
    title: "Project sold: {block}"
    body: "{buyer} bought {block} for {price}."
