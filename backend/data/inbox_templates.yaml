    body: "A serious crash cost {cost_cents}. The regulator suspended the zone's permit for {months} months; no rides until it ends."
  robotaxi_answered:
    title: "Robotaxi incident: you chose to {step}"
    body: "The zone's suspension now ends in month {until}."
  autonomy_incident:
    title: "Autonomy incident: {product} in {region}"
    body: "A crash with {level} engaged led to a recall of {cars} cars in {region}, costing {cost_cents}. The regulator suspended {level} for your cars there for {months} months."
  vehicle_designed:
    title: "{product}: design set"
    body: "{pack} kWh {chemistry} pack, {range} km of range, {charge} kW charging, aiming for {level}, on {platform}, with cells from {cells}."
  cell_plant_ordered:
    title: "{facility} ordered"
    body: "You ordered a {units} {chemistry} cell plant in {region}. Capex of {capex_cents} is paid in equal parts over {months} months; it goes live in {ready}. It needs {staff} process engineers. Its yield starts low and learns."
  charging_ordered:
    title: "{facility} ordered"
    body: "You ordered {units} in {region}, {mode}. Capex of {capex_cents} is paid in equal parts over {months} months; it goes live in {ready}."

  medical_filed: # M41 (50.2)
    title: "{product} filed: {route} with the {regulator}"
    body: "Reviews by this route take {months} months from filing, including a request for more information if one comes. The Medical screen shows the submission's stage."
  medical_more_info: # M41 (50.2)
    title: "The {regulator} asks for more information on {product}"
    body: "The review clock stops while the team answers; the decision comes later than the shortest reviews."
  medical_cleared: # M41 (50.2)
    title: "{product} cleared: {route} ({regulator})"
    body: "The device may now be sold where the {regulator} decides, {months} months after filing. Regions that rely on this clearance start their registrations."
  medical_refused: # M41 (50.2)
    title: "{route} refused for {product}"
    body: "The {regulator} turned the submission down after {months} months. Better evidence or a better device makes a new filing likelier to succeed."
  medical_study_started: # M41 (50.3)
    title: "A {kind} study of {product} starts"
    body: "{patients} patients over {months} months, costing {cost_cents} in all, spent month by month to the readout."
  medical_study_met: # M41 (50.3)
    title: "{product}'s {kind} study met its endpoint"
    body: "The results of {patients} patients support the device: its evidence is stronger for reviews, payers and clinicians."
  medical_study_missed: # M41 (50.3)
    title: "{product}'s {kind} study missed its endpoint"
    body: "The {patients}-patient study did not show what it set out to. The device goes back for a redesign before another study can start."
  medical_coverage_asked: # M41 (50.4)
    title: "{product}: coverage requested ({payer})"
    body: "Payers decide in {months} months; stronger evidence shortens the wait and makes coverage likelier."
  medical_covered: # M41 (50.4)
    title: "{product} is covered: {payer}"
    body: "Hospitals there can now be paid for using the device, so it sells beyond the early adopters."
  medical_coverage_denied: # M41 (50.4)
    title: "{payer} declines to cover {product}"
    body: "Without coverage the device sells only to early adopters. A new request may follow stronger evidence."
  medical_inspection_none: # M41 (50.5)
    title: "The {regulator} inspected the company's quality system"
    body: "The inspectors left without findings."
  medical_inspection_observations: # M41 (50.5)
    title: "The {regulator}'s inspection ends with observations"
    body: "Inspectors listed observations (a Form 483 in the US) for the quality team to put right. No action follows if they are corrected."
  medical_inspection_warning_letter: # M41 (50.5)
    title: "A warning letter from the {regulator}"
    body: "The regulator found significant quality-system failures. New decisions there are held for {months} months while they are corrected, and the brand suffers."
  medical_inspection_import_ban: # M41 (50.5)
    title: "The {regulator} stops the company's devices at the border"
    body: "An import ban stops new sales in the regulator's market for {months} months."
  medical_inspection_consent_decree: # M41 (50.5)
    title: "Consent decree: the {regulator} halts the company's device sales"
    body: "The company must rebuild its quality system under supervision: new sales there stop for {months} months, and it pays {fine_cents}."
  medical_recall: # M41 (50.5)
    title: "Class {klass} recall of {product}"
    body: "{units} installed units are affected ({early}). The field action costs {cost_cents}, and new sales stop while it runs."
  pharma_programme_started: # M42 (55.1)
    title: "{name} enters discovery: {indication}"
    body: "Chemists and biologists look for a candidate molecule; discovery is planned to take {months} months. The Pharma screen shows its chance and expected value."
  pharma_candidate: # M42 (55.1)
    title: "{name}: a candidate molecule"
    body: "Discovery found a candidate. Preclinical work (toxicology and pharmacology) starts now, and the composition patent is filed: its 20 years run from today."
  pharma_readout_success: # M42 (55.1)
    title: "{name}: the {stage} readout is positive"
    body: "The data support the programme, and its efficacy estimate narrows. Choose the next trial's design, or file it, from the Pharma screen."
  pharma_readout_failed: # M42 (55.1)
    title: "{name}: the {stage} readout failed"
    body: "The trial missed. Redesign it (run the stage again, at its cost and more) or stop the programme."
  pharma_filed: # M42 (55.3)
    title: "{name} filed: {application} with the {regulator}"
    body: "The review takes the regulator's standard or priority months. An advisory committee may meet half way."
  pharma_adcom_positive: # M42 (55.3)
    title: "Advisory committee backs {name}"
    body: "The {regulator}'s committee voted in favour. Regulators usually follow the vote."
  pharma_adcom_negative: # M42 (55.3)
    title: "Advisory committee votes against {name}"
    body: "The {regulator}'s committee voted against approval. The decision is still the regulator's, but it is now less likely."
  pharma_approved: # M42 (55.3)
    title: "{name} approved by the {regulator}"
    body: "The drug may now be sold where the {regulator} decides. Other regions register it by reliance, and health-technology assessments set prices where they apply."
  pharma_crl: # M42 (55.3)
    title: "Complete response letter for {name}"
    body: "The {regulator} will not approve the application as filed. The company may answer and file again; a resubmission is likelier to fail."
  pharma_hta_covered: # M42 (55.4)
    title: "{name} is reimbursed in {region}"
    body: "The health-technology assessment accepted its price for its benefit: it now reaches every patient there."
  pharma_hta_refused: # M42 (55.4)
    title: "{name}: reimbursement refused in {region}"
    body: "The assessment found the price too high for the benefit. Without reimbursement it reaches few patients there; a lower list price asks again."
  pharma_confirmed: # M42 (55.3)
    title: "{name}'s confirmatory trial succeeded"
    body: "The accelerated approval is confirmed."
  pharma_withdrawn: # M42 (55.3)
    title: "{name}'s accelerated approval is withdrawn"
    body: "The confirmatory Phase III did not confirm the benefit; the US approval is withdrawn."
  pharma_plant_ordered: # M42 (55.5)
    title: "{plant} ordered"
    body: "It will be built and qualified in {months} months; until then contract manufacturers make the company's drugs."
  pharma_inspection_none: # M42 (55.5, 50.5)
    title: "The {regulator} inspected the company's drug manufacturing"
    body: "The inspectors left without findings."
  pharma_inspection_observations: # M42 (55.5, 50.5)
    title: "The {regulator}'s GMP inspection ends with observations"
    body: "Inspectors listed observations for the quality team to put right. No action follows if they are corrected."
  pharma_inspection_warning_letter: # M42 (55.5, 50.5)
    title: "A warning letter from the {regulator}"
    body: "Significant manufacturing failures. The regulator's decisions on the company's filings are held for {months} months."
  pharma_inspection_import_ban: # M42 (55.5, 50.5)
    title: "The {regulator} stops the company's drugs at the border"
    body: "An import alert stops sales in the regulator's market for {months} months."
  pharma_inspection_consent_decree: # M42 (55.5, 50.5)
    title: "Consent decree: the {regulator} halts the company's drug sales"
    body: "Sales there stop for {months} months while manufacturing is rebuilt under supervision, and the company pays {fine_cents}."
  pharma_recall: # M42 (55.5)
    title: "Recall of {name}"
    body: "A quality problem forces a recall: shipments stop for {months} months."
  pharma_in_licensed: # M42 (55.5)
    title: "{name} joins the pipeline"
    body: "The programme is the company's now: milestones and royalties follow its progress where the deal has them."
  pharma_out_licensed: # M42 (55.5)
    title: "{name} licensed to {partner}"
    body: "The partner pays the upfront now and milestones and royalties as the programme succeeds."
  pharma_ira_selected: # M42 (55.4)
    title: "{name} selected for Medicare price negotiation"
    body: "From January its Medicare price is about {discount_pct}% lower (the Inflation Reduction Act)."
  # M37 (formulas.md 52.1-52.4): dynasty years
  rival_succession:
    title: "{rival}: {new} succeeds {old}"
    body: "{old} has retired as head of {rival}. {new}, {how}, takes over; watch for a change of course."
  dynasty_entrant:
    title: "{rival} enters {category}"
    body: "{rival} has launched in {category}, a market short of competitors."
  founder_died:
    title: "{name} has died, aged {age}"
    body: "{name}, founder of {company}, died this month. The estate pays its tax now; the succession follows."
  founder_died_no_family:
    title: "{name} has died, aged {age}"
    body: "{name}, founder of {company}, died this month with no family to carry on. The campaign ends here."
  family_member_died:
    title: "{name} has died, aged {age}"
    body: "Your family mourns {name}."
  # M40 (56): space and satellites
  space_region_covered:
    title: "{constellation} now covers {region}"
    body: "A shell is complete over {region}. Subscribers can sign up there wherever you hold a licence."
  space_launch_failed:
    title: "Launch failure: {vehicle}"
    body: "The vehicle is grounded for the investigation until turn {until}. Its owed launches wait."
  space_licence_applied:
    title: "Licence applied for: {region}"
    body: "The regulators are reviewing your spectrum and landing-rights application."
  space_licence_granted:
    title: "Licence granted: {region}"
    body: "Your satellite service may sign up subscribers in {region} once a shell covers it."
  space_licence_refused:
    title: "Licence refused: {region}"
    body: "The regulators turned the application down. You may apply again."
  space_debris_rule:
    title: "Tighter debris rules"
    body: "Regulators now charge for satellites in orbit and require faster, costlier disposal at end of life."
  space_failure_answered:
    title: "Launch failure: {constellation}"
    body: "Your answer ({step}) has been carried out."

  # M44 (57): defence and government contracts
  bid_placed:
    title: "Bid placed: {tender}"
    body: "Your bid of {price_cents} is in. Requirements are checked again at the award; the Government screen shows its status."
  tender_awarded:
    title: "Award: {tender}"
    body: "Your bid was {outcome}. Awarded to {winners}."
  contract_won:
    title: "Contract won: {tender}"
    body: "The award stands. Delivery starts next month; the Government screen shows its revenue, cost and performance."
  award_protested:
    title: "Your award is protested: {tender}"
    body: "{by} protested the award. It is held until the protest is decided, and a sustained protest re-competes the tender."
  protest_filed:
    title: "Protest filed: {tender}"
    body: "Your protest holds the award until month {until}."
  protest_decided:
    title: "Protest {outcome}: {tender}"
    body: "A sustained protest re-competes the tender; a denied one lets the award stand."
  contract_completed:
    title: "Contract {contract} completed"
    body: "Its performance joins your past performance."
  contract_options_declined:
    title: "Options declined on contract {contract}"
    body: "Performance was below what the government needed to exercise the option years; the contract ends with its base term."
  contract_defaulted:
    title: "Contract {contract} terminated for default"
    body: "Months without delivery (the product gone, or clearances lapsed) ended it. It counts against your past performance."
  clearances_requested:
    title: "Clearances requested: {people} at {level}"
    body: "Investigations take months, and some candidates never clear. The Government screen shows each one's status."
  clearance_decided:
    title: "Clearance {outcome}: {name}"
    body: "The investigation is decided."
  facility_clearance_requested:
    title: "Facility clearance sponsored"
    body: "Facility {facility}'s clearance takes 6-12 months."
  facility_cleared:
    title: "Facility cleared"
    body: "Facility {facility} may now hold classified work."
  defence_award_reaction:
    title: "Defence work for {government}"
    body: "{objectors} staff object to the work, and consumer brands lost {brand} points."
  defence_letter_answered:
    title: "The open letter: you chose to {step}"
    body: "The Government screen shows the contract's status."

  # M53 (formulas.md 62): telecom. Auctions and bans reach only a company with telecom (a line, a
  # network, a licence or a bid), so a company without telecom hears nothing.
  spectrum_auction_announced:
    title: "Spectrum auction: {auction}"
    body: "{blocks} blocks ({mhz} MHz in all) in {region} go to auction in {month}, from a reserve of {reserve_cents} a block. Register a bid on the Telecom screen before then."
  spectrum_auction_result:
    title: "{auction}: you won {won} of {asked} blocks"
    body: "The auction ran {rounds} rounds and closed at {price_cents} a block. Blocks won are paid for now and carried as spectrum licences for their term."
  spectrum_renewed:
    title: "Spectrum renewed in {region}"
    body: "Your {mhz} MHz of {band}-band spectrum renewed for another term for {fee_cents}."
  spectrum_expired:
    title: "Spectrum expired in {region}"
    body: "Your {mhz} MHz of {band}-band spectrum lapsed at the end of its term."
  spectrum_obligation_fine:
    title: "{regulator} fined you {fine_cents}"
    body: "Your {band}-band licence in {region} owes {owed} population coverage; your sites reach {coverage}. Build more sites, or the licence is revoked if it keeps missing."
  spectrum_revoked:
    title: "{regulator} revoked your licence"
    body: "Your {band}-band licence in {region} missed its coverage obligation ({coverage} against {owed}) too many years. Its book value was written off."
  telecom_ban_announced:
    title: "A ban on {vendor} equipment in {region}"
    body: "The authorities in {area} will exclude {vendor} equipment. No new radios from it may be bought there, and those you have must be replaced by the deadline shown on the Telecom screen."
  telecom_sites_dark:
    title: "{sites} sites switched off in {region}"
    body: "A ban's deadline passed with {vendor} radios still in place: they are off until you replace them (rip-and-replace on the Telecom screen)."
  telecom_ordered:
    title: "{facility} ordered"
    body: "You ordered {units} in {region} ({what}). Capex of {capex_cents} is paid in equal parts over {months} months; it goes live in {ready}."
  bank_charter_applied: # M54 (64.1)
    title: "Charter application filed in {region}"
    body: "{regulator} expects to decide in about {months} months. The bank's opening capital of {capital_cents} is held in its reserves; its lines take deposits there from the charter."
  bank_chartered: # M54 (64.1)
    title: "{regulator} grants your bank its charter"
    body: "Your bank in {region} can take deposits and lend from this month. Its deposit beta, lending and securities are set on the Bank screen."
  bank_partner: # M54 (64.1)
    title: "A partner bank holds your customers' deposits in {region}"
    body: "Your banking lines take deposits there through a chartered partner, which passes on a share of the interest they earn. No capital is needed, and nothing is lent in your name."
  bank_restricted: # M54 (64.1)
    title: "The regulator restricts your bank in {region}"
    body: "Its capital ratio fell to {ratio}, far below the minimum. It may not grow deposits or lend until the ratio is back above its requirement: add capital on the Bank screen."
  bank_stress_passed: # M54 (64.1)
    title: "Your bank in {region} passed its stress test"
    body: "Under the supervisor's adverse scenario its capital ratio would fall to {ratio}, still above the minimum."
  bank_stress_failed: # M54 (64.1)
    title: "Your bank in {region} failed its stress test"
    body: "Under the adverse scenario its capital ratio would fall to {ratio}, below the minimum. Its dividends to the group are frozen for a year."
  bank_run: # M54 (64.1)
    title: "A run on your bank in {region}"
    body: "Uninsured depositors withdrew {withdrawn_cents} this month. Securities sold to pay them realised a loss of {loss_cents}."
  bank_failed: # M54 (64.1)
    title: "Your bank in {region} has failed"
    body: "Its capital is gone and its regulator has taken it over, with its deposits, loans and accounts. Whatever the group had put into it is lost."
  bank_group_review: # M54 (64.5)
    title: "{regulator} reviews your bank in {region}"
    body: "A bank inside a technology group draws its supervisor's scrutiny. Its dividends to the group are blocked for the year; its capital stays its own."
  finance_history: # M54 (64.5)
    title: "Financial news"
    body: "{text}."
  network_launched: # M54 (64.2)
    title: "Your card network opens in {region}"
    body: "Card issuers can now put it on their cards. Merchants take a network as more cards carry it: acceptance starts near zero and grows with its share."
  insurance_licence_applied: # M54 (64.3)
    title: "Insurance licence application filed in {region}"
    body: "{regulator} expects to decide in about {months} months."
  insurance_licensed: # M54 (64.3)
    title: "Your insurer is licensed in {region}"
    body: "It may write policies there from this month while its capital covers the solvency rules."
  insurance_insolvent: # M54 (64.3)
    title: "Your insurer cannot write new business"
    body: "Its own funds ({own_cents}) are below what the solvency rules ask ({required_cents}). Existing policies run on; add capital on the Insurance screen to write again."
  insurance_catastrophe: # M54 (64.3)
    title: "A catastrophe in {region} hits the insurers"
    body: "Insured losses this year are far above normal. Property claims there rise sharply this month."
  # M55 (formulas.md 65): media and entertainment
  media_title_greenlit:
    title: "Green-lit: {title}"
    body: "A {kind} with a budget of {budget_cents}, spent as it is made and carried as a content asset. Planned release: {release}. See it on the Studio screen."
  media_title_released:
    title: "{title} is out: {audience} against {expected} expected"
    body: "Its audience is drawn at release: most titles miss, a few earn most of the money. Its cost is now amortised from the content asset on the kind's schedule."
  media_lead_signed:
    title: "Signed {name} to an overall deal"
    body: "{years} years at {fee_cents} a year; a share is paid up front. You have first look at their titles: green-light one on the Studio screen with them as lead."
  media_lead_unhappy:
    title: "Morale warning: {name} is unhappy about {title}"
    body: "Overruling a creative lead, cutting their budget or moving their date costs morale, more with a bigger ego. Low morale lowers the title's quality and can make them walk to a rival."
  media_lead_walked:
    title: "{name} walked out on {title}"
    body: "They have gone to {rival}, which gets their next title. The title carries on without its lead, at a lower quality."
  media_format_era:
    title: "A new format arrives: {format}"
    body: "Networks on the newest format win users from the incumbents for a few years. Switch {product} on the Social screen to ride it (a switch costs some quality)."
  media_dsa_fine:
    title: "Digital Services Act fine: {product}"
    body: "Light moderation in Europe drew a fine of {fine_cents}. Standard or strong moderation costs more a user but avoids it."
  media_divest_law:
    title: "{product} must divest in {region}"
    body: "A law there orders a sale of the network's users or a ban by {deadline}. Divest on the Social screen for a forced sale's price, or lose its users there."
  media_banned:
    title: "{product} is banned in {region}"
    body: "Its users there have gone. It cannot sell there again."
