# Chart of accounts (ADR-0003). Codes are stable identifiers; never renumber.
# Debits are positive and credits negative in ledger lines.

accounts:
  # Assets
  - { code: 1000_cash, name: Cash, type: asset }
  - { code: 1100_receivables, name: Accounts receivable, type: asset }
  - { code: 1200_prepaid, name: Prepaid expenses, type: asset }
  - { code: 1500_ppe, name: "Property, plant and equipment", type: asset }
  - { code: 1510_accumulated_depreciation, name: Accumulated depreciation, type: asset } # M12a: contra-asset, credit balance
  - { code: 1800_goodwill, name: Goodwill, type: asset } # M14 (28.3): price - the target's book equity at closing; no amortization
  - { code: 1810_investment_subsidiaries, name: Investment in subsidiaries, type: asset } # M14 (28.5): a kept brand's book equity at closing, less cash swept since; replaced by its net assets in consolidation
  - { code: 1820_investment_associates, name: Investments in associates, type: asset } # M16 (31.3): 20-50% stakes at cost, plus the group's share of profit, less its share of dividends
  - { code: 1830_financial_investments, name: Financial investments, type: asset } # M16 (31.3): stakes under 20% at fair value, marked each December
  # Liabilities
  - { code: 2000_payables, name: Accounts payable, type: liability }
  - { code: 2100_accrued_payroll, name: Accrued payroll, type: liability }
  - { code: 2500_debt, name: Debt, type: liability }
  - { code: 2600_safes, name: SAFEs and convertible notes, type: liability }
  # Equity
  - { code: 3000_common_equity, name: Common equity, type: equity }
  - { code: 3100_preferred_equity, name: Preferred equity, type: equity }
  - { code: 3500_non_controlling_interest, name: Non-controlling interest, type: equity } # M16 (31.3): outside holders' share of consolidated subsidiaries' net assets (consolidated statements only)
  # Revenue
  - { code: 4000_revenue_subscriptions, name: Subscription revenue, type: revenue }
  - { code: 4100_revenue_licenses, name: License revenue, type: revenue }
  - { code: 4200_revenue_services, name: Services revenue, type: revenue }
  - { code: 4300_intercompany_sales, name: Intercompany sales, type: revenue } # M16 (31.6): a group company's supply to another at the transfer price; consolidation removes it
  - { code: 4900_other_income, name: Other income, type: revenue } # M6: event cash gains
  - { code: 4910_share_of_associates, name: Share of associates' profit, type: revenue } # M16 (31.3): the group's share of associates' profit; below the operating result
  - { code: 4920_fair_value_gains, name: Fair-value gains and losses, type: revenue } # M16 (31.3): December marks of stakes under 20%; below the operating result
  - { code: 4990_nci_share_of_profit, name: Attributable to non-controlling interest, type: expense } # M16 (31.3): outside holders' share of consolidated subsidiaries' profit; consolidated statements only, shown below the net result
  - { code: 4930_gain_on_disposal, name: Gain or loss on disposal, type: revenue } # M16 (31.1): a subsidiary leaving the group (failed, sold, spun off): what was received less the investment and its goodwill; below the operating result
  # Expenses
  - { code: 5000_cogs, name: Cost of goods sold, type: expense }
  - { code: 5900_intercompany_purchases, name: Intercompany purchases, type: expense } # M16 (31.6): what a group company pays another at the transfer price; consolidation removes it
  - { code: 6000_salaries, name: Salaries, type: expense }
  - { code: 6010_benefits, name: Benefits, type: expense }
  - { code: 6100_rent, name: Rent and office, type: expense }
  - { code: 6200_recruiting, name: Recruiting, type: expense }
  - { code: 6300_compute, name: Compute and hosting, type: expense }
  - { code: 6400_marketing, name: Marketing, type: expense }
  - { code: 6500_research_development, name: Research and development, type: expense }
  - { code: 6600_exploration, name: Exploration, type: expense } # M18 (34.2): desk studies, licences, surveys, sampling, drilling, estimates, feasibility and permits, expensed as spent
  - { code: 6700_depreciation, name: Depreciation, type: expense } # M12a: data centres (22.2)
  - { code: 6900_general_admin, name: General and administrative, type: expense }
  - { code: 6950_lobbying, name: Lobbying, type: expense } # M24 (32.5): a company's monthly lobbying by region; scandal fines post to 6900
  - { code: 7000_interest, name: Interest expense, type: expense }
  - { code: 8000_income_tax, name: Income tax, type: expense }

# The founder's own book (M24, formulas.md 32.2): a separate double-entry book in integer cents,
# never mixed with a company's. Codes start with 9; no company entry may post to them.
personal_accounts:
  - { code: 9100_personal_cash, name: Personal cash, type: asset }
  - { code: 9200_foundation_endowment, name: Foundation endowment, type: asset }
  - { code: 9300_personal_spending, name: Personal spending and grants, type: expense }
  - { code: 9110_angel_investments, name: Angel investments, type: asset }
  - { code: 9120_public_shares, name: Public shares, type: asset }
  - { code: 9130_family_office, name: Family office, type: asset }
  - { code: 9400_personal_income, name: Personal income, type: revenue }
  - { code: 9410_investment_gains, name: Investment gains, type: revenue }
  - { code: 9420_investment_losses, name: Investment losses, type: expense }
  - { code: 9430_dividends_received, name: Dividends received, type: revenue }
