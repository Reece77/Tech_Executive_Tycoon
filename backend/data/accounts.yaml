# Chart of accounts (ADR-0003). Codes are stable identifiers; never renumber.
# Debits are positive and credits negative in ledger lines.

accounts:
  # Assets
  - { code: 1000_cash, name: Cash, type: asset }
  - { code: 1100_receivables, name: Accounts receivable, type: asset }
  - { code: 1200_prepaid, name: Prepaid expenses, type: asset }
  - { code: 1500_ppe, name: "Property, plant and equipment", type: asset }
  - { code: 1520_mineral_properties, name: Mineral properties, type: asset } # M19 (35.2-35.3): a mine's capex and its project's moved exploration spend, less units-of-production depletion credited here
  - { code: 1540_spectrum_licences, name: Spectrum licences, type: asset } # M53 (62.2): spectrum won at auction and renewals, less straight-line amortization credited here
  - { code: 1060_bank_reserves, name: Bank reserves, type: asset } # M54 (64.1): a bank's cash and central-bank reserves, held apart from the company's cash: deposits, loans, securities and the parent's capital move through it
  - { code: 1310_bank_loans, name: Loans, type: asset } # M54 (64.1): a bank's loans outstanding, less repayments and charge-offs
  - { code: 1320_bank_securities, name: Securities, type: asset } # M54 (64.1): a bank's fixed-rate securities at amortised cost (their market value is shown, not booked, until sold)
  - { code: 1330_insurer_investments, name: Insurer investments, type: asset } # M54 (64.3): an insurer's capital and float, invested; premiums less claims and expenses move through it
  - { code: 1560_content_assets, name: Content assets, type: asset } # M55 (65.2): series, films and games capitalised in production, less amortization and write-offs credited here
  - { code: 1530_tool_inventory, name: Tool inventory, type: asset } # M33 (47.2, 47.4): lithography tools held and not yet in a fab: bought from ASML into stock, or made by the player's own tool line at cost
  - { code: 1510_accumulated_depreciation, name: Accumulated depreciation, type: asset } # M12a: contra-asset, credit balance
  - { code: 1800_goodwill, name: Goodwill, type: asset } # M14 (28.3): price - the target's book equity at closing; no amortization
  - { code: 1810_investment_subsidiaries, name: Investment in subsidiaries, type: asset } # M14 (28.5): a kept brand's book equity at closing, less cash swept since; replaced by its net assets in consolidation
  - { code: 1820_investment_associates, name: Investments in associates, type: asset } # M16 (31.3): 20-50% stakes at cost, plus the group's share of profit, less its share of dividends
  - { code: 1830_financial_investments, name: Financial investments, type: asset } # M16 (31.3): stakes under 20% at fair value, marked each December
  # Liabilities
  - { code: 2000_payables, name: Accounts payable, type: liability }
  - { code: 2100_accrued_payroll, name: Accrued payroll, type: liability }
  - { code: 2500_debt, name: Debt, type: liability }
  - { code: 2600_safes, name: SAFEs and convertible notes, type: liability }
  - { code: 2610_asset_retirement_obligation, name: Asset retirement obligation, type: liability } # M19 (35.3): mines' reclamation, provisioned a tonne from first output, paid over mining.reclamation_months after closure (35.3's '2600': SAFEs already hold 2600)
  - { code: 2310_deposits, name: Customer deposits, type: liability } # M54 (64.1): a bank's deposits
  - { code: 2320_claims_reserves, name: Claims reserves, type: liability } # M54 (64.3): claims incurred and not yet paid (the float)
  # Equity
  - { code: 3000_common_equity, name: Common equity, type: equity }
  - { code: 3100_preferred_equity, name: Preferred equity, type: equity }
  - { code: 3500_non_controlling_interest, name: Non-controlling interest, type: equity } # M16 (31.3): outside holders' share of consolidated subsidiaries' net assets (consolidated statements only)
  # Revenue
  - { code: 4000_revenue_subscriptions, name: Subscription revenue, type: revenue }
  - { code: 4100_revenue_licenses, name: License revenue, type: revenue }
  - { code: 4200_revenue_services, name: Services revenue, type: revenue }
  - { code: 4050_revenue_consumables, name: Consumables and service revenue, type: revenue } # M41 (50.1): medical devices' recurring revenue a month per installed unit (robotic instruments and service, sensors, service contracts)
  - { code: 4060_revenue_drugs, name: Drug sales, type: revenue } # M42 (55.4): marketed drugs' net sales by region, and generic makers' sales of off-patent molecules
  - { code: 4070_revenue_government, name: Government contracts, type: revenue } # M44 (57.2): government contracts' revenue: fixed-price and IDIQ task orders as delivered, cost-plus as cost plus the fee
  - { code: 4080_revenue_advertising, name: Advertising revenue, type: revenue } # M55 (65.1): impressions sold by social networks, streaming ad tiers and consumer apps with ad pricing
  - { code: 4090_revenue_content, name: Content revenue, type: revenue } # M55 (65.2-65.4): box office, licences out, game sales and in-app spending
  - { code: 4150_platform_fees, name: Platform fees, type: revenue } # M31 (44.4): a platform owner's fees on other companies' app sales through its store (a group company's go to 4300)
  - { code: 4400_revenue_commodities, name: Commodity sales, type: revenue } # M19 (35.3): a mine's output sold at spot, into contracts and offtakes
  - { code: 4300_intercompany_sales, name: Intercompany sales, type: revenue } # M16 (31.6): a group company's supply to another at the transfer price; consolidation removes it
  - { code: 4410_materials_sales, name: Materials sales, type: revenue } # M20 (36.1): refined materials and wafers sold at spot or under contract
  - { code: 4420_foundry_sales, name: Foundry sales, type: revenue } # M21 (38.2): own fabs' spare wafer starts sold as foundry slots
  - { code: 4950_energy_sales, name: Energy sales, type: revenue } # M32 (46.2): own plants' surplus energy sold to the grid at the grid price less power.export_discount
  - { code: 4430_tool_sales, name: Tool sales, type: revenue } # M33 (47.4): the player's own lithography tools sold to rival foundries
  - { code: 4440_charging_sales, name: Charging sales, type: revenue } # M38 (49.5): energy a charging network sells to EVs
  - { code: 4900_other_income, name: Other income, type: revenue } # M6: event cash gains
  - { code: 4910_share_of_associates, name: Share of associates' profit, type: revenue } # M16 (31.3): the group's share of associates' profit; below the operating result
  - { code: 4920_fair_value_gains, name: Fair-value gains and losses, type: revenue } # M16 (31.3): December marks of stakes under 20%; below the operating result
  - { code: 4990_nci_share_of_profit, name: Attributable to non-controlling interest, type: expense } # M16 (31.3): outside holders' share of consolidated subsidiaries' profit; consolidated statements only, shown below the net result
  - { code: 4930_gain_on_disposal, name: Gain or loss on disposal, type: revenue } # M16 (31.1): a subsidiary leaving the group (failed, sold, spun off): what was received less the investment and its goodwill; below the operating result
  - { code: 4500_interest_income, name: Interest income, type: revenue } # M54 (64.1): a bank's loans and securities, and rivals' net interest income
  - { code: 4510_interchange, name: Interchange, type: revenue } # M54 (64.2): an issuer's interchange on its cards' volume
  - { code: 4520_investment_income, name: Investment income, type: revenue } # M54 (64.3): an insurer's float and capital invested
  - { code: 4530_securities_gains, name: Securities gains and losses, type: revenue } # M54 (64.1): securities sold below or above amortised cost (a run's forced sales)
  - { code: 4940_fx_gains, name: Currency gains, type: revenue } # M54 (64.4, ADR-0025): hedges' fair-value gains and settlements; below the operating result
  - { code: 4945_fx_losses, name: Currency losses, type: expense } # M54 (64.4, ADR-0025): hedges' fair-value losses and settlements; below the operating result
  # Expenses
  - { code: 5000_cogs, name: Cost of goods sold, type: expense }
  - { code: 5100_tariffs, name: Tariffs, type: expense } # M22 (39.3): tariffs on devices, servers and chips made in a taxed bloc and sold in the taxing one; cost of revenue
  - { code: 5110_local_partner_share, name: Local partner's share, type: expense } # M22 (39.3): a local partner's share of the revenue from a partner market (cloud in China); cost of revenue
  - { code: 5150_platform_fees, name: Platform fees and licences, type: expense } # M31 (44.4, 44.1): store fees on app sales and per-unit platform licences on devices; cost of revenue (a group store's go to 5900)
  - { code: 5950_energy, name: Energy (plants and contracts), type: expense } # M32 (46.2, ADR-0022 3): the month's power settlement, cost of revenue: own plants' fuel, operating cost, carbon and grid charges and PPAs' payments, less the grid energy they replaced (facilities post that at the grid price); negative when owning saves
  - { code: 5160_content_royalties, name: Rights holders' royalties, type: expense } # M55 (65.3): music streaming's payout to rights holders; cost of revenue
  - { code: 5170_media_operations, name: Media operations, type: expense } # M55 (65.3-65.5): licences in, live-service updates and moderation; cost of revenue
  - { code: 5300_contract_costs, name: Government contract costs, type: expense } # M44 (57.2): delivering government contracts, overruns included; cost of revenue
  - { code: 5500_deposit_interest, name: Deposit interest, type: expense } # M54 (64.1): interest a bank pays on its deposits
  - { code: 5510_claims, name: Claims, type: expense } # M54 (64.3): claims incurred on policies written
  - { code: 5520_interchange_fees, name: Interchange and network fees, type: expense } # M54 (64.2): what an acquirer pays issuers and networks on its merchants' volume
  - { code: 5530_fraud_losses, name: Fraud and chargebacks, type: expense } # M54 (64.2): a payments line's fraud losses
  - { code: 5200_tool_cost, name: Cost of tools sold, type: expense } # M33 (47.4): the made cost of own tools sold; cost of revenue
  - { code: 5900_intercompany_purchases, name: Intercompany purchases, type: expense } # M16 (31.6): what a group company pays another at the transfer price; consolidation removes it
  - { code: 6000_salaries, name: Salaries, type: expense }
  - { code: 6010_benefits, name: Benefits, type: expense }
  - { code: 6100_rent, name: Rent and office, type: expense }
  - { code: 6200_recruiting, name: Recruiting, type: expense }
  - { code: 6300_compute, name: Compute and hosting, type: expense }
  - { code: 6400_marketing, name: Marketing, type: expense }
  - { code: 6500_research_development, name: Research and development, type: expense }
  - { code: 6600_exploration, name: Exploration, type: expense } # M18 (34.2): desk studies, licences, surveys, sampling, drilling, estimates, feasibility and permits, expensed as spent
  - { code: 6700_depreciation, name: Depreciation, type: expense } # M12a: data centres (22.2)
  - { code: 6760_spectrum_amortization, name: Spectrum amortization, type: expense } # M53 (62.2): a licence's price over its term
  - { code: 6800_loan_losses, name: Loan losses, type: expense } # M54 (64.1): loans charged off
  - { code: 6770_content_amortization, name: Content amortization, type: expense } # M55 (65.2): a released title's cost on its accelerated schedule, and write-offs of cancelled and failed titles
  - { code: 6750_depletion, name: Depletion, type: expense } # M19 (35.3): mineral properties' units-of-production depletion, and write-offs at closure
  - { code: 6900_general_admin, name: General and administrative, type: expense }
  - { code: 6950_lobbying, name: Lobbying, type: expense } # M24 (32.5): a company's monthly lobbying by region; scandal fines post to 6900
  - { code: 6970_fines, name: Fines and penalties, type: expense } # M34 (48.3, 48.4): regulators' fines and periodic penalties (an annulled fine returns here)
  - { code: 6980_recalls, name: Recalls, type: expense } # M41 (50.5): recall field actions and class I recall lawsuits
  - { code: 6985_quality_regulatory, name: Quality and regulatory, type: expense } # M41 (50.2, 50.5): plants' quality systems, post-market surveillance and regulators' review fees
  - { code: 6990_bids_clearances, name: "Bids, protests and clearances", type: expense } # M44 (57.2-57.4): proposals, the player's protests, staff and facility clearances, an ethics board
  - { code: 6960_royalties, name: Royalties and state shares, type: expense } # M19 (35.3, 35.4): host governments' royalties on mines' revenue, and a state partner's share of a mine's cash margin
  - { code: 7000_interest, name: Interest expense, type: expense }
  - { code: 8000_income_tax, name: Income tax, type: expense }

# The founder's own book (M24, formulas.md 32.2): a separate double-entry book in integer cents,
# never mixed with a company's. Codes start with 9; no company entry may post to them.
personal_accounts:
  - { code: 9100_personal_cash, name: Personal cash, type: asset }
  - { code: 9200_foundation_endowment, name: Foundation endowment, type: asset }
  - { code: 9300_personal_spending, name: Personal spending and grants, type: expense }
  - { code: 9110_angel_investments, name: Angel investments, type: asset }
  - { code: 9120_public_shares, name: Public shares, type: asset }
  - { code: 9130_family_office, name: Family office, type: asset }
  - { code: 9400_personal_income, name: Personal income, type: revenue }
  - { code: 9410_investment_gains, name: Investment gains, type: revenue }
  - { code: 9420_investment_losses, name: Investment losses, type: expense }
  - { code: 9430_dividends_received, name: Dividends received, type: revenue }
