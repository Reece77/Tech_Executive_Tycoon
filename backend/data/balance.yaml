# Every tunable number in the game (ADR-0008). Each key: unit and intent.
# Formulas and rationale: docs/formulas.md.

company:
  base_monthly_cost_cents: 50000 # cents per month; base overhead on top of payroll and office ($500 from M1b, $2,000 in M0; formulas.md section 8)

costs:
  tools_per_head_cents: 150000 # cents per month per employee, the founder excepted; software, equipment and travel, posted to 6900_general_admin (M4c balance lever, formulas.md section 8)

scenario:
  garage_bootstrap:
    starting_cash_cents: 5000000 # cents; founder savings, $50,000 (formulas.md section 8a)
  ex_big_tech_founders:
    starting_cash_cents: 40000000 # cents; savings plus angel money, $400,000
  funded_spinout:
    starting_cash_cents: 150000000 # cents; seed round already closed, $1,500,000
  mineral_first_prospector:
    starting_cash_cents: 500000000 # cents; exploration capital, $5,000,000 (v3 only)

difficulty:
  easy:
    starting_cash_mult_bp: 15000 # basis points applied to scenario starting cash; 1.5x
  standard:
    starting_cash_mult_bp: 10000 # basis points; 1.0x
  hard:
    starting_cash_mult_bp: 6000 # basis points; 0.6x
  ironman:
    starting_cash_mult_bp: 10000 # basis points; 1.0x, difficulty comes from no reloads

backup:
  every_n_turns: 12 # turns; periodic save backup after every Nth committed turn (ADR-0004)
  keep_periodic: 10 # count; periodic backups kept per save, oldest deleted first (ADR-0004)

inbox: # the player's inbox (formulas.md 23.1, M10b)
  auto_archive_months: 3 # months; read, unbookmarked items this old archive at month end

holiday: # auto-advance: ordinary Continues until a stop reason (formulas.md 17.1)
  max_months: 24 # months; the longest holiday the player can choose
  default_months: 6 # months; the dialog's starting value
  default_stop: major # minor | major | critical; stop after an event at or above this severity
  stop_runway_months: 6 # months; stop the first time runway falls below this during a holiday

coo: # "Ask my COO" (formulas.md 17.3)
  max_question_chars: 300 # characters in the player's question
  max_answer_words: 200 # words in the answer
  keep_answers: 20 # questions and answers kept per save, oldest deleted first
  max_issues: 5 # count; issues in the briefing, most urgent first
  runway_months: 12 # months; runway under this is an issue
  morale_below: 40 # morale points; an employee's shown morale under this is an issue
  role_open_months: 3 # months; a search open longer than this is an issue
  board_below: 50 # confidence points; average board confidence under this is an issue

# --- People (formulas.md sections 2-3) ------------------------------------------------
people:
  level_ca: # target current ability by level: Normal(mean, sd) in CA points (formulas.md 2.1)
    junior: { mean: 70, sd: 12 }
    mid: { mean: 95, sd: 12 }
    senior: { mean: 120, sd: 12 }
    staff: { mean: 140, sd: 10 }
    principal: { mean: 155, sd: 10 }
    exec: { mean: 150, sd: 15 }
  level_age: # years [min, max], uniform integer age for a generated person by level (2.3)
    junior: [21, 28]
    mid: [25, 35]
    senior: [29, 45]
    staff: [32, 50]
    principal: [35, 58]
    exec: [38, 62]
  ca_clip: [30, 190] # CA points; target CA is clipped to this range (2.1)
  skill_noise_sd: # attribute points; noise around the target for role skills (2.2)
    primary: 1.5
    secondary: 2.0
  secondary_offset: 3.0 # attribute points; secondaries centre this far below target/10 (2.2)
  other_skill_range: [1, 8] # attribute points; non-role skills are Uniform(min, max) (2.2)
  ca_tolerance: 2 # CA points; primaries are rescaled until derived CA is this close to target (2.2)
  pa_gap_mean: # CA points; mean of PA - CA by age band, applies from from_age to the next band (2.4)
    - { from_age: 0, value: 45 }
    - { from_age: 25, value: 30 }
    - { from_age: 30, value: 18 }
    - { from_age: 35, value: 8 }
    - { from_age: 45, value: 2 }
  pa_gap_sd: 15 # CA points; sd of the PA gap before it is floored at 0 (2.4)
  personality_mean: 10.5 # attribute points; mean of each personality and hidden trait (2.5)
  personality_sd: 3.5 # attribute points; sd of each personality and hidden trait (2.5)
  interest_count: [2, 4] # count; interests per person, uniform integer in [min, max] (2.6)
  max_tags: 2 # count; behavior tags assigned per person at most (2.7)
  region_weights: # relative weight; region of a generated candidate (2)
    north_america: 55
    europe: 15
    east_asia: 8
    south_southeast_asia: 10
    latin_america: 6
    africa: 3
    oceania: 3
  retire_bp_per_year_over_60: 600 # bp per month per year of age over 59; retirement roll from M1b (3)
  retire_from_age: 60 # years; retirement rolls start at this age; chance uses (age - (retire_from_age - 1)) (3)

payroll:
  salary_round_to_cents: 50000 # cents; salary expectations round to the nearest $500 (2.8)
  benefits_bp: 2000 # bp of monthly salary; benefits posted with payroll (8)
  office_cost_per_head_cents: 60000 # cents per month per staff member, founder included (8)
  severance_months: 1 # months of salary paid when someone is fired (8)

growth: # monthly skill growth and decline (formulas.md section 3)
  rate: 0.12 # attribute points per month; r in the growth formula
  age_factor: # multiplier a(age) on growth, applies from from_age to the next band
    - { from_age: 0, value: 1.3 }
    - { from_age: 25, value: 1.0 }
    - { from_age: 30, value: 0.7 }
    - { from_age: 35, value: 0.4 }
    - { from_age: 45, value: 0.1 }
    - { from_age: 55, value: 0.0 }
  decline: # attribute points per month d(age), subtracted from every skill
    - { from_age: 0, value: 0.0 }
    - { from_age: 50, value: 0.005 }
    - { from_age: 55, value: 0.015 }
  noise_rel_sd: 0.25 # fraction; sd of Normal noise multiplying the growth term, max(0, 1 + noise)

reveal: # revealed ranges (formulas.md section 4, ADR-0007)
  initial_hw: # half-width of a stranger's range
    skill: 5.0 # attribute points
    personality: 7.0 # attribute points
    pa: 66.0 # CA points; a stranger's potential is genuinely unknown (M2b 67; M4c 66, the smallest in 60-120 that holds 13.10's +3 PA target with interview PA strength 0.20)
  strength: # fraction of hw removed per action, before the scout factor
    job_post_screen: 0.20
    network_intro: 0.30
    interview: 0.35
    reference_check: 0.30
    scouting_month: 0.25
    employed_month: 0.08
  scout_base: 0.5 # scout_factor = scout_base + judgment_of_talent / scout_divisor
  scout_divisor: 40 # attribute points
  founder_pa_hw: 40 # CA points; initial PA half-width of the founding company's view of its founder (M2b, 4-5)
  pa_scout_divisor: 16 # attribute points; PA scout factor = clamp(judgment / pa_scout_divisor, ...) (M2b, 4)
  pa_scout_clamp: [0.1, 1.0] # multiplier [min, max]; bounds of the PA scout factor (M2b, 4)
  pa_strength: # fraction of PA's hw removed per action, before the PA scout factor (M2b, 4; tuned to 13.10)
    job_post_screen: 0.05 # a screen says little about potential
    network_intro: 0.30
    interview: 0.20 # one conversation says a little about potential (0.10 before M4c)
    reference_check: 0.30
    scouting_month: 0.60 # a scouting month is where a good scout earns their keep
    employed_month: 0.08
  pa_phrase_bounds: [70, 100, 130, 160] # CA points; limited/decent/good/excellent/outstanding (M1b)

founder: # founder build (formulas.md section 5)
  skill_base: 5 # attribute points; every skill starts here
  skill_points: 70 # attribute points the player distributes
  skill_cap: 18 # attribute points; no skill may exceed this after background bonuses
  default_age: 28 # years
  age_range: [22, 60] # years; allowed founder ages
  default_region: north_america # regions.yaml key; founder region when none is chosen (name pool)
  energy_per_month: 60 # energy; founder's monthly action budget, reset after phase 12 (6; 100 before M4c)
  energy_cost: # energy spent at once by each action (6)
    interview: 8 # (6 before M4c)
    reference_check: 4 # (3 before M4c)
    job_post: 5 # open a job post search (4 before M4c)
    recruiter: 5 # engage a recruiter (4 before M4c)
    network: 10 # network search
    offer: 0
    create_unit: 2 # create a department or team (M2, section 13.7)
    dissolve_unit: 2 # dissolve a unit; members and child teams move to the parent (M2)
    move_unit: 2 # move a team under a department or the company (M2, section 13.7)
    set_leader: 2 # set, replace or remove a unit's leader (M2)
    move_person: 1 # move a person to another unit (M2)
    set_policy: 1 # set a unit's work-location policy (M2, section 13.9)
    give_raise: 2 # change someone's salary (M2, section 13.8)
    promote: 3 # promote someone one level (M2, section 13.8)
    hiring_plan: 2 # create or change a hiring plan; closing one is free (M2, section 13.10)
    scout_search: 20 # founder scouts every open candidate of one search (M3, section 11.12)
    create_product: 4 # create a product (M3, section 11.2)
    assign_unit: 2 # assign a unit (or the company root) to a product (M3, section 11.3)
    unassign_unit: 2 # take a unit off its product (M3, section 11.3)
    set_price: 1 # set or change one segment's price (M3, section 11.2)
    set_marketing: 1 # set or change a product's monthly marketing budget (M3, section 11.5)
    add_segment: 2 # sell a product into another segment of its category (M3, section 11.2)
    launch_product: 3 # launch a product (M3, section 11.2)
    sunset_product: 3 # sunset a product (M3, section 11.2)
    cancel_product: 3 # cancel a product still in development (M3b, section 11.2)
    raise_safe: 10 # raise money on a SAFE (M4, section 14.4)
    start_round: 15 # start a priced round (M4, section 14.5)
    accept_term_sheet: 5 # accept a term sheet (M4, section 14.5)
    accept_bridge: 5 # accept a bridge SAFE from existing investors (M4, section 14.7)
    name_nominee: 2 # name an employee to an empty common board seat (M4c, section 14.6)
    poach_search: 10 # open a "Poach from a rival" search (M5, section 15.6)
    choose_event: 0 # answer an event (M6, section 16.3)
    appoint_executive: 5 # appoint an executive to a seat (M8, section 18.3)
    remove_executive: 5 # remove an executive from a seat (M8, section 18.3)
    set_product_division: 1 # set the division a product belongs to (M8, section 18.1)
    set_shared_services: 2 # set a division's shared services, central or embedded (M8, section 18.4)

# --- Hiring (formulas.md section 7) -----------------------------------------------------
hiring:
  hint_bands: [-0.3, 0.3] # score; below the first: unlikely, above the second: likely
  channel: # candidate batch size [min, max] and level mix (percent) per channel
    network:
      size: [2, 4] # candidates per batch
      sociability_bonus: 1 # extra candidates when the actor's sociability is high enough
      sociability_threshold: 15 # attribute points; actor sociability needed for the bonus
      level_mix: { junior: 30, mid: 40, senior: 25, staff: 5 }
      knowledge: [network_intro] # knowledge actions applied to each new candidate
    job_post:
      size: [6, 10]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 45, mid: 40, senior: 13, staff: 2 }
      knowledge: [job_post_screen]
    recruiter:
      size: [4, 6]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 10, mid: 35, senior: 40, staff: 15 }
      knowledge: [job_post_screen, job_post_screen]
  job_post_cost_cents: 50000 # cents per month while a job post is open; also the cash needed to open one
  recruiter_fee_bp: 2000 # bp of annual salary, charged when a recruiter candidate is hired
  candidate_shelf_turns: 3 # turns a candidate stays available after their batch arrives
  lowball_ratio: 0.85 # ratio; offers below this share of the expectation are always declined
  max_offer_equity_bp: 200 # bp; most equity one offer may carry
  relocation_cents: 1500000 # cents; added to a hire's cost when the candidate relocates to the search's city (M9, 19.3)
  pitch_per_recruiting: 0.3 # score per 10 points of the offer maker's recruiting above neutral (M2, 7)
  pitch_neutral: 10 # attribute points; recruiting at which the pitch term is 0 (M2, 7)
  offer: # acceptance score and probability (7)
    w_salary: 4.0 # score per unit of (offer / expectation - 1)
    w_equity: 1.0 # weight on equity value
    w_fit: 0.5 # score per mission interest the candidate shares
    w_risk: 1.0 # score per unit of (10 - risk_appetite) / 10, subtracted
    ambition_equity_boost: 1.5 # multiplier on w_equity when ambition is above the threshold
    ambition_boost_above: 15 # attribute points; ambition must exceed this for the boost
    equity_value_per_bp: 0.002 # score per bp of equity before the stage multiplier
    stage_appeal: { 0: -0.5, 1: 0.0, 2: 0.5, 3: 1.0 } # score by company stage
    stage_equity_mult: { 0: 1.0, 1: 0.8, 2: 0.5, 3: 0.3 } # multiplier on equity value by stage
    k: 3.0 # logistic steepness
    threshold: 0.0 # score at which acceptance is 50%

# --- Morale (formulas.md section 9) -----------------------------------------------------
morale:
  new_hire: 65 # morale points; starting morale for a new hire
  target_base: 56 # morale points; target = target_base + pay + fit + runway + workload (M10d: 50 -> 56 for a median employee at 58-68)
  pay_slope: 60 # morale points per unit of (salary / market mid - 1)
  pay_min: -20 # morale points; floor of the pay term
  pay_max: 15 # morale points; ceiling of the pay term
  fit_per_interest: 5 # morale points per shared mission interest
  work_style_mismatch: -5 # morale points when work style differs from the role's style
  runway_warn_months: 6 # months; runway below this costs runway_warn
  runway_crit_months: 3 # months; runway below this (or cash <= 0) costs runway_crit
  runway_warn: -10 # morale points
  runway_crit: -20 # morale points
  workload_term: 0 # morale points; placeholder until projects (M3)
  rate: 0.3 # fraction of the gap to target closed each month
  noise_scale: 2.0 # morale points; noise sd = noise_scale x (21 - temperament) / 20
  fire_penalty: -3 # morale points to everyone remaining when someone is fired
  fire_penalty_culture_carrier: -6 # morale points instead, if the fired person is a culture carrier

# --- Resignations and tag reveals (formulas.md section 10) ------------------------------
resign:
  base_bp: 80 # bp per month before modifiers (M7a: 50 -> 80 for 10-25% of staff leaving a year, docs/balance-targets.md T6)
  cap_bp: 2000 # bp per month at most
  morale_floor: 50 # morale points; below this the chance rises (M10d: 40 -> 50 with morale.target_base 56: the floor stays about 10 below the median employee, so underpaid misfits still leave more)
  morale_divisor: 20 # morale points per +100% chance below the floor
  loyalty_divisor: 10 # loyalty term (21 - loyalty) / loyalty_divisor
  job_hopper_mult: 2.0 # multiplier for the job_hopper tag

tags:
  reveal_bp_per_month: 500 # bp per hidden tag per month for employees
  reveal_bp_on_check: 1500 # bp per hidden tag on an interview or reference check

# --- Organization (formulas.md section 13, M2) -----------------------------------------
org:
  department_unlock_headcount: 10 # people on staff (founder included) before departments unlock (13.1)
  span_base: 5 # reports; span limit L = span_base + floor(leadership / span_per_leadership) (13.2)
  span_per_leadership: 4 # attribute points of leadership per extra report in L (13.2)
  manager_morale_slope: 0.8 # morale points per point of manager quality above 10 (13.4)
  manager_morale_cap: 8 # morale points; W_mgr is clamped to [-cap, +cap] (13.4)
  manager_label_bands: [-2, 2] # morale points of W_mgr; at or below: "stretched", at or above: "strong", between: "fine" (M2b display)
  mentoring_neutral: 5 # attribute points; mentoring x S + bonus at which growth is unchanged (13.5)
  mentoring_divisor: 20 # attribute points per +100% growth in M_growth (13.5)
  mentor_tag_bonus: 3 # attribute points added when another member of the unit is a mentor (13.5)
  growth_mult_min: 0.75 # multiplier; floor of M_growth (13.5)
  growth_mult_max: 1.5 # multiplier; ceiling of M_growth (13.5)
  tag_morale: # morale points each holder adds to every other member's morale target (13.6; from M6 credit_taker and toxic_high_performer act through relationships, 16.7)
    culture_carrier: 2
  tag_morale_cap: # morale points; the sum per tag is capped at this (same sign as the effect) (13.6)
    culture_carrier: 2
  reorg: # one-off morale points (13.7)
    move: -2 # the person moved to another unit
    new_leader_members: -1 # each other member when a unit's leader is set or replaced
    replaced_leader: -5 # a replaced or removed leader who stays in the unit
    dissolve_members: -2 # each member of a dissolved unit
  raise_morale: 3 # morale points, once, for a raise of at least raise_threshold_bp (13.8)
  raise_threshold_bp: 500 # bp; a raise this large or larger earns raise_morale (13.8)
  raise_cooldown_turns: 12 # turns; raise_morale is given at most once in this many turns per person (13.8)
  pay_cut_morale: -10 # morale points, once, for any pay cut (13.8)
  promote_morale: 5 # morale points, once, for a promotion (13.8)
  remote: # work-location policy morale terms (13.9)
    sociable_at: 14 # attribute points; sociability at or above this dislikes remote work
    sociable_morale: -3 # morale points for a sociable remote worker
    solitary_at: 7 # attribute points; sociability at or below this prefers remote work
    solitary_morale: 2 # morale points for a solitary remote worker
  # M8 (formulas.md 18.1-18.4): divisions, coordination cost, support staff
  division_stage: 3 # company stage from which divisions, seats and support rules apply (18)
  max_divisions: 6 # division units a company may have at once (18.1)
  layer_tax: 0.03 # fraction of output lost per layer below depth layer_free_depth (tau, 18.2)
  layer_floor: 0.85 # multiplier; the layer tax never takes output below this (18.2)
  layer_free_depth: 2 # depth (root 0, division 1, department 2, team 3) with no layer tax (18.2)
  cross_division_factor: 0.90 # multiplier on a product's output when its units sit in two or more divisions (18.2)
  support_ratio: 15 # staff per support employee needed for full coverage (rho, 18.4)
  support_shortfall: 0.15 # fraction of output lost at zero coverage (18.4)
  support_morale: -6 # morale points at zero coverage, scaled by (1 - c) ("Admin and support", 18.4)
  embedded_bonus: 1.05 # multiplier on builder output and seller capacity in an embedded division (18.4)
  support_churn: 0.4 # base churn of a pool's products x (1 + support_churn (1 - c) k_COO); delegate energy x c (18.4)

delegates: # delegated hiring (formulas.md section 13.10, ADR-0015)
  energy_per_month: 100 # energy; each delegate's monthly budget, reset with the founder's
  scout_cost: 20 # energy; one scouting pass over a plan's candidates; also the reserve kept back while interviewing
  max_ratio_bp: 12000 # bp of the ask; highest salary ratio a plan may offer (1.2x)

# --- Products and markets (formulas.md section 11, M3) -------------------------------------
# Category, segment and incumbent values are data: categories.yaml and incumbents.yaml.
products:
  start_quality: 10 # quality points; a new product's quality (11.2)
  launch_min_quality: 25 # quality points; launch needs at least this quality (11.2)
  launch_min_feature: 30 # feature-score points; launch needs at least this feature score (11.2)
  morale_factor_base: 0.7 # multiplier; m = base + slope x morale / 100 (morale 50 gives 1.0) (11.3)
  morale_factor_slope: 0.6 # multiplier per 100 morale points (11.3)
  coord_free_builders: 5 # builders; coordination cost starts above this many builders on a product (11.3)
  coord_per_builder: 0.02 # fraction of output lost per builder above the free number (11.3)
  coord_floor: 0.6 # multiplier; coordination factor never drops below this (11.3)
  dev_noise_sd: 0.15 # multiplier sd of monthly development noise (stream product_dev) (11.3)
  maverick_noise_sd: 0.10 # multiplier sd added per maverick builder (11.3, 11.10)
  dev_noise_sd_cap: 0.40 # multiplier sd; development noise sd is capped here (11.3)
  seller_rate: # new customers a month per seller at sell 10 and morale factor 1, sales segments only (11.3)
    mid_market: 2
    enterprise: 0.3
  marketer_mk: 5 # marketing points per unit of marketer contribution mu (11.5)
  budget_mk_unit_cents: 100000 # cents of monthly budget per marketing point ($1,000) (11.5)
  qcap_per_skill: 5 # quality points of Q_cap per point of output-weighted development skill (11.4)
  quality_rate: 0.15 # fraction of the gap to Q_cap closed per month at full speed (11.4)
  overcap_decay: 0.01 # fraction per month quality falls while above Q_cap, not below Q_cap (11.4)
  rot_threshold: 0.25 # fraction of scope; output below this counts as no team (11.4)
  rot_per_month: 0.5 # quality points lost per month with no team (11.4)
  brand_rate: 0.10 # fraction of the gap to target brand closed per month (11.5)
  tag: # output multiplier t_i for builders holding a true tag (11.10)
    quiet_genius: { output: 1.25 }
    toxic_high_performer: { output: 1.20 }
    perfectionist: { output: 0.85 }
    maverick: { output: 1.10 }
  perfectionist_qcap_bonus: 3 # attribute points added to a perfectionist's d in Q_cap, capped at 20 (11.10)
  pace_bands: [0.4, 0.75] # fraction of scope min(1, o / sigma): below the first slow, from the second fast (11.13)
  arr_milestones_cents: [10000000, 100000000, 1000000000] # cents; inbox note when ARR first reaches $100k, $1M, $10M (M3a brief)
  growth_label_months: 6 # months of customer trend behind the Growth / Mature display label (11.2, display only)
  growth_label_rate: 0.05 # fraction per month; customers rising faster than this over that window shows "Growth" (11.2)

market:
  gamma: 3 # exponent on appeal in the choice share (11.7)
  awareness_floor: 5 # brand points; awareness uses at least this brand (11.7)
  awareness_scale: 0.5 # fraction; awareness = scale x max(brand, floor) / 100 (11.7)
  demand_noise_sd: 0.05 # multiplier sd of monthly in-play noise (stream market) (11.7)
  gap_divisor: 50 # appeal points per +100% churn below the best product (11.7)
  low_quality_at: 40 # quality points; below this, churn is multiplied (11.7)
  low_quality_churn_mult: 1.5 # multiplier on churn below low_quality_at (11.7)
  sunset_churn_mult: 3 # multiplier on churn for a sunset product (11.2, 11.7)

stages:
  arr_cents: # cents of ARR that put a company in a stage; stages only rise (11.11)
    2: 100000000 # $1M ARR: venture-backed
    3: 2000000000 # $20M ARR: scale-up
  funding: # a closed priced round of this series also puts a company at stage 1 or above in the stage (14.8)
    2: seed
    3: b

# --- Finance (formulas.md section 14, ADR-0018) ------------------------------------------
finance:
  initial_fd_shares: 10000000 # shares; fully diluted shares at game start (14.2)
  pool_target_bp: 1000 # bp of post-money FD; the unallocated pool after every priced round (14.5)
  vesting_months: 48 # months over which options vest (14.2)
  cliff_months: 12 # months before anything vests (14.2)
  retention_slope: 0.5 # resignation multiplier falls by this per unit of unvested value / salary (14.2)
  retention_floor: 0.5 # lowest resignation multiplier from unvested options (14.2)
  growth_window_months: 6 # months behind g_6; the ratio is annualized with exponent 12 / this (14.3)
  new_revenue_growth: 3 # g_6 when MRR six months ago was 0 and is now positive (14.3)
  multiple_base: 4 # ARR multiple at zero growth (14.3)
  multiple_per_growth: 4 # ARR multiple added per unit of annual growth g_6 (14.3)
  multiple_min: 3 # lowest ARR multiple before the climate (14.3)
  multiple_max: 20 # highest ARR multiple before the climate (14.3)
  floor_cents: # cents; the value floor for a young company (14.3)
    no_product: 200000000 # $2M without a live product
    live: 400000000 # $4M with a live product
  floor_per_head_cents: 10000000 # cents added to the floor per person on staff (14.3)
  floor_head_cap: 30 # people; headcount counted in the floor at most (14.3)
  safe:
    min_cents: 2500000 # cents; smallest SAFE raise, $25,000 (14.4)
    max_cents: 200000000 # cents; largest SAFE raise, $2M (14.4)
    optimism: 1.2 # multiplier on V_base; a cap at this times V_base fills half the time (14.4)
    steepness: 6 # slope of the SAFE acceptance logistic (14.4)
    fee_cents: 200000 # cents; legal fee on a SAFE that fills, $2,000 (14.4)
    hint_bands: [0.9, 1.15] # optimism x V_base / cap: below the first unlikely, from the second likely (14.9)
    max_fraction: 0.5 # fraction; outstanding SAFEs may claim less than this share of the company (keeps the 14.5 close defined)
  round:
    open_turns: 3 # turns a priced round stays open, counting the turn it starts (14.5)
    valuation_noise_sd: 0.15 # sd of the log noise on each firm's quoted pre-money (14.5)
    max_amount_of_pre: 0.5 # fraction; a firm invests at most this share of its quoted pre-money (14.5)
    max_response: 0.95 # probability; cap on a firm's response x climate (14.5)
    gate_arr_cents: # cents of ARR a series needs, besides the previous round (14.5; c and d from M10, 20.2)
      a: 100000000 # $1M
      b: 500000000 # $5M
      c: 2500000000 # $25M (M10, 20.2)
      d: 6000000000 # $60M (M10, 20.2)
    fee_min_cents: 1500000 # cents; smallest legal fee on a priced round, $15,000 (14.5)
    fee_bp: 50 # bp of the amount raised; legal fee on a priced round (14.5)
    typical_cents: # cents [min, max]; the typical raise per series, shown as guidance only (14.5)
      seed: [100000000, 300000000]
      a: [300000000, 1000000000]
      b: [1000000000, 3000000000]
      c: [3000000000, 8000000000] # $30M-$80M (M10, 20.2)
      d: [6000000000, 20000000000] # $60M-$200M (M10, 20.2)
    heat_max: 3 # multiplier; a Series A or B's response x climate is also x clamp(ARR / gate, 1, this) (14.5, M4c)
    heat_seed_live: 1.5 # multiplier; a seed's heat with a live product, else 1 (14.5, M4c)

board:
  start: 70 # confidence of a new director (14.6)
  rate: 0.2 # fraction of the gap to the target closed each month (14.6)
  target_base: 50 # confidence target before the growth, runway and patience terms (14.6)
  growth_weight: 20 # points for growth from half to double the expectation (14.6)
  expected_growth: # annual MRR growth expected after the last priced round (14.6; c and d from M10)
    seed: 2.0
    a: 1.5
    b: 1.0
    c: 0.8 # M10: growth investors expect less than a Series B board, still more than the market
    d: 0.6
  runway_terms: # months of runway from the top: points added to the target (14.6)
    - { min_months: 12, points: 10 }
    - { min_months: 6, points: 0 }
    - { min_months: 3, points: -15 }
    - { min_months: 0, points: -30 }
  no_product_penalty: -20 # points while revenue history is short, once this long after the last round with no live product (14.6)
  no_product_after_turns: 12 # turns after the last priced round (14.6)
  down_round_hit: -15 # points off every director's confidence, once, on a down round (14.6)
  warning_below: 40 # average confidence below this brings a formal warning at a board meeting (14.6)
  removal_below: 25 # a director below this for removal_months votes to remove the founder (14.6)
  removal_months: 3 # consecutive months (14.6)
  meeting_months: [3, 6, 9, 12] # calendar months whose month end has a board meeting (14.6)
  history_months: 6 # month ends of each director's confidence kept for the Board tab's trend (M4b)
  trend_points: 2 # confidence points over that history that read as rising or slipping, not steady (M4b)
  seats: # board seats after each series (14.6)
    seed: { common: 1, investor: 1, independent: 0 }
    a: { common: 2, investor: 2, independent: 0 }
    b: { common: 2, investor: 3, independent: 1 }
    c: { common: 2, investor: 4, independent: 1 } # M10 (20.2): the lead's seat; 7 seats, the most a board has
    d: { common: 2, investor: 4, independent: 1 } # M10 (20.2): a full board; the Series D lead takes no seat
  max_seats: 7 # seats; the most a board has, the founder's included (M10, 20.2)
  director_role: operations_manager # roles.yaml key used only to generate directors' skills (not employees)
  director_level: exec # level used to generate directors

bankruptcy:
  months: 3 # consecutive month ends with negative cash after phase 7 that end the game (14.7)
  bridge_burn_months: 3 # bridge amount in months of the projected net burn when accepted, plus any deficit (14.7, M4b)
  bridge_cap_of_post: 0.8 # bridge post-money cap as a fraction of the last post-money valuation (14.7)
  bridge_min_confidence: 40 # average board confidence needed for existing investors to offer a bridge (14.7)
  bridge_open_turns: 2 # turns a bridge offer stays open after it is made (14.7)

# --- Rivals (formulas.md section 15, M5) -------------------------------------------------
rivals:
  act_threshold: 0.5 # utility; a rival acts only if its best action scores at least this (15.3)
  noise_sd: 0.1 # utility; sd of Normal noise added to each action's utility (15.3)
  cooldown_turns: 6 # turns; the same action on the same product and segment waits this long (15.3)
  push_turns: 6 # turns; how long a feature, quality or brand push (and a cost cut's drag) runs (15.2-15.3)
  window_turns: 6 # turns; share changes are measured over this window (15.3)
  need: # divisors in each action's need, clamped to 0-1 (15.3)
    price_cut_drop: 0.05 # share of served customers lost over the window for need 1
    price_rise_lead: 5 # appeal points of lead below which a rise has no need
    price_rise_span: 10 # appeal points of lead above price_rise_lead for need 1
    feature_gap: 15 # feature-score points behind the best for need 1
    quality_gap: 15 # quality points behind the best for need 1
    brand_gap: 30 # brand points behind the best for need 1
    enter_unserved: 0.4 # unserved / D needed to consider entering a segment
    enter_span: 0.4 # unserved / D above enter_unserved for need 1
    enter_cash_months: 12 # months of costs in cash needed to enter a segment
    cut_costs_months: 12 # months of costs in cash below which cutting costs is needed
    cut_costs_span: 6 # months below cut_costs_months for need 1
    poach_gain: 0.007 # share points the player gained over the window for need 1
  weights: # personality weight on each action's need (15.3)
    aggressive: { price_cut: 1.3, price_rise: 0.6, feature_push: 1.2, quality_push: 0.9, brand_push: 1.1, enter_segment: 1.3, cut_costs: 0.9, poach: 1.4 }
    fast_follower: { price_cut: 1.0, price_rise: 0.8, feature_push: 1.3, quality_push: 1.0, brand_push: 0.9, enter_segment: 1.0, cut_costs: 1.0, poach: 1.0 }
    premium: { price_cut: 0.6, price_rise: 1.2, feature_push: 1.0, quality_push: 1.3, brand_push: 1.2, enter_segment: 0.8, cut_costs: 1.0, poach: 0.9 }
    cost_leader: { price_cut: 1.4, price_rise: 0.5, feature_push: 0.9, quality_push: 0.8, brand_push: 0.8, enter_segment: 1.1, cut_costs: 1.2, poach: 0.8 }
  price_factor: { aggressive: 0.9, fast_follower: 1.0, premium: 1.3, cost_leader: 0.7 } # multiplier on p_ref when entering a segment (15.3)
  price_cut: 0.90 # multiplier on price for a price cut (15.3)
  price_rise: 1.05 # multiplier on price for a price rise (15.3)
  push_pool_growth: 0.10 # fraction added to the builder pool by a feature or quality push (15.3)
  brand_push_marketing: 0.50 # fraction added to marketing during a brand push (15.3)
  cut_costs_pools: 0.15 # fraction cut from every pool by a cost cut (15.3)
  cut_costs_marketing: 0.30 # fraction cut from marketing by a cost cut (15.3)
  feature_push_rate: 1.0 # feature-score points a month during a feature push (15.2)
  quality_push_rate: 1.0 # quality points a month toward 5 d during a quality push (15.2)
  brand_push_rate: 1.0 # brand points a month during a brand push (15.2)
  cut_costs_drag: 0.5 # feature-score and brand points lost a month for push_turns after a cost cut (15.2)
  qcap_per_skill: 5 # quality points of the push target per point of builder skill d (15.2)
  function_mix: # fraction of an incumbent's pool budget per function, by category (15.1)
    b2b_saas: { builder: 0.45, seller: 0.40, marketer: 0.15 }
    cybersecurity: { builder: 0.45, seller: 0.40, marketer: 0.15 }
    dev_tools: { builder: 0.70, seller: 0.15, marketer: 0.15 }
    consumer_apps: { builder: 0.75, seller: 0.0, marketer: 0.25 }
    fintech: { builder: 0.50, seller: 0.30, marketer: 0.20 } # M8 (18.6)
    ai_models: { builder: 0.75, seller: 0.10, marketer: 0.15 } # M8 (18.6)
  function_roles: { builder: software_engineer, seller: account_executive, marketer: marketer } # roles.yaml key whose mid-level pay prices each pool (15.1)
  pool_morale: 60 # morale points of every pool (15.1)
  pool_skill_other: 12 # attribute points; seller and marketer pool skill (15.1)
  start_marketing_share: 0.08 # fraction of each product's revenue spent on marketing at start (15.1)
  key_people: 8 # generated individuals per incumbent, included in its headcount (15.1)
  key_people_levels: { senior: 50, staff: 35, principal: 15 } # percent level mix of key people (15.1: senior to principal)
  free_agent_months: 6 # months a failed rival's people stay in the free-agent pool for the player's searches (M6 sub-task 0)
  startup:
    found_rate: 0.03 # probability per category per month before climate and growth (15.4; M7a: 0.02 -> 0.03, keeps M5 target 1 at one launch per category now that fewer startups refinance)
    max_alive: 8 # rival startups alive at once (15.4)
    team: [3, 8] # individual employees besides the founder (15.4)
    cash_cents: [100000000, 300000000] # cents [min, max] of starting cash (15.4)
    raise_months: 12 # months of costs raised when funding comes (15.4; M7a: 18 -> 12, T7)
    raise_chance: 0.18 # probability per quarter before climate (15.4; M7a: 0.6 -> 0.25 so 20-60% of startups survive five years, T7; M8: 0.25 -> 0.18, six categories spread the startup cap thinner)
    low_cash_months: 6 # months of costs in cash below which a startup tries to raise (15.4)
    salary_mult: 1.0 # multiplier on market rate for startup salaries (15.4)
    personalities: [aggressive, fast_follower, cost_leader] # 15.4: any but premium
  poach:
    offer_mult: 1.0 # multiplier on market rate a rival offers the player's employee (15.6)
    top_fraction: 0.30 # top share of the player's staff by CA a rival may approach (15.6)
    ask_mult: 1.3 # multiplier on current salary a poached key person asks (15.6)
    leave_penalty: -0.5 # offer-score points for leaving an employer (15.6)
    key_builder_quality_hit: 2 # quality points each of the rival's products loses over push_turns when a key builder leaves (15.6)
    bands: [0.20, 0.50] # probability; below: likely to stay, above: likely to go, between: might go (15.6)
    candidates: [2, 4] # key people shown per poach search (15.6)
    salary_weight: 4 # score per unit of (R - 1) in s (15.6)
    morale_mid: 55 # morale points in s = 4 (R - 1) + (55 - morale) / 20 - (loyalty - 10) / 10 - 2u (15.6)
    morale_divisor: 20
    loyalty_mid: 10
    loyalty_divisor: 10
    options_weight: 2
    steepness: 2 # p = 1 / (1 + e^(-steepness s)) (15.6)
  money_bands_months: [12, 36] # months of costs in cash: below tight, from the second deep pockets (15.5)
  stance_turns: 6 # turns: a rival that acted in a player segment this recently is "responding" (15.5)
  headcount_round: 10 # people; estimated headcounts above 100 are rounded to this (15.5)
  headcount_round_above: 100

events: # event director, effect caps, storylines (formulas.md 16; ADR-0005, ADR-0011)
  count_weights: [0.08, 0.40, 0.38, 0.14] # probability of 0, 1, 2, 3 events a month (16.1; tuned in M6.9 from [0.15, 0.50, 0.28, 0.07])
  category_repeat_factor: 0.5 # weight multiplier for a category used last month (16.1)
  template_cooldown_turns: 12 # months before the same template may run again (16.1; tuned in M6.9 from 24)
  person_cooldown_turns: 4 # months before an event may name the same person again (16.1; tuned in M6.9 from 6)
  critical_gap_turns: 6 # at most one critical event in any this many months (16.1)
  major_from: 0.5 # trigger strength from which an event is major, below it minor (16.1)
  light_tone_chance_bp: 1000 # bp chance an event asks for a light or satirical touch (ADR-0011)
  max_storylines: 3 # storylines active at once (16.6)
  summary_words: 60 # words in a storyline summary (16.6)
  body_words: 180 # words in an event body (16.5)
  recent_summaries: 10 # past event summaries passed to the LLM (16.5)
  trigger: # when each trigger holds and how strong it is (16.2); strengths are clamped to 0..1
    low_morale: { below: 35, span: 20 } # morale points: (below - morale) / span
    unhappy_unit: { below: 45, span: 15 } # unit average morale points
    underpaid: { below: 0.95, span: 0.2 } # salary / market mid (tuned in M6.9 from 0.9)
    star_performer: { top_fraction: 0.30, tenure_months: 12, strength: 0.4 } # top share of employees by CA (tuned in M6.9 from 0.10)
    team_clash: { at_most: -25, span: 30 } # relationship points: (at_most - rel) / span (tuned in M6.9 from -50)
    team_bond: { at_least: 30, strength: 0.3 } # relationship points (tuned in M6.9 from 60)
    office_politics: { unit_size: 4, strength: 0.6 } # people in the politician's unit
    tag_noticed: { strength: 0.5 }
    anniversary: { strength: 0.2 }
    product_launched: { strength: 0.5 }
    product_slipping: { strength: 0.6 }
    price_war: { strength: 0.6 }
    rival_move: { strength: 0.3 }
    poached: { strength: 0.8 }
    customer_milestone: { strength: 0.4 }
    runway_short: { months: [6, 3], strength: [0.6, 1.0] } # runway months; below the second, critical is allowed
    funding_closed: { strength: 0.5 }
    board_unhappy: { below: 50, span: 15 } # average board confidence points (tuned in M6.9 from 40)
    early_days: { strength: 0.4 } # no live product yet: the founder's early-days templates (M7a, E3 in docs/balance-targets.md)
    quiet_month: { strength: 0.2 }
    # M10c (24.3): an executive with authority asks for something; two executives clash
    exec_cto: { strength: 0.3 } # the CTO wants a research budget
    exec_cro: { strength: 0.3 } # the CRO wants a price change
    exec_cmo: { strength: 0.3 } # the CMO proposes a campaign
    exec_cfo: { strength: 0.4 } # the CFO warns about runway (runway below the CFO's threshold)
    exec_clash: { at_most: -10, span: 30 } # relationship points between two seat holders: (at_most - rel) / span
  caps: # largest effect per choice by severity [minor, major, critical] (16.3)
    morale_delta: [3, 10, 20] # morale points (minor tuned in M6.9 from 5)
    relationship_delta: [10, 20, 40] # relationship points
    cash_delta: [100, 300, 1000] # bp of max(cash, cash_revenue_months x monthly revenue); gains up to cash_gain_share of it
    brand_delta: [2, 5, 10] # brand points
    quality_delta: [1, 3, 6] # quality points
    customers_pct: [1, 3, 8] # percent of the product's customers in the segment
    growth_boost: [0.2, 0.5, 1.0] # skill points, once
    energy_delta: [5, 10, 15] # founder energy next month
    board_confidence: [3, 6, 12] # confidence points for every director
    salary_change: [5, 10, 15] # percent raise, never a cut
    modifier: [5, 10, 20] # percent change to a stat each month while it runs (23.2, M10b)
  modifier_months: [6, 12, 12] # months; the longest a modifier runs, by severity (23.2)
  crisis: # critical events from crises (23.3, M10b); draws on the events stream, own keys
    key_exit_top_fraction: 0.10 # share of staff by current ability whose exit is a crisis
    breach_chance: 0.004 # a month, x (1 - security coverage), per qualifying live product
    breach_min_customers: 1000 # customers a product needs before a breach is news
    security_full_at: 15 # mean security skill of the product team that gives full coverage
    outage_chance: 0.003 # a month, per qualifying live product
    outage_max_quality: 45 # quality below which a busy product can go down
    outage_min_customers: 5000 # customers a product needs before an outage is a crisis
  cash_revenue_months: 3 # months of revenue in the cash cap base (16.3)
  cash_gain_share: 0.5 # gains reach at most this share of the cost cap (16.3)
  effect_size_bounds: [0.34, 0.67] # share of the cap: up to the first "small", above the second "large" (16.9)

relationships: # pairs of unit-mates and manager links (formulas.md 16.7)
  start_base: 15 # points: start = round(start_base - start_per_temperament x |temperament difference|)
  start_per_temperament: 1.5 # points per temperament point of difference
  start_clamp: [-20, 15] # points
  drift: 0.10 # fraction of the way back to the start value each month
  tag_push: { credit_taker: -3, toxic_high_performer: -4, culture_carrier: 2, politician: -3 } # points a month with each unit-mate
  politician_ambition_at: 14 # a politician pushes only unit-mates with ambition at least this
  morale_weight: 0.1 # morale points per relationship point (W_rel)
  morale_cap: 5 # W_rel is clamped to plus or minus this
  label_bounds: [-50, -20, 20, 60] # hostile at or below the first; strained below the second; close from the last
  range: [-100, 100] # relationships stay in this range

# --- Executive seats (formulas.md 18.3, M8) ----------------------------------------------
exec_seats:
  stage: 3 # company stage from which seats can be filled and vacant seats cost (18.3)
  min_level: senior # lowest level a seat holder may have (18.3)
  score_mid: 10 # attribute points; seat score s at which the effect e is 0: e = (s - mid) / span
  score_span: 8 # attribute points of s per unit of e
  effect_min: -0.5 # lowest e from a holder (18.3)
  effect_max: 1.0 # highest e (18.3)
  vacant_effect: -0.5 # e of a vacant seat at stage 3 or later (18.3)
  appoint_morale: 5 # morale points, once, for the appointee (18.3)
  remove_morale: -10 # morale points, once, for a removed executive (18.3)
  fit_bands: [11, 14] # displayed seat score: below the first "weak fit", from the second "strong fit", else "fair fit" (18.8)
  seats: # skill weights of s (sum to 1) and coefficients per unit of e (18.3): effect is the first effect;
    # qcap (CTO, Q_cap), churn (CPO, base churn down), brand (CMO, B*), awareness (CMO), pricing (CRO, p_ref in sales segments)
    coo: { label: COO, effect: 0.5, weights: { operations: 0.35, leadership: 0.25, strategy: 0.20, communication: 0.20 } } # k_COO = 1 - effect x e
    cfo: { label: CFO, effect: 0.08, confidence: 0.5, weights: { finance: 0.45, strategy: 0.20, negotiation: 0.20, communication: 0.15 } } # V_base x (1 + effect e); director confidence + confidence x e a month
    cto: { label: CTO, effect: 0.10, qcap: 0.10, weights: { software_engineering: 0.25, infrastructure: 0.15, ml_research: 0.10, leadership: 0.25, strategy: 0.25 } } # builder output and Q_cap x (1 + 0.10 e)
    cpo: { label: CPO, effect: 0.15, churn: 0.15, weights: { product: 0.45, design: 0.15, strategy: 0.20, leadership: 0.20 } } # feature points gained x (1 + 0.15 e); base churn x (1 - 0.15 e)
    cmo: { label: CMO, effect: 0.20, brand: 0.10, awareness: 0.20, weights: { marketing: 0.45, communication: 0.20, strategy: 0.20, leadership: 0.15 } } # marketing points x (1 + 0.20 e); B* x (1 + 0.10 e); awareness x (1 + 0.20 e)
    cro: { label: CRO, effect: 0.20, pricing: 0.10, weights: { sales: 0.40, negotiation: 0.25, leadership: 0.20, communication: 0.15 } } # seller capacity x (1 + 0.20 e); p_ref x (1 + 0.10 e) in sales segments

exec_authority: # executives with authority (formulas.md 24, M10c)
  change_energy: 2 # founder energy to give, change or withdraw one seat's authority (24.1)
  energy_per_month: 100 # an executive's own energy a month for acting (24.1)
  quality: { base: 0.55, per_score: 0.03, min: 0.6, max: 0.98 } # P(the right rule) = clamp(base + per_score x s, min, max), s the true seat score (24.2)
  mistake_budget_off: 0.20 # a mistaken budget split is off by this fraction (24.2)
  report_months: 3 # a quarterly report from each seat holder (24.3)
  plan_hires: 2 # people one hiring plan opened by an executive asks for at most
  memory_months: 12 # months of decisions kept for reports and the panel
  move_margin: 1.25 # a product gives up a builder only above this x its full speed (CTO)
  price_step_pct: 5 # % the CRO moves a sales-led price in one month, within its band
  lease_seats: 25 # seats in a lease the COO proposes
  repay_share: 0.5 # share of the cash above the cash threshold the CFO repays early
  loan_share: 0.5 # share of the limit the CFO proposes to borrow
  defaults: # guardrails a seat starts with when given authority (24.1); the player changes them
    cto: { headcount_cap: 30, max_salary_ratio_bp: 11000, protected_units: [] } # builders; offer x ask in bp
    cro: { headcount_cap: 20, price_band_pct: 10, max_salary_ratio_bp: 11000 } # sellers; +- % of the player's last price
    cmo: { marketing_pct_of_revenue: 15 } # % of last month's revenue spent on marketing in total
    coo: { coverage_target: 1.0, lease_approval_rent_cents: 0, max_salary_ratio_bp: 11000 } # support coverage; rent above which a lease is only proposed
    cfo: { runway_months: 9, repay_above_months: 24 } # months of burn: propose a round or loan below the first; repay debt early with cash above the second

# --- Capital and macro (formulas.md section 20, M10 lane B) -------------------------------
macro:
  history_months: 24 # months of indicators the API shows behind the current one (20.4)
  rate: { mean: 3.0, phi: 0.97, shock_sd: 0.15, bounds: [0.0, 8.0] } # % a year; base rate AR(1) after 2025 (20.1)
  climate: { mean: 1.1, phi: 0.95, shock_sd: 0.05, bounds: [0.6, 1.8] } # multiplier; venture climate AR(1) after 2025 (20.1)
  confidence: { mean: 100.0, phi: 0.95, shock_sd: 2.5, bounds: [60.0, 125.0] } # index (100 = 2010-2019 average); AR(1) after 2025 (20.1)
  ai_change: { mean: -0.10, phi: 0.8, shock_sd: 0.08, bounds: [-0.5, 0.5] } # fraction a year; AI compute index's yearly change, AR(1) after 2025, drawn each January (20.1)
  confidence_exponent: 0.5 # adoption x (cc / 100)^this in the confidence segments (20.1)
  confidence_segments: [consumer, smb] # segments.yaml keys whose adoption follows consumer confidence (20.1)
  downturn:
    monthly: 0.012 # probability a downturn starts in a month after 2025 (20.1)
    gap_months: 36 # months without a downturn needed before another can start (20.1)
    months: 12 # months a downturn lasts (20.1)
    rate: -0.25 # % points pushed onto the base rate each downturn month, before the AR(1) step (20.1)
    climate: -0.04 # pushed onto the venture climate each downturn month (20.1)
    confidence: -1.5 # index points pushed onto consumer confidence each downturn month (20.1)

debt:
  take_energy: 10 # founder energy to sign a loan (20.3)
  repay_energy: 5 # founder energy to repay early (20.3)
  venture:
    window_turns: 12 # turns after a priced round closes during which venture debt is offered (20.3)
    max_of_round_bp: 3000 # bp of that round's amount; most venture debt against one round (20.3)
    spread_bp: 600 # bp a year over the base rate (20.3)
    term_months: 36 # months to repay (20.3)
    interest_only_months: 12 # months of interest only before equal principal (20.3)
    warrant_bp: 25 # bp of fully diluted shares (after issue) granted to the lender at signing (20.3)
    covenant_burn_months: 3 # cash must cover this many months of last month's burn (20.3)
  bank:
    stage: 3 # company stage needed for a bank loan (20.3)
    profit_months: 3 # months of positive operating profit needed, each (20.3)
    max_of_arr_bp: 10000 # bp of ARR; most bank debt outstanding (20.3)
    spread_bp: 300 # bp a year over the base rate (20.3)
    term_months: 48 # months to repay, equal principal from the first (20.3)
    covenant_profit_months: 3 # operating profit summed over this many months must be positive (20.3)
    covenant_cash_bp: 1000 # bp of the balance; cash must cover at least this (20.3)
  min_cents: 10000000 # cents; smallest loan, $100,000 (UI and rules floor)
  breach:
    waiver_fee_bp: 100 # bp of the balance; the waiver fee choice (20.3)
    rate_up_bp: 200 # bp a year added for the rest of the term; the higher-rate choice (20.3)
    repay_bp: 2500 # bp of the balance repaid at once; the partial-repayment choice (20.3)
    cure_months: 3 # months after a breach before covenants are tested again (M10 decision)
    call_window_months: 6 # a second breach within this many months of the first makes the balance due (20.3)

# --- Offices (formulas.md 19.2, M9) ------------------------------------------------------
office:
  seat_sizes: [25, 50, 100, 250] # seats a lease may have (19.2)
  lease_discount: 0.75 # fraction; a leased seat costs this x payroll.office_cost_per_head_cents x rent index a month (19.2)
  fit_out_months: 3 # months of rent paid once when a lease starts (19.2)
  close_penalty_months: 3 # months of rent paid once when a lease is closed (19.2)
  crowded_morale: -4 # morale points for everyone in an office whose members exceed its seats (19.2)
  lease_energy: 10 # energy to lease an office (19.2)
  close_energy: 10 # energy to close an office (19.2)
  assign_energy: 2 # energy to set the office a unit works from (M9 decision; as assign_unit)

# --- Regional markets (formulas.md 19.4-19.5, M9) ----------------------------------------
markets:
  localize_cents: 4000000 # cents x scope / localize_scope: one-off localization cost per region (19.5)
  localize_scope: 6 # scope sigma at which localization costs exactly localize_cents (19.5)
  localize_months: 3 # months from launch in a region until it sells there (19.5)
  localize_slowdown: 0.10 # fraction; feature points grow this much slower while any region localizes (19.5)
  launch_energy: 4 # energy to launch a product in a region (19.5)
  foreign_awareness: 1.0 # multiplier on self-serve awareness in a region without local presence (19.5; 1.0 since M10b, 23.5: self-serve needs no presence)
  no_marketing_awareness: 0.7 # share of awareness in a region given none of the product's marketing (23.5, M10b)
  presence_people: 5 # people working in a region that count as local presence without an office (19.5)
  neighbour_sellers: 0.5 # fraction of sellers in the neighbour region that count in a sales-led segment (19.5)
  cross_region_step: 0.05 # output lost per extra region the builders work in (19.4)
  cross_region_floor: 0.85 # lowest cross-region output factor (19.4)

# --- Cities and geography (formulas.md 19.1, 19.3, 19.6, M9) -----------------------------
geo:
  default_hq_city: san_francisco # cities.yaml key; a new game's HQ unless one is chosen (19.1)
  pay_level: 0.876 # multiplier on every city's salary multiplier, for asks and market rates: a San Francisco company's average pay equals v1's regional candidate mix (19.1; Reece, 2026-11-01)
  local_candidates: 0.85 # fraction of a search's candidates who live in its city; the rest relocate (19.3)
  region_entry: # a rival's enter_region need (19.6): (unserved share - unserved) / span, with cash for cash_months
    unserved: 0.8 # unserved share of the region's demand needed to consider entering (tuned in M9 from 19.6's 0.4: rivals entered the served home market and squeezed v1's incumbents)
    span: 0.2 # unserved share above `unserved` for need 1 (tuned in M9 from 0.4, so an empty region still has need 1)
    cash_months: 12 # months of costs in cash needed to enter a region
    cooldown_turns: 12 # turns; a rival enters at most one region in this many (M9 pacing, so entries do not crowd out 15.3's other actions)
