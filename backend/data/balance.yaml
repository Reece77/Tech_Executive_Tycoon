# Every tunable number in the game (ADR-0008). Each key: unit and intent.
# Formulas and rationale: docs/formulas.md.

company:
  base_monthly_cost_cents: 50000 # cents per month; base overhead on top of payroll and office ($500 from M1b, $2,000 in M0; formulas.md section 8)

costs:
  tools_per_head_cents: 150000 # cents per month per employee, the founder excepted; software, equipment and travel, posted to 6900_general_admin (M4c balance lever, formulas.md section 8)

scenario:
  garage_bootstrap:
    starting_cash_cents: 5000000 # cents; founder savings, $50,000 (formulas.md section 8a)
  ex_big_tech_founders:
    starting_cash_cents: 40000000 # cents; savings plus angel money, $400,000
  funded_spinout:
    starting_cash_cents: 150000000 # cents; seed round already closed, $1,500,000
  mineral_first_prospector:
    starting_cash_cents: 500000000 # cents; exploration capital, $5,000,000 (v3 only)

difficulty:
  easy:
    starting_cash_mult_bp: 15000 # basis points applied to scenario starting cash; 1.5x
  standard:
    starting_cash_mult_bp: 10000 # basis points; 1.0x
  hard:
    starting_cash_mult_bp: 6000 # basis points; 0.6x
  ironman:
    starting_cash_mult_bp: 10000 # basis points; 1.0x, difficulty comes from no reloads

backup:
  every_n_turns: 12 # turns; periodic save backup after every Nth committed turn (ADR-0004)
  keep_periodic: 10 # count; periodic backups kept per save, oldest deleted first (ADR-0004)

inbox: # the player's inbox (formulas.md 23.1, M10b)
  auto_archive_months: 3 # months; read, unbookmarked items this old archive at month end

holiday: # auto-advance: ordinary Continues until a stop reason (formulas.md 17.1)
  max_months: 24 # months; the longest holiday the player can choose
  default_months: 6 # months; the dialog's starting value
  default_stop: major # minor | major | critical; stop after an event at or above this severity
  stop_runway_months: 6 # months; stop the first time runway falls below this during a holiday

coo: # "Ask my COO" (formulas.md 17.3)
  max_question_chars: 300 # characters in the player's question
  max_answer_words: 200 # words in the answer
  keep_answers: 20 # questions and answers kept per save, oldest deleted first
  max_issues: 5 # count; issues in the briefing, most urgent first
  runway_months: 12 # months; runway under this is an issue
  morale_below: 40 # morale points; an employee's shown morale under this is an issue
  role_open_months: 3 # months; a search open longer than this is an issue
  board_below: 50 # confidence points; average board confidence under this is an issue

# --- People (formulas.md sections 2-3) ------------------------------------------------
people:
  level_ca: # target current ability by level: Normal(mean, sd) in CA points (formulas.md 2.1)
    junior: { mean: 70, sd: 12 }
    mid: { mean: 95, sd: 12 }
    senior: { mean: 120, sd: 12 }
    staff: { mean: 140, sd: 10 }
    principal: { mean: 155, sd: 10 }
    exec: { mean: 150, sd: 15 }
  level_age: # years [min, max], uniform integer age for a generated person by level (2.3)
    junior: [21, 28]
    mid: [25, 35]
    senior: [29, 45]
    staff: [32, 50]
    principal: [35, 58]
    exec: [38, 62]
  ca_clip: [30, 190] # CA points; target CA is clipped to this range (2.1)
  skill_noise_sd: # attribute points; noise around the target for role skills (2.2)
    primary: 1.5
    secondary: 2.0
  secondary_offset: 3.0 # attribute points; secondaries centre this far below target/10 (2.2)
  other_skill_range: [1, 8] # attribute points; non-role skills are Uniform(min, max) (2.2)
  ca_tolerance: 2 # CA points; primaries are rescaled until derived CA is this close to target (2.2)
  pa_gap_mean: # CA points; mean of PA - CA by age band, applies from from_age to the next band (2.4)
    - { from_age: 0, value: 45 }
    - { from_age: 25, value: 30 }
    - { from_age: 30, value: 18 }
    - { from_age: 35, value: 8 }
    - { from_age: 45, value: 2 }
  pa_gap_sd: 15 # CA points; sd of the PA gap before it is floored at 0 (2.4)
  personality_mean: 10.5 # attribute points; mean of each personality and hidden trait (2.5)
  personality_sd: 3.5 # attribute points; sd of each personality and hidden trait (2.5)
  interest_count: [2, 4] # count; interests per person, uniform integer in [min, max] (2.6)
  max_tags: 2 # count; behavior tags assigned per person at most (2.7)
  region_weights: # relative weight; region of a generated candidate (2)
    north_america: 55
    europe: 15
    east_asia: 8
    south_southeast_asia: 10
    latin_america: 6
    africa: 3
    oceania: 3
  retire_bp_per_year_over_60: 600 # bp per month per year of age over 59; retirement roll from M1b (3)
  retire_from_age: 60 # years; retirement rolls start at this age; chance uses (age - (retire_from_age - 1)) (3)
  reveal_tenure_months: 12 # months in your company after which the attributes below show exactly (playtest 3 addendum 13, M15b)
  reveal_tenure_attributes: [leadership, mentoring, communication] # leadership fit's inputs: long-serving staff show a single star value (addendum 13)

payroll:
  salary_round_to_cents: 50000 # cents; salary expectations round to the nearest $500 (2.8)
  benefits_bp: 2000 # bp of monthly salary; benefits posted with payroll (8)
  office_cost_per_head_cents: 60000 # cents per month per staff member, founder included (8)
  severance_months: 1 # months of salary paid when someone is fired (8)

growth: # monthly skill growth and decline (formulas.md section 3)
  rate: 0.12 # attribute points per month; r in the growth formula
  age_factor: # multiplier a(age) on growth, applies from from_age to the next band
    - { from_age: 0, value: 1.3 }
    - { from_age: 25, value: 1.0 }
    - { from_age: 30, value: 0.7 }
    - { from_age: 35, value: 0.4 }
    - { from_age: 45, value: 0.1 }
    - { from_age: 55, value: 0.0 }
  decline: # attribute points per month d(age), subtracted from every skill
    - { from_age: 0, value: 0.0 }
    - { from_age: 50, value: 0.005 }
    - { from_age: 55, value: 0.015 }
  noise_rel_sd: 0.25 # fraction; sd of Normal noise multiplying the growth term, max(0, 1 + noise)

reveal: # revealed ranges (formulas.md section 4, ADR-0007)
  initial_hw: # half-width of a stranger's range
    skill: 5.0 # attribute points
    personality: 7.0 # attribute points
    pa: 66.0 # CA points; a stranger's potential is genuinely unknown (M2b 67; M4c 66, the smallest in 60-120 that holds 13.10's +3 PA target with interview PA strength 0.20)
  strength: # fraction of hw removed per action, before the scout factor
    job_post_screen: 0.20
    network_intro: 0.30
    interview: 0.35
    reference_check: 0.30
    scouting_month: 0.25
    employed_month: 0.08
    public_appearance: 0.04 # M15b: a rival CEO's statement or feud reveals a little (addendum 11)
    rival_approach: 0.12 # M15b: a poach search on the CEO's company reveals more
    rival_diligence: 0.20 # M15b: diligence on the CEO's company reveals the most from outside
  scout_base: 0.5 # scout_factor = scout_base + judgment_of_talent / scout_divisor
  scout_divisor: 40 # attribute points
  founder_pa_hw: 40 # CA points; initial PA half-width of the founding company's view of its founder (M2b, 4-5)
  pa_scout_divisor: 16 # attribute points; PA scout factor = clamp(judgment / pa_scout_divisor, ...) (M2b, 4)
  pa_scout_clamp: [0.1, 1.0] # multiplier [min, max]; bounds of the PA scout factor (M2b, 4)
  pa_strength: # fraction of PA's hw removed per action, before the PA scout factor (M2b, 4; tuned to 13.10)
    job_post_screen: 0.05 # a screen says little about potential
    network_intro: 0.30
    interview: 0.20 # one conversation says a little about potential (0.10 before M4c)
    reference_check: 0.30
    scouting_month: 0.60 # a scouting month is where a good scout earns their keep
    employed_month: 0.08
    public_appearance: 0.0 # M15b: a statement says nothing about potential
    rival_approach: 0.05 # M15b: an approach says a little
    rival_diligence: 0.10 # M15b: diligence says a little more
  pa_phrase_bounds: [70, 100, 130, 160] # CA points; limited/decent/good/excellent/outstanding (M1b)

founder: # founder build (formulas.md section 5)
  skill_base: 5 # attribute points; every skill starts here
  skill_points: 70 # attribute points the player distributes
  skill_cap: 18 # attribute points; no skill may exceed this after background bonuses
  default_age: 28 # years
  age_range: [22, 60] # years; allowed founder ages
  default_region: north_america # regions.yaml key; founder region when none is chosen (name pool)
  energy_per_month: 60 # energy; founder's monthly action budget, reset after phase 12 (6; 100 before M4c)
  energy_cost: # energy spent at once by each action (6)
    interview: 8 # (6 before M4c)
    reference_check: 4 # (3 before M4c)
    job_post: 5 # open a job post search (4 before M4c)
    recruiter: 5 # engage a recruiter (4 before M4c)
    network: 10 # network search
    offer: 0
    create_unit: 2 # create a department or team (M2, section 13.7)
    dissolve_unit: 2 # dissolve a unit; members and child teams move to the parent (M2)
    move_unit: 2 # move a team under a department or the company (M2, section 13.7)
    set_leader: 2 # set, replace or remove a unit's leader (M2)
    move_person: 1 # move a person to another unit (M2)
    set_policy: 1 # set a unit's work-location policy (M2, section 13.9)
    give_raise: 2 # change someone's salary (M2, section 13.8)
    promote: 3 # promote someone one level (M2, section 13.8)
    hiring_plan: 2 # create or change a hiring plan; closing one is free (M2, section 13.10)
    scout_search: 20 # founder scouts every open candidate of one search (M3, section 11.12)
    create_product: 4 # create a product (M3, section 11.2)
    assign_unit: 2 # assign a unit (or the company root) to a product (M3, section 11.3)
    unassign_unit: 2 # take a unit off its product (M3, section 11.3)
    set_price: 1 # set or change one segment's price (M3, section 11.2)
    set_marketing: 1 # set or change a product's monthly marketing budget (M3, section 11.5)
    add_segment: 2 # sell a product into another segment of its category (M3, section 11.2)
    launch_product: 3 # launch a product (M3, section 11.2)
    sunset_product: 3 # sunset a product (M3, section 11.2)
    cancel_product: 3 # cancel a product still in development (M3b, section 11.2)
    raise_safe: 10 # raise money on a SAFE (M4, section 14.4)
    start_round: 15 # start a priced round (M4, section 14.5)
    accept_term_sheet: 5 # accept a term sheet (M4, section 14.5)
    accept_bridge: 5 # accept a bridge SAFE from existing investors (M4, section 14.7)
    name_nominee: 2 # name an employee to an empty common board seat (M4c, section 14.6)
    poach_search: 10 # open a "Poach from a rival" search (M5, section 15.6)
    choose_event: 0 # answer an event (M6, section 16.3)
    appoint_executive: 5 # appoint an executive to a seat (M8, section 18.3)
    remove_executive: 5 # remove an executive from a seat (M8, section 18.3)
    set_product_division: 1 # set the division a product belongs to (M8, section 18.1)
    set_shared_services: 2 # set a division's shared services, central or embedded (M8, section 18.4)

# --- Hiring (formulas.md section 7) -----------------------------------------------------
hiring:
  hint_bands: [-0.3, 0.3] # score; below the first: unlikely, above the second: likely
  channel: # candidate batch size [min, max] and level mix (percent) per channel
    network:
      size: [2, 4] # candidates per batch
      sociability_bonus: 1 # extra candidates when the actor's sociability is high enough
      sociability_threshold: 15 # attribute points; actor sociability needed for the bonus
      level_mix: { junior: 30, mid: 40, senior: 25, staff: 5 }
      knowledge: [network_intro] # knowledge actions applied to each new candidate
    job_post:
      size: [6, 10]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 45, mid: 40, senior: 13, staff: 2 }
      knowledge: [job_post_screen]
    recruiter:
      size: [4, 6]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 10, mid: 35, senior: 40, staff: 15 }
      knowledge: [job_post_screen, job_post_screen]
  job_post_cost_cents: 50000 # cents per month while a job post is open; also the cash needed to open one
  recruiter_fee_bp: 2000 # bp of annual salary, charged when a recruiter candidate is hired
  candidate_shelf_turns: 3 # turns a candidate stays available after their batch arrives
  lowball_ratio: 0.85 # ratio; offers below this share of the expectation are always declined
  max_offer_equity_bp: 200 # bp; most equity one offer may carry
  relocation_cents: 1500000 # cents; added to a hire's cost when the candidate relocates to the search's city (M9, 19.3)
  pitch_per_recruiting: 0.3 # score per 10 points of the offer maker's recruiting above neutral (M2, 7)
  pitch_neutral: 10 # attribute points; recruiting at which the pitch term is 0 (M2, 7)
  offer: # acceptance score and probability (7)
    w_salary: 4.0 # score per unit of (offer / expectation - 1)
    w_equity: 1.0 # weight on equity value
    w_fit: 0.5 # score per mission interest the candidate shares
    w_risk: 1.0 # score per unit of (10 - risk_appetite) / 10, subtracted
    ambition_equity_boost: 1.5 # multiplier on w_equity when ambition is above the threshold
    ambition_boost_above: 15 # attribute points; ambition must exceed this for the boost
    equity_value_per_bp: 0.002 # score per bp of equity before the stage multiplier
    stage_appeal: { 0: -0.5, 1: 0.0, 2: 0.5, 3: 1.0 } # score by company stage
    stage_equity_mult: { 0: 1.0, 1: 0.8, 2: 0.5, 3: 0.3 } # multiplier on equity value by stage
    k: 3.0 # logistic steepness
    threshold: 0.0 # score at which acceptance is 50%

# --- Morale (formulas.md section 9) -----------------------------------------------------
morale:
  new_hire: 65 # morale points; starting morale for a new hire
  target_base: 56 # morale points; target = target_base + pay + fit + runway + workload (M10d: 50 -> 56 for a median employee at 58-68)
  pay_slope: 60 # morale points per unit of (salary / market mid - 1)
  pay_min: -20 # morale points; floor of the pay term
  pay_max: 15 # morale points; ceiling of the pay term
  fit_per_interest: 5 # morale points per shared mission interest
  work_style_mismatch: -5 # morale points when work style differs from the role's style
  runway_warn_months: 6 # months; runway below this costs runway_warn
  runway_crit_months: 3 # months; runway below this (or cash <= 0) costs runway_crit
  runway_warn: -10 # morale points
  runway_crit: -20 # morale points
  workload_term: 0 # morale points; placeholder until projects (M3)
  rate: 0.3 # fraction of the gap to target closed each month
  noise_scale: 2.0 # morale points; noise sd = noise_scale x (21 - temperament) / 20
  fire_penalty: -3 # morale points to everyone remaining when someone is fired
  fire_penalty_culture_carrier: -6 # morale points instead, if the fired person is a culture carrier

# --- Resignations and tag reveals (formulas.md section 10) ------------------------------
resign:
  base_bp: 80 # bp per month before modifiers (M7a: 50 -> 80 for 10-25% of staff leaving a year, docs/balance-targets.md T6)
  cap_bp: 2000 # bp per month at most
  morale_floor: 50 # morale points; below this the chance rises (M10d: 40 -> 50 with morale.target_base 56: the floor stays about 10 below the median employee, so underpaid misfits still leave more)
  morale_divisor: 20 # morale points per +100% chance below the floor
  loyalty_divisor: 10 # loyalty term (21 - loyalty) / loyalty_divisor
  job_hopper_mult: 2.0 # multiplier for the job_hopper tag

tags:
  reveal_bp_per_month: 500 # bp per hidden tag per month for employees
  reveal_bp_on_check: 1500 # bp per hidden tag on an interview or reference check

# --- Organization (formulas.md section 13, M2) -----------------------------------------
org:
  department_unlock_headcount: 10 # people on staff (founder included) before departments unlock (13.1)
  span_base: 5 # reports; span limit L = span_base + floor(leadership / span_per_leadership) (13.2)
  span_per_leadership: 4 # attribute points of leadership per extra report in L (13.2)
  manager_morale_slope: 0.8 # morale points per point of manager quality above 10 (13.4)
  manager_morale_cap: 8 # morale points; W_mgr is clamped to [-cap, +cap] (13.4)
  manager_label_bands: [-2, 2] # morale points of W_mgr; at or below: "stretched", at or above: "strong", between: "fine" (M2b display)
  mentoring_neutral: 5 # attribute points; mentoring x S + bonus at which growth is unchanged (13.5)
  mentoring_divisor: 20 # attribute points per +100% growth in M_growth (13.5)
  mentor_tag_bonus: 3 # attribute points added when another member of the unit is a mentor (13.5)
  growth_mult_min: 0.75 # multiplier; floor of M_growth (13.5)
  growth_mult_max: 1.5 # multiplier; ceiling of M_growth (13.5)
  tag_morale: # morale points each holder adds to every other member's morale target (13.6; from M6 credit_taker and toxic_high_performer act through relationships, 16.7)
    culture_carrier: 2
  tag_morale_cap: # morale points; the sum per tag is capped at this (same sign as the effect) (13.6)
    culture_carrier: 2
  reorg: # one-off morale points (13.7)
    move: -2 # the person moved to another unit
    new_leader_members: -1 # each other member when a unit's leader is set or replaced
    replaced_leader: -5 # a replaced or removed leader who stays in the unit
    dissolve_members: -2 # each member of a dissolved unit
  raise_morale: 3 # morale points, once, for a raise of at least raise_threshold_bp (13.8)
  raise_threshold_bp: 500 # bp; a raise this large or larger earns raise_morale (13.8)
  raise_cooldown_turns: 12 # turns; raise_morale is given at most once in this many turns per person (13.8)
  pay_cut_morale: -10 # morale points, once, for any pay cut (13.8)
  promote_morale: 5 # morale points, once, for a promotion (13.8)
  remote: # work-location policy morale terms (13.9)
    sociable_at: 14 # attribute points; sociability at or above this dislikes remote work
    sociable_morale: -3 # morale points for a sociable remote worker
    solitary_at: 7 # attribute points; sociability at or below this prefers remote work
    solitary_morale: 2 # morale points for a solitary remote worker
  # M8 (formulas.md 18.1-18.4): divisions, coordination cost, support staff
  division_stage: 3 # company stage from which divisions, seats and support rules apply (18)
  max_divisions: 6 # division units a company may have at once (18.1)
  layer_tax: 0.03 # fraction of output lost per layer below depth layer_free_depth (tau, 18.2)
  layer_floor: 0.85 # multiplier; the layer tax never takes output below this (18.2)
  layer_free_depth: 2 # depth (root 0, division 1, department 2, team 3) with no layer tax (18.2)
  cross_division_factor: 0.90 # multiplier on a product's output when its units sit in two or more divisions (18.2)
  support_ratio: 15 # staff per support employee needed for full coverage (rho, 18.4)
  support_shortfall: 0.15 # fraction of output lost at zero coverage (18.4)
  support_morale: -6 # morale points at zero coverage, scaled by (1 - c) ("Admin and support", 18.4)
  embedded_bonus: 1.05 # multiplier on builder output and seller capacity in an embedded division (18.4)
  support_churn: 0.4 # base churn of a pool's products x (1 + support_churn (1 - c) k_COO); delegate energy x c (18.4)

delegates: # delegated hiring (formulas.md section 13.10, ADR-0015)
  energy_per_month: 100 # energy; each delegate's monthly budget, reset with the founder's
  scout_cost: 20 # energy; one scouting pass over a plan's candidates; also the reserve kept back while interviewing
  max_ratio_bp: 12000 # bp of the ask; highest salary ratio a plan may offer (1.2x)

# --- Products and markets (formulas.md section 11, M3) -------------------------------------
# Category, segment and incumbent values are data: categories.yaml and incumbents.yaml.
products:
  start_quality: 10 # quality points; a new product's quality (11.2)
  launch_min_quality: 25 # quality points; launch needs at least this quality (11.2)
  launch_min_feature: 30 # feature-score points; launch needs at least this feature score (11.2)
  morale_factor_base: 0.7 # multiplier; m = base + slope x morale / 100 (morale 50 gives 1.0) (11.3)
  morale_factor_slope: 0.6 # multiplier per 100 morale points (11.3)
  coord_free_builders: 5 # builders; coordination cost starts above this many builders on a product (11.3)
  coord_per_builder: 0.02 # fraction of output lost per builder above the free number (11.3)
  coord_floor: 0.6 # multiplier; coordination factor never drops below this (11.3)
  dev_noise_sd: 0.15 # multiplier sd of monthly development noise (stream product_dev) (11.3)
  maverick_noise_sd: 0.10 # multiplier sd added per maverick builder (11.3, 11.10)
  dev_noise_sd_cap: 0.40 # multiplier sd; development noise sd is capped here (11.3)
  seller_rate: # new customers a month per seller at sell 10 and morale factor 1, sales segments only (11.3)
    mid_market: 2
    enterprise: 0.3
    hyperscalers: 0.03 # M12a (22.3): the hyperscalers segment is sales-led
    device_oems: 0.1 # M12b (26.2, 26.3): device OEMs are sales-led
  marketer_mk: 5 # marketing points per unit of marketer contribution mu (11.5)
  budget_mk_unit_cents: 100000 # cents of monthly budget per marketing point ($1,000) (11.5)
  qcap_per_skill: 5 # quality points of Q_cap per point of output-weighted development skill (11.4)
  quality_rate: 0.15 # fraction of the gap to Q_cap closed per month at full speed (11.4)
  overcap_decay: 0.01 # fraction per month quality falls while above Q_cap, not below Q_cap (11.4)
  rot_threshold: 0.25 # fraction of scope; output below this counts as no team (11.4)
  rot_per_month: 0.5 # quality points lost per month with no team (11.4)
  brand_rate: 0.10 # fraction of the gap to target brand closed per month (11.5)
  tag: # output multiplier t_i for builders holding a true tag (11.10)
    quiet_genius: { output: 1.25 }
    toxic_high_performer: { output: 1.20 }
    perfectionist: { output: 0.85 }
    maverick: { output: 1.10 }
  perfectionist_qcap_bonus: 3 # attribute points added to a perfectionist's d in Q_cap, capped at 20 (11.10)
  pace_bands: [0.4, 0.75] # fraction of scope min(1, o / sigma): below the first slow, from the second fast (11.13)
  arr_milestones_cents: [10000000, 100000000, 1000000000] # cents; inbox note when ARR first reaches $100k, $1M, $10M (M3a brief)
  growth_label_months: 6 # months of customer trend behind the Growth / Mature display label (11.2, display only)
  growth_label_rate: 0.05 # fraction per month; customers rising faster than this over that window shows "Growth" (11.2)

market:
  gamma: 3 # exponent on appeal in the choice share (11.7)
  awareness_floor: 5 # brand points; awareness uses at least this brand (11.7)
  awareness_scale: 0.5 # fraction; awareness = scale x max(brand, floor) / 100 (11.7)
  demand_noise_sd: 0.05 # multiplier sd of monthly in-play noise (stream market) (11.7)
  gap_divisor: 50 # appeal points per +100% churn below the best product (11.7)
  low_quality_at: 40 # quality points; below this, churn is multiplied (11.7)
  low_quality_churn_mult: 1.5 # multiplier on churn below low_quality_at (11.7)
  sunset_churn_mult: 3 # multiplier on churn for a sunset product (11.2, 11.7)

stages:
  arr_cents: # cents of ARR that put a company in a stage; stages only rise (11.11)
    2: 100000000 # $1M ARR: venture-backed
    3: 2000000000 # $20M ARR: scale-up
  funding: # a closed priced round of this series also puts a company at stage 1 or above in the stage (14.8)
    2: seed
    3: b

# --- Finance (formulas.md section 14, ADR-0018) ------------------------------------------
finance:
  initial_fd_shares: 10000000 # shares; fully diluted shares at game start (14.2)
  pool_target_bp: 1000 # bp of post-money FD; the unallocated pool after every priced round (14.5)
  vesting_months: 48 # months over which options vest (14.2)
  cliff_months: 12 # months before anything vests (14.2)
  retention_slope: 0.5 # resignation multiplier falls by this per unit of unvested value / salary (14.2)
  retention_floor: 0.5 # lowest resignation multiplier from unvested options (14.2)
  growth_window_months: 6 # months behind g_6; the ratio is annualized with exponent 12 / this (14.3)
  new_revenue_growth: 3 # g_6 when MRR six months ago was 0 and is now positive (14.3)
  multiple_base: 2.5 # ARR multiple at zero growth (14.3)
  multiple_per_growth: 5.5 # ARR multiple added per unit of annual growth g_6 (14.3)
  multiple_min: 3 # lowest ARR multiple before the climate (14.3)
  multiple_max: 20 # highest ARR multiple before the climate (14.3)
  floor_cents: # cents; the value floor for a young company (14.3)
    no_product: 200000000 # $2M without a live product
    live: 400000000 # $4M with a live product
  floor_per_head_cents: 10000000 # cents added to the floor per person on staff (14.3)
  floor_head_cap: 30 # people; headcount counted in the floor at most (14.3)
  safe:
    min_cents: 2500000 # cents; smallest SAFE raise, $25,000 (14.4)
    max_cents: 200000000 # cents; largest SAFE raise, $2M (14.4)
    optimism: 1.2 # multiplier on V_base; a cap at this times V_base fills half the time (14.4)
    steepness: 6 # slope of the SAFE acceptance logistic (14.4)
    fee_cents: 200000 # cents; legal fee on a SAFE that fills, $2,000 (14.4)
    hint_bands: [0.9, 1.15] # optimism x V_base / cap: below the first unlikely, from the second likely (14.9)
    max_fraction: 0.5 # fraction; outstanding SAFEs may claim less than this share of the company (keeps the 14.5 close defined)
  round:
    open_turns: 3 # turns a priced round stays open, counting the turn it starts (14.5)
    valuation_noise_sd: 0.15 # sd of the log noise on each firm's quoted pre-money (14.5)
    max_amount_of_pre: 0.5 # fraction; a firm invests at most this share of its quoted pre-money (14.5)
    max_response: 0.95 # probability; cap on a firm's response x climate (14.5)
    gate_arr_cents: # cents of ARR a series needs, besides the previous round (14.5; c and d from M10, 20.2)
      a: 100000000 # $1M
      b: 500000000 # $5M
      c: 2500000000 # $25M (M10, 20.2)
      d: 6000000000 # $60M (M10, 20.2)
    fee_min_cents: 1500000 # cents; smallest legal fee on a priced round, $15,000 (14.5)
    fee_bp: 50 # bp of the amount raised; legal fee on a priced round (14.5)
    typical_cents: # cents [min, max]; the typical raise per series, shown as guidance only (14.5)
      seed: [100000000, 300000000]
      a: [300000000, 1000000000]
      b: [1000000000, 3000000000]
      c: [3000000000, 8000000000] # $30M-$80M (M10, 20.2)
      d: [6000000000, 20000000000] # $60M-$200M (M10, 20.2)
    heat_max: 3 # multiplier; a Series A or B's response x climate is also x clamp(ARR / gate, 1, this) (14.5, M4c)
    heat_seed_live: 1.5 # multiplier; a seed's heat with a live product, else 1 (14.5, M4c)

board:
  start: 70 # confidence of a new director (14.6)
  rate: 0.2 # fraction of the gap to the target closed each month (14.6)
  target_base: 50 # confidence target before the growth, runway and patience terms (14.6)
  growth_weight: 20 # points for growth from half to double the expectation (14.6)
  expected_growth: # annual MRR growth expected after the last priced round (14.6; c and d from M10)
    seed: 2.0
    a: 1.5
    b: 1.0
    c: 0.8 # M10: growth investors expect less than a Series B board, still more than the market
    d: 0.6
  runway_terms: # months of runway from the top: points added to the target (14.6)
    - { min_months: 12, points: 10 }
    - { min_months: 6, points: 0 }
    - { min_months: 3, points: -15 }
    - { min_months: 0, points: -30 }
  no_product_penalty: -20 # points while revenue history is short, once this long after the last round with no live product (14.6)
  no_product_after_turns: 12 # turns after the last priced round (14.6)
  down_round_hit: -15 # points off every director's confidence, once, on a down round (14.6)
  warning_below: 40 # average confidence below this brings a formal warning at a board meeting (14.6)
  removal_below: 25 # a director below this for removal_months votes to remove the founder (14.6)
  removal_months: 3 # consecutive months (14.6)
  meeting_months: [3, 6, 9, 12] # calendar months whose month end has a board meeting (14.6)
  history_months: 6 # month ends of each director's confidence kept for the Board tab's trend (M4b)
  trend_points: 2 # confidence points over that history that read as rising or slipping, not steady (M4b)
  seats: # board seats after each series (14.6)
    seed: { common: 1, investor: 1, independent: 0 }
    a: { common: 2, investor: 2, independent: 0 }
    b: { common: 2, investor: 3, independent: 1 }
    c: { common: 2, investor: 4, independent: 1 } # M10 (20.2): the lead's seat; 7 seats, the most a board has
    d: { common: 2, investor: 4, independent: 1 } # M10 (20.2): a full board; the Series D lead takes no seat
  max_seats: 7 # seats; the most a board has, the founder's included (M10, 20.2)
  director_role: operations_manager # roles.yaml key used only to generate directors' skills (not employees)
  director_level: exec # level used to generate directors

bankruptcy:
  months: 3 # consecutive month ends with negative cash after phase 7 that end the game (14.7)
  bridge_burn_months: 3 # bridge amount in months of the projected net burn when accepted, plus any deficit (14.7, M4b)
  bridge_cap_of_post: 0.8 # bridge post-money cap as a fraction of the last post-money valuation (14.7)
  bridge_min_confidence: 40 # average board confidence needed for existing investors to offer a bridge (14.7)
  bridge_open_turns: 2 # turns a bridge offer stays open after it is made (14.7)

# --- Rivals (formulas.md section 15, M5) -------------------------------------------------
rivals:
  act_threshold: 0.5 # utility; a rival acts only if its best action scores at least this (15.3)
  noise_sd: 0.1 # utility; sd of Normal noise added to each action's utility (15.3)
  cooldown_turns: 6 # turns; the same action on the same product and segment waits this long (15.3)
  push_turns: 6 # turns; how long a feature, quality or brand push (and a cost cut's drag) runs (15.2-15.3)
  window_turns: 6 # turns; share changes are measured over this window (15.3)
  need: # divisors in each action's need, clamped to 0-1 (15.3)
    price_cut_drop: 0.05 # share of served customers lost over the window for need 1
    price_rise_lead: 5 # appeal points of lead below which a rise has no need
    price_rise_span: 10 # appeal points of lead above price_rise_lead for need 1
    feature_gap: 15 # feature-score points behind the best for need 1
    quality_gap: 15 # quality points behind the best for need 1
    brand_gap: 30 # brand points behind the best for need 1
    enter_unserved: 0.4 # unserved / D needed to consider entering a segment
    enter_span: 0.4 # unserved / D above enter_unserved for need 1
    enter_cash_months: 12 # months of costs in cash needed to enter a segment
    cut_costs_months: 12 # months of costs in cash below which cutting costs is needed
    cut_costs_span: 6 # months below cut_costs_months for need 1
    poach_gain: 0.007 # share points the player gained over the window for need 1
  weights: # personality weight on each action's need (15.3)
    aggressive: { price_cut: 1.3, price_rise: 0.6, feature_push: 1.2, quality_push: 0.9, brand_push: 1.1, enter_segment: 1.3, cut_costs: 0.9, poach: 1.4 }
    fast_follower: { price_cut: 1.0, price_rise: 0.8, feature_push: 1.3, quality_push: 1.0, brand_push: 0.9, enter_segment: 1.0, cut_costs: 1.0, poach: 1.0 }
    premium: { price_cut: 0.6, price_rise: 1.2, feature_push: 1.0, quality_push: 1.3, brand_push: 1.2, enter_segment: 0.8, cut_costs: 1.0, poach: 0.9 }
    cost_leader: { price_cut: 1.4, price_rise: 0.5, feature_push: 0.9, quality_push: 0.8, brand_push: 0.8, enter_segment: 1.1, cut_costs: 1.2, poach: 0.8 }
  price_factor: { aggressive: 0.9, fast_follower: 1.0, premium: 1.3, cost_leader: 0.7 } # multiplier on p_ref when entering a segment (15.3)
  price_cut: 0.90 # multiplier on price for a price cut (15.3)
  price_rise: 1.05 # multiplier on price for a price rise (15.3)
  push_pool_growth: 0.10 # fraction added to the builder pool by a feature or quality push (15.3)
  brand_push_marketing: 0.50 # fraction added to marketing during a brand push (15.3)
  cut_costs_pools: 0.15 # fraction cut from every pool by a cost cut (15.3)
  cut_costs_marketing: 0.30 # fraction cut from marketing by a cost cut (15.3)
  feature_push_rate: 1.0 # feature-score points a month during a feature push (15.2)
  quality_push_rate: 1.0 # quality points a month toward 5 d during a quality push (15.2)
  brand_push_rate: 1.0 # brand points a month during a brand push (15.2)
  cut_costs_drag: 0.5 # feature-score and brand points lost a month for push_turns after a cost cut (15.2)
  qcap_per_skill: 5 # quality points of the push target per point of builder skill d (15.2)
  function_mix: # fraction of an incumbent's pool budget per function, by category (15.1)
    b2b_saas: { builder: 0.45, seller: 0.40, marketer: 0.15 }
    cybersecurity: { builder: 0.45, seller: 0.40, marketer: 0.15 }
    dev_tools: { builder: 0.70, seller: 0.15, marketer: 0.15 }
    consumer_apps: { builder: 0.75, seller: 0.0, marketer: 0.25 }
    fintech: { builder: 0.50, seller: 0.30, marketer: 0.20 } # M8 (18.6)
    ai_models: { builder: 0.75, seller: 0.10, marketer: 0.15 } # M8 (18.6)
    cloud_hosting: { builder: 0.45, seller: 0.40, marketer: 0.15 } # M12a (22.3)
    devices: { builder: 0.65, seller: 0.15, marketer: 0.20 } # M12b (26.1)
    servers: { builder: 0.60, seller: 0.30, marketer: 0.10 } # M12b (26.1)
    chips_mobile_soc: { builder: 0.75, seller: 0.20, marketer: 0.05 } # M12b (26.3)
    chips_server_cpu: { builder: 0.75, seller: 0.20, marketer: 0.05 } # M12b (26.3)
    chips_ai_accelerator: { builder: 0.75, seller: 0.20, marketer: 0.05 } # M12b (26.3)
    contract_manufacturing: { builder: 0.70, seller: 0.25, marketer: 0.05 } # M12b (26.2)
  function_roles: { builder: software_engineer, seller: account_executive, marketer: marketer } # roles.yaml key whose mid-level pay prices each pool (15.1)
  pool_morale: 60 # morale points of every pool (15.1)
  pool_skill_other: 12 # attribute points; seller and marketer pool skill (15.1)
  start_marketing_share: 0.08 # fraction of each product's revenue spent on marketing at start (15.1)
  key_people: 8 # generated individuals per incumbent, included in its headcount (15.1)
  key_people_levels: { senior: 50, staff: 35, principal: 15 } # percent level mix of key people (15.1: senior to principal)
  free_agent_months: 6 # months a failed rival's people stay in the free-agent pool for the player's searches (M6 sub-task 0)
  startup:
    found_rate: 0.03 # probability per category per month before climate and growth (15.4; M7a: 0.02 -> 0.03, keeps M5 target 1 at one launch per category now that fewer startups refinance)
    max_alive: 8 # rival startups alive at once (15.4)
    team: [3, 8] # individual employees besides the founder (15.4)
    cash_cents: [100000000, 300000000] # cents [min, max] of starting cash (15.4)
    raise_months: 12 # months of costs raised when funding comes (15.4; M7a: 18 -> 12, T7)
    raise_chance: 0.18 # probability per quarter before climate (15.4; M7a: 0.6 -> 0.25 so 20-60% of startups survive five years, T7; M8: 0.25 -> 0.18, six categories spread the startup cap thinner)
    low_cash_months: 6 # months of costs in cash below which a startup tries to raise (15.4)
    salary_mult: 1.0 # multiplier on market rate for startup salaries (15.4)
    personalities: [aggressive, fast_follower, cost_leader] # 15.4: any but premium
    start_feature_share: 0.3 # fraction of the features the category's market expectation gained since January 2010 (F_exp(t) - F0, 11.4) a new startup's product starts with (M15a, 30.7 V5: from 0, late founders never reached the 30% launch bar; product manager 2026-11-07: 0.3, with M8 18.9 target 5's bound 1.2 -> 1.14)
    small_staff: 3 # people; a rival startup below this many is small (M15a, 30.7 V5; product manager 2026-11-07)
    small_months: 24 # consecutive month ends small before it closes, shut down or acqui-hired (M15a, 30.7 V5): long-lived tiny startups held every max_alive place
  poach:
    offer_mult: 1.0 # multiplier on market rate a rival offers the player's employee (15.6)
    top_fraction: 0.30 # top share of the player's staff by CA a rival may approach (15.6)
    seat_holder_weight: 0.4 # M10d (product manager, 2026-11-02): an executive-seat holder's weight in the target draw (x CA); executives are better paid and harder to reach (15.6)
    ask_mult: 1.3 # multiplier on current salary a poached key person asks (15.6)
    leave_penalty: -0.3 # offer-score points for leaving an employer (15.6)
    key_builder_quality_hit: 2 # quality points each of the rival's products loses over push_turns when a key builder leaves (15.6)
    bands: [0.20, 0.50] # probability; below: likely to stay, above: likely to go, between: might go (15.6)
    candidates: [2, 4] # key people shown per poach search (15.6)
    salary_weight: 4 # score per unit of (R - 1) in s (15.6)
    morale_mid: 55 # morale points in s = 4 (R - 1) + (55 - morale) / 20 - (loyalty - 10) / 10 - 2u (15.6)
    morale_divisor: 20
    loyalty_mid: 10
    loyalty_divisor: 10
    options_weight: 2
    steepness: 2 # p = 1 / (1 + e^(-steepness s)) (15.6)
  money_bands_months: [12, 36] # months of costs in cash: below tight, from the second deep pockets (15.5)
  stance_turns: 6 # turns: a rival that acted in a player segment this recently is "responding" (15.5)
  headcount_round: 10 # people; estimated headcounts above 100 are rounded to this (15.5)
  headcount_round_above: 100

events: # event director, effect caps, storylines (formulas.md 16; ADR-0005, ADR-0011)
  count_weights: [0.08, 0.40, 0.38, 0.14] # probability of 0, 1, 2, 3 events a month (16.1; tuned in M6.9 from [0.15, 0.50, 0.28, 0.07])
  category_repeat_factor: 0.5 # weight multiplier for a category used last month (16.1)
  template_cooldown_turns: 12 # months before the same template may run again (16.1; tuned in M6.9 from 24)
  person_cooldown_turns: 4 # months before an event may name the same person again (16.1; tuned in M6.9 from 6)
  critical_gap_turns: 6 # at most one critical event in any this many months (16.1)
  major_from: 0.5 # trigger strength from which an event is major, below it minor (16.1)
  light_tone_chance_bp: 1000 # bp chance an event asks for a light or satirical touch (ADR-0011)
  max_storylines: 3 # storylines active at once (16.6)
  summary_words: 60 # words in a storyline summary (16.6)
  body_words: 180 # words in an event body (16.5)
  recent_summaries: 10 # past event summaries passed to the LLM (16.5)
  trigger: # when each trigger holds and how strong it is (16.2); strengths are clamped to 0..1
    low_morale: { below: 35, span: 20 } # morale points: (below - morale) / span
    unhappy_unit: { below: 45, span: 15 } # unit average morale points
    underpaid: { below: 0.95, span: 0.2 } # salary / market mid (tuned in M6.9 from 0.9)
    star_performer: { top_fraction: 0.30, tenure_months: 12, strength: 0.4 } # top share of employees by CA (tuned in M6.9 from 0.10)
    team_clash: { at_most: -25, span: 30 } # relationship points: (at_most - rel) / span (tuned in M6.9 from -50)
    team_bond: { at_least: 30, strength: 0.3 } # relationship points (tuned in M6.9 from 60)
    office_politics: { unit_size: 4, strength: 0.6 } # people in the politician's unit
    tag_noticed: { strength: 0.5 }
    anniversary: { strength: 0.2 }
    product_launched: { strength: 0.5 }
    product_slipping: { strength: 0.6 }
    price_war: { strength: 0.6 }
    rival_move: { strength: 0.3 }
    poached: { strength: 0.8 }
    customer_milestone: { strength: 0.4 }
    runway_short: { months: [6, 3], strength: [0.6, 1.0] } # runway months; below the second, critical is allowed
    funding_closed: { strength: 0.5 }
    board_unhappy: { below: 50, span: 15 } # average board confidence points (tuned in M6.9 from 40)
    early_days: { strength: 0.4 } # no live product yet: the founder's early-days templates (M7a, E3 in docs/balance-targets.md)
    quiet_month: { strength: 0.2 }
    # M10c (24.3): an executive with authority asks for something; two executives clash
    exec_cto: { strength: 0.3 } # the CTO wants a research budget
    exec_cro: { strength: 0.3 } # the CRO wants a price change
    exec_cmo: { strength: 0.3 } # the CMO proposes a campaign
    exec_cfo: { strength: 0.4 } # the CFO warns about runway (runway below the CFO's threshold)
    exec_clash: { at_most: -10, span: 30 } # relationship points between two seat holders: (at_most - rel) / span
    research_breakthrough: { strength: 0.7 } # M11 (21.3): a project's breakthrough this month
    research_dead_end: { strength: 0.6 } # M11 (21.3): a project's dead end this month
  caps: # largest effect per choice by severity [minor, major, critical] (16.3)
    morale_delta: [3, 10, 20] # morale points (minor tuned in M6.9 from 5)
    relationship_delta: [10, 20, 40] # relationship points
    cash_delta: [100, 300, 1000] # bp of max(cash, cash_revenue_months x monthly revenue); gains up to cash_gain_share of it
    brand_delta: [2, 5, 10] # brand points
    quality_delta: [1, 3, 6] # quality points
    customers_pct: [1, 3, 8] # percent of the product's customers in the segment
    growth_boost: [0.2, 0.5, 1.0] # skill points, once
    energy_delta: [5, 10, 15] # founder energy next month
    board_confidence: [3, 6, 12] # confidence points for every director
    salary_change: [5, 10, 15] # percent raise, never a cut
    modifier: [5, 10, 20] # percent change to a stat each month while it runs (23.2, M10b)
  modifier_months: [6, 12, 12] # months; the longest a modifier runs, by severity (23.2)
  crisis: # critical events from crises (23.3, M10b); draws on the events stream, own keys
    key_exit_top_fraction: 0.20 # share of staff by current ability whose exit is a crisis
    breach_chance: 0.008 # a month, x (1 - security coverage), per qualifying live product
    breach_min_customers: 1000 # customers a product needs before a breach is news
    security_full_at: 15 # mean security skill of the product team that gives full coverage
    outage_chance: 0.006 # a month, per qualifying live product
    outage_max_quality: 45 # quality below which a busy product can go down
    outage_min_customers: 5000 # customers a product needs before an outage is a crisis
  cash_revenue_months: 3 # months of revenue in the cash cap base (16.3)
  cash_gain_share: 0.5 # gains reach at most this share of the cost cap (16.3)
  effect_size_bounds: [0.34, 0.67] # share of the cap: up to the first "small", above the second "large" (16.9)

relationships: # pairs of unit-mates and manager links (formulas.md 16.7)
  start_base: 15 # points: start = round(start_base - start_per_temperament x |temperament difference|)
  start_per_temperament: 1.5 # points per temperament point of difference
  start_clamp: [-20, 15] # points
  drift: 0.10 # fraction of the way back to the start value each month
  tag_push: { credit_taker: -3, toxic_high_performer: -4, culture_carrier: 2, politician: -3 } # points a month with each unit-mate
  politician_ambition_at: 14 # a politician pushes only unit-mates with ambition at least this
  morale_weight: 0.1 # morale points per relationship point (W_rel)
  morale_cap: 5 # W_rel is clamped to plus or minus this
  label_bounds: [-50, -20, 20, 60] # hostile at or below the first; strained below the second; close from the last
  range: [-100, 100] # relationships stay in this range

# --- Executive seats (formulas.md 18.3, M8) ----------------------------------------------
exec_seats:
  stage: 3 # company stage from which seats can be filled and vacant seats cost (18.3)
  min_level: senior # lowest level a seat holder may have (18.3)
  score_mid: 10 # attribute points; seat score s at which the effect e is 0: e = (s - mid) / span
  score_span: 8 # attribute points of s per unit of e
  effect_min: -0.5 # lowest e from a holder (18.3)
  effect_max: 1.0 # highest e (18.3)
  vacant_effect: -0.5 # e of a vacant seat at stage 3 or later (18.3)
  appoint_morale: 5 # morale points, once, for the appointee (18.3)
  remove_morale: -10 # morale points, once, for a removed executive (18.3)
  fit_bands: [11, 14] # displayed seat score: below the first "weak fit", from the second "strong fit", else "fair fit" (18.8)
  seats: # skill weights of s (sum to 1) and coefficients per unit of e (18.3): effect is the first effect;
    # qcap (CTO, Q_cap), churn (CPO, base churn down), brand (CMO, B*), awareness (CMO), pricing (CRO, p_ref in sales segments)
    coo: { label: COO, effect: 0.5, weights: { operations: 0.35, leadership: 0.25, strategy: 0.20, communication: 0.20 } } # k_COO = 1 - effect x e
    cfo: { label: CFO, effect: 0.08, confidence: 0.5, weights: { finance: 0.45, strategy: 0.20, negotiation: 0.20, communication: 0.15 } } # V_base x (1 + effect e); director confidence + confidence x e a month
    cto: { label: CTO, effect: 0.10, qcap: 0.10, weights: { software_engineering: 0.25, infrastructure: 0.15, ml_research: 0.10, leadership: 0.25, strategy: 0.25 } } # builder output and Q_cap x (1 + 0.10 e)
    cpo: { label: CPO, effect: 0.15, churn: 0.15, weights: { product: 0.45, design: 0.15, strategy: 0.20, leadership: 0.20 } } # feature points gained x (1 + 0.15 e); base churn x (1 - 0.15 e)
    cmo: { label: CMO, effect: 0.20, brand: 0.10, awareness: 0.20, weights: { marketing: 0.45, communication: 0.20, strategy: 0.20, leadership: 0.15 } } # marketing points x (1 + 0.20 e); B* x (1 + 0.10 e); awareness x (1 + 0.20 e)
    cro: { label: CRO, effect: 0.20, pricing: 0.10, weights: { sales: 0.40, negotiation: 0.25, leadership: 0.20, communication: 0.15 } } # seller capacity x (1 + 0.20 e); p_ref x (1 + 0.10 e) in sales segments

exec_authority: # executives with authority (formulas.md 24, M10c)
  change_energy: 2 # founder energy to give, change or withdraw one seat's authority (24.1)
  energy_per_month: 100 # an executive's own energy a month for acting (24.1)
  quality: { base: 0.55, per_score: 0.03, min: 0.6, max: 0.98 } # P(the right rule) = clamp(base + per_score x s, min, max), s the true seat score (24.2)
  mistake_budget_off: 0.20 # a mistaken budget split is off by this fraction (24.2)
  report_months: 3 # a quarterly report from each seat holder (24.3)
  plan_hires: 2 # people one hiring plan opened by an executive asks for at most
  memory_months: 12 # months of decisions kept for reports and the panel
  move_margin: 1.25 # a product gives up a builder only above this x its full speed (CTO)
  price_step_pct: 5 # % the CRO moves a sales-led price in one month, within its band
  lease_seats: 25 # seats in a lease the COO proposes
  repay_share: 0.5 # share of the cash above the cash threshold the CFO repays early
  loan_share: 0.5 # share of the limit the CFO proposes to borrow
  defaults: # guardrails a seat starts with when given authority (24.1); the player changes them
    cto: { headcount_cap: 30, max_salary_ratio_bp: 11000, protected_units: [] } # builders; offer x ask in bp
    cro: { headcount_cap: 20, price_band_pct: 10, max_salary_ratio_bp: 11000 } # sellers; +- % of the player's last price
    cmo: { marketing_pct_of_revenue: 15 } # % of last month's revenue spent on marketing in total
    coo: { coverage_target: 1.0, lease_approval_rent_cents: 0, max_salary_ratio_bp: 11000 } # support coverage; rent above which a lease is only proposed
    cfo: { runway_months: 9, repay_above_months: 24 } # months of burn: propose a round or loan below the first; repay debt early with cash above the second
    cpo: { headcount_cap: 12, categories: [], protected_products: [] } # M13b (27.1): builders a new product's team may total; category keys it may enter ([] = any); product ids it may not sunset

pitch: # executives' pitches: big moves they propose for the founder to approve (formulas.md 27.1, M13b)
  base: 0.15 # probability an executive with authority pitches in a quarter, at ambition 10 (27.1; 27.5 target 7: 0.45 -> 0.15)
  per_ambition: 0.01 # added per point of true ambition above 10 (27.1; 27.5 target 7: 0.04 -> 0.01)
  chance_clamp: [0.05, 0.9] # the pitch probability's bounds (27.1; 27.5 target 7: 0.15 -> 0.05 at the bottom)
  ambition_neutral: 10 # attribute points; the ambition at which the probability is `base`
  decline_morale: 2 # morale points a declined pitch costs its executive, once (27.1)
  decline_morale_ego: 4 # the same for an executive with ego at or above ego_at (27.1)
  ego_at: 15 # attribute points; the ego from which a decline stings more (27.1)
  record_months: 24 # months an approved pitch is tracked against its low and high case (27.1)
  cost_months: 12 # months of cost counted against the auto-approve limit (27.1)
  auto_approve_cash_bp: 500 # bp of cash; the default auto-approve limit, 5% of cash (27.1)
  spread: { at_zero: 0.6, per_score: 0.025, min: 0.15 } # half-width of the low/high case as a fraction of the central case: max(min, at_zero - per_score x the displayed seat score) (27.1)
  team_builders: 6 # builders in the team the CPO suggests for a new product (27.1; 27.5 target 3: 3 -> 6, so it can launch inside the record window)
  sunset_months: 6 # months a product must have shrunk, below its maintenance line, before the CPO pitches its sunset (27.1)
  dc_use: 0.6 # projected use of a data centre's capacity the CTO needs before pitching one (27.1)
  dc_months: 24 # months that use must last (27.1)
  plant_share: 0.75 # contract volume as a share of a plant size before the COO pitches a plant (27.1)
  plant_months: 12 # months that volume must last (27.1)
  campaign_months: 3 # months of a CMO campaign (27.1)
  campaign_share: 1.0 # a campaign adds this x the product's current monthly marketing (at least campaign_min_cents) each campaign month (27.1)
  campaign_min_cents: 500000 # cents; $5,000 a month at least (27.1)
  campaign_brand_gap: 20 # brand points below the target before the CMO pitches a campaign (27.1)
  office_seats: 25 # seats in an office the COO pitches (27.1)
  new_product_share: 0.04 # share of a segment's addressable customers a new product's central case reaches at 24 months, / (1 + products already selling there) (27.1; 27.5 calibration 2026-11-05: 0.25 -> 0.04, a score-12 CPO's median 24-month outcome)
  team_ready_months: 3 # months before a pitched new product's team is hired and building, in its expected launch (27.5 target 3)
  region_capture: 1.7 # x the CRO's central case for a region (home share x demand x price x fit, grown 24 months): calibrates it against what launches reach (27.5 target 3)
  region_fit_without_office: 0.7 # the CRO's fit for a region where the company has no office (27.1; 1 with one)
  campaign_awareness_pct: 25 # % awareness a campaign adds to its product for campaign_months (a modifier, 23.2)
  campaign_brand_pct: 10 # % brand target a campaign adds for campaign_months
  campaign_lift: 0.15 # a campaign's central case: customers x this x brand gap / 100 more customers (27.1)
  buyback_share: 0.25 # share of the cash above the CFO's cash threshold a buyback pitch spends (27.1)
  research_roles: { software_platform: software_engineer, ai: data_scientist, infrastructure: devops_engineer, chip_design: chip_designer, devices: hardware_engineer } # the role the CTO hires for a research team in each domain (27.1)

# --- Capital and macro (formulas.md section 20, M10 lane B) -------------------------------
macro:
  history_months: 24 # months of indicators the API shows behind the current one (20.4)
  rate: { mean: 3.0, phi: 0.97, shock_sd: 0.15, bounds: [0.0, 8.0] } # % a year; base rate AR(1) after 2025 (20.1)
  climate: { mean: 1.1, phi: 0.95, shock_sd: 0.05, bounds: [0.6, 1.8] } # multiplier; venture climate AR(1) after 2025 (20.1)
  confidence: { mean: 100.0, phi: 0.95, shock_sd: 2.5, bounds: [60.0, 125.0] } # index (100 = 2010-2019 average); AR(1) after 2025 (20.1)
  ai_change: { mean: -0.10, phi: 0.8, shock_sd: 0.08, bounds: [-0.5, 0.5] } # fraction a year; AI compute index's yearly change, AR(1) after 2025, drawn each January (20.1)
  confidence_exponent: 0.5 # adoption x (cc / 100)^this in the confidence segments (20.1)
  confidence_segments: [consumer, smb] # segments.yaml keys whose adoption follows consumer confidence (20.1)
  downturn:
    monthly: 0.012 # probability a downturn starts in a month after 2025 (20.1)
    gap_months: 36 # months without a downturn needed before another can start (20.1)
    months: 12 # months a downturn lasts (20.1)
    rate: -0.25 # % points pushed onto the base rate each downturn month, before the AR(1) step (20.1)
    climate: -0.04 # pushed onto the venture climate each downturn month (20.1)
    confidence: -1.5 # index points pushed onto consumer confidence each downturn month (20.1)

debt:
  take_energy: 10 # founder energy to sign a loan (20.3)
  repay_energy: 5 # founder energy to repay early (20.3)
  venture:
    window_turns: 12 # turns after a priced round closes during which venture debt is offered (20.3)
    max_of_round_bp: 5000 # bp of that round's amount; most venture debt against one round (20.3; M10d: 3000 -> 5000, so a seed's loan carries blitzscale nearer its Series A and covenants bite on 60% of seeds, not 80%)
    spread_bp: 600 # bp a year over the base rate (20.3)
    term_months: 36 # months to repay (20.3)
    interest_only_months: 12 # months of interest only before equal principal (20.3)
    warrant_bp: 25 # bp of fully diluted shares (after issue) granted to the lender at signing (20.3)
    covenant_burn_months: 2 # cash must cover this many months of last month's burn (20.3; M15a, 30.7 V7: 3 -> 2, product manager 2026-11-07: covenants bit on 70% of blitz_debt seeds on 1-10 and 11-40)
  bank:
    stage: 3 # company stage needed for a bank loan (20.3)
    profit_months: 3 # months of positive operating profit needed, each (20.3)
    max_of_arr_bp: 10000 # bp of ARR; most bank debt outstanding (20.3)
    spread_bp: 300 # bp a year over the base rate (20.3)
    term_months: 48 # months to repay, equal principal from the first (20.3)
    covenant_profit_months: 3 # operating profit summed over this many months must be positive (20.3)
    covenant_cash_bp: 1000 # bp of the balance; cash must cover at least this (20.3)
  min_cents: 10000000 # cents; smallest loan, $100,000 (UI and rules floor)
  breach:
    waiver_fee_bp: 100 # bp of the balance; the waiver fee choice (20.3)
    rate_up_bp: 200 # bp a year added for the rest of the term; the higher-rate choice (20.3)
    repay_bp: 2500 # bp of the balance repaid at once; the partial-repayment choice (20.3)
    cure_months: 3 # months after a breach before covenants are tested again (M10 decision)
    call_window_months: 6 # a second breach within this many months of the first makes the balance due (20.3)

# --- Offices (formulas.md 19.2, M9) ------------------------------------------------------
office:
  seat_sizes: [25, 50, 100, 250] # seats a lease may have (19.2)
  lease_discount: 0.75 # fraction; a leased seat costs this x payroll.office_cost_per_head_cents x rent index a month (19.2)
  fit_out_months: 3 # months of rent paid once when a lease starts (19.2)
  close_penalty_months: 3 # months of rent paid once when a lease is closed (19.2)
  crowded_morale: -4 # morale points for everyone in an office whose members exceed its seats (19.2)
  lease_energy: 10 # energy to lease an office (19.2)
  close_energy: 10 # energy to close an office (19.2)
  assign_energy: 2 # energy to set the office a unit works from (M9 decision; as assign_unit)

# --- Regional markets (formulas.md 19.4-19.5, M9) ----------------------------------------
markets:
  localize_cents: 8000000 # cents x scope / localize_scope: one-off localization cost per region (19.5)
  localize_scope: 6 # scope sigma at which localization costs exactly localize_cents (19.5)
  localize_months: 6 # months from launch in a region until it sells there (19.5)
  localize_slowdown: 0.10 # fraction; feature points grow this much slower while any region localizes (19.5)
  launch_energy: 4 # energy to launch a product in a region (19.5)
  foreign_awareness: 1.0 # multiplier on self-serve awareness in a region without local presence (19.5; 1.0 since M10b, 23.5: self-serve needs no presence)
  no_marketing_awareness: 0.7 # share of awareness in a region given none of the product's marketing (23.5, M10b)
  presence_people: 5 # people working in a region that count as local presence without an office (19.5)
  neighbour_sellers: 0.5 # fraction of sellers in the neighbour region that count in a sales-led segment (19.5)
  cross_region_step: 0.05 # output lost per extra region the builders work in (19.4)
  cross_region_floor: 0.85 # lowest cross-region output factor (19.4)

# --- Cities and geography (formulas.md 19.1, 19.3, 19.6, M9) -----------------------------
geo:
  default_hq_city: san_francisco # cities.yaml key; a new game's HQ unless one is chosen (19.1)
  pay_level: 0.876 # multiplier on every city's salary multiplier, for asks and market rates: a San Francisco company's average pay equals v1's regional candidate mix (19.1; Reece, 2026-11-01)
  local_candidates: 0.85 # fraction of a search's candidates who live in its city; the rest relocate (19.3)
  region_entry: # a rival's enter_region need (19.6): (unserved share - unserved) / span, with cash for cash_months
    unserved: 0.6 # unserved share of the region's demand needed to consider entering (tuned in M9 from 19.6's 0.4: rivals entered the served home market and squeezed v1's incumbents)
    span: 0.2 # unserved share above `unserved` for need 1 (tuned in M9 from 0.4, so an empty region still has need 1)
    cash_months: 12 # months of costs in cash needed to enter a region
    cooldown_turns: 6 # turns; a rival enters at most one region in this many (M9 pacing, so entries do not crowd out 15.3's other actions)

# --- Facilities: data centres (formulas.md 22.2, 22.5, M12a) -------------------------------
facility:
  kinds: # one generic facility model (ADR-0020 2); M12b adds assembly plants as another kind
    data_centre_general:
      label: General data centre
      unit: CU # compute units: what $1,000 a month buys on spot at index 1.0 (22.1)
      input_good: server # components_history.yaml good whose index prices capex (22.4)
      output_good: compute_general # compute.goods key it produces (22.1)
      capex_per_unit_cents: 2400000 # cents per CU in 2010 dollars, x the server index at the build (22.2)
      build_months: 12 # months from the build order to completion (22.2)
      opex_per_unit_cents: 25000 # cents per live CU a month (22.2)
      life_months: 60 # months of straight-line depreciation from completion (22.2)
      staff_per: 200 # CU per infrastructure person needed (22.2)
      staff_roles: [devops_engineer, security_engineer] # roles.yaml keys that staff it (22.2)
      staff_skill: infrastructure # skills.yaml key whose mean sets reliability (22.2)
    data_centre_gpu:
      label: GPU data centre
      unit: CU
      input_good: gpu
      output_good: compute_gpu
      capex_per_unit_cents: 2000000 # cents per CU in 2010 dollars, x the GPU index at the build (22.2; M12a tuning from $40,000 for 22.7 target 4, Reece 2026-11-02; with opex $200 the dearest month still costs 1.22x spot per used CU at 40% use)
      build_months: 9 # months, plus any allocation delay (22.2, 22.4)
      opex_per_unit_cents: 20000 # cents per live CU a month, mostly power (22.2; M12a tuning from $500, as capex above)
      life_months: 48 # months of depreciation (22.2)
      staff_per: 200 # CU per infrastructure person needed (22.2)
      staff_roles: [devops_engineer, security_engineer]
      staff_skill: infrastructure
    assembly_plant: # M12b (26.2): own device and server assembly
      label: Assembly plant
      unit: units/month # units of assembly a month (a server takes hardware.bom.servers.plant_slots)
      input_good: equipment # components_history.yaml good whose index prices capex (26.2)
      output_good: assembly # hardware.output_good: not a compute good
      capex_per_unit_cents: 30000 # cents per unit a month of capacity in 2010 dollars, x the equipment index (26.2)
      build_months: 12 # months from the order to completion (26.2)
      opex_per_unit_cents: 0 # cost is fixed_opex plus variable a unit run instead (26.2)
      life_months: 96 # months of straight-line depreciation (26.2)
      staff_per: 1000 # units a month per manufacturing engineer needed (26.2)
      staff_roles: [manufacturing_engineer]
      staff_skill: manufacturing # sets yield, and reliability for contract-manufacturing quality (26.2)
      fixed_opex_cents: 2000000 # cents a live month (26.2)
      variable_cents: 300 # cents a unit run (26.2)
      sizes: [5000, 20000, 50000, 100000] # units a month a build may choose (M12b decision)
      outages: false # plants have no outages (22.5 is data centres only)
  sizes: [100, 500, 2000, 10000] # CU a build may choose (22.2)
  build_energy: 12 # founder energy to order a build (22.2)
  close_energy: 12 # founder energy to close or sell one (22.2)
  assign_energy: 2 # energy to assign a unit to staff one (M12a decision; as assign_unit)
  sale_share: 0.5 # fraction of book value a sale brings (22.2)
  reliability_floor: 0.7 # reliability = 100 x coverage x (floor + skill share x mean skill / 20) (22.2)
  reliability_skill: 0.3 # the skill share of that formula; floor + skill = 1 (22.2)
  outage:
    base: 0.016 # chance a month x (100 - reliability) / 10 (22.5; M12a tuning from 0.002, 22.7 target 6: 0.002 gave 0.13 outages a year at coverage 0.5, not >= 1)
    customers_share: 0.5 # share of the critical customers_pct cap every hosted product loses in an outage (22.5)
    cloud_churn_mult: 3 # cloud customers' churn x this in the outage month (22.5)

# --- Components and supply shocks (formulas.md 22.4, M12a) ---------------------------------
supply:
  change: { mean: -0.08, phi: 0.6, shock_sd: 0.06, bounds: [-0.4, 0.4] } # fraction a year; each good's yearly change after 2025, an AR(1) step each January (22.4)
  shock:
    monthly: 0.01 # chance a shock starts in a month, per good, after 2025 (22.4)
    gap_months: 30 # months since the last shock began before another can start (22.4)
    rise: [0.25, 0.60] # fraction the index rises while a shock runs (22.4)
    allocation: [0.40, 0.80] # allocation while a shock runs (22.4)
    months: [6, 18] # months a shock runs; the rise then fades over as many months (22.4; M12a decision)
  delay_step: 0.10 # allocation shortfall per month of delay: 1 month late for each 10 points (22.4)
  contract_energy: 6 # founder energy to sign a component contract (22.4)
  contract_months: [12, 36] # months a contract may run (22.4)
  take_or_pay: 0.30 # fraction of an unused contracted volume's value charged at the end (22.4)
  history_months: 36 # months of index history the API shows behind the current one (22.6)

# --- Compute and cloud hosting (formulas.md 22.1, 22.3, M12a) ------------------------------
compute:
  goods:
    compute_general: { label: General compute, spot_cents: 100000, spot_index: flat } # one CU = $1,000 a month on spot; the index stays 1.0 (22.1)
    compute_gpu: { label: GPU compute, spot_cents: 100000, spot_index: ai } # $1,000 x M10's AI compute index (22.1, 20.1)
  indexed_good: compute_gpu # what a compute_indexed category (AI) needs (22.1)
  plain_good: compute_general # what every other category needs (22.1)
  feature_base: 50 # cloud hosting features = base + per_lead x infrastructure lead, at most 100 (22.3)
  feature_per_lead: 2 # feature points per point of infrastructure lead (22.3)
  capacity_category: cloud_hosting # categories.yaml key of the market that sells spare capacity (22.3)

# --- Hardware and devices (formulas.md 26.1-26.2, M12b, lane A) ----------------------------
hardware:
  plant_kind: assembly_plant # facility.kinds key of own assembly plants (26.2)
  output_good: assembly # a plant's output: units of assembly (not a compute good)
  capacity_category: contract_manufacturing # categories.yaml market that sells spare plant capacity (26.2)
  bom: # per unit-sale category (26.2): base cents x the good's index, plus the chip, plus assembly
    devices: { good: device_bom, base_cents: 18000, chip_type: mobile_soc, contract_fee_cents: 1300, plant_slots: 1 } # $180 BOM, a mobile SoC, $13 a unit at a contract manufacturer in Shenzhen (26.7)
    servers: { good: server_bom, base_cents: 280000, chip_type: server_cpu, contract_fee_cents: 8000, plant_slots: 6 } # $2,800 BOM, a server CPU, $80 a unit; a server takes 6 units of plant capacity (M12b decision)
  contract:
    energy: 6 # founder energy to sign a contract-manufacturing contract (26.2)
    months: [12, 24] # whole months a contract may run (26.2)
    take_or_pay: 0.5 # fraction of the fee charged on unused volume each month (26.2)
    cheap_city: shenzhen # cities.yaml key where the fee is the base fee (26.2)
    city_fee_mult: 1.3 # the fee in any other city, x the base (M12b decision: "Shenzhen cheaper")
    manufacturers:
      foxconn: { label: Foxconn, fee_mult: 1.0 }
      pegatron: { label: Pegatron, fee_mult: 1.03 }
    max_units: 1000000 # the most units a month one contract may cover (M12b decision)
  plant_yield:
    base: 0.85 # yield = base + skill_share x mean manufacturing skill / 20 (26.2)
    skill_share: 0.10
    noise_sd: 0.01 # monthly yield noise (fraction), stream manufacturing, key (facility_id,) (26.2)
    bounds: [0.5, 0.99] # yield after noise stays within these fractions

# --- Fabless chips (formulas.md 26.3, M12b, lane A) ----------------------------------------
chips:
  good: foundry_wafer # components_history.yaml key of foundry wafers (26.3)
  types: # chips per wafer and a wafer's 2010 price at index 1.0 (26.3)
    mobile_soc: { label: Mobile SoC, per_wafer: 600, wafer_cents: 200000, advanced_node: false } # $2,000 a mature-node wafer: an own SoC at about $13 against $40 bought (26.6 target 4)
    server_cpu: { label: Server CPU, per_wafer: 150, wafer_cents: 800000, advanced_node: true }
    ai_accelerator: { label: AI accelerator, per_wafer: 60, wafer_cents: 900000, advanced_node: true } # $9,000 a wafer (26.7)
  packaging_cents: 800 # packaging and test, cents a chip (26.3)
  chip_yield:
    base: 0.70 # yield = base + per_lead x chip-design lead, at most cap (26.3)
    per_lead: 0.003
    cap: 0.92 # 0.95 from the Chiplets era (26.4, eras.yaml yield_cap)
    domain: chip_design
  contract:
    energy: 6 # founder energy to sign a wafer contract (26.3)
    months: [12, 36] # whole months a wafer contract may run (26.3, as 22.4)
    take_or_pay: 0.3 # fraction of unused wafer starts' value charged each month (M12b decision; 22.4's share)
    foundries:
      tsmc: { label: TSMC, price_mult: 1.0 }
      samsung: { label: Samsung Foundry, price_mult: 0.95 }
    max_wafers: 100000 # the most wafer starts a month one contract may cover (M12b decision)
  gpu_capex: # own accelerators in own GPU data centres (26.3)
    floor: 0.4 # capex x (floor + share x own unit cost / market chip price)
    share: 0.6
    chip_type: ai_accelerator
    segment: hyperscalers # the market price is this segment's reference price
    compute_good: compute_gpu # data centres making this compute good get the cut (GPU data centres)
  price_segment: device_oems # a bought chip costs this segment's reference price (26.2)
# --- R&D tree and era milestones (formulas.md 21, M11, lane A) ---------------------------
rnd:
  decay: 0.015 # fraction of each lead lost a month, after progress (21.1): a lead halves in about 46 months
  cap_per_point: 0.010 # Q_cap multiplier per point of category lead (21.2 says 0.004; M11 tuning for 21.8 target 2)
  cap_points: 50 # points; the most category lead that lifts Q_cap, so at most x1.20 (21.2)
  feature_per_point: 0.005 # (21.2 says 0.002; M11 tuning for 21.8 target 2) feature points gained x (1 + this x lead) (21.2)
  feature_points: 50 # points; the most category lead that lifts features (21.2)
  rate: 0.3 # lead points per point of research output a month at zero lead (21.3 says 0.25; M11 tuning for 21.8 target 2: 0.4; M15a: 0.4 -> 0.3 for 30.7 V2, research_heavy won 5 of 10 seeds, now 4, ARR 1.25x -> 1.15x)
  half: 30 # points of lead at which progress is half as fast (21.3)
  start_energy: 6 # founder energy to start a research project (21.3)
  stop_energy: 2 # founder energy to stop one (21.3)
  budget_energy: 0 # energy to set a project's budget (M11 decision: as a product's marketing budget, free)
  breakthrough_chance: 0.02 # a month per active project, x q (21.3)
  breakthrough_points: 5 # lead points at once on a breakthrough (21.3)
  dead_end_chance: 0.015 # a month per active project, / q (21.3)
  dead_end_share: 0.5 # fraction of the last progress_window months' progress lost on a dead end (21.3)
  progress_window: 3 # months of progress a dead end looks back over (21.3)
  quality_skill: 12 # mean research skill at which q = 1 (21.3)
  quality_clamp: [0.5, 1.5] # q's range (21.3)
  era_lead: 15 # points; an era's threshold is the baseline at its historical month plus this (21.4)
  era_baseline: 5 # points added to the domain's baseline when an era arrives (21.4)
  first_mover_months: 24 # months of the first mover's window (21.4; M13b 27.3: 12 -> 24)
  first_mover_cap: 5 # quality-cap points for the first mover's products in the era's categories (21.4; M13b 27.3: 5 -> 8; 27.5 target 5: back to 5)
  first_mover_brand: 6 # brand-target points for those products (21.4; M13b 27.3: 10 -> 15; 27.5 target 5: 6, the window alone adds 25-60% customers)
  first_mover_appeal: 1.0 # multiplier on those products' appeal during the window (M13b 27.3; 1 = none; 27.5 target 5: 1.15 -> 1)
  license: # licensing (21.5)
    energy: 8 # founder energy to license in or out
    margin: 10 # points; the licensor keeps this much of its lead over the licensee
    price_per_point_cents: 2400000 # cents; $24,000 a point (21.5 says $150,000; M11 tuning for 21.8 target 5), once (no inflation in the game: nominal)
    price_arr_cents: 2000000000 # cents; the licensee's ARR at which the price doubles ($20M)
    royalty_bp: 200 # bp of the licensee's monthly revenue in the domain's categories, licensing out
    royalty_months: 24 # months the royalty runs
  leak: # a researcher on a project who leaves for a rival (21.5)
    share: 0.1 # fraction of the company's lead in the project's domain the rival gains
    cap: 10 # points; at most this
  rival: # incumbents' research action (21.6)
    rate: 0.8 # lead points a month = rate x builder skill / 10 while it runs
    need_span: 30 # points of lead gap (best lead in its domains - own) for need 1
    era_bonus: 0.15 # need added when an era in the domain is within era_window_months of its historical date (21.6 says 0.3; M11 tuning: at 0.3 T2 broke, steady 7 of 10)
    era_window_months: 24 # months
    months: 6 # months one research action runs
    pool_cost: 0.10 # builder pool +10% while it runs, returned at the end
    weights: { premium: 1.2, fast_follower: 0.9, aggressive: 1.0, cost_leader: 0.6 } # by personality
  reveal: # how exactly the player sees a rival's lead (21.7)
    range: 5 # points either side of the true lead
    licensed_range: 2 # points either side once the two companies have a licence

# --- IPO (formulas.md 25.1-25.2, M13 lane B) ---------------------------------------------------
ipo:
  min_stage: 3 # stage a company must have reached to hire banks (25.1)
  min_arr_cents: 8000000000 # cents; $80M ARR (2010 dollars; the game has no inflation) (25.1)
  trailing_months: 12 # months behind the profitability or growth test: the last 4 quarters (25.1)
  min_growth: 0.20 # fraction a year of revenue growth that qualifies a loss-making company (25.1 says 40%; M13 tuning for 25.9 target 2: blitzscale passes $80M ARR growing 20-25% a year and loss-making, so it never listed)
  board_min_confidence: 50 # average director confidence needed when the banks are hired (25.1)
  hire_energy: 10 # founder energy to hire the banks (25.2 step 1)
  retry_months: 12 # months after a pulled IPO before banks can be hired again (M13 decision)
  filing_delay_months: 1 # months an S-1 choice that restates a metric adds to the chain (25.2 step 2)
  ambition: { high: 1.15, middle: 1.0, low: 0.9 } # offer price multiplier by the roadshow's ambition (25.2 step 4)
  share_sold: { low: 0.10, middle: 0.15, high: 0.25 } # fraction of post-IPO fully diluted shares sold as new shares (25.2 step 3)
  dual_class_discount: 0.05 # fraction off the offer price with dual-class shares (25.2 step 3)
  demand: { mean: 1.0, climate: 0.6, sd: 0.2, bounds: [0.3, 3.0] } # book demand d = clamp(N(mean + climate x (v - 1), sd), bounds) (25.2 step 4)
  demand_words: # the book in words (25.8): d below `below` reads as `word`; never the draw
    - { below: 0.8, word: weak }
    - { below: 1.1, word: steady }
    - { below: 1.3, word: healthy }
    - { below: 2.0, word: strong }
  demand_top_word: very strong # d at or above the last `below`
  raise_min_demand: 1.3 # d needed to raise the price (25.2 step 4)
  raise_pct: 0.10 # fraction a raise adds to the offer price (25.2 step 4)
  cut_pct: 0.15 # fraction a cut takes off it (25.2 step 4)
  pull_fee_share: 0.3 # share of the bank fee owed when the IPO is pulled (25.2 step 4)
  pull_confidence: -10 # points every director loses when the IPO is pulled (25.2 step 4)
  first_day: { demand: 0.25, ambition: 0.15, step: 0.15, bounds: [-0.3, 0.8] } # r = clamp(demand x (d - 1) - ambition x (a - 1) / step, bounds), a the price over V_f per share (25.2 step 5)
  independents: 2 # independent directors added at the listing (25.7)
  ticker_len: 4 # letters in the generated ticker (M13 decision)

# --- Public company (formulas.md 25.3-25.5, 25.7, M13 lane B) ------------------------------
public:
  multiple: { base: 2, growth: 18, margin: 5, rate: 1.5, rate_pivot: 2, bounds: [1, 30] } # ARR multiple m = clamp(base + growth g + margin x margin - rate x (r_base % - pivot), bounds) x v (25.3; M13 tuning from 25.3's growth 25 and margin 15 for 25.9 target 4: scripted IPOs list at +30-40% margins, which gave P/S 20x in 2012-2019)
  sentiment: { phi: 0.9, sd: 0.06, bounds: [0.5, 1.8] } # S' = 1 + phi (S - 1) + N(0, sd), clamped; stream market_sentiment (25.3)
  analysts:
    min: 3 # analysts covering a newly listed company (25.3)
    max: 8 # at most (25.3)
    base_cap_cents: 100000000000 # cents; one more analyst for each doubling of market cap above $1B (M13 decision for 25.3's "more as market cap grows")
    target_sd: 0.1 # each target = V_f per share x (1 + N(0, sd)), refreshed after each report (25.3)
    buy_above: 1.15 # target / P above this: buy (25.3)
    sell_below: 0.9 # below this: sell; otherwise hold (25.3)
    firms: [Goldman Sachs Research, Morgan Stanley Research, J.P. Morgan Research, Bank of America Securities, Citi Research, UBS, Barclays, Jefferies] # covering firms, in the order coverage adds them
  earnings:
    revenue_weight: 3 # sentiment jump = clamp(3 s + 0.02 sm, jump) (25.4)
    margin_weight: 0.02 # per point of margin surprise (25.4)
    jump: [-0.25, 0.20] # bounds of the jump fraction (25.4)
    miss_below: -0.02 # a revenue surprise below this is a miss (25.4)
    beat_from: 0.0 # a surprise at or above this is a beat; between the two, in line (M13 decision)
    misses_in_row: 2 # consecutive misses that cut every director's confidence (25.4)
    misses_in_row_confidence: -8 # points (25.4)
    beat_streak: 3 # beats in a row that add sentiment (25.4)
    beat_streak_sentiment: 0.05 # sentiment points added (25.4)
    beat_board: 4 # director confidence per beat, in the report month (25.7)
    miss_board: -6 # per miss (25.7)
    guidance_energy: 4 # founder energy to set a quarter's guidance (25.4)
    guidance_band: 0.5 # guided revenue must lie within consensus x (1 +- this) (M13 decision: a guard against typos)
  activist_trigger: { value_share: 0.7, months: 6, misses: 3, window_quarters: 4, gap_months: 24 } # P below 0.7 x V_f per share for 6 months, or 3 misses in 4 quarters; then no new activist for 24 months (25.4; the gap is an M13 decision)
  takeover_trigger: { value_share: 0.6, months: 6, gap_months: 24 } # market cap below 0.6 x V_f for 6 months; gap as above (25.4)
  activist:
    buyback_cash_share: 0.10 # share of cash a demanded buyback spends (M13 decision)
    settle_cash_share: 0.01 # share of cash a proxy fight costs (M13 decision)
    board_seats: 1 # seats the activist takes when the board gives them (M13 decision)
  takeover:
    premium: 0.35 # the bid over the share price (M13 decision)
    talks_share: 0.5 # share of the premium sentiment prices in when talks open (M13 decision)
  capital:
    buyback_energy: 6 # founder energy (25.5)
    buyback_premium: 0.02 # buy at P x (1 + this) (25.5)
    buyback_max_share: 0.10 # at most this fraction of shares in one buyback (M13 decision)
    dividend_energy: 4 # founder energy (25.5)
    secondary_energy: 10 # founder energy (25.5)
    secondary_discount: 0.05 # new shares at P x (1 - this) (25.5)
    secondary_fee: 0.03 # fraction of the gross paid in fees (25.5)
    secondary_max_share: 0.20 # at most this fraction of shares outstanding in one offering (M13 decision)
  board:
    investor_lapse_months: 12 # one investor seat lapses every this many months after the listing (25.7)
    patience: { buy: 5, hold: 0, sell: -5 } # patience points from the analysts' consensus (25.7)
  history_months: 36 # months of share prices kept in the live state (the database keeps all)

# --- Chair and CEO (formulas.md 25.6, M13 lane B) -------------------------------------------
ceo:
  appoint_energy: 10 # founder energy to appoint a CEO (25.6)
  override_energy: 6 # founder energy to override one CEO decision (25.6)
  chair_energy: 40 # the founder's monthly energy as Chair (25.6)
  min_stage: 4 # stage needed to appoint a CEO (25.6)
  weights: { leadership: 0.3, strategy: 0.3, communication: 0.2, product: 0.1, finance: 0.1 } # the CEO's score (25.6)
  price_band_pct: 10 # % the CEO may move a price from the player's last (25.6)
  headcount_cap: 40 # a function's headcount the CEO's hiring plans stop at, when no seat guardrail sets one (M13 decision)
  max_salary_ratio_bp: 11000 # offer x ask in bp for the CEO's plans (as exec_authority.defaults)
  replace: { below: 30, months: 3 } # board confidence below this for this many months: the board may vote to replace the CEO (25.6)
  memory_months: 12 # months of CEO decisions kept for the panel

# --- Mergers and acquisitions (formulas.md section 28, M14 lane A) ------------------------
mna:
  min_arr_cents: 100000000 # cents; below $1M ARR a company is valued at cash + builders x min_value_per_builder (28.1)
  min_value_per_builder_cents: 15000000 # cents; $150,000 per builder on staff, the acqui-hire value (28.1)
  range: 0.30 # a private company's displayed value range, V_f x (1 +- this), off-centre by a seeded offset (28.1)
  diligence:
    energy: 6 # founder energy (28.2)
    months: 2 # months until the findings arrive (28.2)
    cost_bp: 50 # bp of the target's estimated value, to 6900 general and administrative (28.2; "professional fees")
    min_cents: 5000000 # cents; at least $50,000 (28.2)
    range: 0.10 # the value range after diligence, +- this (28.2)
    product_range: 5 # score points; products' quality and feature score shown +- this after diligence (28.2)
  problems:
    p: 0.15 # each hidden problem's probability per target, drawn when first looked at (28.2)
    tech_debt_quality: 10 # quality points lost over the first year after closing (28.2)
    tech_debt_months: 12 # months that loss spreads over (28.2)
    key_person_flight_mult: 2.0 # one key person's flight chance x this (28.2)
    churn_mult: 1.5 # customer_concentration: the acquired products' churn x this (28.2)
    churn_months: 12 # months after closing (28.2)
  offer_energy: 10 # founder energy for an offer (28.3)
  premium: { aggressive: 0.50, premium: 0.40, fast_follower: 0.30, cost_leader: 0.20 } # reservation premium over V_f by rival personality (28.3)
  founder_premium: { base: 0.25, per_ambition: 0.02, neutral: 10 } # a startup founder's premium: base + per_ambition x (ambition - neutral) (28.3)
  distress_discount: 0.25 # off the premium when cash covers fewer than distress_months of costs (28.3)
  distress_months: 6 # months of costs (28.3)
  counter_sd: 0.05 # a private target counters once at reservation x (1 + N(0, this)) (28.3)
  talks_block_months: 12 # months talks stay closed after they end (28.3)
  counter_anchor: { aggressive: 1.15, premium: 1.10, fast_follower: 1.06, cost_leader: 1.03 } # a private target's first counter: reservation x this by personality (playtest 3 addendum 9, M15b; lowered from 1.30-1.15 so a deal at the first counter stays within 28.9 target 2, 1.0-1.6 x V_f)
  max_rounds: 3 # rounds of counters; each moves half the gap toward the reservation; an offer below the last ends talks (addendum 9)
  lowball: 0.9 # an offer below the last counter x this is a lowball (addendum 9)
  strikes: 2 # lowballs that end talks for talks_block_months (addendum 9)
  board: { bar: 0.30, sd: 0.05 } # a listed target's board accepts a premium over market cap of at least bar + N(0, sd), drawn once per approach (28.3)
  tender: { energy: 15, floor: 0.15, span: 0.5, cap: 0.9, defence: 0.20, fee_bp: 100, block_months: 12 } # hostile tender: chance clamp((premium - floor) / span, 0, cap) - defence for an aggressive target; a failed one costs fee_bp of the price and blocks bids block_months (28.3)
  closing_months: 1 # months from acceptance to closing without a review (28.3)
  sweep_months: 3 # a brand subsidiary's cash above this many months of its costs sweeps to the parent each month (28.5)
  funding_months: 1 # months of its costs; the parent pays a brand's cash shortfall up to this each month, an intercompany transfer (Reece's playtest 3, 2026-11-06)
  loss_warning_months: 3 # months; a brand with an operating loss this many months running raises a warning (Reece's playtest 3)
  directive_energy: 2 # founder energy to set a brand's directive (28.5)
  acquired_flag_months: 12 # months Org flags an acquired unit (M14 brief)
  rival_rate: 0.005 # an incumbent's chance a quarter to buy one startup in its categories (28.6; 28.9 target 7 tuning: 0.04 -> 0.008, about 3 a decade; 0.005 at the lane merge for M12a's living-market guard, 2 a decade)
  rival_cash_months: 12 # only with cash above this many months of costs (28.6)
  cpo_limit_mult: 4 # the CPO pitches only startups priced under the auto-approve limit x this (28.7)
  pitch_synergy: 0.25 # an acquisition pitch's central case adds this x the target's monthly costs as integration savings (M14 decision for 28.7; the middle of 28.9 target 4's band)
  pitch_bid_premium: 0.30 # an approved acquisition pitch bids a listed target's market cap x (1 + this), a private one its displayed range's high end (M14 decision for 28.7)

antitrust:
  review: 0.35 # combined customer share in a segment, region and category from which a deal is reviewed (28.4)
  block: 0.50 # from which it is blocked without a remedy (28.4)
  review_months: [3, 6] # a review's length, uniform, stream mna (28.4)
  strictness: # x the block probability by year: history, then flat (28.4)
    - { from_year: 2010, strictness: 0.6 }
    - { from_year: 2020, strictness: 1.0 }

integration:
  months: 12 # culture clash and key-person flight last this long after closing (28.5)
  flight_brand: 0.007 # a kept brand's key people leave with this chance a month (28.5; 28.9 target 3 tuning: 0.03 -> 0.007, brands lose at most 10% in 12 months)
  flight_base: 0.01 # an integrated key person leaves with this chance a month (28.5; 28.9 target 3 tuning: 0.02 -> 0.01)
  flight_per_distance: 0.06 # + this x the personality distance (28.5)
  clash: 0.10 # acquired people's morale moves this x distance of the gap to the player's average a month (M14 decision for 28.5's clash)
  distance_span: 4 # attribute points; a mean personality-trait gap this big between the companies is distance 1 (M14 decision)
  max_staff: 250 # only a target with at most this many staff (key people and pools) can be integrated; larger ones are kept as a brand (product manager, 2026-11-05)
  synergy_overlap: 0.40 # share of an acquired product's sellers and marketers let go where the acquirer already sells in its category (2026-11-05)
  synergy_new: 0.15 # the same in a category the acquirer does not sell in (2026-11-05)
  synergy_builders: 0.10 # share of an acquired product's builders let go (2026-11-05)
  synergy_other: 0.30 # share of the target's key people in other functions let go (2026-11-05)
  severance_months: 3 # months of salary for each pool member let go, to 6000 (28.5)
  churn_mult: 1.3 # the acquired products' churn x this (28.5)
  churn_months: 6 # months after closing (28.5)
  brand_blend: 0.10 # the acquired products' brand moves this share toward the player's a month (28.5)
  tech_lower_share: 0.20 # research lead = the higher + this x the lower (28.5)
# --- Press, promises and credibility (formulas.md 29.1-29.3, M14b lane B) ------------------
press:
  max_per_quarter: 2 # press moments a quarter at most; the rest are skipped, highest stakes first (29.1)
  bold_brand: 3 # % on every product's brand target for bold_months after a bold answer (29.1)
  bold_months: 6
  measured_brand: 1 # % for measured_months after a measured answer (29.1)
  measured_months: 6
  deflect_cred: -2 # credibility points for a deflection (29.1)
  bold_backfire: 6 # credibility points lost when results contradict a bold claim (29.1)
  backfire_months: 6 # months a bold claim can backfire: the product's share falls, or a miss once listed (29.1)
  audience: { early: 0.5, scaleup: 1.0, listed: 1.5 } # a, scaling every press effect: stages 1-2, stage 3, listed (29.1)
  layoff_share: 0.10 # fired / staff at the month's start that makes a layoffs moment (29.1)
  cred_start: 50 # credibility points a company starts at and drifts toward (29.3)
  cred_drift: 1 # points a month toward cred_start (29.3)
  cred_hiring: 0.05 # offer-score points at credibility 100: +cred_hiring x (credibility - 50) / 50 (29.3)
  cred_hiring_cap: 0.05 # at most (29.3)
  cred_history: 5 # changes shown with their causes (29.3)
  statement_chance: 0.6 # chance a rival CEO speaks at their company's own launch, release or price cut (29.4; M14b decision, tuned from 0.5 for target 4)
  jab_base: 0.3 # chance such a statement is a jab at the player when they sell in the segment (M14b decision, tuned from 0.2 for target 4)
  jab_feud: 0.6 # + this x feud / 100 (M14b decision)
  reminder_months: [1, 3] # a "you said ..." reminder this many months after a broken promise, drawn (29.2)

promise:
  max_open: 3 # open promises at once (29.2)
  energy: 2 # founder energy to make a promise in a press moment (M14b decision)
  months: [3, 18] # a ship, beat or research promise's deadline, months out (29.2)
  fixed_months: 12 # no layoffs and no price rise run this long (29.2)
  kept_brand: 4 # % on the brand target x a x (1 + ambition) x the credibility factor (29.2)
  kept_cred: 5 # credibility points x a (29.2)
  kept_months: 12 # months the kept bonus runs (29.2)
  kept_morale: 2 # morale points for every employee, no layoffs kept (29.2)
  broken_brand: 8 # % off the brand target x a (29.2)
  broken_cred: 10 # credibility points x a (29.2)
  broken_months: 12 # months the broken penalty runs (M14b decision, as kept)
  broken_sentiment: 0.05 # sentiment x a lost once listed (29.2)
  broken_morale: 5 # morale points every employee loses, no layoffs broken (29.2)
  broken_trust: 10 # relationship points every employee's pair with the founder loses (29.2)
  beat_span: 20 # displayed quality points of gap to the rival for ambition 1 (M14b decision)
  research_span: 20 # displayed lead points to the target level for ambition 1 (M14b decision)
  fixed_ambition: 0.2 # ambition of a no-layoffs or no-price-rise promise (M14b decision)

feud:
  bold_mention: 20 # points when a bold answer names a rival CEO (29.4 says 10; M14b tuning for 29.7 target 4: at 10 no steady run reached rivalry)
  head_to_head: 8 # a launch in a segment both companies sell in (29.4)
  poach: 15 # poaching the other's key person, either way (29.4)
  hostile_bid: 20 # a hostile bid (M14 calls feud.add_feud) (29.4)
  decay: 1 # points a month (29.4 says 2; M14b tuning for 29.7 target 4)
  rivalry: 50 # a feud at or above this is a rivalry (29.4)
  target_mult: 1.5 # a rival in a rivalry weights actions against the player's products x this (29.4)
  causes_kept: 5 # recent causes shown on the Rival screen

# --- Recruitment fixes from playtest 2 (formulas.md 29.5, M14b lane B) ----------------------
recruit:
  replace_speed: 0.6 # Replace's time to fill over a normal plan's (29.5)
  normal_months: 2 # a plan's months from opening to the hire: search, then interview and offer (M14b measure)
  replace_window: 3 # months after a resignation or poach that Replace is offered (M14b decision)
  replace_ratio_bp: 11000 # a Replace plan's offers as bp of the candidate's ask (M14b decision, as the executives' plans)
  interest_fee_bp: 1500 # bp of the role's mid salary at the search's level, per search by interest (29.5)
  interest_pool: 4 # candidates generated per candidate kept, to find ones with the interest (M14b decision)
  fit_weights: { leadership: 0.35, mentoring: 0.25, communication: 0.25, temperament: 0.15 } # leadership fit from revealed values (29.5; M14b decision)
  fit_stars: [1, 5] # the fit's star scale (29.5)

# --- Game modes: company score, rankings, Sandbox (formulas.md 30.1-30.4, M15b lane B) -----
score:
  value_floor_dollars: 1000000 # dollars; V (market cap, else V_f) at or below $1M scores 0 (30.1)
  value_span_decades: 6 # decades above the floor to the full value part: $1T scores 400 (30.1)
  weight_value: 400 # points (30.1)
  weight_growth: 200 # points (30.1)
  weight_profit: 150 # points (30.1)
  weight_leadership: 150 # points (30.1)
  weight_reputation: 100 # points (30.1)
  growth_full: 0.5 # trailing 3-year revenue CAGR scoring the full growth part (30.1)
  margin_floor: -0.2 # trailing operating margin scoring 0 (30.1)
  margin_span: 0.5 # margin above the floor for the full part: +30% scores 1 (30.1)
  reputation_span: 200 # mean brand + credibility points for the full reputation part (30.1)

rank:
  top_revenue: 50 # places in the Top 50 by revenue (30.4)
  top_lists: 20 # places in Best places to work and in Most innovative (30.4)
  places_min_staff: 50 # staff; smaller companies are not in Best places to work (30.4)
  effect_places: 10 # a top-10 place earns the list's effect (30.4)
  hiring: 0.03 # hiring appeal for the year from a top-10 Best places to work place (30.4)
  brand: 0 # brand target points for the year from a top-10 Most innovative place (30.4); 0 (product manager, 2026-11-07, M15a): with the tie-break fixed, 0.5 still moved V1/V2 (research_heavy 6 wins), V3 (-8.6 pts) and V4 (1.44x) out of band; an M23 follow-up
  effect_months: 12 # months the effects run, January to December (30.4)
  years: 3 # Most innovative counts eras caused and launches in the last 3 years (30.4)
  tenure_full_months: 60 # mean tenure scoring the full tenure measure (M15b decision)
  places: { first: 0.4, second: 0.3, third: 0.3 } # weights on mean morale, pay against market, tenure (M15b decision)
  innovative: { first: 0.4, second: 0.3, third: 0.3 } # weights on research leads, eras caused, launches (M15b decision)
  lead_full: 60 # summed research lead points scoring the full lead measure (M15b decision)
  eras_full: 2 # eras caused in the window for the full measure (M15b decision)
  launches_full: 6 # launches in the window for the full measure (M15b decision)
  news_top: 5 # companies; January's news item names each list's top this many (playtest 4, M15r addendum b)

sandbox:
  years: [2010, 2025] # start years offered (30.2)
  cash_dollars: [100000, 100000000] # starting cash offered, dollars (M15b decision)
  rival_share_half: 0.5 # "half the rivals" keeps this share of each category's incumbents (30.2)
  era_spread_months: 24 # months; with eras "all seeded", a later historical era arrives in its month +- this, drawn (M15b decision for 30.2)

story: # rival CEO storylines (M15b addendum 12): press pieces from engine facts, LLM-worded within the budget (16.8)
  feud_marks: [25, 50] # feud points; crossing one brings a reply from their CEO (addendum 12)
  max_per_month: 2 # pieces a month at most, one per rival (keeps the LLM spend small)

serial: # founding again after an exit (M15b addendum 10)
  background: garage_bootstrap # scenarios.yaml start: the new company's cap table (founder 90%, pool 10%) and equity account
  min_cash_dollars: 10000 # dollars; the least of the proceeds the founder can put into the new company

# --- The founder's life (formulas.md 32, M24 lane C) ------------------------------------------
stress: # 32.1: stress 0-100 on the founder, public
  start: 20 # stress points a new founder starts with
  comfort: 0.6 # share of the month's energy budget spent without strain
  load: 30 # stress points per unit of share spent above comfort (all 60 of 60: +12 a month); 32.1 said 40, set to 30 by the product manager (2026-11-08): at 40 research_heavy (peaking at 82) burned out and tipped M15a's 10-year guard
  recover: 8 # stress points lost in a month at or below comfort
  holiday: 25 # stress points lost in a month on Holiday, or the month off a burnout grants
  critical: 5 # stress points for each critical event answered in the month
  burnout_at: 80 # stress points; burnout starts here
  recover_below: 40 # stress points; burnout ends when stress falls below this
  burnout_cut: 0.30 # share of the monthly energy budget lost while burnt out
  backfire_mult: 2 # a bold claim made while burnt out costs this many backfires' credibility (M24 decision for "chance doubles")
  push_on: 5 # stress points for pushing on at the burnout event
  history: 6 # months of stress causes shown on the top bar

personal: # 32.2: the founder's own book (9xxx accounts), never mixed with a company's
  tax_rate: 0.35 # share of the founder's salary lost to income tax before it reaches the book

foundation: # 32.3
  min_cents: 100000000 # cents ($1M) of personal cash needed to create a foundation
  energy: 5 # energy to create one
  payout: 0.05 # share of the endowment granted each December
  beloved_k: 3 # Beloved points per decade of a year's grants: min(beloved_cap, k x log10(g / unit)); 32.3 says 2, tuned to 3 for 32.7 target 5 ($10M a year raises Beloved 5-10: 2 x 2 = 4 missed it)
  beloved_cap: 10 # Beloved points at most from one year's grants
  beloved_unit_dollars: 100000 # dollars; a year's grants below this raise no Beloved
  hiring: 0.03 # offer-score points at most (education) in the founder's home region
  hiring_full_dollars: 10000000 # dollars a year of grants reaching the full education effect (M24 decision; 32.7 target 5 caps it at 0.03)
  brand: 2 # brand-target points on consumer products (climate)
  morale: 1 # morale-target points for staff (health)
  pool: 0.05 # share added to hiring pools in the foundation's city (local communities)
  effect_months: 12 # months a year's grant effects last
  legacy_unit_dollars: 1000000 # dollars; legacy adds 100 x log10(1 + lifetime grants / this) (32.6)

persona: # 32.4: four public traits 0-100
  start: 20 # trait points each starts at
  drift: 2 # trait points a month toward start
  effect_at: 60 # trait points; effects apply at this or more
  history: 8 # trait causes shown on the profile
  sources: # trait points per occurrence (32.4 table)
    era_caused: 15
    bold_answer: 3
    new_category: 5
    innovative_top: 5
    layoffs: 10
    hostile_bid: 10
    poach: 3
    broke_no_layoffs: 15
    kept_promise: 4
    places_top: 5
    raises: 2
    broken_promise: 6
    covenant_breach: 8
    failed_tender: 8
    pushed_on: 4
    runway_burn: 2 # a month burning cash with runway under burn_runway_months (product manager, 2026-11-07)
    down_round: 70 # a priced round closed below the last (product manager, 2026-11-07: +8; tuned to 70 for 32.7 target 3, see the M24 brief)
    headcount_doubled: 5 # once a year: headcount up more than headcount_growth (product manager, 2026-11-07)
  raise_share: 0.25 # raises to this share of staff in one month count as raises across the company (M24 decision)
  layoff_share: 0.10 # firing this share of staff in a month is a layoff (32.4)
  builder_hiring: 0.03 # Visionary: offer-score points for builder roles
  feud_mult: 1.3 # Ruthless: rival feud points build x this
  ruthless_morale: -2 # Ruthless: morale-target points for staff
  antitrust_mult: 1.1 # Ruthless: antitrust strictness x this
  resign_mult: 0.9 # Beloved: resignation chance x this
  bold_brand: 1 # Beloved: brand-target points after a bold press answer
  bold_months: 3 # months Beloved's bold-answer brand point lasts (M24 decision: press.bold_months)
  burn_runway_months: 6 # months; runway_burn counts a burning month with runway under this
  burn_year_cap: 12 # trait points; runway_burn raises Reckless at most this much a calendar year
  headcount_growth: 1.0 # share; headcount_doubled when December's headcount is above (1 + this) x last December's
  reckless_cred_target: 45 # Reckless: credibility drifts toward this instead of press.cred_start

influence: # 32.5: lobbying and influence over regulators by region
  energy: 5 # energy to set or change a region's monthly lobbying
  rate: 3 # influence points a month x sqrt(spend / unit)
  unit_dollars: 100000 # dollars a month of lobbying for rate points
  decay: 0.03 # share of influence lost each month
  cap: 100 # influence points at most
  antitrust: 0.4 # an antitrust review's block probability x (1 - this x I / 100)
  risk_rate: 0.0005 # hidden scandal risk per $1k of lobbying a month; 32.5 says 0.002, tuned for 32.7 target 4 (0.002: a scandal on 8 of 10 seeds; 0.0005: 5)
  risk_ruthless: 1.5 # risk builds x this while Ruthless is at persona.effect_at or more
  risk_decay: 0.02 # share of risk lost each month
  risk_scale: 1000 # a month's scandal chance is min(chance_cap, risk / this)
  chance_cap: 0.2 # a month's scandal chance at most
  exposure: [10, 30] # hidden risk at which exposure reads medium, then high (the API shows only the word)
  max_monthly_dollars: 10000000 # dollars; the most one region's lobbying may be set to (M24 decision)
  scandal_cred: -15 # credibility points
  scandal_brand: -6 # brand points on every product
  scandal_fine: 0.005 # share of the trailing 12 months' revenue, paid at once
  scandal_ruthless: 10 # trait points
  scandal_reckless: 5 # trait points
  apologize_cred: -5 # credibility points more for apologizing
  apologize_stress: 10 # stress points for apologizing
  fight_chance: 0.5 # chance that fighting it brings a second story (the hit again, no fine)

group: # 31: the holding company and its subsidiaries (M16, v3)
  stage5_revenue_cents: 200000000000 # cents ($2B) of group revenue in the last 12 months that opens the holding company (with a listing), 31.2
  stage5_subsidiaries: 2 # or this many subsidiaries (kept brands count), 31.2
  form_energy: 20 # energy to form the holding company
  form_fee: 0.001 # share of market cap paid in legal fees when forming it (6900)
  office_monthly_cents: 25000000 # cents ($250k) a month: the holding company's group office (6900)
  control: 0.5 # stake from which a company is controlled and fully consolidated (NCI for the rest), 31.3
  influence: 0.2 # stake from which a company is an associate (equity method); below it, fair value, 31.3
  seat_per_stake: 0.15 # minorities get one board seat per this share of the subsidiary, 31.4
  private_discount: 0.2 # an unlisted subsidiary's stake sells at its value less this share, 31.5
  buyout_premium: 0.25 # minorities are bought out at their value plus this share, 31.5
  max_sale: 0.49 # most of a subsidiary sold while the group keeps control, 31.5
  carve_out: [0.10, 0.40] # share of a subsidiary listed in a carve-out IPO, 31.5
  spin_keep: 0.199 # most of a spun-off company the group may keep, 31.5
  stake_max: 0.499 # most of a listed rival bought on the market, 31.5
  stake_impact: 0.005 # the price paid rises this share for each 1% of the target bought, 31.5
  disclosures: [0.05, 0.10, 0.25] # stakes in a listed rival announced publicly as they are crossed, 31.5
  offer_at: 0.30 # at this stake the group makes a full offer (28.3) or buys no more, 31.5
  venture: [0.05, 0.25] # share of a startup bought in its funding round (15.4), 31.5
  cost_plus: 0.10 # margin over cost of a "cost plus" transfer price, 31.6
  supply_cost: 0.80 # an in-group supplier's cost as a share of the market price it replaces (M16 decision: the saving that makes vertical integration pay), 31.6
  fairness_band: 0.10 # a transfer price more than this share from market is unfair where minorities hold, 31.6
  fairness_months: 6 # months unfair before the minority complaint (a critical event), 31.6
  complaint_discount: 0.10 # share off the subsidiary's value while a complaint stands, 31.6
  complaint_legal: 0.005 # share of the subsidiary's revenue a year paid in legal costs while it stands (6900), 31.6
  mandate: # 31.4: what a subsidiary's CEO is judged on, by mandate
    energy: 3 # energy to set a subsidiary's mandate
    grow_target: 0.25 # yearly revenue growth a "grow" CEO must reach
    margin_target: 0.15 # operating margin a "margin" CEO must reach
    payout_target: 0.5 # share of the year's profit a "return cash" CEO must pay out as dividends
    grow_keep_months: 6 # months of costs a "grow" subsidiary keeps; above that it pays up only grow_payout of last month's operating profit (it reinvests the rest)
    margin_keep_months: 3 # months of costs a "margin" subsidiary keeps before the rest goes up to its owner
    return_keep_months: 1 # the same under "return cash" (without a mandate: mna.sweep_months)
    grow_payout: 0.5 # share of last month's operating profit a "grow" subsidiary pays up (it keeps its stock of cash)
    review_misses: 2 # Decembers missed in a row before the board proposes a new CEO
    pitch_chance: 0.25 # chance each quarter that a subsidiary CEO asks the group for capital
    pitch_months: 3 # months of the subsidiary's costs a capital request asks for (within its capex limit)
  discount: # 31.7: the conglomerate discount on a listed holding company's sum of the parts
    base: 0.10 # with one segment
    per_segment: 0.03 # for each further unrelated segment
    synergy: 0.15 # less this x the share of group revenue that is intra-group
    min: 0.10 # the discount at least
    max: 0.25 # and at most
geology: # 34.1: blocks and hidden deposits at game start (M18, v3 lane B); per-region data in geology.yaml
  max_grade: 0.9 # a deposit's true grade at most (a fraction of ore)
  blocks_per_region: 60 # exploration blocks each region is divided into, 34.1
  deposit_rate: 0.08 # a block holds a deposit of a commodity with chance prospectivity x this (one deposit at most); M18 tuning 0.16 -> 0.08 with grade_scale for 34.1's "roughly 1 in 25 surveyed blocks" and 34.6 targets 2-4
  grade_scale: 0.7 # every commodity's median grade x this (one knob for how often a deposit pays; geology.yaml's medians are assumptions); M18 tuning 1.0 -> 0.7
  size_lift: 2.0 # a deposit's tonnage and grade medians x (1 - size_lift/2 + size_lift x prospectivity): richer belts hold larger, richer deposits (assumption; M18 tuning 1.0 -> 2.0, the most allowed, for 34.6 target 4)
  depth_m: [80, 600] # uniform depth to the top of the ore in metres; empty blocks draw one too, so drilling costs never betray emptiness
  infra_km: [5, 300] # log-uniform distance to road, rail and power in km (raises capex), 34.1
  difficulty_sd: 0.35 # log-sd of a block's hidden permitting difficulty around 1.0 (x the region's permit years)
  sensitivity_sd: 0.15 # sd of a block's hidden community sensitivity around the region's mean, clamped to 0-1
  cells: 66 # drill positions an ore body holds (a hole samples one not yet drilled): with this many, 20 holes give the 34.6 target 1 range of +/-15% and 40 holes +/-8% (finite-population sampling, M18 decision)
  supplier_blocks: 2 # blocks per region and commodity that suppliers of the commodity licence at game start (the highest desk-study signals, never the truth), 34.4
exploration: # 34.2-34.3: the pipeline, its costs and times (dossier 6, scaled to the game; all assumptions unless marked)
  min_stage: 3 # company stage from which it may explore, 34.4
  confidence: 0.9 # stated confidence of every estimate range (two-sided), 34.2
  skill_base: 1.3 # ranges x (skill_base - skill_slope x team skill), 34.2
  skill_slope: 0.05 # 34.2's 0.03, tuned to 0.05 for 34.6 target 2 (skill 15 vs 8: 0.03 gives ranges 20% narrower, below the target's 25-40%; 0.05 gives 39%)
  skill_floor: 0.3 # the range factor never falls below this
  geologist_role: geologist # roles.yaml key whose holders do the work
  stages_per_geologist: 1 # desk studies and project stages one geologist can run at once (geologist-months, 34.2)
  energy: 3 # founder energy to start a desk study, a licence or a stage
  desk:
    cost_cents: 20000000 # $200k a desk study (region and commodity), 34.2
    months: 2
    signal: 1.6 # latent desk-study score of a block holding the commodity; empty blocks score 0
    noise_sd: 2.0 # sd of the latent score's noise, x the field and estimation range factors (M18 tuning 1.0 -> 2.0, target 2)
    high_share: 0.1 # the top share of a region's blocks by latent score shown "high" (M18 tuning 0.2 -> 0.1, target 2)
    medium_share: 0.3 # the next share shown "medium"; the rest "low"
  licence:
    years: 5 # an exploration licence's term, 34.2
    renewals: 1 # renewable this many times, for the same fee
  survey:
    cost_cents: 100000000 # $1M x the region's cost_index ($0.75-1.15M; 34.2's $1-3M, tuned for 34.6 target 3)
    months: 4 # 34.2's 6, tuned for target 3's 3-8 years
    signal: 2.2 # latent anomaly reading of a deposit (sds at a factor of 1), x (tonnage / median)^size_weight
    size_weight: 0.25
    noise_sd: 1.5 # x the field and estimation range factors (M18 tuning 1.0 -> 1.5, target 2)
    strong_at: 2.0 # reading at or above: a strong anomaly
    weak_at: 1.0 # at or above: a weak one; below: none
    commodity_misread: 0.1 # chance the anomaly's commodity is read as another of the region's (x the range factor)
    bands: # the stated chance a deposit lies under each reading (shown, never the truth; checked by the M18 runner)
      strong: [0.55, 0.90]
      weak: [0.15, 0.50]
      none: [0.0, 0.10]
  sampling:
    cost_cents: 100000000 # $1M (34.2's $2M, tuned for 34.6 target 3)
    months: 3 # 34.2's 6, tuned for target 3's 3-8 years
    range: 0.60 # half-width of the first grade range at a range factor of 1 (+/-60%), 34.2
  drill:
    hole_base_cents: 9000000 # $90k a hole at the surface ...
    hole_per_m_cents: 35000 # ... plus $350 a metre of depth, x the region's cost_index: about $90-350k (34.2's $150-400k, tuned for target 3)
    holes_per_month: 4 # holes a programme drills a month
    max_programme: 40 # holes in one programme at most
  estimate:
    cost_cents: 100000000 # $1M a resource estimate, 34.2
    months: 2 # 34.2's 3, tuned for target 3's 3-8 years
    inferred: 8 # holes for an inferred resource, 34.2
    indicated: 20
    measured: 40
    tonnage_sd: { inferred: 0.45, indicated: 0.22, measured: 0.11 } # log-sd of the tonnage estimate around the truth at a range factor of 1
  feasibility:
    levels: [scoping, pre_feasibility, definitive]
    cost_cents: { scoping: 100000000, pre_feasibility: 400000000, definitive: 800000000 } # $1M, $4M, $8M (34.2's $2M, $8M, $20M, tuned for 34.6 target 3's $20-60M a permitted project)
    months: { scoping: 4, pre_feasibility: 8, definitive: 12 } # 34.2's 6, 12, 18, tuned for target 3's 3-8 years
    accuracy: { scoping: 0.30, pre_feasibility: 0.15, definitive: 0.08 } # log-sd of capex and operating cost estimates at a range factor of 1 (AACE classes 5, 4, 3 roughly)
    recovery_sd: { scoping: 0.08, pre_feasibility: 0.05, definitive: 0.03 } # sd of the recovery estimate (fraction)
    min_category: { scoping: inferred, pre_feasibility: indicated, definitive: measured }
    recovery_bounds: [0.05, 0.99] # a recovery estimate's centre and ends stay inside these
    life_years: 15 # a mine's life for the NPV
    build_years: { hard_rock: 3, brine: 6, placer: 2 } # years from a decision to first output (dossier 6: hard-rock lithium 3-5, brine 6-10)
    discount_rate: 0.08 # real discount rate of the NPV
    royalty: 0.05 # share of revenue paid in royalties and taxes on output
    infra_capex_per_km: 0.002 # capex x (1 + this x km to infrastructure)
    depth_capex_per_m: 0.0008 # capex x (1 + this x depth in metres)
    kind_capex: { hard_rock: 1.0, brine: 1.15, placer: 0.6 } # capex multiples by deposit type (brine ponds and DLE dearer; placers cheap)
    kind_opex: { hard_rock: 1.0, brine: 0.7, placer: 0.8 } # brine's lower operating cost (dossier 6)
    deck_years: 2 # years of output priced at the deck's current price; the rest at its long-run level
  permitting:
    max_refusal: 0.95 # a permit's refusal chance at most, however hard the block and however often the company pushed on
    requires: definitive # the feasibility level a permit application needs
    benefit_odds: 0.5 # a benefit agreement cuts the refusal chance by this share
    protest_rate: 0.012 # monthly chance of a protest x the block's hidden sensitivity / 0.5
    consult_cents: 50000000 # $500k: consulting the community ...
    consult_months: 3 # ... and the delay it adds
    benefit_cents: 300000000 # $3M: a benefit agreement
    push_legal: 0.25 # pushing on: chance of an injunction (a delay of push_delay_months and legal costs)
    push_delay_months: 6
    push_legal_cents: 100000000 # $1M of legal costs on an injunction
    push_ruthless: 5 # persona Ruthless points for pushing on (34.3, M24's hook)
    refusal_on_push: 0.1 # pushing on adds this to the refusal chance
  minor:
    accident_rate: 0.01 # monthly chance of a drilling accident while a programme runs
    accident_fine_cents: 25000000 # $250k fine; the programme pauses a month
    bonanza_ratio: 2.5 # a hole this many times the running estimate is a bonanza intercept (news)
    dry_streak: 5 # this many holes in a row under half the running estimate is a dry streak (news)
  sale:
    share: { surveyed: 0.0, sampled: 0.02, drilled: 0.05, estimated: 0.08, scoping: 0.12, pre_feasibility: 0.2, definitive: 0.3, permitted: 0.45 } # a buyer pays this share of the project's NPV at the deck at the low end of its revealed ranges (M18 decision: narrower ranges fetch more), 34.2
    anomaly_cents: 50000000 # $500k for a strong anomaly with no grade work yet
    energy: 3
