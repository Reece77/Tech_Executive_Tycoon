# Every tunable number in the game (ADR-0008). Each key: unit and intent.
# Formulas and rationale: docs/formulas.md.

company:
  base_monthly_cost_cents: 50000 # cents per month; base overhead on top of payroll and office ($500 from M1b, $2,000 in M0; formulas.md section 8)

scenario:
  garage_bootstrap:
    starting_cash_cents: 5000000 # cents; founder savings, $50,000 (formulas.md section 8a)
  ex_big_tech_founders:
    starting_cash_cents: 40000000 # cents; savings plus angel money, $400,000
  funded_spinout:
    starting_cash_cents: 150000000 # cents; seed round already closed, $1,500,000
  mineral_first_prospector:
    starting_cash_cents: 500000000 # cents; exploration capital, $5,000,000 (v3 only)

difficulty:
  easy:
    starting_cash_mult_bp: 15000 # basis points applied to scenario starting cash; 1.5x
  standard:
    starting_cash_mult_bp: 10000 # basis points; 1.0x
  hard:
    starting_cash_mult_bp: 6000 # basis points; 0.6x
  ironman:
    starting_cash_mult_bp: 10000 # basis points; 1.0x, difficulty comes from no reloads

backup:
  every_n_turns: 12 # turns; periodic save backup after every Nth committed turn (ADR-0004)
  keep_periodic: 10 # count; periodic backups kept per save, oldest deleted first (ADR-0004)

# --- People (formulas.md sections 2-3) ------------------------------------------------
people:
  level_ca: # target current ability by level: Normal(mean, sd) in CA points (formulas.md 2.1)
    junior: { mean: 70, sd: 12 }
    mid: { mean: 95, sd: 12 }
    senior: { mean: 120, sd: 12 }
    staff: { mean: 140, sd: 10 }
    principal: { mean: 155, sd: 10 }
    exec: { mean: 150, sd: 15 }
  level_age: # years [min, max], uniform integer age for a generated person by level (2.3)
    junior: [21, 28]
    mid: [25, 35]
    senior: [29, 45]
    staff: [32, 50]
    principal: [35, 58]
    exec: [38, 62]
  ca_clip: [30, 190] # CA points; target CA is clipped to this range (2.1)
  skill_noise_sd: # attribute points; noise around the target for role skills (2.2)
    primary: 1.5
    secondary: 2.0
  secondary_offset: 3.0 # attribute points; secondaries centre this far below target/10 (2.2)
  other_skill_range: [1, 8] # attribute points; non-role skills are Uniform(min, max) (2.2)
  ca_tolerance: 2 # CA points; primaries are rescaled until derived CA is this close to target (2.2)
  pa_gap_mean: # CA points; mean of PA - CA by age band, applies from from_age to the next band (2.4)
    - { from_age: 0, value: 45 }
    - { from_age: 25, value: 30 }
    - { from_age: 30, value: 18 }
    - { from_age: 35, value: 8 }
    - { from_age: 45, value: 2 }
  pa_gap_sd: 15 # CA points; sd of the PA gap before it is floored at 0 (2.4)
  personality_mean: 10.5 # attribute points; mean of each personality and hidden trait (2.5)
  personality_sd: 3.5 # attribute points; sd of each personality and hidden trait (2.5)
  interest_count: [2, 4] # count; interests per person, uniform integer in [min, max] (2.6)
  max_tags: 2 # count; behavior tags assigned per person at most (2.7)
  region_weights: # relative weight; region of a generated candidate (2)
    north_america: 55
    europe: 15
    east_asia: 8
    south_southeast_asia: 10
    latin_america: 6
    africa: 3
    oceania: 3
  retire_bp_per_year_over_60: 600 # bp per month per year of age over 59; retirement roll from M1b (3)
  retire_from_age: 60 # years; retirement rolls start at this age; chance uses (age - (retire_from_age - 1)) (3)

payroll:
  salary_round_to_cents: 50000 # cents; salary expectations round to the nearest $500 (2.8)
  benefits_bp: 2000 # bp of monthly salary; benefits posted with payroll (8)
  office_cost_per_head_cents: 60000 # cents per month per staff member, founder included (8)
  severance_months: 1 # months of salary paid when someone is fired (8)

growth: # monthly skill growth and decline (formulas.md section 3)
  rate: 0.12 # attribute points per month; r in the growth formula
  age_factor: # multiplier a(age) on growth, applies from from_age to the next band
    - { from_age: 0, value: 1.3 }
    - { from_age: 25, value: 1.0 }
    - { from_age: 30, value: 0.7 }
    - { from_age: 35, value: 0.4 }
    - { from_age: 45, value: 0.1 }
    - { from_age: 55, value: 0.0 }
  decline: # attribute points per month d(age), subtracted from every skill
    - { from_age: 0, value: 0.0 }
    - { from_age: 50, value: 0.005 }
    - { from_age: 55, value: 0.015 }
  noise_rel_sd: 0.25 # fraction; sd of Normal noise multiplying the growth term, max(0, 1 + noise)

reveal: # revealed ranges (formulas.md section 4, ADR-0007)
  initial_hw: # half-width of a stranger's range
    skill: 5.0 # attribute points
    personality: 7.0 # attribute points
    pa: 40.0 # CA points
  strength: # fraction of hw removed per action, before the scout factor
    job_post_screen: 0.20
    network_intro: 0.30
    interview: 0.35
    reference_check: 0.30
    scouting_month: 0.25
    employed_month: 0.08
  scout_base: 0.5 # scout_factor = scout_base + judgment_of_talent / scout_divisor
  scout_divisor: 40 # attribute points
  pa_phrase_bounds: [70, 100, 130, 160] # CA points; limited/decent/good/excellent/outstanding (M1b)

founder: # founder build (formulas.md section 5)
  skill_base: 5 # attribute points; every skill starts here
  skill_points: 70 # attribute points the player distributes
  skill_cap: 18 # attribute points; no skill may exceed this after background bonuses
  default_age: 28 # years
  age_range: [22, 60] # years; allowed founder ages
  default_region: north_america # regions.yaml key; founder region when none is chosen (name pool)
  energy_per_month: 100 # energy; founder's monthly action budget, reset after phase 12 (6)
  energy_cost: # energy spent at once by each action (6)
    interview: 6
    reference_check: 3
    job_post: 4 # open a job post search
    recruiter: 4 # engage a recruiter
    network: 10 # network search
    offer: 0
    create_unit: 2 # create a department or team (M2, section 13.7)
    dissolve_unit: 2 # dissolve a unit; members and child teams move to the parent (M2)
    move_unit: 2 # move a team under a department or the company (M2, section 13.7)
    set_leader: 2 # set, replace or remove a unit's leader (M2)
    move_person: 1 # move a person to another unit (M2)
    set_policy: 1 # set a unit's work-location policy (M2, section 13.9)
    give_raise: 2 # change someone's salary (M2, section 13.8)
    promote: 3 # promote someone one level (M2, section 13.8)
    hiring_plan: 2 # create or change a hiring plan; closing one is free (M2, section 13.10)

# --- Hiring (formulas.md section 7) -----------------------------------------------------
hiring:
  hint_bands: [-0.3, 0.3] # score; below the first: unlikely, above the second: likely
  channel: # candidate batch size [min, max] and level mix (percent) per channel
    network:
      size: [2, 4] # candidates per batch
      sociability_bonus: 1 # extra candidates when the actor's sociability is high enough
      sociability_threshold: 15 # attribute points; actor sociability needed for the bonus
      level_mix: { junior: 30, mid: 40, senior: 25, staff: 5 }
      knowledge: [network_intro] # knowledge actions applied to each new candidate
    job_post:
      size: [6, 10]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 45, mid: 40, senior: 13, staff: 2 }
      knowledge: [job_post_screen]
    recruiter:
      size: [4, 6]
      sociability_bonus: 0
      sociability_threshold: 0
      level_mix: { junior: 10, mid: 35, senior: 40, staff: 15 }
      knowledge: [job_post_screen, job_post_screen]
  job_post_cost_cents: 50000 # cents per month while a job post is open; also the cash needed to open one
  recruiter_fee_bp: 2000 # bp of annual salary, charged when a recruiter candidate is hired
  candidate_shelf_turns: 3 # turns a candidate stays available after their batch arrives
  lowball_ratio: 0.85 # ratio; offers below this share of the expectation are always declined
  max_offer_equity_bp: 200 # bp; most equity one offer may carry
  pitch_per_recruiting: 0.3 # score per 10 points of the offer maker's recruiting above neutral (M2, 7)
  pitch_neutral: 10 # attribute points; recruiting at which the pitch term is 0 (M2, 7)
  option_pool_bp: 1000 # bp; equity held by staff plus pending offers may not exceed this
  offer: # acceptance score and probability (7)
    w_salary: 4.0 # score per unit of (offer / expectation - 1)
    w_equity: 1.0 # weight on equity value
    w_fit: 0.5 # score per mission interest the candidate shares
    w_risk: 1.0 # score per unit of (10 - risk_appetite) / 10, subtracted
    ambition_equity_boost: 1.5 # multiplier on w_equity when ambition is above the threshold
    ambition_boost_above: 15 # attribute points; ambition must exceed this for the boost
    equity_value_per_bp: 0.002 # score per bp of equity before the stage multiplier
    stage_appeal: { 0: -0.5, 1: 0.0, 2: 0.5, 3: 1.0 } # score by company stage
    stage_equity_mult: { 0: 1.0, 1: 0.8, 2: 0.5, 3: 0.3 } # multiplier on equity value by stage
    k: 3.0 # logistic steepness
    threshold: 0.0 # score at which acceptance is 50%

# --- Morale (formulas.md section 9) -----------------------------------------------------
morale:
  new_hire: 65 # morale points; starting morale for a new hire
  target_base: 50 # morale points; target = target_base + pay + fit + runway + workload
  pay_slope: 60 # morale points per unit of (salary / market mid - 1)
  pay_min: -20 # morale points; floor of the pay term
  pay_max: 15 # morale points; ceiling of the pay term
  fit_per_interest: 5 # morale points per shared mission interest
  work_style_mismatch: -5 # morale points when work style differs from the role's style
  runway_warn_months: 6 # months; runway below this costs runway_warn
  runway_crit_months: 3 # months; runway below this (or cash <= 0) costs runway_crit
  runway_warn: -10 # morale points
  runway_crit: -20 # morale points
  workload_term: 0 # morale points; placeholder until projects (M3)
  rate: 0.3 # fraction of the gap to target closed each month
  noise_scale: 2.0 # morale points; noise sd = noise_scale x (21 - temperament) / 20
  fire_penalty: -3 # morale points to everyone remaining when someone is fired
  fire_penalty_culture_carrier: -6 # morale points instead, if the fired person is a culture carrier

# --- Resignations and tag reveals (formulas.md section 10) ------------------------------
resign:
  base_bp: 50 # bp per month before modifiers
  cap_bp: 2000 # bp per month at most
  morale_floor: 40 # morale points; below this the chance rises
  morale_divisor: 20 # morale points per +100% chance below the floor
  loyalty_divisor: 10 # loyalty term (21 - loyalty) / loyalty_divisor
  job_hopper_mult: 2.0 # multiplier for the job_hopper tag

tags:
  reveal_bp_per_month: 500 # bp per hidden tag per month for employees
  reveal_bp_on_check: 1500 # bp per hidden tag on an interview or reference check

# --- Organization (formulas.md section 13, M2) -----------------------------------------
org:
  department_unlock_headcount: 10 # people on staff (founder included) before departments unlock (13.1)
  span_base: 5 # reports; span limit L = span_base + floor(leadership / span_per_leadership) (13.2)
  span_per_leadership: 4 # attribute points of leadership per extra report in L (13.2)
  manager_morale_slope: 0.8 # morale points per point of manager quality above 10 (13.4)
  manager_morale_cap: 8 # morale points; W_mgr is clamped to [-cap, +cap] (13.4)
  mentoring_neutral: 5 # attribute points; mentoring x S + bonus at which growth is unchanged (13.5)
  mentoring_divisor: 20 # attribute points per +100% growth in M_growth (13.5)
  mentor_tag_bonus: 3 # attribute points added when another member of the unit is a mentor (13.5)
  growth_mult_min: 0.75 # multiplier; floor of M_growth (13.5)
  growth_mult_max: 1.5 # multiplier; ceiling of M_growth (13.5)
  tag_morale: # morale points each holder adds to every other member's morale target (13.6)
    culture_carrier: 2
    credit_taker: -2
    toxic_high_performer: -3
  tag_morale_cap: # morale points; the sum per tag is capped at this (same sign as the effect) (13.6)
    culture_carrier: 2
    credit_taker: -4
    toxic_high_performer: -6
  reorg: # one-off morale points (13.7)
    move: -2 # the person moved to another unit
    new_leader_members: -1 # each other member when a unit's leader is set or replaced
    replaced_leader: -5 # a replaced or removed leader who stays in the unit
    dissolve_members: -2 # each member of a dissolved unit
  raise_morale: 3 # morale points, once, for a raise of at least raise_threshold_bp (13.8)
  raise_threshold_bp: 500 # bp; a raise this large or larger earns raise_morale (13.8)
  raise_cooldown_turns: 12 # turns; raise_morale is given at most once in this many turns per person (13.8)
  pay_cut_morale: -10 # morale points, once, for any pay cut (13.8)
  promote_morale: 5 # morale points, once, for a promotion (13.8)
  remote: # work-location policy morale terms (13.9)
    sociable_at: 14 # attribute points; sociability at or above this dislikes remote work
    sociable_morale: -3 # morale points for a sociable remote worker
    solitary_at: 7 # attribute points; sociability at or below this prefers remote work
    solitary_morale: 2 # morale points for a solitary remote worker

delegates: # delegated hiring (formulas.md section 13.10, ADR-0015)
  energy_per_month: 100 # energy; each delegate's monthly budget, reset with the founder's
  scout_cost: 20 # energy; one scouting pass over a plan's candidates; also the reserve kept back while interviewing
  max_ratio_bp: 12000 # bp of the ask; highest salary ratio a plan may offer (1.2x)
