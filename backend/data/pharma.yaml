# --- Exclusivity (55.3) ----------------------------------------------------------------------------
# US: patent 20 years from filing (35 U.S.C. 154); Hatch-Waxman (1984) term restoration of half the
# testing phase plus the review, at most 5 years and 14 years after approval (35 U.S.C. 156); orphan
# exclusivity 7 years (Orphan Drug Act 1983, 21 U.S.C. 360cc) (confirmed). EU: 8 years' data protection,
# 2 years' market protection, +1 year for a significant new indication (Directive 2004/27/EC, EMA:
# https://www.ema.europa.eu/en/documents/presentation/presentation-data-exclusivity-market-protection-and-paediatric-rewards-zaide-frias_en.pdf);
# the SPC (Reg. 469/2009): approval - filing - 5 years, at most 5 years and 15 after approval; orphan
# market exclusivity 10 years (Reg. 141/2000 art. 8) (confirmed). Elsewhere (A): the patent and 6 years'
# data protection (Japan's re-examination is 8, China's data protection 6).
exclusivity:
  us: { patent_years: 20, pte_max_years: 5, pte_cap_years: 14, pte_trial_share: 0.5, orphan_years: 7 }
  eu: { data_years: 8, market_years: 2, extra_years: 1, spc_max_years: 5, spc_cap_years: 15, spc_offset_years: 5, orphan_years: 10 }
  other: { data_years: 6 }

# --- The Inflation Reduction Act (55.4) ------------------------------------------------------------
# Signed 16 Aug 2022. Negotiated Medicare prices take effect 9 years after approval for small molecules
# and 13 for biologics (selection at 7 and 11; IRA 1192(e), confirmed). Round 1: 10 drugs selected 29 Aug
# 2023, prices from 1 Jan 2026, 22% net savings (38-79% off list); round 2: 15 drugs including
# semaglutide, prices from 1 Jan 2027, 44% net savings (KFF, https://www.kff.org/medicare/key-facts-about-medicare-drug-price-negotiation/ ;
# https://www.fiercepharma.com/pharma/medicare-unveils-price-reductions-15-drugs-including-novos-semaglutide ;
# confirmed). Round 3 (2028): 15 drugs with Part B included, and 20 a year from 2029 (the statute;
# discount A at 35%). Orphan drugs for a single rare disease are excluded (the statute).
ira:
  small_molecule_years: 9
  biologic_years: 13
  rounds:
    - { year: 2026, drugs: 10, discount: 0.22 }
    - { year: 2027, drugs: 15, discount: 0.44 }
    - { year: 2028, drugs: 15, discount: 0.35 }
    - { year: 2029, drugs: 20, discount: 0.35 }
  selected: [Eliquis, Januvia, Farxiga, Entresto, Stelara, Ozempic, Wegovy]
  source: "IRA 1192; CMS and KFF on rounds 1-2 (confirmed); rounds 3-4 discounts A"

# --- Prices by region (55.4) -----------------------------------------------------------------------
# price_index: a brand's net price there x the US net price. RAND (Mulcahy, Schwam and Lovejoy 2024,
# RR-A788-3, 2022 data): US prices 278% of 33 OECD countries' for all drugs (confirmed), and about 3x for
# brand-name originators after rebates (est.): other high-income regions about 0.33-0.40 (derived), the
# rest A. hta: prices set by health-technology assessment (NICE, G-BA, HAS; Japan's NHI price list;
# China's NRDL; Australia's PBAC). hta_max_premium: a list price more than this above the value cap
# is not reimbursed (A; NICE's threshold rose from GBP 20-30k to 25-35k a QALY from April 2026:
# https://www.nice.org.uk/news/articles/changes-to-nice-s-cost-effectiveness-thresholds-confirmed).
# hta_months: EFPIA's Patients W.A.I.T. Indicator, about 531 days on average from EU approval to
# availability (2023 survey, est.): 12-24 months.
pricing:
  regions:
    - { region: north_america, price_index: 1.0, hta: false }
    - { region: europe, price_index: 0.35, hta: true }
    - { region: east_asia, price_index: 0.30, hta: true }
    - { region: south_southeast_asia, price_index: 0.10, hta: false }
    - { region: latin_america, price_index: 0.25, hta: false }
    - { region: africa, price_index: 0.10, hta: false }
    - { region: oceania, price_index: 0.40, hta: true }
  hta_max_premium: 0.3
  hta_months: [12, 24]
  source: "RAND RR-A788-3 (2024); EFPIA W.A.I.T. (est.); A"

# --- Approval (55.3) -------------------------------------------------------------------------------
# FDA: PDUFA goals for new molecular entities, act within 10 months (standard) or 6 (priority) of the
# 60-day filing date, so 12 or 8 months from submission (PDUFA VII goals letter,
# https://fda.gov/media/151712/download, confirmed); accelerated approval from December 1992 (21 CFR 314
# subpart H), breakthrough therapy from FDASIA, 9 July 2012 (confirmed). In 2024 CDER approved 50 novel
# drugs (55 in 2023): 56% with priority review, 36% breakthrough, 14% accelerated approval, 74% on the
# first cycle (FDA, New Drug Therapy Approvals 2024, https://fda.gov/media/184967/download, confirmed).
# Advisory committees: 55-59% of novel approvals in 2010-2011, 6-8% in 2020-2021 (Zhang et al., Health
# Affairs 2022, doi:10.1377/hlthaff.2021.01927, confirmed via summaries): adcom_share 0.2 (A, between).
# EMA: up to 210 active days plus clock stops; 465 days on average from the start of evaluation to the
# Commission's decision in 2023 (EMA Annual Report 2023, confirmed): 13-17 months; accelerated
# assessment 150 days (9-12 months with stops, est.); PRIME from March 2016; conditional approval from
# 2006 (Reg. 507/2006). PMDA: a 12-month review target for standard new drugs, 9 for priority (A, est.);
# NMPA: priority review from 2017 reforms; standard review long before them (A).
# crl_resubmit_months: a class 2 resubmission's 6-month goal (PDUFA) plus the time to answer (A).
# reliance_months: other regions register on an FDA or EU approval (A, as M41's reliance).
approval:
  reviews:
    - { regulator: fda_drugs, application: NDA/BLA, standard_months: [11, 13], priority_months: [7, 9], priority_from: "1992-10", breakthrough_from: "2012-07", accelerated_from: "1992-12", adcom_share: 0.2, source: "PDUFA VII goals letter; FDA New Drug Therapy Approvals 2024" }
    - { regulator: ema, application: MAA, standard_months: [13, 17], priority_months: [9, 12], priority_from: "2006-01", breakthrough_from: "2016-03", accelerated_from: "2006-04", source: "EMA Annual Report 2023" }
    - { regulator: pmda_drugs, application: J-NDA, standard_months: [11, 14], priority_months: [8, 10], priority_from: "2010-01", source: "A (PMDA review targets, est.)" }
    - { regulator: nmpa_drugs, application: NDA (China), standard_months: [14, 24], priority_months: [10, 14], priority_from: "2017-10", source: "A (NMPA reforms from 2015-2017, est.)" }
  crl_resubmit_months: [8, 14]
  reliance_months: [6, 18]
  source: "PDUFA VII; FDA 2024 approvals report; EMA Annual Report 2023"

# --- AI-driven discovery (55.2) --------------------------------------------------------------------
# Jayatunga, Ayers, Bruens, Jayanth and Meier, "How successful are AI-discovered drugs in clinical
# trials?", Drug Discov Today 29:104009 (2024), doi:10.1016/j.drudis.2024.104009: Phase I success 80-90%
# and Phase II about 40% in a small sample (confirmed). AI discovery is possible from AlphaFold 2's CASP14
# (November 2020; Jumper et al., Nature 596:583 (2021), doi:10.1038/s41586-021-03819-2, confirmed).
ai:
  phase1: 0.85
  phase2: 0.40
  from_month: "2020-11"
  source: "Jayatunga et al. 2024; Jumper et al. 2021"

