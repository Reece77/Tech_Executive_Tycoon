# --- Stages (55.1) ---------------------------------------------------------------------------------
# months: BIO 2021 phase durations: Phase II 3.6 years, Phase III 3.3, review 1.3, 10.5 in all from
# Phase I (confirmed), so Phase I 2.3 (derived); ranges +/- 20% (A). Discovery and preclinical: Paul et
# al. 2010's cycle times, target-to-hit 1.0, hit-to-lead 1.5, lead optimisation 2.0 years (4.5 in
# discovery) and preclinical 1.0 (confirmed); ranges A.
# patients: the FDA's typical sizes, Phase 1 20-80, Phase 2 100s, Phase 3 300-3,000
# (https://www.fda.gov/patients/drug-development-process/step-3-clinical-research, est. via
# reproductions); the game's lean to large (A within them).
# cost_per_patient and fixed (real USD): Phase III $41,413 per patient, the median of 225 pivotal trials
# (Moore et al., BMJ Open 10:e038863 (2020), doi:10.1136/bmjopen-2020-038863, confirmed), with $5M fixed
# so a standard Phase III (1,150 patients) is about $53M, near Moore's $48M per drug (derived). Phase I
# and II from Martin et al., "How much do clinical trials cost?", Nat Rev Drug Discov 16:381 (2017),
# doi:10.1038/nrd.2017.70, medians $3.4M (Phase I in patients) and $8.6M (Phase II) a trial (confirmed):
# a standard Phase I (60 patients) $40,000 x 60 + $1.0M = $3.4M, Phase II (200) $30,000 x 200 + $2.6M =
# $8.6M (derived split, A). Discovery and preclinical: Paul et al. 2010's cost per candidate, $13.5M
# through lead optimisation and $5M preclinical (confirmed), a month over their months (derived).
stages:
  discovery: { months: [43, 65], fixed: 250000 }
  preclinical: { months: [10, 14], fixed: 420000 }
  phase1: { months: [22, 33], patients: [20, 100], cost_per_patient: 40000, fixed: 1000000 }
  phase2: { months: [35, 52], patients: [100, 300], cost_per_patient: 30000, fixed: 2600000 }
  phase3: { months: [32, 48], patients: [300, 2000], cost_per_patient: 41413, fixed: 5000000 }

# --- Modalities (55.1) -----------------------------------------------------------------------------
# us_data_years: new chemical entity exclusivity 5 years (21 U.S.C. 355(j)(5)(F)(ii)); biologics 12
# from first licensure (BPCIA 2010, 42 U.S.C. 262(k)(7)) (confirmed).
# erosion: small molecules: FDA, "Generic Competition and Drug Prices" (Conrad and Lutter, Dec 2019),
# prices 39% below the brand's with one generic, 79% with four, over 95% with six or more
# (https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/generic-competition-and-drug-prices,
# confirmed): price_share 0.15. Lipitor: US generics 30 Nov 2011, Q1 2012 worldwide sales $1.4B against
# $2.39B (-42% with the US about half), Q2 $1.22B against $2.59B
# (https://pharmafile.com/news/pfizer-weathers-patent-expiry-storm/, confirmed): the brand keeps about
# 15-20% of US patients within a year: floor 0.10, months 4 (derived, A for the shape).
# Biologics: Humira's US biosimilars from 31 Jan 2023, worldwide revenue $21.2B (2022, derived from
# -32%), $14.40B (2023) and $8.99B (2024) (https://news.abbvie.com/2025-01-31-AbbVie-Reports-Full-Year-and-Fourth-Quarter-2024-Financial-Results,
# confirmed): kept 68% after a year and 42% after two: floor 0.25, months 18 (derived fit: 0.64 and
# 0.45); price_share 0.2: Humira's unbranded biosimilars launched 80-86% below its list price in 2023 (est.,
# company announcements). Cell and gene therapies: no biosimilars yet (A: slow, shallow).
# cogs_share / cmo_share: cost of goods x net price, own plant or contract manufacturer (A: small
# molecules about 5-10% of sales, biologics more; a CMO's margin on top).
# cost_mult: x trials' cost per patient (A: biologics' CMC and immunogenicity work; cell and gene
# therapies' manufacturing per patient).
modalities:
  - { key: small_molecule, label: Small molecule, cost_mult: 1.0, us_data_years: 5, biologic: false, cogs_share: 0.08, cmo_share: 0.15, erosion: { floor: 0.10, months: 4, price_share: 0.15 } }
  - { key: biologic, label: Biologic, cost_mult: 1.3, us_data_years: 12, biologic: true, cogs_share: 0.15, cmo_share: 0.25, erosion: { floor: 0.25, months: 18, price_share: 0.2 } }
  - { key: cell_and_gene, label: Cell and gene therapy, cost_mult: 2.0, us_data_years: 12, biologic: true, cogs_share: 0.30, cmo_share: 0.40, erosion: { floor: 0.60, months: 36, price_share: 0.6 } }

