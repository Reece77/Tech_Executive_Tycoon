# Pharmaceuticals (docs/formulas.md 55, M42). Built from docs/v5-research/pharma-dossier.md and the
# M42 session's verification (2026-11-18). Every value carries its source; "est." marks a figure from
# a secondary source, a recalled filing figure consistent with reported growth, or a range's midpoint;
# "derived" a figure computed from cited inputs; "A" an assumption for gameplay where no public figure
# exists (each listed in the M42 brief's "Decisions made"). Money is real US dollars (the engine
# converts with pharma.scale, the game's economy); foreign currencies are converted at the year's
# average rate: 2010 US Federal Reserve G.5A (https://www.federalreserve.gov/releases/g5a/20110103),
# 2024-2025 IRS yearly averages (https://www.irs.gov/individuals/international-taxpayers/yearly-average-currency-exchange-rates):
# CHF 1.043 / 0.881 / 0.831 (2010 est.), DKK 5.6266 / 6.896 / 6.617, EUR 0.754 (est.) / 0.924 / 0.886,
# GBP 0.647 (est.) / 0.783 (est.) / 0.759, INR 45.65 / 83.68 / 87.13, KRW 1,364 (2024), CNY 7.189 (2024).
#
# History holds (55.6 target 1): the pharma model's programmes, reviews and plants act only for a
# company that has entered pharmaceuticals. Rivals' revenue to 2025 is this file's (the companies'
# reported revenue); a company without pharma draws, posts and logs nothing here.

history_end: "2025-12"

# Preclinical to Phase I (BIO's series starts at Phase I): 69%, Paul et al., "How to improve R&D
# productivity: the pharmaceutical industry's grand challenge", Nat Rev Drug Discov 9:203-214 (2010),
# doi:10.1038/nrd3078 (confirmed: its model's preclinical p(TS) 69%).
preclinical_success: 0.69
preclinical_source: "Paul et al. 2010, Nat Rev Drug Discov 9:203, doi:10.1038/nrd3078"

# --- Therapeutic areas (55.1) ----------------------------------------------------------------------
# transitions: BIO, Informa Pharma Intelligence and QLS Advisors, "Clinical Development Success Rates
# and Contributing Factors 2011-2020" (Feb 2021), by disease area (9,704 programmes; each area's four
# rates multiply to its quoted likelihood of approval within 0.1 points, the check made when they were
# read): https://go.bio.org/rs/490-EHZ-999/images/ClinicalDevelopmentSuccessRates2011_2020.pdf
# (confirmed; tables via https://selborneresearch.com/guides/healthcare/clinical-trial-success-by-therapeutic-area/).
# All indications: 52.0% / 28.9% / 57.8% / 90.6%, LOA 7.9%. Neuroscience is the mean of BIO's neurology
# (47.7/26.8/53.1/86.7, LOA 5.9%) and psychiatry (52.7/26.8/56.3/91.2, LOA 7.3%) (derived).
# cost_mult: trials' cost per patient x this. Oncology 1.6: Hsiue, Moore and Alexander, Clin Trials
# 17:119 (2020), doi:10.1177/1740774520907609, oncology pivotal median $31.7M against $19.0M for all
# pivotal trials (Moore et al., JAMA Intern Med 178:1451 (2018), doi:10.1001/jamainternmed.2018.3931):
# x1.67 (confirmed, rounded). Cardiovascular 1.3 and metabolic 1.2: outcome trials are large (A; Sertkaya
# et al., Clin Trials 13:117 (2016), doi:10.1177/1740774515625964, gives per-study Phase 3 costs from
# $11.5M to $52.9M by area). The rest 1.0 (A).
# months_mult: BIO 2021's oncology Phase I 2.7 years against 2.3 for all (x1.17; Phase II 3.7 v 3.6, III
# 3.1 v 3.3: about x1.05 over the three, derived); cardiovascular and neuroscience 1.1 (A: long outcome
# and CNS trials); rare disease 0.9 (A: smaller trials enrol faster per patient needed).
# gross_to_net: US list-to-net. Drug Channels Institute: brand gross-to-net reductions $356B in 2024,
# net prices about half of list on average (https://www.drugchannels.net/2025/07/gross-to-net-bubble-hits-356b-in.html,
# confirmed). By area A around that mean: rebated, competitive classes (insulins and GLP-1s, immunology,
# anticoagulants) deeper; oncology and rare disease (few rebates, buy-and-bill) shallower.
# region_share: treated patients by region, the same for every area (A, derived): IQVIA's US share of
# world spending about 45-50% on a list basis (IQVIA Institute, Global Use of Medicines 2025, est.) and
# the other regions' shares of spending (A: Europe 22%, East Asia 20%, South and Southeast Asia 4%,
# Latin America 5%, Africa 2%, Oceania 1.5%), each divided by its price index (pricing below).
# sales_cents: real cents a month a region for full commercial support (medical affairs, sales force):
# A, $2M a month a region (about 100 representatives); oncology and rare disease less (specialists).
areas:
  - key: oncology
    label: Oncology
    category: pharma_oncology
    transitions: { phase1: 0.488, phase2: 0.246, phase3: 0.477, submission: 0.920 } # BIO 2021 oncology, LOA 5.3% (confirmed)
    cost_mult: 1.6
    months_mult: 1.05
    gross_to_net: 0.25 # A
    region_share: &shares { north_america: 0.174, europe: 0.243, east_asia: 0.259, south_southeast_asia: 0.154, latin_america: 0.077, africa: 0.078, oceania: 0.015 }
