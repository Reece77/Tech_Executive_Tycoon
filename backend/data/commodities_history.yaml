# Commodity price history to December 2025 (docs/formulas.md 33.1, M17, lane A).
# Data: docs/v3-research/v3-data-dossier.md 1.1 (annual table), 1.2 (quartz, neon) and 1.3
# (shocks). The same on every seed; after 2025 each good moves by a seeded log-price AR(1)
# with shocks (stream `commodity`, key (0, good_index) in this file's order: append new goods
# and never reorder).
#
# years: each year's value [price, source tag], held for every month of that year. Tags (the
#   dossier's): V verified against the cited source, D derived from verified figures, R
#   recalled (spot-check before relying on it), e the source's own estimate, A an assumption
#   (no public series; the basis is in the comment).
# shocks: dossier 1.3 shocks placed in their months. Inside [first, last point] a month's price
#   is geometric between the points (a constant monthly rate), replacing the held annual
#   value; outside, the annual value holds. The loader rejects a year without a value.
# allocation: months a good was short (spot buyers get that share; 100% outside them).
# Prices are in each good's `unit`; commodities.yaml converts a unit to dollars per volume unit.
# M50 (ADR-0024, formulas.md 60.2; 2026-11-23): 2008 and 2009 years added to every good, and
#   2008-2009 shocks (the mid-2008 peak and Q4 crash) for copper, tin, nickel, cobalt and
#   polysilicon, appended after any existing shock (shock order is not a stream key; they never
#   overlap and end by December 2009, so 2010 onward is unchanged). Same tags: V read this session
#   from USGS Mineral Commodity Summaries 2010-2012 (https://d9-wret.s3.us-west-2.amazonaws.com/
#   assets/palladium/production/mineral-pubs/<mineral>/mcs-<year>-<abbr>.pdf) or FRED's IMF
#   series (PCOPPUSDM, PTINUSDM, PNICKUSDM: https://fred.stlouisfed.org/graph/fredgraph.csv?id=<id>),
#   D derived (as each row says), R recalled from the named source.
# M50b (formulas.md 60.4; 2026-11-28): 2000-2007 years added to every good the same way, and each
#   2008 shock's points extended back to January 2000 (its 2008-2009 points unchanged, so 2008 on is
#   unchanged) with a new 2000 tantalum spike. Sources: USGS MCS 2005-2012 (<mineral>/<abbr>mcs05.pdf,
#   mcs-2009-<abbr>.pdf at the URL above), USGS Minerals Yearbook (lithium), FRED's IMF series.
