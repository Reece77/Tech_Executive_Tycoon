    unit: ¢/lb
    years:
      2010: [140, V]
      2011: [158, V]
      2012: [127, V]
      2013: [122, V]
      2014: [140, V]
      2015: [127, V]
      2016: [91, V]
      2017: [116.6, V]
      2018: [134.2, V]
      2019: [105.7, V]
      2020: [96.8, V]
      2021: [220.3, V]
      2022: [361.9, V] # China's "dual control" power curbs (1.3)
      2023: [179.7, V]
      2024: [170.3, V]
      2025: [130, e]

  # Polysilicon, solar grade spot (Bernreuter to 2019; dagger years are rough levels from key
  # points, D). The good's price is semiconductor grade: this x commodity.semi_poly_multiple
  # (an assumption, 33.1); its index is the same.
  - key: polysilicon
    unit: $/kg
    years:
      2010: [60, V]
      2011: [56, V]
      2012: [22, V]
      2013: [17, V]
      2014: [20.5, V]
      2015: [16, V]
      2016: [15, V]
      2017: [16, V]
      2018: [13, V]
      2019: [9, V]
      2020: [9, D] # trough $6.75 Jun, $12.45 Sep, $10.40 Dec (V)
      2021: [25, D] # rose from about $10 to $41.65 (Oct, China mono-dense)
      2022: [32, D] # peak $39 Aug
      2023: [12, D] # $22.70 Jan to $7.72 Dec
      2024: [7, D]
      2025: [7, D] # $6.88 on 3 Dec 2025
    shocks:
      # the 2011-2012 crash: $79/kg (Mar 2011) to under $30 (late 2011) to $15.35-15.90 (Dec 2012), V
      - { label: Polysilicon glut, source: V, points: { "2011-01": 60, "2011-03": 79, "2011-12": 30, "2012-12": 15.6 } }
      # dual-control power curbs: about $10 to $41.65 (Oct 2021), peak $39 (Aug 2022), V
      - { label: Dual-control power curbs, source: V, points: { "2021-01": 10, "2021-10": 41.65, "2022-08": 39, "2022-12": 25 } }

