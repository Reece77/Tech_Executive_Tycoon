# Commodity price history to December 2025 (docs/formulas.md 33.1, M17, lane A).
# Data: docs/v3-research/v3-data-dossier.md 1.1 (annual table), 1.2 (quartz, neon) and 1.3
# (shocks). The same on every seed; after 2025 each good moves by a seeded log-price AR(1)
# with shocks (stream `commodity`, key (0, good_index) in this file's order: append new goods
# and never reorder).
#
# years: each year's value [price, source tag], held for every month of that year. Tags (the
#   dossier's): V verified against the cited source, D derived from verified figures, R
#   recalled (spot-check before relying on it), e the source's own estimate, A an assumption
#   (no public series; the basis is in the comment).
# shocks: dossier 1.3 shocks placed in their months. Inside [first, last point] a month's price
#   is geometric between the points (a constant monthly rate), replacing the held annual
#   value; outside, the annual value holds. The loader rejects a year without a value.
# allocation: months a good was short (spot buyers get that share; 100% outside them).
# Prices are in each good's `unit`; commodities.yaml converts a unit to dollars per volume unit.
goods:
  # High-purity quartz (crucible grade). No public series (dossier 1.2): USGS ground HPQ
  # ranges 2021-2025, midpoint (D); flat at the 2021 level before (formulas 33.1).
  - key: quartz_hp
    unit: $/t
    years:
      2010: [8250, D] # 2021 level held back (33.1)
      2011: [8250, D]
      2012: [8250, D]
      2013: [8250, D]
      2014: [8250, D]
      2015: [8250, D]
      2016: [8250, D]
      2017: [8250, D]
      2018: [8250, D]
      2019: [8250, D]
      2020: [8250, D]
      2021: [8250, D] # USGS 500-16,000 (V), midpoint
      2022: [8750, D] # USGS 500-17,000
      2023: [10250, D] # USGS 500-20,000
      2024: [8750, D] # USGS 500-17,000
      2025: [6250, D] # USGS 500-12,000 e
    shocks:
      # Hurricane Helene shut Spruce Pine for several weeks (late September 2024, R); size A
      - { label: Hurricane Helene at Spruce Pine, source: R, points: { "2024-09": 8750, "2024-10": 13125, "2024-11": 13125, "2024-12": 8750 } }
    allocation:
      - { start: "2024-10", end: "2024-11", share: 0.60 } # A: weeks of lost output

