# Product categories and market segments (docs/formulas.md 11.1 and 11.3, M3).
# Order is significant: the `market` RNG stream is keyed (category_index, segment_index)
# in the order of this file (ADR-0017), so append new entries and never reorder.
#
# segments: how customers in each segment choose (11.1 segment table, 11.6, 11.7).
# - weights: appeal weights on quality / price / brand / features (sum to 1).
# - outside_option: appeal of buying nothing (a0).
# - base_churn: fraction of a product's customers lost per month before modifiers.
# - adoption: fraction of unserved demand that comes into play per month.
# - reach: self_serve (new customers limited by awareness) or sales (by sales capacity).
#
# categories: per category (11.1 category table) and per segment it sells to.
# - growth: annual growth of addressable demand (fraction per year).
# - features_at_start: features the market expects at turn 0 (F0).
# - features_per_month: expected features added per month (dF).
# - scope: team output that counts as full speed (sigma, 11.4).
# - brand_constant: marketing points for half of the maximum brand (K, 11.5).
# - dev_weights: skill weights of the development skill d (11.3), summing to 1.
# - launch_quality (M8, optional): launch also needs at least this quality (compliance).
# - growth_by_year (M8, optional): annual growth from each listed calendar year on; replaces
#   `growth` for demand (formulas.md 18.6).
# - compute_indexed (M8, optional): hosting is h x compute_index(year) (compute_index.yaml).
# - markets: addressable customers in January 2010 (D0), reference monthly price and hosting
#   cost per customer per month, both in cents.
# regions (M9, formulas.md 19.5): each region's market size (x the home region's D0 for every
# category and segment), price index (x p_ref) and sales neighbour (sellers there count 50%).
# Listed in regions.yaml order; the regional `market` key is (category_index, segment_index,
# region_index) with region_index the region's position in regions.yaml. When the HQ is not
# in North America, size and price index are taken relative to the home region's row.
regions:
  - { region: north_america, size: 1.00, price_index: 1.00, neighbour: latin_america }
  - { region: europe, size: 0.55, price_index: 0.90, neighbour: africa }
  - { region: east_asia, size: 0.45, price_index: 0.80, neighbour: south_southeast_asia }
  - { region: south_southeast_asia, size: 0.40, price_index: 0.35, neighbour: east_asia }
  - { region: latin_america, size: 0.25, price_index: 0.50, neighbour: north_america }
  - { region: africa, size: 0.06, price_index: 0.35, neighbour: europe }
  - { region: oceania, size: 0.10, price_index: 0.95, neighbour: south_southeast_asia }

segments:
  - key: consumer
    label: Consumer
    weights: { quality: 0.30, price: 0.20, brand: 0.30, features: 0.20 }
    outside_option: 45
    base_churn: 0.06
    adoption: 0.03
    reach: self_serve
  - key: smb
    label: SMB
    weights: { quality: 0.25, price: 0.35, brand: 0.15, features: 0.25 }
    outside_option: 45
    base_churn: 0.03
    adoption: 0.015
    reach: self_serve
  - key: mid_market
    label: Mid-market
    weights: { quality: 0.30, price: 0.25, brand: 0.20, features: 0.25 }
    outside_option: 45
    base_churn: 0.015
    adoption: 0.01
    reach: sales
  - key: enterprise
    label: Enterprise
    weights: { quality: 0.35, price: 0.10, brand: 0.25, features: 0.30 }
    outside_option: 45
    base_churn: 0.008
    adoption: 0.005
    reach: sales
  # M12a (formulas.md 22.3): cloud buyers at hyperscale, sales-led
  - key: hyperscalers
    label: Hyperscalers
    weights: { quality: 0.40, price: 0.40, brand: 0.05, features: 0.15 }
    outside_option: 45
    base_churn: 0.005
    adoption: 0.003
    reach: sales
  # M12b (formulas.md 26.1, 26.2): makers of devices and servers buying chips or contract
  # manufacturing, sales-led
  - key: device_oems
    label: Device OEMs
    weights: { quality: 0.35, price: 0.35, brand: 0.10, features: 0.20 }
    outside_option: 45
    base_churn: 0.04 # contract manufacturing customers; chip markets use replacement_months
    adoption: 0.01
    reach: sales

categories:
  - key: b2b_saas
    label: B2B SaaS
    growth: 0.20
    features_at_start: 60
    features_per_month: 4.0
    scope: 6
    brand_constant: 60
    dev_weights: { software_engineering: 0.35, product: 0.20, design: 0.15, infrastructure: 0.15, data: 0.10, security: 0.05 }
    markets:
      - { segment: smb, addressable: 400000, reference_price_cents: 5000, hosting_cents: 400 }
      - { segment: mid_market, addressable: 40000, reference_price_cents: 80000, hosting_cents: 5000 }
      - { segment: enterprise, addressable: 4000, reference_price_cents: 800000, hosting_cents: 40000 }

  - key: dev_tools
    label: Developer tools
    growth: 0.25
    features_at_start: 50
    features_per_month: 4.0
    scope: 5
    brand_constant: 50
    dev_weights: { software_engineering: 0.40, infrastructure: 0.25, product: 0.15, data: 0.10, security: 0.10 }
    markets:
      - { segment: smb, addressable: 200000, reference_price_cents: 3000, hosting_cents: 600 }
      - { segment: mid_market, addressable: 20000, reference_price_cents: 50000, hosting_cents: 8000 }
      - { segment: enterprise, addressable: 3000, reference_price_cents: 500000, hosting_cents: 70000 }

  - key: consumer_apps
    label: Consumer apps
    growth: 0.30
    features_at_start: 40
    features_per_month: 5.0
    scope: 4
    brand_constant: 300
    dev_weights: { software_engineering: 0.30, design: 0.25, product: 0.25, marketing: 0.10, data: 0.10 }
    markets:
      # Consumer apps book revenue per user (11.8): the reference price is revenue per user.
      - { segment: consumer, addressable: 50000000, reference_price_cents: 40, hosting_cents: 4 }

  - key: cybersecurity
    label: Cybersecurity
    growth: 0.15
    features_at_start: 70
    features_per_month: 3.5
    scope: 7
    brand_constant: 70
    dev_weights: { security: 0.40, software_engineering: 0.25, infrastructure: 0.20, data: 0.10, product: 0.05 }
    markets:
      - { segment: smb, addressable: 300000, reference_price_cents: 4000, hosting_cents: 300 }
      - { segment: mid_market, addressable: 30000, reference_price_cents: 100000, hosting_cents: 6000 }
      - { segment: enterprise, addressable: 5000, reference_price_cents: 1200000, hosting_cents: 60000 }

  # --- M8 (formulas.md 18.6), open from January 2010 ---
  - key: fintech
    label: Fintech
    growth: 0.25
    features_at_start: 60
    features_per_month: 4.0
    scope: 6
    brand_constant: 80
    launch_quality: 30
    dev_weights: { software_engineering: 0.30, security: 0.20, finance: 0.20, legal: 0.15, data: 0.15 }
    markets:
      # Consumer fintech books revenue per user (11.8): the reference price is revenue per user.
      - { segment: consumer, addressable: 20000000, reference_price_cents: 60, hosting_cents: 5 }
      - { segment: smb, addressable: 300000, reference_price_cents: 6000, hosting_cents: 500 }
      - { segment: mid_market, addressable: 25000, reference_price_cents: 120000, hosting_cents: 8000 }
      - { segment: enterprise, addressable: 2500, reference_price_cents: 1500000, hosting_cents: 90000 }

  - key: ai_models
    label: AI models and inference
    growth: 0.25 # the fallback before the first growth_by_year year (none: 2010 is listed)
    features_at_start: 30
    features_per_month: 6.0
    scope: 8
    brand_constant: 70
    compute_indexed: true
    # M8 tuning (target 4, January 2024 demand 100-400x January 2010): 2016-2019 at 50%, not
    # the brief's 60% (which gives about 465x).
    growth_by_year: { 2010: 0.30, 2016: 0.50, 2020: 0.40, 2022: 1.50, 2023: 2.00, 2024: 1.20, 2025: 0.60, 2030: 0.25 }
    dev_weights: { ml_research: 0.40, software_engineering: 0.20, data: 0.20, infrastructure: 0.20 }
    markets:
      - { segment: consumer, addressable: 200000, reference_price_cents: 50, hosting_cents: 20 }
      - { segment: smb, addressable: 20000, reference_price_cents: 10000, hosting_cents: 4000 }
      - { segment: mid_market, addressable: 2000, reference_price_cents: 200000, hosting_cents: 60000 }
      - { segment: enterprise, addressable: 300, reference_price_cents: 2500000, hosting_cents: 600000 }

  # --- M12a (formulas.md 22.3): Cloud and GPU hosting, open from January 2010 ---
  # Sells spare data-centre capacity (compute.capacity_category): a company sells here only
  # while it owns spare CU, its quality is its data centres' mean reliability and its
  # features come from its infrastructure lead. Each customer buys units_per_customer CU, so
  # D0 and p_ref per CU are addressable x units and reference price / units ($1,000 a CU,
  # x M10's AI index for GPU CU, which sell here at their spot value). Rivals' capacity is
  # abstract: hosting_cents is their cost of a customer's CU (55% of p_ref).
  - key: cloud_hosting
    label: Cloud and GPU hosting
    growth: 0.30
    features_at_start: 60
    features_per_month: 4.0
    scope: 6
    brand_constant: 25 # M12a tuning (22.7 target 3): 80 left spare capacity unsold
    capacity_market: true
    dev_weights: { infrastructure: 0.45, software_engineering: 0.25, security: 0.20, data: 0.10 }
    markets:
      - { segment: smb, addressable: 20000, reference_price_cents: 400000, hosting_cents: 220000, units_per_customer: 4 }
      - { segment: mid_market, addressable: 2500, reference_price_cents: 2000000, hosting_cents: 1100000, units_per_customer: 20 }
      - { segment: enterprise, addressable: 300, reference_price_cents: 20000000, hosting_cents: 11000000, units_per_customer: 200 }
      - { segment: hyperscalers, addressable: 30, reference_price_cents: 200000000, hosting_cents: 110000000, units_per_customer: 2000 }

  # --- M12b (formulas.md 26.1-26.3): hardware, devices and fabless chips ---
  # revenue_model units: a customer in play who chooses a product buys units_per_customer
  # units once (revenue price x units, cost of goods at sale); replacement_months is the
  # replacement cycle (base churn 1 / months), which brings customers back into play. The
  # installed base is the product's customers. hosting_cents is a rival's cost of goods per
  # unit (rivals' manufacturing is abstract; 40-45% of the reference price: at 55%, as Cloud
  # hosting's, cost leaders went bankrupt in price wars); the player's comes from its bill
  # of materials,
  # chip and assembly (hardware.*, chips.*). Rival startups are not founded in these markets.
  - key: devices
    label: Devices
    growth: 0.12
    features_at_start: 50
    features_per_month: 8.0 # 26.1: hardware ages fast
    scope: 6
    brand_constant: 150
    launch_quality: 30 # 26.1
    revenue_model: units
    dev_weights: { hardware_design: 0.40, manufacturing: 0.20, design: 0.20, software_engineering: 0.10, chip_design: 0.10 }
    markets:
      - { segment: consumer, addressable: 20000000, reference_price_cents: 40000, hosting_cents: 18000, replacement_months: 30 }
      - { segment: smb, addressable: 400000, reference_price_cents: 50000, hosting_cents: 22000, units_per_customer: 5, replacement_months: 40 }
      - { segment: enterprise, addressable: 20000, reference_price_cents: 60000, hosting_cents: 27000, units_per_customer: 50, replacement_months: 40 }

  - key: servers
    label: Servers
    growth: 0.10
    features_at_start: 50
    features_per_month: 8.0
    scope: 6
    brand_constant: 100
    launch_quality: 30
    revenue_model: units
    dev_weights: { hardware_design: 0.40, infrastructure: 0.25, manufacturing: 0.20, chip_design: 0.15 }
    markets:
      - { segment: enterprise, addressable: 30000, reference_price_cents: 500000, hosting_cents: 225000, units_per_customer: 20, replacement_months: 48 }
      - { segment: hyperscalers, addressable: 30, reference_price_cents: 400000, hosting_cents: 180000, units_per_customer: 5000, replacement_months: 48 }

  # Chips (26.3): one category per chip type (family chips, chip_type the product's type),
  # so each type has its own demand. Device OEM demand grows with the devices and servers
  # markets, hyperscaler accelerators with AI models, server CPUs with cloud hosting
  # (growth_follows). Design wins renew every 24 months.
  - key: chips_mobile_soc
    label: "Chips: mobile SoCs"
    family: chips
    chip_type: mobile_soc
    growth: 0.12
    features_at_start: 50
    features_per_month: 10.0 # 26.1
    scope: 6
    brand_constant: 80
    launch_quality: 30
    revenue_model: units
    growth_follows: { device_oems: [devices] }
    dev_weights: { chip_design: 0.60, hardware_design: 0.20, software_engineering: 0.10, manufacturing: 0.10 }
    markets:
      - { segment: device_oems, addressable: 400, reference_price_cents: 4000, hosting_cents: 1800, units_per_customer: 50000, replacement_months: 24 }

  - key: chips_server_cpu
    label: "Chips: server CPUs"
    family: chips
    chip_type: server_cpu
    growth: 0.10
    features_at_start: 50
    features_per_month: 10.0
    scope: 6
    brand_constant: 80
    launch_quality: 30
    revenue_model: units
    growth_follows: { device_oems: [servers], hyperscalers: [cloud_hosting] }
    dev_weights: { chip_design: 0.60, hardware_design: 0.20, software_engineering: 0.10, manufacturing: 0.10 }
    markets:
      - { segment: device_oems, addressable: 200, reference_price_cents: 40000, hosting_cents: 16000, units_per_customer: 2000, replacement_months: 24 }
      - { segment: hyperscalers, addressable: 30, reference_price_cents: 36000, hosting_cents: 15000, units_per_customer: 20000, replacement_months: 24 }

  - key: chips_ai_accelerator
    label: "Chips: AI accelerators"
    family: chips
    chip_type: ai_accelerator
    growth: 0.28
    features_at_start: 50
    features_per_month: 10.0
    scope: 6
    brand_constant: 80
    launch_quality: 30
    revenue_model: units
    growth_follows: { device_oems: [servers], hyperscalers: [ai_models] }
    dev_weights: { chip_design: 0.60, hardware_design: 0.20, software_engineering: 0.10, manufacturing: 0.10 }
    markets:
      - { segment: device_oems, addressable: 100, reference_price_cents: 150000, hosting_cents: 60000, units_per_customer: 500, replacement_months: 24 }
      - { segment: hyperscalers, addressable: 30, reference_price_cents: 150000, hosting_cents: 60000, units_per_customer: 2000, replacement_months: 24 }

  # Contract manufacturing (26.2): sells a company's spare assembly-plant capacity, like
  # Cloud hosting sells spare compute. A customer buys units_per_customer units a month at
  # the reference price per customer ($13 a unit); a company sells only while it owns spare
  # plant capacity. hosting_cents is a rival's cost per customer.
  - key: contract_manufacturing
    label: Contract manufacturing
    growth: 0.10
    features_at_start: 50
    features_per_month: 4.0
    scope: 6
    brand_constant: 40
    assembly_market: true
    dev_weights: { manufacturing: 0.50, hardware_design: 0.30, operations: 0.20 }
    markets:
      - { segment: device_oems, addressable: 200, reference_price_cents: 13000000, hosting_cents: 6000000, units_per_customer: 10000 }
