# Platforms and ecosystems (docs/formulas.md 44, ADR-0021, M31). Built from
# docs/v4-research/platforms-dossier.md; every value carries its source (researched 2026-11-14).
# Where a value is an assumption for gameplay (no public figure), it is marked A and listed in
# the M31 brief's "Decisions made". Where sources disagree, the most widely cited is used and
# the range noted. Dates are "YYYY-MM" (the month the change took effect).
#
# Source keys used below (full URLs):
#   SC   StatCounter Global Stats, Mobile Operating System Market Share, yearly, 2010-2025, CSV
#        export: https://gs.statcounter.com/chart.php?device=Mobile&device_hidden=mobile&statType_hidden=os_combined&region_hidden=<ww|na|eu|sa|af|oc|CN|JP|KR|IN|ID>&granularity=yearly&statType=Operating%20System&fromInt=2010&toInt=2025&fromYear=2010&toYear=2025&csv=1
#        (fetched 2026-11-14; usage share of mobile web traffic, the dossier's measure)
#   WB   World Bank population, 2020, millions (approximate): https://data.worldbank.org/indicator/SP.POP.TOTL
#        China 1411, Japan 126, South Korea 52, India 1396, Indonesia 274, United States 331,
#        Canada 38, Mexico 129, EU-27 447, Europe (UN geoscheme) about 745

history_end: "2025-12" # the last month whose shares, fees and rules come only from this file (44.1)

# --- The game's regions from StatCounter's (44.1) -------------------------------------------
# north_america: SC North America; europe: SC Europe; latin_america: SC South America;
# africa: SC Africa; oceania: SC Oceania. east_asia: China, Japan and South Korea blended by
# population (WB; A: fixed 2020 weights), China's Android to android_china (Google Play has
# not been available in mainland China since Google's 2010 exit:
# https://www.technologyreview.com/2012/12/06/181287/android-takes-off-in-china-but-google-has-little-to-show-for-it/ ,
# https://www.caixinglobal.com/2025-08-02/google-denies-rumors-it-is-resuming-full-services-on-chinese-mainland-102347932.html),
# Japan's and Korea's to android_play. south_southeast_asia: India and Indonesia by population
# (WB; A). Platforms: SC iOS -> ios, Android -> android_play / android_china, BlackBerry OS ->
# blackberry, SymbianOS -> symbian, Windows -> windows_phone; everything else (Series 40,
# Samsung bada, Sony Ericsson, feature-phone browsers, consoles) -> other. Each SC row is
# normalised to 1 before blending (SC's rows sum to 100 +/- 0.05), and rounded to 4 places
# with the remainder in `other`. HarmonyOS is not separated by SC (counted inside Android in
# China); Counterpoint's sales shares (about 17-19% in 2024-2025,
# https://en.wikipedia.org/wiki/HarmonyOS) are left out: SC's measure is kept throughout.
region_parts:
  east_asia: { china: 1411, japan: 126, south_korea: 52 } # WB
  south_southeast_asia: { india: 1396, indonesia: 274 } # WB
  north_america: { united_states: 331, canada: 38, mexico: 129 } # WB (for sub-region rules)
  europe: { eu: 447, rest: 298 } # WB / UN (Europe about 745)

# --- Platforms (44.1) --------------------------------------------------------------------------
# owner: an incumbents.yaml company's name, or null for an owner outside the game (its name in
# owner_label; it still sets rules and reviews apps, but books nothing). store_opened: the month
# its store began (fees apply from it). ended: the month it stopped serving apps (shares after
# it are the data's to 2025; from 2026 an ended platform has no users).
platforms:
  - key: ios
    name: iOS
    store: App Store
    kind: device
    owner: Apple
    owner_label: Apple
    store_opened: "2008-07" # 10 Jul 2008: https://www.macrumors.com/2018/07/10/happy-10th-anniversary-app-store
    licensable: false # Apple does not license iOS (no source needed beyond the platform's history; A)
    side_loading: false # until regulated (rules below)
    first_party: # categories the owner sells its own apps in, from (44.5)
      consumer_apps: "2015-06" # Apple Music, 30 Jun 2015: https://en.wikipedia.org/wiki/Apple_Music
      fintech: "2014-10" # Apple Pay, 20 Oct 2014: https://en.wikipedia.org/wiki/Apple_Pay
  - key: android_play
    name: Android
    store: Google Play
    kind: device
    owner: null
    owner_label: Google
    store_opened: "2008-10" # Android Market, 22 Oct 2008: https://android-developers.googleblog.com/2008/10/android-market-now-available-for-users.html ; Google Play from 6 Mar 2012: https://9to5google.com/2012/03/06/android-market-is-now-google-play/
    licensable: true # licensed to OEMs; Google's apps under the MADA: https://ec.europa.eu/commission/presscorner/api/files/document/print/en/ip_18_4581/IP_18_4581_EN.pdf
    side_loading: true # Android installs apps from outside Play (the Commission's 2018 decision, same source)
    open_source: "2008-10" # AOSP under Apache 2.0, 21 Oct 2008: https://www.theregister.com/2008/10/21/google_android_opens/
    first_party:
      consumer_apps: "2010-01" # YouTube, Gmail and Maps ship with Play (MADA, IP_18_4581 above)
      ai_models: "2023-12" # Gemini, 6 Dec 2023: https://en.wikipedia.org/wiki/Gemini_(language_model)
  - key: android_china
    name: Android (China)
    store: Chinese Android stores
    kind: device
    owner: null
    owner_label: Huawei, Xiaomi, Tencent and others
    store_opened: "2010-01" # Google's 2010 exit (MIT Technology Review, above); OEM and Tencent stores serve Android in China
    regions: [east_asia]
    licensable: true
    side_loading: true
    open_source: "2008-10" # the same AOSP base (Apache 2.0, 21 Oct 2008: https://www.theregister.com/2008/10/21/google_android_opens/)
    first_party:
      consumer_apps: "2010-01" # Tencent's QQ and WeChat (incumbents.yaml's QQ; https://en.wikipedia.org/wiki/WeChat)
  - key: blackberry
    name: BlackBerry
    store: BlackBerry World
    kind: device
    owner: null
    owner_label: BlackBerry
    ended: "2022-01" # legacy services ended 4 Jan 2022: https://www.rcrwireless.com/20220103/devices/blackberry-ends-legacy-service-support ; own hardware ended 28 Sep 2016: https://thenextweb.com/news/the-end-of-an-era-blackberry-will-no-longer-make-its-own-phones
    licensable: false
    side_loading: false
  - key: symbian
    name: Symbian
    store: Nokia Store
    kind: device
    owner: null
    owner_label: Nokia
    ended: "2014-01" # Nokia Store stopped taking new or updated Symbian apps 1 Jan 2014: https://www.techspot.com/news/55188-nokia-officially-shuts-the-doors-on-symbian-and-meego-app-support.html ; last Symbian phone (808 PureView) per Nokia, 24 Jan 2013: https://www.engadget.com/2013/01/24/nokia-808-pureview-the-last-symbian-phone/
    licensable: false
    side_loading: false
  - key: windows_phone
    name: Windows Phone
    store: Windows Phone Store
    kind: device
    owner: Microsoft
    owner_label: Microsoft
    ended: "2019-12" # Windows 10 Mobile support ended 10 Dec 2019: https://www.windowscentral.com/windows-10-mobile-support-officially-ends-today ; Windows Phone 8.1 on 11 Jul 2017: https://www.theregister.co.uk/2017/07/11/windows_phone_officially_obsolete/
    licensable: true # licensed to OEMs (Nokia, HTC, Samsung): https://en.wikipedia.org/wiki/Windows_Phone
    side_loading: false

# --- Fee schedules (44.4) ----------------------------------------------------------------------
# kind: standard (every sale); subscription (subscriptions; `after_year` true = only after a
# subscriber's first year); small_business (sellers under threshold_cents of app proceeds a
# year); regulated (an alternative path in part of a region: `region_share` of the region's app
# revenue is in the regulated country (WB), and `platforms.alternative_share` of that goes
# through the alternative path at `rate`).
fee_rules:
  # Apple
  - { platform: ios, from: "2008-07", kind: standard, rate: 0.30, source: "70/30 at launch, 10 Jul 2008: https://appleinsider.com/articles/18/07/05/apple-details-history-of-app-store-on-its-10th-anniversary ; in-app purchase for free apps at 30%, 15 Oct 2009: https://developer.apple.com/news/?id=10152009a" }
  - { platform: ios, from: "2016-06", kind: subscription, after_year: true, rate: 0.15, source: "85/15 after a subscriber's first year, effective 13 Jun 2016: https://daringfireball.net/2016/06/the_new_app_store" }
  - { platform: ios, from: "2021-01", kind: small_business, rate: 0.15, threshold_cents: 100000000, source: "Small Business Program, up to $1M of proceeds a year, 1 Jan 2021: https://www.apple.com/newsroom/2020/11/apple-announces-app-store-small-business-program/ ; https://www.macrumors.com/2020/11/18/apple-drops-app-store-fees/" }
  # Google Play (and Android Market): the 30% went to carriers and billing until Google kept it (A: booked to the owner throughout)
  - { platform: android_play, from: "2008-10", kind: standard, rate: 0.30, source: "70/30, paid apps from 13 Feb 2009: https://www.rcrwireless.com/20090213/wireless/android-platform-developers-can-start-charging-for-their-work ; https://www.androidcentral.com/android-market-details-paid-apps-q1-2009-and-google-takes-no-profit" }
  - { platform: android_play, from: "2016-06", kind: subscription, after_year: true, rate: 0.15, source: "Google's 85/15 after a year announced the same week: https://www.macrumors.com/2016/06/08/google-85-15-subscription-revenue-split-android" }
  - { platform: android_play, from: "2021-07", kind: small_business, rate: 0.15, threshold_cents: 100000000, source: "15% on each developer's first $1M a year, 1 Jul 2021: https://android-developers.googleblog.com/2021/03/boosting-dev-success.html (A: modelled as a rate for sellers under $1M, the game's seller-size rule)" }
  - { platform: android_play, from: "2022-01", kind: subscription, after_year: false, rate: 0.15, source: "15% on all subscriptions from day one, 1 Jan 2022: https://9to5google.com/2021/10/21/google-play-subscription-fee/ ; https://techcrunch.com/?p=2221893" }
  # Chinese Android stores: commonly 50/50 for games and 30% otherwise; no primary source found, so the standard 30% is an assumption (A)
  - { platform: android_china, from: "2010-01", kind: standard, rate: 0.30, source: "A (no primary source found for Chinese stores' rates; 30% as the industry standard)" }
  - { platform: blackberry, from: "2010-01", kind: standard, rate: 0.30, source: "A (BlackBerry App World's 70/30 split not verified)" }
  - { platform: symbian, from: "2010-01", kind: standard, rate: 0.30, source: "A (Nokia Store's 70/30 split not verified)" }
  - { platform: windows_phone, from: "2010-01", kind: standard, rate: 0.30, source: "A (Windows Phone Store's 70/30 split not verified)" }
  # Regulated paths
  - { platform: android_play, region: east_asia, part: south_korea, from: "2021-12", kind: regulated, rate: 0.26, source: "South Korea's Telecommunications Business Act amendment (passed 31 Aug 2021, in force 14 Sep 2021: https://www.macrumors.com/2021/08/31/south-korea-passes-app-store-bill/); Google's alternative billing 4 points lower (30% -> 26%) from 18 Dec 2021: https://developers-kr.googleblog.com/2021/11/enabling-alternative-billing-in-korea-en.html" }
  - { platform: android_play, region: europe, part: eu, from: "2024-03", kind: regulated, rate: 0.27, source: "M35b: Google Play's DMA compliance from 6 Mar 2024: alternative billing in the EEA with the service fee 3 points lower (30% -> 27%; 15% -> 12% for most developers): https://techcrunch.com/2024/03/06/google-announces-the-new-fees-that-come-with-its-play-stores-dma-compliance-plan ; https://support.google.com/googleplay/android-developer/answer/12348241 (the June 2026 install-based schedule is after the history; A)" }
  - { platform: android_play, region: north_america, part: united_states, from: "2025-10", kind: regulated, rate: 0.0, source: "M35b: Epic v. Google's injunction in force from late October 2025 after the Supreme Court declined to pause it (6 Oct 2025): external links and alternative billing in the US: https://engadget.com/big-tech/supreme-court-denies-googles-request-to-pause-play-store-changes-while-it-appeals-epic-case-121502132.html ; Google's US programme page: https://support.google.com/googleplay/android-developer/answer/15582165 (no service fee was collected on linked-out purchases by December 2025; the 9%/20% caps of the 4 Nov 2025 proposed settlement were not in force; A)" }
  - { platform: ios, region: east_asia, part: south_korea, from: "2022-06", kind: regulated, rate: 0.26, source: "Apple's alternative payments in Korea at 26%, 30 Jun 2022: https://www.cnbc.com/2022/06/30/apple-opens-up-third-party-app-payments-in-korea-will-take-26percent-cut-.html" }
  - { platform: ios, region: north_america, part: united_states, from: "2024-01", kind: regulated, rate: 0.27, source: "Epic v. Apple injunction (10 Sep 2021) in force after the Supreme Court declined review 16 Jan 2024; Apple's link-out commission 27%: https://9to5mac.com/2024/01/16/apple-revises-us-app-store-rules-to-let-developers-link-to-outside-payment-methods-but-it-will-still-charge-a-commission/" }
  - { platform: ios, region: north_america, part: united_states, from: "2025-05", kind: regulated, rate: 0.0, source: "Contempt order 30 Apr 2025: no commission on linked-out purchases (https://techcrunch.com/2025/05/02/apple-changes-us-app-store-rules-to-let-apps-redirect-users-to-their-own-websites-for-payments); the Ninth Circuit upheld the finding on 11 Dec 2025 and allowed a cost-based rate once the district court sets one, none set by December 2025: https://minnlawyer.com/2025/12/12/apple-epic-games-ninth-circuit-iphone-app-payments/" }
  - { platform: ios, region: europe, part: eu, from: "2024-03", kind: regulated, rate: 0.20, source: "DMA compliance from 7 Mar 2024: https://digital-markets-act.ec.europa.eu/designated-gatekeepers-must-now-comply-all-obligations-under-digital-markets-act-2024-03-07_es ; Apple's EU terms 17% (10% small and after year one) + 3% payment processing, iOS 17.4 on 5 Mar 2024: https://techcrunch.com/2024/01/25/apple-dma-changes/ (the Core Technology Fee is per install, not modelled; A)" }
  - { platform: ios, region: east_asia, part: japan, from: "2025-12", kind: regulated, rate: 0.21, source: "Japan's Mobile Software Competition Act fully in force 18 Dec 2025; Apple's terms 21% (10% small) with other payment processors: https://mjtsai.com/blog/2025/12/18/japan-app-marketplaces-external-payments-new-fee-structure ; https://www.cliffordchance.com/insights/resources/blogs/talking-tech/en/articles/2024/07/japan-opens-up-competition-on-mobile-platforms.html" }

# --- Dated rules by region (44.5) --------------------------------------------------------------
# kind: alt_payments (an alternative payment path must be allowed), anti_steering_banned
# (links to pay outside cannot be forbidden), side_loading (installs and stores from outside
# the owner's store must be allowed). platforms: the ones the rule binds.
rules:
  - { region: east_asia, part: south_korea, from: "2021-09", kind: alt_payments, platforms: [ios, android_play], source: "in force 14 Sep 2021: https://keia.org/the-peninsula/the-implications-of-south-koreas-anti-google-law/" }
  - { region: north_america, part: united_states, from: "2024-01", kind: anti_steering_banned, platforms: [ios], source: "https://techcrunch.com/2024/01/16/supreme-court-declines-to-hear-apple-epic-antitrust-case-meaning-developers-can-point-customers-to-the-web/amp" }
  - { region: europe, part: eu, from: "2024-03", kind: alt_payments, platforms: [ios, android_play], source: "DMA, 7 Mar 2024 (Commission, above)" }
  - { region: europe, part: eu, from: "2024-03", kind: side_loading, platforms: [ios], source: "alternative app marketplaces in iOS 17.4 in the EU: https://www.macrumors.com/2024/01/25/ios-17-4-alternative-app-marketplaces-eu/" }
  - { region: east_asia, part: japan, from: "2025-12", kind: alt_payments, platforms: [ios, android_play], source: "MSCA, 18 Dec 2025: https://www.macrumors.com/2025/12/17/japan-app-store-feature-updates" }
  - { region: east_asia, part: japan, from: "2025-12", kind: side_loading, platforms: [ios], source: "alternative app marketplaces in Japan (no direct web downloads), same sources" }

# --- Developers (44.2) -------------------------------------------------------------------------
# Professional developers worldwide, millions (Evans Data; the dossier's "about 20M in 2015" had
# no source and is left out). Between points: linear; before 2013: the 2013 value (A); after the
# last point: platforms.developer_growth a year.
developers_by_year:
  2013: 18.2 # https://prnewswire.com/news-releases/worldwide-developer-population-to-top-26-million-by-2019-new-evans-data-study-shows-213114931.html
  2019: 23.9 # https://www.24-7pressrelease.com/press-release/462985/worldwide-professional-developer-population-of-24-million-projected-to-grow-amid-shifting-geographical-concentrations
  2022: 26.4 # https://www.pr.com/press-release/893926
  2024: 28.7 # Evans Data's projection, same release as 2019 (SlashData counts 36.5M professionals in early 2025: https://slashdata.co/post/global-developer-population-trends-2025-how-many-developers-are-there)
# Each region's share of developers: no public series by the game's regions was found, so the
# regions' market sizes in categories.yaml are used (A).

# Apps in each store, thousands (shown beside the catalogue index; the index itself is computed).
app_counts:
  ios: { 2017: 2200, 2024: 1962 } # Jan 2017 peak 2.2M: https://statista.com/statistics/263795/number-of-available-apps-in-the-apple-app-store ; 1,961,596 at end 2024: https://www.macrumors.com/2025/05/30/app-store-2024-transparency-report/
  android_play: { 2018: 3600, 2025: 1800 } # about 3.6M in Mar 2018: https://www.computerbase.de/2022-04/google-android-1-million-weniger-apps-im-play-store-als-2018/ ; about 1.8M by Apr 2025: https://techcrunch.com/2025/04/29/google-play-sees-47-decline-in-apps-since-start-of-last-year/

# --- Standards (44.7) and open source (44.6) ---------------------------------------------------
standards:
  - key: phone_connector
    category: devices
    label: Phone connector
    formats: [usb_c, lightning]
    sponsors: { lightning: ios } # Apple's connector from the iPhone 5, Sep 2012: https://en.wikipedia.org/wiki/Lightning_(connector)
    winner: usb_c
    tipped: "2023-09" # iPhone 15 moved to USB-C, announced 12 Sep 2023: https://9to5mac.com/2023/09/12/apple-announces-iphone-15-usb-c/
    rule: { region: europe, from: "2024-12", source: "EU common charger rule for phones from 28 Dec 2024: https://single-market-economy.ec.europa.eu/sectors/electrical-and-electronic-engineering-industries-eei/radio-equipment-directive-red/one-common-charging-solution-all_en" }
  - key: wireless_charging
    category: devices
    label: Wireless charging
    formats: [qi, pma]
    sponsors: {}
    winner: qi
    tipped: "2017-09" # Apple adopted Qi for iPhone 8 and X, 12 Sep 2017: https://appleinsider.com/articles/17/09/12/apple-embraces-qi-wireless-charging-standard-for-iphone-x-8-earns-praise-from-wireless-power-consortium ; PMA merged into AirFuel in 2015: https://eepower.com/news/a4wp-and-pma-finalize-merger/

open_source:
  - { key: android, label: Android (AOSP), category: os, from: "2008-10", owner_label: Google, source: "Apache 2.0, 21 Oct 2008: https://tidbits.com/2008/10/21/android-code-released-as-open-source/" }
  - { key: llama, label: LLaMA, category: ai_models, from: "2023-02", owner_label: Meta, source: "24 Feb 2023 (research licence); Llama 2 for commercial use 18 Jul 2023: https://computing.co.uk/news/4120476/meta-releases-llama-llm-free-commercial" }
  - { key: mistral_7b, label: Mistral 7B, category: ai_models, from: "2023-09", owner_label: Mistral AI, source: "Apache 2.0, 27 Sep 2023: https://mistral.ai/news/announcing-mistral-7b/" }

