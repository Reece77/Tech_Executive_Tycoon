      tin: "negligible (dossier 2)"
      tantalum: "negligible (dossier 2)"
    licence_fee_cents: 3500000
    permit_years: [3.0, 6.0]
    cost_index: 1.1
    sensitivity: 0.60
    refusal: 0.18
  east_asia:
    prospectivity: { copper: 0.25, lithium_carbonate: 0.30, cobalt: 0.04, ndpr_oxide: 0.95, quartz_hp: 0.20, tin: 0.60, tantalum: 0.12 }
    basis:
      copper: "China 8% (dossier 2, D)"
      lithium_carbonate: "China 17% (dossier 2, D)"
      cobalt: "negligible mine output (dossier 2)"
      ndpr_oxide: "China 71% (dossier 2, D)"
      quartz_hp: "China, lower grade (dossier 2, R)"
