# --- Health regulators (M41, docs/formulas.md 50) ---------------------------------------------
# M34's regulator records with the `health` kind: they clear medical devices, inspect device
# plants and order recalls (medical.yaml routes, inspections and recalls), and never designate,
# open competition cases or order break-ups. strictness: an inspection index by year (A, 1.0 = the
# FDA after FDARA 2017's risk-based schedule), read by tst.sim.medical through M34's helpers.
health_regulators:
  - key: fda
    kind: health
    name: US Food and Drug Administration (CDRH)
    region: north_america
    part: united_states # platforms.yaml region_parts (WB)
    strictness: { 2008: 1.0, 2010: 1.0 } # A (M50: 2008 as 2010): biennial inspections (510(h)), risk-based since FDARA 2017: https://natlawreview.com/article/fda-reauthorization-act-requires-changes-to-medical-device-inspections-alert
    source: "https://www.fda.gov/about-fda/cdrh-reports/cdrh-2024-annual-report"
  - key: eu_notified_bodies
    kind: health
    name: EU notified bodies and national competent authorities
    region: europe
    part: eu # the EU-27 (platforms.yaml region_parts, WB)
    strictness: { 2008: 0.7, 2010: 0.7, 2021: 0.9 } # A (M50: 2008 as 2010, under the MDD 93/42/EEC): unannounced audits and the MDR from 26 May 2021; 51 MDR notified bodies by Dec 2025: https://ppri.goeg.at/system/files/inline-files/2025-10_18NBSurvey_MD_IVD_MDAvailabilityStudy.pdf
    source: "https://bsigroup.com/de-DE/medical-devices/News/Enews/2023-news/mdr-transition-timelines-extended/"
  - key: pmda
    kind: health
    name: Pharmaceuticals and Medical Devices Agency
    region: east_asia
    part: japan # platforms.yaml region_parts (WB)
    strictness: { 2008: 0.8, 2010: 0.8 } # A (M50: 2008 as 2010)
    source: "https://rapath.github.io/jp/pre-market/approval-shonin/pmda-review-process/"
  - key: nmpa
    kind: health
    name: National Medical Products Administration
    region: east_asia
    part: china # platforms.yaml region_parts (WB)
    strictness: { 2008: 0.7, 2010: 0.7, 2021: 0.85 } # A (M50: 2008 as 2010, the SFDA's 2007 registration rules): the revised device regulation (State Council Order 739) from 1 Jun 2021
    source: "https://www.rvo.nl/sites/default/files/2022-06/Regulatory%20Roadmap%20-%20Dutch%20Medical%20Devices%20Products%20to%20the%20Chinese%20Market.pdf"

# M42 (formulas.md 55.3): medicines regulators, M34's records with the `drugs` kind. They approve
# drugs and inspect drug plants (tst.sim.pharma; reviews' months and expedited programmes are
# pharma.yaml's); M34's competition rules and M41's device code read neither this list nor them.
# Parts as the health regulators' (platforms.yaml region_parts); other regions register by reliance.
drug_regulators:
  - key: fda_drugs
    kind: drugs
    name: US Food and Drug Administration (CDER and CBER)
    region: north_america
    part: united_states # platforms.yaml region_parts (WB)
    strictness: { 2008: 1.0, 2010: 1.0 } # A (M50: 2008 as 2010): surveillance inspections risk-based, about every 2-3 years (FDA's site selection model)
    source: "https://fda.gov/media/184967/download"
  - key: ema
    kind: drugs
    name: European Medicines Agency
    region: europe
    part: eu # platforms.yaml region_parts (WB)
    strictness: { 2008: 0.9, 2010: 0.9 } # A (M50: 2008 as 2010): GMP inspections by national authorities under the EMA's coordination
    source: "https://www.ema.europa.eu/assets/en/annual-report/2023/human-medicines.html"
  - key: pmda_drugs
    kind: drugs
    name: Pharmaceuticals and Medical Devices Agency (drugs)
    region: east_asia
    part: japan # platforms.yaml region_parts (WB)
    strictness: { 2008: 0.8, 2010: 0.8 } # A (M50: 2008 as 2010)
    source: "https://www.pmda.go.jp/english/"
  - key: nmpa_drugs
    kind: drugs
    name: National Medical Products Administration (drugs)
    region: east_asia
    part: china # platforms.yaml region_parts (WB)
    strictness: { 2008: 0.6, 2010: 0.6, 2017: 0.8 } # A (M50: 2008 as 2010, after the SFDA's 2007 Provisions for Drug Registration): the 2015-2017 drug review reforms and ICH membership (June 2017)
    source: "https://english.nmpa.gov.cn/"

# M53 (formulas.md 62.4): telecom regulators, M34's records with the `telecom` kind. They set licence
# conditions (coverage obligations), review operator mergers and enforce net-neutrality rules
# (tst.sim.telecom; the rules and precedents are telecom.yaml's); M34's competition rules, M41's device
# code and M42's drug code read neither this list nor them. One a region (the region's largest national
# authority stands for its others, A). strictness: a coverage and merger index by year (A, 1.0 = the
# FCC; the European Commission's 2016 block of Three and O2 and the CMA's 2024 conditions on Vodafone
# and Three, telecom.yaml, lift Europe's). formed: S (each regulator's Wikipedia page, 2026-11-25).
telecom_regulators:
  - key: fcc
    kind: telecom
    name: Federal Communications Commission
    region: north_america
    part: united_states # platforms.yaml region_parts (WB)
    formed: "1934-06" # Federal Communications Commission: 19 Jun 1934 (S)
    strictness: { 2008: 0.9, 2009: 0.9, 2010: 0.9, 2011: 1.0, 2017: 0.85, 2021: 1.0 } # A: AT&T and T-Mobile abandoned (Dec 2011), Sprint and T-Mobile cleared with conditions (Nov 2019), telecom.yaml
    source: "https://en.wikipedia.org/wiki/Federal_Communications_Commission"
  - key: berec
    kind: telecom
    name: European Commission and BEREC
    region: europe
    part: eu # platforms.yaml region_parts (WB)
    formed: "2009-11" # BEREC: Regulation 1211/2009 of 25 Nov 2009 (Net Neutrality Regulation 2015, S)
    strictness: { 2008: 1.0, 2010: 1.0, 2016: 1.2, 2024: 1.1 } # A: Three and O2 blocked on 11 May 2016 (O2 (UK), S); MasOrange cleared with remedies (2024, R)
    source: "https://en.wikipedia.org/wiki/Body_of_European_Regulators_for_Electronic_Communications"
  - key: miit
    kind: telecom
    name: Ministry of Industry and Information Technology
    region: east_asia
    part: china # platforms.yaml region_parts (WB)
    formed: "2008-03" # Ministry of Industry and Information Technology: March 2008 (S)
    strictness: { 2008: 1.2, 2010: 1.2 } # A: spectrum assigned administratively to the state operators (5G licences 6 Jun 2019, R)
    source: "https://en.wikipedia.org/wiki/Ministry_of_Industry_and_Information_Technology"
  - key: trai
    kind: telecom
    name: Telecom Regulatory Authority of India and the Department of Telecommunications
    region: south_southeast_asia
    part: india # platforms.yaml region_parts (WB)
    formed: "1997-02" # Telecom Regulatory Authority of India: 20 Feb 1997 (S)
    strictness: { 2008: 0.9, 2010: 0.9, 2016: 1.1 } # A: discriminatory tariffs banned 8 Feb 2016 (Net neutrality in India, S)
    source: "https://en.wikipedia.org/wiki/Telecom_Regulatory_Authority_of_India"
  - key: anatel
    kind: telecom
    name: Anatel
    region: latin_america
    formed: "1997-07" # National Telecommunications Agency (Brazil): 16 Jul 1997 (S)
    strictness: { 2008: 0.9, 2010: 0.9, 2021: 1.0 } # A: the 2021 auction's coverage obligations (R)
    source: "https://en.wikipedia.org/wiki/National_Telecommunications_Agency_(Brazil)"
  - key: icasa
    kind: telecom
    name: Independent Communications Authority of South Africa
    region: africa
    formed: "2000-06" # Independent Communications Authority of South Africa: 1 Jun 2000 (S)
    strictness: { 2008: 0.7, 2010: 0.7 } # A
    source: "https://en.wikipedia.org/wiki/Independent_Communications_Authority_of_South_Africa"
  - key: acma
    kind: telecom
    name: Australian Communications and Media Authority
    region: oceania
    formed: "2005-07" # Australian Communications and Media Authority: 1 Jul 2005 (S)
    strictness: { 2008: 0.9, 2010: 0.9 } # A
    source: "https://en.wikipedia.org/wiki/Australian_Communications_and_Media_Authority"

# M54 (docs/formulas.md 64.5): bank and insurance regulators, M34's records with the `bank` and
# `insurance` kinds. A bank regulator charters banks (finance_services.yaml regulators: its months),
# sets capital rules and stress tests, and reviews a bank inside a tech group; an insurance
# regulator licenses insurers. A strictness at or above finserv.bank.strict_line adds
# finserv.bank.strict_months to a charter (A). M34's competition rules and M41's, M42's and M53's
# code never read them. Strictness: A, with the dated changes named (R: Dodd-Frank, July 2010; the
# Fed's tailoring rule after the 2018 Economic Growth Act; the reviews after Silicon Valley Bank's
# failure, 2023; the ECB's Single Supervisory Mechanism from November 2014; China's rectification of
# fintech platforms after Ant Group's halted listing, November 2020).
finance_regulators:
  - key: us_bank
    kind: bank
    name: "Federal Reserve, OCC and FDIC"
    region: north_america
    formed: "1913-12" # Federal Reserve Act, 23 Dec 1913 (R)
    strictness: { 2008: 1.0, 2010: 1.15, 2018: 0.95, 2023: 1.15 } # A (R dates above)
    source: "https://en.wikipedia.org/wiki/Federal_Reserve"
