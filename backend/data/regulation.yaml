    source: "https://en.wikipedia.org/wiki/Central_Bank_of_Brazil"
  - key: sarb
    kind: bank
    name: South African Reserve Bank
    region: africa
    formed: "1921-06" # R
    strictness: { 2008: 1.0 } # A
    source: "https://en.wikipedia.org/wiki/South_African_Reserve_Bank"
  - key: apra_bank
    kind: bank
    name: APRA
    region: oceania
    formed: "1998-07" # Australian Prudential Regulation Authority: 1 Jul 1998 (R)
    strictness: { 2008: 1.0, 2018: 0.9 } # A: restricted licences for new banks from 2018 (R)
