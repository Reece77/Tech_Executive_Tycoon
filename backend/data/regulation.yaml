  - { key: microsoft_2000, label: Microsoft, at: "2000-06", note: "ordered split in two, 7 Jun 2000; reversed on appeal 28 Jun 2001", source: "https://money.cnn.com/2000/06/07/technology/microsoft_ruling/ ; https://tidbits.com/2001/06/28/appeals-court-unanimously-reverses-microsoft-breakup/" }
