# Regulation with teeth (docs/formulas.md 48, M34). Built from docs/v4-research/regulation-dossier.md;
# every value carries its source (researched 2026-11-14). A value marked A is an assumption for
# gameplay (no public figure) and is listed in the M34 brief's "Decisions made". Dates are "YYYY-MM"
# (the month a step took effect). Companies: an incumbents.yaml name, or null for a company outside
# the game (its name in `label`): those records are shown and count as precedent, but book nothing.
#
# History holds (48.5 target 1): to `history_end` designations, duties, cases, fines and rulings come
# only from this file and post nothing (platforms.yaml already carries the dated platform rules and
# fee rows the duties brought to 2025, 44.4). The model acts on rivals from the month after.
#
# M50 (ADR-0024, formulas.md 60.2), 2026-11-23: each strictness path gained a 2008 key (and 2009 where a
# real step fell in 2009) so a 2008 start has history; tagged A like the rest, the basis in the row's comment
# after "M50:". Most hold the 2010 level (a step path read from the listed year, so 2010 on is unchanged).

history_end: "2025-12"

# --- Regulators (48.1) ------------------------------------------------------------------------
# region / part: a game region and, where the regulator covers part of it, a region_parts key from
# platforms.yaml (its population share weights duties and fines' reach). strictness: by year from
# the listed year (A: a gameplay index, 1.0 = the EU Commission under the DMA; no public measure),
# flat after the last year until seeded drift from 2026. structural: whether its law lets it order
# a break-up or unbundling (48.4).
regulators:
  - key: eu_commission
    name: European Commission (DG Competition)
    region: europe
    part: eu # the EU-27 (platforms.yaml region_parts, WB)
    structural: true # Regulation 1/2003 Art. 7 (structural remedies) and DMA Art. 18 (systematic non-compliance): https://eur-lex.europa.eu/EN/legal-content/summary/digital-markets-act.html
    strictness: { 2008: 0.7, 2010: 0.7, 2017: 0.85, 2023: 1.0 } # A: rising with the Google decisions (2017-2019) and the DMA (2023); M50: 2008 as 2010 (Microsoft's EUR 899M penalty Feb 2008, Intel's EUR 1.06B fine May 2009)
    source: "https://digital-markets-act.ec.europa.eu/commission-designates-six-gatekeepers-under-digital-markets-act-2023-09-06_en"
  - key: uk_cma
    name: Competition and Markets Authority
    region: europe
    part: rest # A: the UK sits in Europe's non-EU part (platforms.yaml region_parts)
    structural: true # A: market investigations can order divestiture (Enterprise Act 2002); SMS conduct duties from 2025
    strictness: { 2008: 0.6, 2010: 0.6, 2020: 0.8, 2025: 0.9 } # A: the Activision block (April 2023) and the DMCC regime (2025); M50: 2008 as 2010 (the OFT, before the CMA's 2014 merger with the Competition Commission)
    source: "https://www.gov.uk/government/news/cma-confirms-apple-and-google-have-strategic-market-status-in-mobile-platforms"
  - key: us_doj_ftc
    name: US Department of Justice and Federal Trade Commission
    region: north_america
    part: united_states # platforms.yaml region_parts (WB)
    structural: true # Sherman Act divestiture: the AT&T break-up (1984) and the 2000 Microsoft order (precedents below)
    strictness: { 2008: 0.4, 2009: 0.5, 2010: 0.5, 2020: 0.8 } # A: the 2020 cases against Google and Meta; M50: 2008 lower (DOJ's Section 2 report, Sep 2008), 2009 the 2010 level from the report's withdrawal (11 May 2009): https://www.justice.gov/archive/opa/pr/2009/May/09-at-459.html
    source: "https://www.hugheshubbard.com/news/court-issues-remedies-ruling-in-united-states-v-google-search-case"
  - key: jftc
    name: Japan Fair Trade Commission
    region: east_asia
    part: japan # platforms.yaml region_parts (WB)
    structural: false # A: the MSCA brings conduct duties, not structural powers
    strictness: { 2008: 0.4, 2010: 0.4, 2024: 0.7 } # A: the Mobile Software Competition Act (enacted 2024); M50: 2008 as 2010
    source: "https://www.jftc.go.jp/en/policy_enforcement/digital/index.html"
  - key: kftc
    name: Korea Fair Trade Commission and Korea Communications Commission
    region: east_asia
    part: south_korea # platforms.yaml region_parts (WB)
    structural: false # A
    strictness: { 2008: 0.5, 2010: 0.5, 2021: 0.8 } # A (M50: 2008 as 2010): the app payment law (in force 14 Sep 2021, platforms.yaml rules)
    source: "https://keia.org/the-peninsula/the-implications-of-south-koreas-anti-google-law/"
  - key: samr
    name: State Administration for Market Regulation
    region: east_asia
    part: china # platforms.yaml region_parts (WB)
    structural: false # A
    strictness: { 2008: 0.3, 2009: 0.4, 2010: 0.4, 2021: 0.8 } # A: the platform campaign of 2021 (no figure used); M50: 2008 lower (the Anti-Monopoly Law in force only from 1 Aug 2008, enforced by MOFCOM, NDRC and SAIC before SAMR's 2018 merger), 2009 the 2010 level (MOFCOM blocked Coca-Cola/Huiyuan, 18 Mar 2009)
    source: "A"

# --- Designation regimes (48.1) ---------------------------------------------------------------
# users_share: the platform's share of the part's users that the regime's users test reads (A: the
# legal count over the part's population, WB in platforms.yaml). turnover / value: in the regime's
# currency, billions (converted with regulation.fx). None of a test = not part of that regime.
# duties: what designation brings (48.2), from `comply_months` after the designation.
regimes:
  - key: dma
    regulator: eu_commission
    name: Digital Markets Act
    in_force: "2022-11" # in force 1 Nov 2022: https://freshfields.com/en/our-thinking/campaigns/tech-data-and-ai-the-digital-frontier/eu-digital-strategy/digital-markets-act
    first_designations: "2023-09" # 6 Sep 2023 (Commission, regulators above)
    users_share: 0.10 # 45M monthly active end users in the EU (Art. 3(2)(b)) / 447M (WB): https://cerre.eu/wp-content/uploads/2022/11/NoteOnDesignationOfGatekeepersintheDMA_Final.pdf ; https://eur-lex.europa.eu/EN/legal-content/summary/digital-markets-act.html
    business_users: 10000 # yearly active business users (Art. 3(2)(b), same sources); recorded, not tested (A: the game has no business-user count)
    turnover_b: 7.5 # EUR, EU annual turnover in each of the last three years (Art. 3(2)(a), CERRE above)
    turnover_scope: region # the test reads the company's turnover in the region
    value_b: 75 # EUR, average market capitalisation (Art. 3(2)(a), CERRE above)
    currency: EUR
    comply_months: 6 # "six months to comply with the other relevant obligations": https://www.euronews.com/2024/05/13/bookingcom-gatekeeper-under-eus-online-competition-rules
    duties: [side_loading, alt_payments, anti_steering, interoperability, no_self_preferencing, data_portability] # Arts. 5-7: https://www.hsfkramer.com/notes/crt/2024-03/digital-markets-act-overview
    max_fine_share: 0.10 # Art. 30: https://digital-markets-act.ec.europa.eu/citizens-and-whistleblower-portal/eu-citizens-qa_en
    repeat_fine_share: 0.20 # Art. 30, repeated infringements (same source)
    periodic_share: 0.05 # Art. 31: up to 5% of average daily worldwide turnover (same source)
  - key: uk_dmcc
    regulator: uk_cma
    name: Digital Markets, Competition and Consumers Act 2024
    in_force: "2025-01" # first SMS investigation opened 14 Jan 2025: https://www.clearygottlieb.com/news-and-insights/publication-listing/changes-to-uk-competition-and-consumer-enforcement-2025
    first_designations: "2025-10" # Google search 10 Oct 2025; Apple and Google mobile 22 Oct 2025 (designations below)
    users_share: null # no users test: "substantial and entrenched market power" (A: read as regulation.dominance_share of users)
    turnover_b: 25 # GBP, global turnover, or 1 in the UK: https://www.covingtonblogs.com/2024/06/10/overview-of-the-uks-new-digital-markets-regime/
    turnover_scope: world
    value_b: null
    currency: GBP
    comply_months: 6 # A: conduct requirements follow designation; none imposed by December 2025
    duties: [alt_payments, anti_steering, interoperability, no_self_preferencing] # A: the CMA's announced mobile roadmap (steering, interoperability, app review): https://www.gov.uk/government/news/cma-confirms-apple-and-google-have-strategic-market-status-in-mobile-platforms
    max_fine_share: 0.10 # DMCC Act penalties up to 10% of global turnover: https://www.covingtonblogs.com/2024/06/10/overview-of-the-uks-new-digital-markets-regime/
    repeat_fine_share: 0.10 # A: no higher cap for repeats
    periodic_share: 0.05 # DMCC daily penalties up to 5% of daily global turnover (same source)
  - key: jp_msca
    regulator: jftc
    name: Mobile Software Competition Act
    in_force: "2025-12" # full effect 18 Dec 2025: https://www.jftc.go.jp/en/policy_enforcement/digital/index.html
    first_designations: "2025-03" # Apple, iTunes KK and Google, March 2025 (same source)
    users_share: 0.317 # 40M average monthly smartphone users (Cabinet Order No. 376 of 2024: https://www.jftc.go.jp/file/Cabinet_Order_which_establishes_the_scale_of_business_operations_under_Article_3_Paragraph_1_of_the_MSCA.pdf) / 126M (WB)
    turnover_b: null
    turnover_scope: region
    value_b: null
    currency: JPY
    comply_months: 9 # designation March 2025 to full effect December 2025 (above)
    duties: [side_loading, alt_payments, anti_steering, no_self_preferencing] # app stores, payments, steering and self-preferencing: https://legalblogs.wolterskluwer.com/competition-blog/japans-mobile-software-competition-act-grows-its-guidelines/
    max_fine_share: 0.20 # MSCA surcharge 20% of the relevant turnover (A: not verified; the game reads it as a share of turnover)
    repeat_fine_share: 0.30 # A
    periodic_share: 0.0
  - key: kr_tba
    regulator: kftc
    name: Telecommunications Business Act amendment (app payments)
    in_force: "2021-09" # in force 14 Sep 2021: https://www.macrumors.com/2021/08/31/south-korea-passes-app-store-bill/
    first_designations: "2021-09"
    users_share: 0.0 # applies to every app market operator (same source; A: any platform with users in Korea)
    turnover_b: null
    turnover_scope: region
    value_b: null
    currency: KRW
    comply_months: 3 # Google's alternative billing from 18 Dec 2021: https://developers-kr.googleblog.com/2021/11/enabling-alternative-billing-in-korea-en.html
    duties: [alt_payments] # the law's payment-system duty (KEIA above)
    max_fine_share: 0.02 # up to 2% of Korean app revenue (A: reported KCC figure, not verified)
    repeat_fine_share: 0.03 # A
    periodic_share: 0.0

