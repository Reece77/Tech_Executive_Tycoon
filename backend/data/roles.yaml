# Hireable roles for v1 (docs/formulas.md sections 1, 2, 9).
# - primary skills weigh 3 and secondary skills weigh 1 in current ability (CA).
# - work_style is the role's natural style; a person whose style differs gets the
#   morale mismatch penalty (formulas.md section 9).
# - work_style_weights and interest_weights are relative weights for generation.
# - salary_band_mid_cents: 2010 US mid-point by level, in cents (North America = 1.0x).
# The founder is not a hireable role: the founder's employment uses the fixed role
# "founder" and CA uses the best-fit role below (formulas.md section 1).
# - product_function: what the role does on a product (formulas.md 11.3, M3): builder,
#   seller, marketer or none. The founder always counts as a builder.
# - summary and why_hire (M10b, formulas.md 23.4): what the role does and when to hire one.
# Drafted for M1a; M1a adds the schema and loads this file. Values are design defaults.
roles:
  - key: software_engineer
    label: Software engineer
    product_function: builder
    summary: "Builds and maintains the product: features, fixes and the code that keeps quality up. A builder on any product; software engineering and infrastructure matter most."
    why_hire: "Hire one when a product slips or develops too slowly: each adds output toward its maintenance line and full speed."
    primary: [software_engineering, infrastructure]
    secondary: [data, security, communication, product]
    work_style: builder
    work_style_weights: { builder: 6, operator: 2, researcher: 2, seller: 0 }
    interest_weights: { ai: 3, hardware: 1, crypto: 1, climate: 1, security: 2, gaming: 2, mining: 0, policy: 0, design: 1, fintech: 1, consumer: 2, enterprise: 2, open_source: 3 }
    salary_band_mid_cents: { junior: 6500000, mid: 9000000, senior: 11500000, staff: 14000000, principal: 16500000, exec: 19000000 }

  - key: data_scientist
    label: Data scientist
    product_function: builder
    summary: "Builds the data and machine-learning side of a product. A builder; data and ML research matter most, so they shine in AI and data-heavy categories."
    why_hire: "Hire one for AI and analytics products, where their skills count for more of a builder's output."
    primary: [data, ml_research]
    secondary: [software_engineering, communication, product, strategy]
    work_style: researcher
    work_style_weights: { builder: 2, operator: 1, researcher: 6, seller: 1 }
    interest_weights: { ai: 4, hardware: 1, crypto: 1, climate: 2, security: 1, gaming: 1, mining: 0, policy: 1, design: 1, fintech: 2, consumer: 1, enterprise: 2, open_source: 2 }
    salary_band_mid_cents: { junior: 7000000, mid: 9500000, senior: 12000000, staff: 14500000, principal: 17000000, exec: 19500000 }

  - key: devops_engineer
    label: DevOps engineer
    product_function: builder
    summary: "Keeps infrastructure running and secure, and builds alongside engineers. A builder; infrastructure and security matter most."
    why_hire: "Hire one as a product grows: they add builder output and raise the team's security, which makes a breach less likely."
    primary: [infrastructure, security]
    secondary: [software_engineering, operations, data, communication]
    work_style: operator
    work_style_weights: { builder: 3, operator: 6, researcher: 1, seller: 0 }
    interest_weights: { ai: 1, hardware: 2, crypto: 1, climate: 1, security: 3, gaming: 1, mining: 0, policy: 0, design: 0, fintech: 1, consumer: 1, enterprise: 3, open_source: 3 }
    salary_band_mid_cents: { junior: 6200000, mid: 8500000, senior: 10800000, staff: 13000000, principal: 15200000, exec: 17500000 }

  - key: security_engineer
    label: Security engineer
    product_function: builder
    summary: "Finds and fixes security weaknesses and builds secure features. A builder; security and infrastructure matter most."
    why_hire: "Hire one before a product passes 1,000 customers: security coverage lowers the monthly chance of a breach."
    primary: [security, infrastructure]
    secondary: [software_engineering, legal, communication, data]
    work_style: builder
    work_style_weights: { builder: 5, operator: 3, researcher: 2, seller: 0 }
    interest_weights: { ai: 1, hardware: 2, crypto: 2, climate: 0, security: 4, gaming: 1, mining: 0, policy: 2, design: 0, fintech: 2, consumer: 1, enterprise: 2, open_source: 2 }
    salary_band_mid_cents: { junior: 6800000, mid: 9200000, senior: 11800000, staff: 14200000, principal: 16500000, exec: 19000000 }

  - key: product_manager
    label: Product manager
    product_function: builder
    summary: "Decides what to build and keeps the team on the right problems. A builder; product, strategy and communication matter most."
    why_hire: "Hire one when the team is large enough that direction, not hands, limits progress."
    primary: [product, strategy]
    secondary: [communication, design, data, leadership]
    work_style: operator
    work_style_weights: { builder: 3, operator: 5, researcher: 1, seller: 1 }
    interest_weights: { ai: 2, hardware: 1, crypto: 1, climate: 1, security: 1, gaming: 2, mining: 0, policy: 1, design: 3, fintech: 2, consumer: 3, enterprise: 3, open_source: 1 }
    salary_band_mid_cents: { junior: 7000000, mid: 9500000, senior: 12000000, staff: 14500000, principal: 16500000, exec: 19000000 }

  - key: designer
    label: Designer
    product_function: builder
    summary: "Designs how the product looks and works. A builder; design and product matter most, and consumer categories weigh design heavily."
    why_hire: "Hire one for consumer and design-led products, where design counts for more of a builder's output."
    primary: [design, product]
    secondary: [communication, marketing, software_engineering]
    work_style: builder
    work_style_weights: { builder: 6, operator: 1, researcher: 2, seller: 1 }
    interest_weights: { ai: 1, hardware: 1, crypto: 0, climate: 2, security: 0, gaming: 3, mining: 0, policy: 0, design: 5, fintech: 1, consumer: 4, enterprise: 1, open_source: 1 }
    salary_band_mid_cents: { junior: 5500000, mid: 7500000, senior: 9500000, staff: 11500000, principal: 13500000, exec: 15500000 }

  - key: sales_representative
    label: Sales representative
    product_function: seller
    summary: "Sells to smaller customers. A seller; sales, negotiation and communication set how many deals they close."
    why_hire: "Hire one when 'sales capacity limited' appears in an SMB or sales-led segment: each adds customers a month."
    primary: [sales, negotiation]
    secondary: [communication, product, marketing]
    work_style: seller
    work_style_weights: { builder: 0, operator: 2, researcher: 0, seller: 8 }
    interest_weights: { ai: 1, hardware: 1, crypto: 1, climate: 1, security: 1, gaming: 1, mining: 0, policy: 1, design: 0, fintech: 2, consumer: 3, enterprise: 3, open_source: 0 }
    salary_band_mid_cents: { junior: 4500000, mid: 6000000, senior: 7500000, staff: 9000000, principal: 10500000, exec: 12500000 }

  - key: account_executive
    label: Account executive
    product_function: seller
    summary: "Closes larger deals with mid-market and enterprise customers. A seller; sales and negotiation matter most."
    why_hire: "Hire one when a mid-market or enterprise segment is capacity limited: sellers set how many customers you can win there."
    primary: [sales, negotiation]
    secondary: [communication, strategy, product, finance]
    work_style: seller
    work_style_weights: { builder: 0, operator: 2, researcher: 0, seller: 8 }
    interest_weights: { ai: 1, hardware: 1, crypto: 0, climate: 1, security: 2, gaming: 0, mining: 0, policy: 1, design: 0, fintech: 2, consumer: 1, enterprise: 5, open_source: 0 }
    salary_band_mid_cents: { junior: 6000000, mid: 8000000, senior: 10000000, staff: 12000000, principal: 14000000, exec: 16500000 }

  - key: marketer
    label: Marketer
    product_function: marketer
    summary: "Builds the brand and brings customers in. A marketer; marketing, communication and design set how far the budget goes."
    why_hire: "Hire one when brand lags: marketers multiply what the marketing budget buys toward the brand target."
    primary: [marketing, communication]
    secondary: [design, data, product, sales]
    work_style: seller
    work_style_weights: { builder: 2, operator: 2, researcher: 1, seller: 5 }
    interest_weights: { ai: 1, hardware: 1, crypto: 1, climate: 2, security: 0, gaming: 3, mining: 0, policy: 1, design: 3, fintech: 1, consumer: 5, enterprise: 2, open_source: 1 }
    salary_band_mid_cents: { junior: 5000000, mid: 6800000, senior: 8800000, staff: 10800000, principal: 12800000, exec: 15000000 }

  - key: finance_manager
    label: Finance manager
    product_function: none
    summary: "Runs the books, fundraising paperwork and reporting. Support staff, not on a product; finance and operations matter most."
    why_hire: "Hire one from about 15 staff, or before stage 3: support staff cover the admin load that otherwise slows everyone."
    primary: [finance, strategy]
    secondary: [legal, operations, data, negotiation]
    work_style: operator
    work_style_weights: { builder: 1, operator: 6, researcher: 2, seller: 1 }
    interest_weights: { ai: 1, hardware: 0, crypto: 2, climate: 1, security: 0, gaming: 0, mining: 1, policy: 2, design: 0, fintech: 5, consumer: 1, enterprise: 3, open_source: 0 }
    salary_band_mid_cents: { junior: 6000000, mid: 8000000, senior: 10000000, staff: 12500000, principal: 14500000, exec: 17000000 }

  - key: recruiter
    label: Recruiter
    product_function: none
    summary: "Finds and screens candidates. Support staff, not on a product; recruiting and communication matter most."
    why_hire: "Hire one when you hire often: recruiters run hiring plans and keep support coverage up as headcount grows."
    primary: [recruiting, judgment_of_talent]
    secondary: [communication, negotiation, sales]
    work_style: seller
    work_style_weights: { builder: 0, operator: 3, researcher: 1, seller: 6 }
    interest_weights: { ai: 1, hardware: 1, crypto: 0, climate: 1, security: 1, gaming: 1, mining: 0, policy: 1, design: 1, fintech: 1, consumer: 2, enterprise: 3, open_source: 1 }
    salary_band_mid_cents: { junior: 4500000, mid: 6000000, senior: 7800000, staff: 9500000, principal: 11200000, exec: 13500000 }

  - key: operations_manager
    label: Operations manager
    product_function: none
    summary: "Keeps the company running: offices, processes and vendors. Support staff, not on a product; operations matters most."
    why_hire: "Hire one as the company passes about 15 staff: support coverage keeps output and morale from slipping."
    primary: [operations, leadership]
    secondary: [finance, procurement, communication, strategy]
    work_style: operator
    work_style_weights: { builder: 1, operator: 7, researcher: 0, seller: 2 }
    interest_weights: { ai: 1, hardware: 2, crypto: 0, climate: 2, security: 1, gaming: 0, mining: 1, policy: 2, design: 0, fintech: 1, consumer: 1, enterprise: 3, open_source: 0 }
    salary_band_mid_cents: { junior: 5500000, mid: 7200000, senior: 9200000, staff: 11200000, principal: 13200000, exec: 15500000 }

  # --- M12b (formulas.md 26): hardware, chips and manufacturing roles, appended ---
  - key: hardware_engineer
    label: Hardware engineer
    product_function: builder
    summary: "Designs devices and servers: boards, enclosures and the parts list. A builder on hardware products; hardware design matters most."
    why_hire: "Hire one for a device or server product: hardware design is the biggest part of its development skill."
    primary: [hardware_design, manufacturing]
    secondary: [chip_design, software_engineering, design, procurement]
    work_style: builder
    work_style_weights: { builder: 6, operator: 2, researcher: 2, seller: 0 }
    interest_weights: { ai: 1, hardware: 6, crypto: 1, climate: 1, security: 1, gaming: 2, mining: 0, policy: 0, design: 2, fintech: 0, consumer: 3, enterprise: 2, open_source: 1 }
    salary_band_mid_cents: { junior: 6800000, mid: 9200000, senior: 11800000, staff: 14200000, principal: 16800000, exec: 19500000 }

  - key: chip_designer
    label: Chip designer
    product_function: builder
    summary: "Designs chips: architecture, logic and verification before the wafers are ordered. A builder on chip products; chip design matters most."
    why_hire: "Hire one for a chip product or chip-design research: chip design is most of a chip's development skill and its yield."
    primary: [chip_design, hardware_design]
    secondary: [software_engineering, manufacturing, data, ml_research]
    work_style: researcher
    work_style_weights: { builder: 4, operator: 1, researcher: 5, seller: 0 }
    interest_weights: { ai: 4, hardware: 6, crypto: 1, climate: 0, security: 1, gaming: 1, mining: 0, policy: 0, design: 0, fintech: 0, consumer: 1, enterprise: 2, open_source: 1 }
    salary_band_mid_cents: { junior: 7500000, mid: 10200000, senior: 13000000, staff: 15800000, principal: 18500000, exec: 21500000 }

  - key: manufacturing_engineer
    label: Manufacturing engineer
    product_function: builder
    summary: "Runs production lines: process, quality and yield. Staffs an assembly plant (one per 1,000 units a month) and builds alongside hardware engineers."
    why_hire: "Hire one to staff your own assembly plant: their manufacturing skill sets its yield."
    primary: [manufacturing, operations]
    secondary: [hardware_design, procurement, data, leadership]
    work_style: operator
    work_style_weights: { builder: 3, operator: 6, researcher: 1, seller: 0 }
    interest_weights: { ai: 0, hardware: 5, crypto: 0, climate: 2, security: 0, gaming: 0, mining: 1, policy: 1, design: 1, fintech: 0, consumer: 1, enterprise: 2, open_source: 0 }
    salary_band_mid_cents: { junior: 5200000, mid: 7000000, senior: 9000000, staff: 11000000, principal: 13000000, exec: 15200000 }

  # --- M18 (formulas.md 34.2): exploration, appended ---
  - key: geologist
    label: Geologist
    product_function: none
    summary: "Finds and measures mineral deposits: desk studies, surveys, sampling, drilling and resource estimates. Field geology is their geology skill; geophysics and resource estimation draw on geology and data together."
    why_hire: "Hire one before exploring: every exploration stage needs a geologist free, and the team's skill narrows every estimate range (34.2). Mining cities (Perth, Santiago, Johannesburg, Toronto) have the deepest pools."
    primary: [geology, data]
    secondary: [mining_engineering, communication, operations, judgment_of_talent]
    work_style: researcher
    work_style_weights: { builder: 2, operator: 3, researcher: 5, seller: 0 }
    interest_weights: { ai: 0, hardware: 1, crypto: 0, climate: 3, security: 0, gaming: 0, mining: 8, policy: 1, design: 0, fintech: 0, consumer: 0, enterprise: 1, open_source: 0 }
    salary_band_mid_cents: { junior: 6000000, mid: 8200000, senior: 10500000, staff: 12800000, principal: 15000000, exec: 17500000 }

  # --- M19 (formulas.md 35.2): mining operations, appended ---
  - key: mining_engineer
    label: Mining engineer
    product_function: none
    summary: "Plans and runs a mine: pit and stope design, the mill, maintenance and safety. Their skill is the mean of mining engineering and operations."
    why_hire: "Hire one to staff a mine (one per 10,000 t a year of capacity, at least one): coverage and skill set its reliability and cut its accident rate (35.4)."
    primary: [mining_engineering, operations]
    secondary: [geology, data, leadership, procurement]
    work_style: operator
    work_style_weights: { builder: 3, operator: 6, researcher: 1, seller: 0 }
    interest_weights: { ai: 0, hardware: 1, crypto: 0, climate: 2, security: 0, gaming: 0, mining: 8, policy: 1, design: 0, fintech: 0, consumer: 0, enterprise: 1, open_source: 0 }
    salary_band_mid_cents: { junior: 6500000, mid: 8800000, senior: 11000000, staff: 13500000, principal: 16000000, exec: 18500000 }
