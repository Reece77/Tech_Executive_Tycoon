# Commodity suppliers (docs/formulas.md 33.4, M17, lane A): the counterparties of offtake
# agreements. In M17 they are counterparties only (no products or pools); M19 and M20 turn the
# relevant ones into rival mining and refining companies.
#
# From dossier 3.1 and 3.2, plus producers the dossier names in section 2 so that every good has
# at least two suppliers (marked "added"; no revenue is given for those).
#   region: regions.yaml key of the headquarters. goods: good -> rough share of world production
#     or refining the supplier holds (A: an assumption for gameplay unless a comment says
#     otherwise). reliability: 0-1, the chance it keeps delivering through a severe shock; a
#     breach's monthly chance is (1 - reliability) x offtake.breach.monthly_scale (A).
#   from / until: months it can sign (a good may carry its own: { share, from, until }) (inclusive; open when absent). An offtake still running in
#     the month after `until` ends as a breach (Ingas and Cryoin, February 2022).
#   revenue_2010: the dossier's 2010 revenue in US$ millions, as_printed in the source's own
#     currency, its source and tag. M17 sub-task 1 spot-checked every value the dossier tagged R
#     (recalled) against a published source (2026-11-08): tag "checked" with the source, or
#     "unverified" with why. The session's network could not open sec.gov or company PDFs
#     directly, so each check reads the figure from search results quoting the source.
suppliers:
  # --- 3.1 Mining and primary producers --------------------------------------------------------
  - key: freeport
    name: Freeport-McMoRan
    region: north_america
    listing: NYSE
    goods: { copper: 0.08, cobalt: { share: 0.10, until: "2016-10" } } # sold Tenke Fungurume to CMOC in November 2016 (dossier, R)
    reliability: 0.92
    revenue_2010: { usd_m: 18982, as_printed: "Revenues $18,982 million (FY2010)", tag: checked, source: "Freeport-McMoRan 2010 Form 10-K, https://www.sec.gov/Archives/edgar/data/0000831259/000083125911000014/fcx123110-10k.htm" } # dossier R ~$19.0B: matches
  - key: bhp
    name: BHP Billiton
    region: oceania
    listing: ASX/LSE/NYSE
    goods: { copper: 0.07 }
    reliability: 0.95
    revenue_2010: { usd_m: 52798, as_printed: "Revenue US$52,798 million (year ended 30 June 2010)", tag: checked, source: "BHP Billiton results for the year ended 30 June 2010, https://www.bhp.com/-/media/bhp/documents/investors/news/2010/100825bhpbillitonresultsyearended30june2010.pdf" } # dossier R ~$52.8B: matches
  - key: rio_tinto
    name: Rio Tinto
    region: europe
    listing: LSE/ASX/NYSE
    goods: { copper: 0.04, lithium_carbonate: { share: 0.08, from: "2025-03" } } # bought Arcadium Lithium in 2025 (dossier, R)
    reliability: 0.95
    revenue_2010: { usd_m: 56576, as_printed: "Consolidated sales revenue US$56,576 million; gross sales revenue US$60.32 billion (2010)", tag: checked, source: "Rio Tinto 2010 full-year results as reported by SteelOrbis (https://www.steelorbis.com/steel-news/latest-news/rio-tintos-net-profit-rises-194-percent-in-2010-582106.htm); 2010 Form 20-F https://www.sec.gov/Archives/edgar/data/0000863064/000095012311025507/u10506e20vf.htm" } # dossier R ~$60B was gross sales (matches); the IFRS revenue line, used here, is $56.6B
  - key: glencore
    name: Glencore
    region: europe
