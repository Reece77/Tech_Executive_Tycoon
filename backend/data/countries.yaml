# Tension between the US-aligned and China blocs, 0-100 (39.1). To December 2025 the history,
# the same on every seed: an assumption scaled from the dossier 5 timeline (quiet to 2017;
# the Section 301 tariffs and ZTE in 2018; Huawei 2019; the FDPR and SMIC 2020; October 2022's
# rules; 2023's tool deals and gallium licensing; December 2024's bans; Busan's truce in
# October-November 2025). Values hold from their month until the next.
tension_history:
  - ["2010-01", 22]
  - ["2010-09", 26] # the rare-earth halt to Japan
  - ["2012-03", 28] # the WTO case
  - ["2014-08", 25]
  - ["2016-01", 27]
  - ["2018-04", 40] # ZTE's denial order
  - ["2018-07", 50] # Section 301 tranches
  - ["2019-05", 60] # Huawei listed
  - ["2020-05", 65] # the FDPR to Huawei
  - ["2020-12", 68] # SMIC listed
  - ["2022-10", 75] # the October 2022 rules
  - ["2023-07", 78] # gallium and germanium licensing
  - ["2024-12", 82] # the December 2024 bans
  - ["2025-04", 85] # tariff escalation and April's rare-earth controls
  - ["2025-11", 72] # the Busan truce
