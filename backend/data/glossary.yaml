# Definitions for tooltips (M7b; spec 13: "every number has a tooltip explaining its drivers").
# Term id -> one or two sentences in plain words. Every KPI label and table column header in
# the front end names a term here (frontend/src/lib/glossary.test.ts fails on a missing one).
# Ids: lower-case words joined by _, with one optional "." (kpi.cash, line.net, account.x).
# Never mention a hidden value (ADR-0007): these describe what the player can see.
terms:
  # --- KPIs (tiles on Overview, People, Products, Finance, Competitors, Game over) ---------
  kpi.cash: "Money in the bank now. It moves with revenue, costs, funding and event effects."
  kpi.burn: "Net cash the business used last month, before financing: costs less revenue and event gains. Investor and loan money does not count."
  kpi.runway: "Months of cash left at this month's projected net burn. 'Profitable' means revenue covers projected costs."
  kpi.mrr: "Monthly recurring revenue: what customers paid in the last closed month."
  kpi.arr: "Annual run rate: 12 times last month's recurring revenue."
  kpi.headcount: "Everyone on the staff now, the founder included, and how many are on notice."
  kpi.payroll: "Salaries plus benefits paid in the last closed month."
  kpi.avg_morale: "The average morale of your employees (not the founder), 0 to 100. Below 40 people start to look elsewhere."
  kpi.org: "Departments and teams, and how stretched their managers are."
  kpi.support: "Support staff (finance, recruiting, operations and executives) against one per 15 staff. A shortfall slows everyone in the pool and costs morale."
  kpi.funding: "Your latest priced round, the post-money valuation, and how much of the company the founder owns."
  kpi.people_cost: "Salaries, benefits and office space this month for the whole staff."
  kpi.mission: "The two interests the company stands for. People who share them are happier here."
  kpi.customers: "Paying customers (or users, for consumer products) across every segment now."
  kpi.product_costs: "Hosting and marketing this month across your products."
  kpi.hosting: "Compute to serve this product's customers this month."
  kpi.development: "How fast the team is improving the product: fast, steady or slow."
  kpi.fd_shares: "Every share, every option granted and the unallocated option pool."
  kpi.share_price: "The price per share of your latest priced round."
  kpi.post_money: "The company's value just after the latest priced round: pre-money plus the money raised."
  kpi.founder_owns: "The founder's share of the fully diluted company."
  kpi.board_confidence: "The directors' average confidence in you, 0 to 100. Below the removal line for too long, they replace the founder."
  kpi.board_seats: "Who sits on the board and who appointed them."
  kpi.board_expects: "What the board looks for at its next meeting."
  kpi.next_meeting: "When the board meets next; it meets every quarter."
  kpi.rival_staff: "People a rival has working on the markets you share, as far as you can tell."
  kpi.rival_revenue: "A rival's monthly revenue in the markets you share."
  kpi.rival_money: "How well funded a rival looks, in words."
  kpi.rival_stance: "How a rival is behaving toward you lately."
  kpi.lasted: "How long the company ran before the game ended."
  kpi.peak_headcount: "The most people on the staff at any month end."
  kpi.arr_at_end: "Annual run rate in the last month played."
  kpi.founder_owned: "The founder's share of the company when the game ended."

  # --- People, recruitment and the org ------------------------------------------------------
  name: "Who or what the row is about. Click a name to open it."
  age: "Age in years at the current date."
  level: "Seniority: junior, mid, senior, lead or principal. It sets the market rate and what the person can manage."
  role: "The job the person does. It decides which skills matter most."
  role_label: "The job the person does or the plan hires for."
  salary: "Annual salary. Below the market rate it weighs on morale."
  morale: "How happy the person is, 0 to 100. It moves toward a target set by pay, fit, runway, their manager and teammates."
  form: "How well the person is working lately."
  top: "The person's three strongest skills as far as you know them. Ranges narrow as you learn more."
  status: "Where the row stands now: active, on notice, open, closed, live and so on."
  unit: "The department or team the person belongs to."
  manager: "Who the person reports to, and how that manager is coping."
  skill_range: "What you know of this skill, 1 to 20. A range narrows as you work with someone or check references."
  personality_range: "What you know of this personality trait, 1 to 20. Interviews narrow it."
  asks: "The salary the candidate expects. Offers well below it are often declined."
  interests: "What the candidate cares about. Shared with the company mission, it lifts morale."
  known: "What you have done to learn about the candidate: screened, interviewed, references checked."
  actions: "What you can do next, and the energy each action costs."

  # --- Hiring plans --------------------------------------------------------------------------
  owner_name: "The delegate who runs the plan with their own energy."
  channel: "Where the search looks: job posts, a recruiter, or the founder's network."
  hired: "People hired so far against the plan's target."
  ratio_bp: "The highest salary the delegate may offer, as a share of the candidate's ask."
  equity_bp: "Equity offered with each hire, in percent of the company."
  unit_name: "The unit new hires join."
  focus: "What the delegate looks for first: skill, fit or cost."
  activity: "What the delegate did for the plan last month."

  # --- Products and markets ------------------------------------------------------------------
  category_label: "The kind of product: B2B SaaS, consumer app and so on."
  quality: "How good the product is, 0 to 100. Builders raise it; with nobody working on it, it falls."
  feature_score: "How complete the product's features are, 0 to 100."
  brand: "How well known and trusted the product is, 0 to 100. Marketing raises it."
  customers: "Customers (or users) now."
  mrr_cents: "Monthly recurring revenue in the last closed month."
  trend: "How the number moved over the last months."
  pace: "How fast the team is improving the product: fast, steady or slow."
  appeal: "How attractive the product is to this segment: its quality, price, brand and features, weighed the segment's way."
  price_cents: "The monthly price per customer in this segment."
  price: "The monthly price per customer in this segment."
  share_of_served: "This product's share of the segment's customers who are buying something."
  company_name: "The company that sells the product, or whose save it is."
  segment: "The customer segment: consumers, small businesses, mid-market or enterprise."
  reach: "How new customers find the product: by themselves, or through your sales team."
  new_last_month: "New customers won in the last closed month."
  churned_last_month: "Customers lost in the last closed month."
  churn: "The share of customers lost each month."

  # --- Rivals ----------------------------------------------------------------------------------
  personality_label: "The rival's style: how it tends to price, build and hire."
  stance: "How the rival is behaving toward you lately."
  competes: "The markets where the rival sells against you."
  staff_estimate: "People the rival has, as far as you can tell."
  money: "How well funded the rival looks, in words."
  last: "The rival's latest move you know of."
  running_now: "What the rival is doing with the product now: a price cut, a marketing push and so on."

  # --- Finance: cap table, rounds, board --------------------------------------------------------
  holder: "Who owns the shares: founder, investors, employees through options, or the pool."
  share_class: "Common shares, preferred shares from priced rounds, or options."
  shares: "Shares held."
  fraction: "Share of the fully diluted company: every share, option and the unallocated pool."
  fraction_before: "Share of the fully diluted company now."
  fraction_after: "Share of the fully diluted company after the round closes."
  change: "How the share changes with this round."
  granted: "Options granted to the person."
  vested: "Options the person has earned so far."
  unvested: "Options still to be earned; they lapse if the person leaves."
  next: "When the next options vest."
  start_turn: "When the options were granted."
  firm_name: "The investor offering the term sheet."
  pre_money_cents: "What the investor values the company at before their money goes in."
  post_money_cents: "Pre-money plus the money raised."
  amount_cents: "How much money the investor puts in."
  own: "The founder's share of the company if you accept this term sheet."
  seat: "The board seat that comes with the money, if any."
  expires_turn: "The last month you can accept the term sheet."
  confidence: "How confident the director is in you, 0 to 100."
  trend_board: "How the director's confidence moved over recent months."
  months_below: "Months in a row the board's confidence has been under the removal line."
  seated_label: "When the director joined the board."

  # --- History -------------------------------------------------------------------------------
  month: "The month it happened."
  category: "People, products, finance, rivals or events."
  what: "What happened, with links to the people and products involved."
  by: "Who did it: you, a named delegate, or 'Default (at Continue)' for an event left unanswered."

  # --- Saves ---------------------------------------------------------------------------------
  display_name: "The save's name. Renaming it never changes the company's name."
  scenario_id: "How the game started: the scenario's money and situation."
  difficulty: "Easy, standard, hard or Ironman. Ironman saves cannot be copied or restored."
  turn: "The game date the save has reached."
  game_state: "Active, or how the game ended: bankrupt or founder removed."
  last_played: "When the save last changed on this computer."
  size_bytes: "The save file's size on disk."
  backup_kind: "Periodic backups come every 12 months of play; others were taken before an upgrade."
  backup_taken: "When the backup file was written."

  # --- Statements (Finance) -------------------------------------------------------------------
  statement_line: "A line of the profit and loss, in thousands of dollars. Hover a line for what it holds."
  period: "One month, quarter or year of the statements, in thousands of dollars. An asterisk marks a period still in progress."
  line.revenue: "Everything customers paid in the period."
  line.gross: "Revenue minus the cost of serving customers (hosting)."
  line.opex: "Operating expenses: salaries, benefits, rent, recruiting, marketing and general costs."
  line.interest: "Interest paid on debt (none in v1)."
  line.tax: "Income tax (none in v1)."
  line.net: "What is left after every cost: the period's profit or loss."
  account.4000_revenue_subscriptions: "Recurring subscription revenue from your products."
  account.4100_revenue_licenses: "Revenue from licences."
  account.4200_revenue_services: "Revenue from services work."
  account.4900_other_income: "Money in from events and other one-off gains."
  account.5000_cogs: "Direct costs of what you sold."
  account.6000_salaries: "Salaries paid to the staff."
  account.6010_benefits: "Benefits on top of salaries."
  account.6100_rent: "Office space for people who work from the office."
  account.6200_recruiting: "Job posts, recruiter fees and other hiring costs."
  account.6300_compute: "Hosting: the compute that serves your customers."
  account.6400_marketing: "Marketing budgets of your products."
  account.6500_research_development: "Research and development outside salaries."
  account.6900_general_admin: "Overhead, tools, travel, severance and other general costs."
  account.7000_interest: "Interest on debt."
  account.8000_income_tax: "Income tax."
  # M8: divisions, executives and new markets (formulas.md 18)
  division_line: "A line of a division's statement, in thousands of dollars: its own revenue and costs, then its share of corporate costs."
  division_column: "Corporate, each division, and the company. Divisions and corporate add up to the company."
  division.shared_services: "Corporate operating costs shared by headcount among corporate and the central divisions. A reporting line: no cash moves."
  division.direct_profit: "The division's revenue minus the costs of its own people and products."
  division.operating_profit: "Direct profit after the shared-services allocation."
  division.layer_tax: "Each layer below a department under a division costs 3% of output (never more than 15%); a strong COO halves it."
  division.cross_division: "A product built by units in more than one division loses 10% of its output."
  division.embedded: "Embedded services: the division keeps its own support staff and decides faster, so its output and capacity rise 5%. It takes no share of corporate costs."
  seat.fit: "How well someone suits a seat, judged from what you know of their skills. An estimate."
  seat.vacancy: "From stage 3, an empty seat costs the company half the effect of a weak holder."
  # --- Debt and the macro economy (M10, formulas.md 20) -------------------------------------
  lender: "Who lent the money: venture debt after a priced round, or a bank once the company is a profitable scale-up."
  principal_cents: "The amount borrowed when the loan was signed."
  signed_label: "The month the loan was signed. The rate was fixed then."
  warrant_shares: "Shares the venture lender may buy, granted at signing: 0.25% of the company. They dilute everyone."
  balance_cents: "Principal still owed. Each month's payment lowers it; repaying early carries no fee."
  rate_bp: "The interest rate a year: the base rate when signed plus the lender's spread, two points higher after a breach if you chose that."
  next_payment: "What Continue pays this month: interest on the balance, and principal once any interest-only months are over."
  covenants: "The lender's tests, checked each month: headroom above zero holds. A breach brings the lender's terms; a second within six months makes the whole balance due."
  macro.base_rate: "The US federal funds rate, % a year. History to 2025, then it moves in cycles. Loans price off it."
  macro.climate: "How eager venture investors are. It multiplies the ARR multiple they pay and how many firms answer a round."
  macro.confidence: "Consumer confidence, 100 = the 2010-2019 average. Consumer and SMB customers adopt faster when it is high."
  macro.ai_compute: "The price of AI compute against 2010. AI hosting costs follow it."
  macro.downturn: "From 2026 a downturn can start once every few years: for twelve months rates, the venture climate and confidence fall."
  # --- Cities, offices and regions (M9, formulas.md 19) ------------------------------------
  geo.city: "A tech hub where you can lease an office and hire. Its region is the market its people sell to."
  geo.region: "One of the seven regions. Each is a market of its own, sized against your home region."
  geo.salary_index: "Pay in the city against San Francisco (1.00). Everyone's market rate follows the city they work in."
  geo.rent_index: "Office rent in the city against San Francisco (1.00), for leases and flexible HQ space."
  geo.talent: "Extra skill candidates found there bring to their role, by skill group; each + is half a point."
  geo.people: "Your staff who work in the city: in an office there, or remote and living there."
  geo.office: "Flexible space in the HQ city, or a leased office."
  geo.office_people: "People working there, against the office's seats. Flexible space has no limit."
  geo.rent: "What the office costs a month: a lease's rent, full or not, or flexible space per head."
  geo.cost_per_head: "Salaries, benefits and the office's rent a month, divided by the people working there."
  geo.units: "The units based in the office. Their members work there unless the unit is remote."
  geo.office_status: "When the lease started, or that it is crowded: more people than seats costs everyone in it morale."
  geo.region_status: "Home, live in the region since a month, localizing until a month, or not launched."
  geo.region_prices: "The product's monthly price in each segment in the region."
  geo.region_customers: "Customers in the region; for a region it has not launched in, the customers there to win."
  geo.region_mrr: "Monthly revenue from the region at today's customers and prices."
  geo.reach: "Self-serve buyers abroad hear of you as much as at home once you have localized; sales-led segments need sellers in the region, or half as much from its neighbour."
  geo.region_marketing: "The share of the product's marketing budget spent in the region and the self-serve awareness it buys there: full at the default split (by revenue), 70% with none."
  geo.region_rivals: "Other companies' products of the category selling in the region."
  geo.work_city: "The city they work in: their unit's office city, or where they live if remote."
  geo.candidate_city: "Where the candidate lives. 'Would relocate' means they would move to the search's city, for a relocation fee if hired."
  # --- M10b: feel fixes (formulas.md 23) ----------------------------------------------------
  events.modifier: "A lasting effect of an event choice: a percent change to one thing (brand target, quality cap, builder output, seller capacity, awareness, churn, morale target or your energy) every month for a number of months, then it ends."
  events.active_effects: "Event effects still running, where each came from and how many months are left."
  events.critical: "A crisis that needs your decision before Continue: a key person leaving, a security breach, an outage or a press storm. At most one comes in any six months."
  inbox.bookmark: "Starred messages stay in the inbox. Read messages older than three months archive themselves; answered events archive at once."
  product.team_strength: "The team's builder output a month against two lines: below the maintenance line quality falls; at full speed quality and features grow as fast as they can."
  org.structure_guide: "What departments, teams and divisions do, with your company's numbers: span of control, managers, the layer tax, cross-division work, support coverage and executive effects."
  role.why_hire: "What the role does on a product and when hiring one helps."
  # --- M10c: executives with authority (formulas.md 24) -------------------------------------
  exec.authority: "Lets a seat holder run their function each month within the guardrails you set, through the same actions you would take, with their own energy. Better executives make better calls; a misstep is a plausible but worse choice, named in their decisions."
  exec.guardrails: "Limits on what an executive with authority may do: a headcount cap and pay ceiling, a price band, marketing as a share of revenue, a support coverage target, or the runway that triggers a funding proposal."
  exec.proposal: "Something an executive wants you to approve: a funding round, a loan or an office lease. Pending proposals block Continue until you approve or decline them; approving takes the action as you."
  exec.pitch: "A big move an executive with authority proposes, at most once a quarter, with why, the cost and a low and high case at 24 months. Approve runs it as the executive, with their energy; Modify opens its own screen; Decline costs them a little morale. Pending pitches block Continue."
  exec.auto_approve: "On holiday, a pitch that costs less than this over 12 months goes ahead and is reported; bigger ones wait for you. The default is 5% of cash; 0 means always ask."
  exec.pitch_record: "An executive's pitches and how the approved ones turned out after 24 months: a hit reached its central case (the same yardstick for every executive), a miss did not, too early means what it created was not yet running."
  era.first_mover: "Pull an era forward and for 24 months your products in its markets get +8 quality cap, +15 brand target and 15% more appeal, and your lead does not decay. An era report at the end shows what it added."
  market.size: "Customers who could buy, times the typical monthly price, times 12: what a market is worth a year if every possible customer paid the reference price."
  exec.report: "Each seat holder's quarterly report: their function's numbers, what they did with their authority, and one or two concerns."
  # M12a: Infrastructure (formulas.md 22)
  infra.component_index: "A component's price against January 2010 (1.00). Builds are priced at this month's index; a shortage cuts allocation and delays part of a build."
  infra.spot: "What one compute unit (CU) costs a month bought on spot. GPU compute follows the AI compute index."
  infra.site: "A data centre: its kind, region and when it went live or was ordered."
  infra.size: "Compute units (CU) it is built for. One CU is what $1,000 a month buys on spot in 2010."
  infra.use: "CU your own products use, CU sold as Cloud hosting, and what is free, against what is live."
  infra.reliability: "0 to 100, from staff coverage and the staff's infrastructure skill. Low reliability brings outages; it is your Cloud hosting quality."
  infra.staff: "Infrastructure people (DevOps or security engineers) in the unit assigned to it, against one per 200 CU needed."
  infra.cost_per_used: "This month's depreciation and operating cost divided by the CU used, against the spot price. Under-used capacity is dear."
  infra.book_value: "Capex paid less depreciation so far. Selling brings half of it."
  infra.cloud_customers: "Customers buying your spare capacity, by segment. They are capped by the spare CU in each region and its neighbour."
  infra.cloud_revenue: "This month's Cloud hosting revenue at current customers and prices."
  infra.cloud_price: "Your average price per CU against the market leader's."
  infra.outages: "Data-centre outages in the last 12 months. Each costs hosted products customers and makes cloud customers churn faster."
  account.6700_depreciation: "Data centres' capex spread over their life, plus any loss on a sale. A cost of revenue, like hosting; it moves no cash."
  # --- Research and eras (M11, formulas.md 21) ----------------------------------------------
  research.domain: "A field of technology: software platform, AI, infrastructure, chip design or devices. Each feeds some markets."
  research.baseline: "The world's level in the domain, free to everyone. It rises every month, and by 5 points when one of the domain's eras arrives."
  research.lead: "Points ahead of the industry in this field; start a project to build one. A lead is know-how, not a person: research raises it, and without research it loses 1.5% a month."
  research.level: "Baseline plus lead. When any company's level reaches an era's threshold, the era arrives early."
  research.threshold: "The level that brings an era before its historical date: the baseline it would have by then plus 15 points."
  research.tech_factor: "Your research lead in a market lifts what product teams can reach and how fast features grow, more for a bigger lead, up to 50 points of it."
  research.researchers: "Members of the unit in builder roles. Each adds output from their research skills, morale and tags."
  research.budget: "What the project spends each month on compute, equipment and travel. Below full funding, progress scales down."
  research.funded: "The share of the full monthly budget the project gets."
  research.gain: "Estimated lead gained a month at this pace, from the skill ranges you see. Progress slows as the lead grows."
  research.months_to_era: "Months until your level reaches the domain's next era threshold at this pace, after decay."
  research.rival_range: "A rival's lead as a range: within 5 points, or within 2 once you have a licence with them."
  research.licence: "Licensing in buys part of a rival's lead once; licensing out grants part of yours for a royalty. A licensor keeps 10 points ahead."
  research.royalty: "A share of the licensee's monthly revenue in the domain's markets, paid to the licensor for 24 months."
  research.era: "A market-changing technology that arrives on its historical date unless a company researches it first. It accelerates its markets."
  research.first_mover: "The company that brings an era early gets 12 months of +5 quality cap and +10 brand target in its markets, and its lead does not decay."
  # --- Hardware (M12b, formulas.md 26.5) ---------------------------------------------------
  hardware.unit_cost: "What one unit costs to make: its bill of materials at the component index, its chip (your own at cost, or bought), and assembly (a contract manufacturer's fee, or your plant's cost per good unit)."
  hardware.gross_margin: "Price less unit cost, as a share of the price, in the product's first segment."
  hardware.units_sold: "Units sold last month. Demand above what your contracts and plants could make went to rivals."
  hardware.plant: "An assembly plant: its city, and when it went live or was ordered."
  hardware.plant_size: "Units a month it can run when fully staffed."
  hardware.plant_use: "Units run last month for your own products and sold as contract manufacturing, against its size."
  hardware.plant_yield: "The share of units run that come out good, from your manufacturing engineers' skill. Bad units cost their run but are not sold."
  hardware.plant_staff: "Manufacturing engineers in the unit assigned to it, against one per 1,000 units a month. Short staff runs fewer units."
  hardware.cost_per_good_unit: "Last month's fixed cost, cost per unit run and depreciation divided by good units, against a contract manufacturer's fee."
  hardware.cost_per_good: "Last month's fixed cost, cost per unit run and depreciation divided by good units, against a contract manufacturer's fee."
  hardware.cm_units: "Units a month you make for other device makers on your plants' spare capacity."
  hardware.cm_revenue: "This month's contract-manufacturing revenue at current customers and prices."
  # --- IPO, the public company, Chair and CEO (M13, formulas.md 25) ------------------------
  ipo: "Initial public offering: the company sells new shares to the public and lists on a stock exchange. It takes about five months, from hiring banks to listing day, and makes the company public (stage 4)."
  ipo.lead_underwriter: "The investment bank that runs the IPO: it files with the regulator, takes the roadshow and prices the shares. Its fee is a percentage of the money raised; a premium name prices higher."
  ipo.s1: "The registration statement filed with the regulator before an IPO. The regulator's questions about it can delay the listing."
  ipo.roadshow: "Weeks of meetings with investors before pricing: you choose how hard to push the price, how much of the company to sell, and whether to keep dual-class shares."
  ipo.book_demand: "How much investors asked for against the shares on offer, as the bank describes it: strong, solid, weak and so on. A strong book lets you raise the price."
  ipo.dual_class: "Two classes of shares: yours carry more votes, so you keep control after listing and a board vote cannot remove you. Investors pay a little less for the shares."
  public.market_cap: "Market capitalisation: the share price times the shares outstanding. It is what the market says the whole company is worth."
  public.guidance: "Revenue and operating margin you tell the market to expect for the coming quarter. Results are judged against it; without guidance, against the analysts' consensus."
  mna.value: "A listed company's market cap is public. A private one shows an estimated range, narrower after due diligence; its middle is not the true value."
  mna.diligence: "Two months and 0.5% of the estimated value (at least $50,000): narrows the range and shows its people, product ranges and any hidden problem."
  mna.brand: "Kept as a brand: it keeps its own books and people and decides under your directive. Its results consolidate into your statements; its spare cash sweeps to you."
  mna.integrate: "Integrated: its products and key people join you, with the staff its products need; the rest are let go with severance. Culture clash costs some people."
  mna.result: "A brand's own operating result for the period, before consolidation."
  public.guided_revenue: "The quarter's revenue you guided to, or the consensus when you gave no guidance."
  public.actual_revenue: "The quarter's revenue as reported at its end."
  public.margin: "Operating margin guided against what the quarter delivered: operating result as a share of revenue."
  public.beat_miss: "A beat is results above guidance; a miss, below; in line, close to it. Beats lift the share price and the board's confidence; misses cut both, and two in a row cut harder."
  public.consensus: "The analysts' average expectation for the coming quarter's revenue and margin. Guiding above it makes a miss likelier."
  public.analyst_rating: "Each covering analyst rates the shares buy, hold or sell, from how the price compares with what they think the company is worth."
  public.price_target: "Where an analyst expects the share price to be in a year. The average target is the mean across analysts."
  public.buyback: "The company buys its own shares on the market at a small premium. Fewer shares outstanding lift each remaining share's claim on the company; the cash leaves."
  public.dividend: "Cash paid to shareholders, an amount a share, declared now and paid at the month end. Your own shares receive it too."
  public.secondary: "A sale of new shares after the IPO, at a small discount to the price and for a fee. It raises cash and dilutes every holder, you included."
  public.activist: "A fund that buys a stake when the share price lags for months or the company keeps missing, and demands changes: a board seat or a buyback. You can also fight it in a costly proxy contest."
  public.takeover_bid: "An approach from a buyer for the whole company, usually at a premium to the share price. It tends to come when the price has lagged for a while."
  ceo.ceo: "Chief executive. Until the IPO that is you; once public you may appoint a CEO to run day-to-day operations within the authority you give them."
  ceo.chair: "As Chair you keep capital, strategy, guidance and executive appointments, with a smaller monthly energy budget. You can override any decision the CEO takes."
  ceo.authority: "The functions the CEO runs for you each month: hiring, pricing, marketing, support and the like. Turning one off hands it back to you."
  ceo.override: "Each month the CEO acts through the same actions you would take. Overriding a decision undoes it at an energy cost; a misstep is a plausible but worse call."
