# Definitions for tooltips (M7b; spec 13: "every number has a tooltip explaining its drivers").
# Term id -> one or two sentences in plain words. Every KPI label and table column header in
# the front end names a term here (frontend/src/lib/glossary.test.ts fails on a missing one).
# Ids: lower-case words joined by _, with one optional "." (kpi.cash, line.net, account.x).
# Never mention a hidden value (ADR-0007): these describe what the player can see.
terms:
  # --- KPIs (tiles on Overview, People, Products, Finance, Competitors, Game over) ---------
  kpi.cash: "Money in the bank now. It moves with revenue, costs, funding and event effects."
  kpi.burn: "Net cash the business used last month, before financing: costs less revenue and event gains. Investor and loan money does not count."
  kpi.runway: "Months of cash left at this month's projected net burn. 'Profitable' means revenue covers projected costs."
  kpi.mrr: "Monthly recurring revenue: what customers paid in the last closed month."
  kpi.arr: "Annual run rate: 12 times last month's recurring revenue."
  kpi.headcount: "Everyone on the staff now, the founder included, and how many are on notice."
  kpi.payroll: "Salaries plus benefits paid in the last closed month."
  kpi.avg_morale: "The average morale of your employees (not the founder), 0 to 100. Below 40 people start to look elsewhere."
  kpi.org: "Departments and teams, and how stretched their managers are."
  kpi.support: "Support staff (finance, recruiting, operations and executives) against one per 15 staff. A shortfall slows everyone in the pool and costs morale."
  kpi.funding: "Your latest priced round, the post-money valuation, and how much of the company the founder owns."
  kpi.people_cost: "Salaries, benefits and office space this month for the whole staff."
  kpi.mission: "The two interests the company stands for. People who share them are happier here."
  kpi.customers: "Paying customers (or users, for consumer products) across every segment now."
  kpi.product_costs: "Hosting and marketing this month across your products."
  kpi.hosting: "Compute to serve this product's customers this month."
  kpi.development: "How fast the team is improving the product: fast, steady or slow."
  kpi.fd_shares: "Every share, every option granted and the unallocated option pool."
  kpi.share_price: "The price per share of your latest priced round."
  kpi.post_money: "The company's value just after the latest priced round: pre-money plus the money raised."
  kpi.founder_owns: "The founder's share of the fully diluted company."
  kpi.board_confidence: "The directors' average confidence in you, 0 to 100. Below the removal line for too long, they replace the founder."
  kpi.board_seats: "Who sits on the board and who appointed them."
  kpi.board_expects: "What the board looks for at its next meeting."
  kpi.next_meeting: "When the board meets next; it meets every quarter."
  kpi.rival_staff: "People a rival has working on the markets you share, as far as you can tell."
  kpi.rival_revenue: "A rival's monthly revenue in the markets you share."
  kpi.rival_money: "How well funded a rival looks, in words."
  kpi.rival_stance: "How a rival is behaving toward you lately."
  kpi.lasted: "How long the company ran before the game ended."
  kpi.peak_headcount: "The most people on the staff at any month end."
  kpi.arr_at_end: "Annual run rate in the last month played."
  kpi.founder_owned: "The founder's share of the company when the game ended."

  # --- People, recruitment and the org ------------------------------------------------------
  name: "Who or what the row is about. Click a name to open it."
  age: "Age in years at the current date."
  level: "Seniority: junior, mid, senior, lead or principal. It sets the market rate and what the person can manage."
  role: "The job the person does. It decides which skills matter most."
  role_label: "The job the person does or the plan hires for."
  salary: "Annual salary. Below the market rate it weighs on morale."
  morale: "How happy the person is, 0 to 100. It moves toward a target set by pay, fit, runway, their manager and teammates."
  form: "How well the person is working lately."
  top: "The person's three strongest skills as far as you know them. Ranges narrow as you learn more."
  status: "Where the row stands now: active, on notice, open, closed, live and so on."
  unit: "The department or team the person belongs to."
  manager: "Who the person reports to, and how that manager is coping."
  skill_range: "What you know of this skill, 1 to 20. A range narrows as you work with someone or check references."
  personality_range: "What you know of this personality trait, 1 to 20. Interviews narrow it."
  asks: "The salary the candidate expects. Offers well below it are often declined."
  interests: "What the candidate cares about. Shared with the company mission, it lifts morale."
  known: "What you have done to learn about the candidate: screened, interviewed, references checked."
  actions: "What you can do next, and the energy each action costs."

  # --- Hiring plans --------------------------------------------------------------------------
  owner_name: "The delegate who runs the plan with their own energy."
  channel: "Where the search looks: job posts, a recruiter, or the founder's network."
  hired: "People hired so far against the plan's target."
  ratio_bp: "The highest salary the delegate may offer, as a share of the candidate's ask."
  equity_bp: "Equity offered with each hire, in percent of the company."
  unit_name: "The unit new hires join."
  focus: "What the delegate looks for first: skill, fit or cost."
  activity: "What the delegate did for the plan last month."

  # --- Products and markets ------------------------------------------------------------------
  category_label: "The kind of product: B2B SaaS, consumer app and so on."
  quality: "How good the product is, 0 to 100. Builders raise it; with nobody working on it, it falls."
  feature_score: "How complete the product's features are, 0 to 100."
  brand: "How well known and trusted the product is, 0 to 100. Marketing raises it."
  customers: "Customers (or users) now."
  mrr_cents: "Monthly recurring revenue in the last closed month."
  trend: "How the number moved over the last months."
  pace: "How fast the team is improving the product: fast, steady or slow."
  appeal: "How attractive the product is to this segment: its quality, price, brand and features, weighed the segment's way."
  price_cents: "The monthly price per customer in this segment."
  price: "The monthly price per customer in this segment."
  share_of_served: "This product's share of the segment's customers who are buying something."
  company_name: "The company that sells the product, or whose save it is."
  segment: "The customer segment: consumers, small businesses, mid-market or enterprise."
  reach: "How new customers find the product: by themselves, or through your sales team."
  new_last_month: "New customers won in the last closed month."
  churned_last_month: "Customers lost in the last closed month."
  churn: "The share of customers lost each month."

  # --- Rivals ----------------------------------------------------------------------------------
  personality_label: "The rival's style: how it tends to price, build and hire."
  stance: "How the rival is behaving toward you lately."
  competes: "The markets where the rival sells against you."
  staff_estimate: "People the rival has, as far as you can tell."
  money: "How well funded the rival looks, in words."
  last: "The rival's latest move you know of."
  running_now: "What the rival is doing with the product now: a price cut, a marketing push and so on."

  # --- Finance: cap table, rounds, board --------------------------------------------------------
  holder: "Who owns the shares: founder, investors, employees through options, or the pool."
  share_class: "Common shares, preferred shares from priced rounds, or options."
  shares: "Shares held."
  fraction: "Share of the fully diluted company: every share, option and the unallocated pool."
  fraction_before: "Share of the fully diluted company now."
  fraction_after: "Share of the fully diluted company after the round closes."
  change: "How the share changes with this round."
  granted: "Options granted to the person."
  vested: "Options the person has earned so far."
  unvested: "Options still to be earned; they lapse if the person leaves."
  next: "When the next options vest."
  start_turn: "When the options were granted."
  firm_name: "The investor offering the term sheet."
  pre_money_cents: "What the investor values the company at before their money goes in."
  post_money_cents: "Pre-money plus the money raised."
  amount_cents: "How much money the investor puts in."
  own: "The founder's share of the company if you accept this term sheet."
  seat: "The board seat that comes with the money, if any."
  expires_turn: "The last month you can accept the term sheet."
  confidence: "How confident the director is in you, 0 to 100."
  trend_board: "How the director's confidence moved over recent months."
  months_below: "Months in a row the board's confidence has been under the removal line."
  seated_label: "When the director joined the board."

  # --- History -------------------------------------------------------------------------------
  month: "The month it happened."
  category: "People, products, finance, rivals or events."
  what: "What happened, with links to the people and products involved."
  by: "Who did it: you, a named delegate, or 'Default (at Continue)' for an event left unanswered."

  # --- Saves ---------------------------------------------------------------------------------
  display_name: "The save's name. Renaming it never changes the company's name."
  scenario_id: "How the game started: the scenario's money and situation."
  difficulty: "Easy, standard, hard or Ironman. Ironman saves cannot be copied or restored."
  turn: "The game date the save has reached."
  game_state: "Active, or how the game ended: bankrupt or founder removed."
  last_played: "When the save last changed on this computer."
  size_bytes: "The save file's size on disk."
  backup_kind: "Periodic backups come every 12 months of play; others were taken before an upgrade."
  backup_taken: "When the backup file was written."

  # --- Statements (Finance) -------------------------------------------------------------------
  statement_line: "A line of the profit and loss, in thousands of dollars. Hover a line for what it holds."
  period: "One month, quarter or year of the statements, in thousands of dollars. An asterisk marks a period still in progress."
  line.revenue: "Everything customers paid in the period."
  line.gross: "Revenue minus the cost of serving customers (hosting)."
  line.opex: "Operating expenses: salaries, benefits, rent, recruiting, marketing and general costs."
  line.interest: "Interest paid on debt (none in v1)."
  line.tax: "Income tax (none in v1)."
  line.net: "What is left after every cost: the period's profit or loss."
  account.4000_revenue_subscriptions: "Recurring subscription revenue from your products."
  account.4100_revenue_licenses: "Revenue from licences."
  account.4200_revenue_services: "Revenue from services work."
  account.4900_other_income: "Money in from events and other one-off gains."
  account.5000_cogs: "Direct costs of what you sold."
  account.6000_salaries: "Salaries paid to the staff."
  account.6010_benefits: "Benefits on top of salaries."
  account.6100_rent: "Office space for people who work from the office."
  account.6200_recruiting: "Job posts, recruiter fees and other hiring costs."
  account.6300_compute: "Hosting: the compute that serves your customers."
  account.6400_marketing: "Marketing budgets of your products."
  account.6500_research_development: "Research and development outside salaries."
  account.6900_general_admin: "Overhead, tools, travel, severance and other general costs."
  account.7000_interest: "Interest on debt."
  account.8000_income_tax: "Income tax."
  # M8: divisions, executives and new markets (formulas.md 18)
  division_line: "A line of a division's statement, in thousands of dollars: its own revenue and costs, then its share of corporate costs."
  division_column: "Corporate, each division, and the company. Divisions and corporate add up to the company."
  division.shared_services: "Corporate operating costs shared by headcount among corporate and the central divisions. A reporting line: no cash moves."
  division.direct_profit: "The division's revenue minus the costs of its own people and products."
  division.operating_profit: "Direct profit after the shared-services allocation."
  division.layer_tax: "Each layer below a department under a division costs 3% of output (never more than 15%); a strong COO halves it."
  division.cross_division: "A product built by units in more than one division loses 10% of its output."
  division.embedded: "Embedded services: the division keeps its own support staff and decides faster, so its output and capacity rise 5%. It takes no share of corporate costs."
  seat.fit: "How well someone suits a seat, judged from what you know of their skills. An estimate."
  seat.vacancy: "From stage 3, an empty seat costs the company half the effect of a weak holder."
