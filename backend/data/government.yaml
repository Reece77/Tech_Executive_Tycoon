# --- Sourcing rules (57.3) -----------------------------------------------------------------------------
bans:
  - key: s889
    label: "Section 889 (FY2019 NDAA): no covered Chinese telecommunications or video equipment"
    governments: [us]
    countries: [china] # Huawei, ZTE, Hytera, Hikvision, Dahua: the game bans the country's share of a product
    start: "2019-08" # part A, 13 Aug 2019; part B (contractors' own use) 13 Aug 2020
domestic_content:
  - governments: [us]
    areas: [devices, chips, space]
    steps:
      - { start: "2010-01", share: [0.50, "R:buy_american"] }
      - { start: "2020-01", share: [0.55, "R:buy_american"] }
      - { start: "2022-10", share: [0.60, "S:buy_american"] }
      - { start: "2024-01", share: [0.65, "S:buy_american"] }
