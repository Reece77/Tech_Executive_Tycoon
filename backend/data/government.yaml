trusted_foundry:
  governments: [us]
  start: "2004-01"
  countries: [us]
controlled_countries: [china, russia] # 22 CFR 126.1: a controlled item may not be sold there

# --- Clearances (57.3) ---------------------------------------------------------------------------------
# p90_days: the fastest 90% of initial cases, end to end (PAC); the game's median a case is
# government.clearances.median_of_p90 x this plus sponsor_months (balance.yaml). never_share: candidates who
# never clear: denials (0.2% of DCSA adjudications in FY2021; 6.5-9.2% of initial cases at CIA and NSA in
# FY2014) plus discontinued cases (A: candidates who withdraw or leave before a decision).
clearances:
  secret:
    p90_days: { 2010: [120, "A:pac_2018"], 2016: [200, "A:pac_2018"], 2018: [240, "S:pac_2018"], 2019: [234, "S:pac_2018"], 2024: [138, "S:pac_2024"] } # 2010: before the 2016-2018 backlog (A)
    never_share: [0.05, "A:odni_denials"]
    cost_usd: [433, 2024, "R:dcsa_prices"]
  top_secret:
    p90_days: { 2010: [300, "A:pac_2018"], 2016: [450, "A:pac_2018"], 2018: [538, "S:pac_2018"], 2019: [468, "S:pac_2018"], 2024: [249, "S:pac_2024"] }
    never_share: [0.08, "A:odni_denials"]
    cost_usd: [5410, 2024, "R:dcsa_prices"]
facility_clearance_months: [[6, "A:game"], [12, "A:game"]] # a facility clearance (FCL) sponsored by a tender: about 6-12 months

# --- Protests (57.2) -----------------------------------------------------------------------------------
