# Defence and government contracts (docs/formulas.md 57, M44). Research: docs/v5-research/defence-dossier.md
# (its "Verification (M44)" section records what was checked, how, and what stays unverified).
#
# Every number is [value, "TAG:source"] (money [value, dollar year, "TAG:source"] under keys ending _usd,
# _usd_m or _usd_bn; a {year: [value, tag]} money series is in each year's dollars). TAG: S sourced
# (the figure as the source prints it), D derived from sourced figures (the derivation in a comment),
# R recalled or read from a secondary report of the source (checked where the comment says), A an
# assumption for play (its basis in a comment). `source` names a key of `sources`; the loader refuses a
# number without a tag and a known source. Money is converted to 2010 dollars with `cpi` at load (real
# scale); the engine applies the game's scale (balance.yaml economy_scale.money, formulas.md 54).
# History holds to 2025 (budgets, the named tenders, rules and their dates); seeded after.

sources:
  sipri_milex: { title: "SIPRI Military Expenditure Database, current US$ (release April 2025, data 1949-2024)", url: "https://www.sipri.org/databases/milex" }
  sipri_fs: { title: "SIPRI Fact Sheets, Trends in world military expenditure (2011-2025 editions)", url: "https://www.sipri.org/sites/default/files/2025-04/2504_fs_milex_2024.pdf" }
  sipri_top100: { title: "SIPRI Arms Industry Database / Yearbook 2012 table 5A (2010 arms sales)", url: "https://www.sipri.org/databases/armsindustry" }
  bls_cpi: { title: "US BLS CPI-U, annual averages (as vehicles.yaml and robotics.yaml)", url: "https://www.bls.gov/cpi/" }
  gao_it_2015: { title: "GAO blog, A closer look at a new high-risk area: management of federal IT projects (17 Feb 2015): about $80 billion a year", url: "https://www.gao.gov/blog/2015/02/17/a-closer-look-at-a-new-high-risk-area-management-of-federal-information-technology-projects" }
  gao_20_691t: { title: "GAO-20-691T, Information Technology (Aug 2020): over $90 billion a year", url: "https://www.gao.gov/products/gao-20-691t" }
  gao_24_106693: { title: "GAO-24-106693, IT: agencies' spending (Dec 2023): about $95 billion on the IT Dashboard, more than $100 billion a year", url: "https://www.gao.gov/products/GAO-24-106693" }
  it_2010: { title: "FY2010 federal IT budget, $76-82 billion by source (OMB Exhibit 53 totals as reported by InformationWeek and FY2012 analyses)", url: "https://www.itdashboard.gov/" }
  dod_itca: { title: "DoD FY2024 IT and cyberspace activities budget overview (about $58 billion; R, not read directly)", url: "https://comptroller.defense.gov/" }
  jedi: { title: "JEDI: award to Microsoft 25 Oct 2019 ($10B ceiling, 10 years); AWS protest Nov 2019; cancelled 6 July 2021 (Defense Daily, HPCwire, CIO Dive, 6 July 2021)", url: "https://www.hpcwire.com/2021/07/06/pentagon-cancels-jedi-cloud-contract/" }
  jwcc: { title: "JWCC: AWS, Google, Microsoft and Oracle, $9B shared ceiling, 7 Dec 2022, ordering to June 2028 (Nextgov)", url: "https://www.nextgov.com/cxo-briefing/2022/12/amazon-google-microsoft-oracle-awarded-9b-pentagon-cloud-contract/380596/" }
