# --- Governments (57.1) --------------------------------------------------------------------------------
# defence_usd_bn: SIPRI military expenditure, current US$ billions (SIPRI's April 2025 database; the
# database revises every year, so 2010 reads 738 for the US where the 2011 fact sheet printed 698). Data to
# 2024; 2025 holds 2024's value, then seeded (formulas.md 57.1). civil_it_usd_bn: US federal IT spending;
# other governments' civil technology budgets are civil_ratio x defence (A: the US's ratio, about 0.10-0.12).
# open_to: blocs (countries.yaml) whose companies may bid; refuses: blocs whose militaries' suppliers it
# will not buy from (57.4). China's and the US-aligned governments' defence buyers refuse each other's.
# rest_of_eu = the EU-27 less France and Germany (D: the sum of member states in SIPRI's sheet, less both).
governments:
  - key: us
    label: United States
    country: us
    open_to: [us_aligned]
    refuses: [china]
    defence_usd_bn: { 2010: [738.0, "S:sipri_milex"], 2012: [725.2, "S:sipri_milex"], 2014: [647.8, "S:sipri_milex"], 2016: [639.9, "S:sipri_milex"], 2018: [682.5, "S:sipri_milex"], 2020: [778.4, "S:sipri_milex"], 2022: [860.7, "S:sipri_milex"], 2024: [997.3, "S:sipri_milex"] }
    civil_it_usd_bn: { 2010: [78.0, "R:it_2010"], 2015: [80.0, "S:gao_it_2015"], 2020: [90.0, "S:gao_20_691t"], 2024: [95.0, "S:gao_24_106693"] } # IT Dashboard scope: excludes about $37B of DoD national-security IT
