  cdao: { title: "CDAO: Deputy Secretary memo 8 Dec 2021; initial operating capability 1 Feb 2022, full 1 Jun 2022 (Defense News, 2 Jun 2022)", url: "https://media.defense.gov/2022/Feb/02/2002931807/-1/-1/1/MEMORANDUM-ON-ESTABLISHMENT-OF-THE-CHIEF-DIGITAL-AND-ARTIFICIAL-INTELLIGENCE-OFFICER.PDF" }
