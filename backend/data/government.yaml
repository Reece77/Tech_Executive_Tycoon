# buyers (selling to sanctioned states is out of scope; the Gulf is not a game country).

# --- Programme areas (57.1) ----------------------------------------------------------------------------
# defence_share / civil_share: of a defence / civil technology budget spent in the area on what the game's
# products sell (A: DoD IT and cyberspace about $58B of about $850B, about 7% (dod_itca, R), split by the
# game's areas; space about 3.5% (the Space Force's budget, about $30B, A)). controlled: defence work in the
# area makes the product a controlled (ITAR-style) item (57.3). space's categories are M40's.
areas:
  cloud: { categories: [cloud_hosting], defence_share: [0.012, "A:dod_itca"], civil_share: [0.22, "A:gao_24_106693"], controlled: false }
  ai: { categories: [ai_models], defence_share: [0.006, "A:cdao"], civil_share: [0.04, "A:game"], controlled: true }
  space: { categories: [launch, satellite_broadband, earth_observation], defence_share: [0.035, "A:game"], civil_share: [0.02, "A:game"], controlled: true }
  chips: { categories: [chips_mobile_soc, chips_server_cpu, chips_ai_accelerator], defence_share: [0.004, "A:chips_act"], civil_share: [0.0, "A:game"], controlled: true }
  devices: { categories: [devices, servers], defence_share: [0.012, "A:dod_itca"], civil_share: [0.12, "A:game"], controlled: true }
  cyber: { categories: [cybersecurity], defence_share: [0.010, "A:dod_itca"], civil_share: [0.12, "A:game"], controlled: false }

# --- Named tenders to 2025 (57.1-57.2) -----------------------------------------------------------------
# announced / closes: the solicitation's month and its bid deadline (A where the comment says so: the record
# gives the award). value_usd_m: the ceiling (or the orders the record gives) in the award year's dollars.
# winners are the record's; without a player bid each is awarded as history. names are primes (below) or
# game companies (incumbents.yaml, entrants.yaml).
tenders:
  - key: maven
    title: Project Maven (Algorithmic Warfare Cross-Functional Team)
    government: us
    area: ai
    announced: "2017-04" # the Work memo, 26 Apr 2017
    closes: "2017-07" # A
    awarded: "2017-09" # A: Google's contract was reported from September 2017
    value_usd_m: [15, 2017, "A:maven"] # A: reported at $9-15M for the pilot
    term_years: 2 # ended March 2019, not renewed (announced 1 Jun 2018)
    contract: fixed_price
    clearance: secret
    winners: [Google Cloud]
    note: "Google's staff protested (about 3,100-4,000 signatures, about a dozen resignations); not renewed"
  - key: jedi
    title: Joint Enterprise Defense Infrastructure (JEDI) cloud
    government: us
    area: cloud
    announced: "2018-07"
    closes: "2018-10" # bids due 12 Oct 2018 (R)
    awarded: "2019-10"
    value_usd_m: [10000, 2019, "S:jedi"]
    term_years: 10
    contract: idiq
    clearance: top_secret
    winners: [Microsoft Azure]
    protested_by: [Amazon Web Services]
    cancelled: "2021-07"
  - key: nssl_phase2
    title: National Security Space Launch Phase 2
    government: us
    area: space
    announced: "2019-05" # A: the RFP of May 2019
    closes: "2019-08" # A
    awarded: "2020-08"
    value_usd_m: [653, 2020, "S:nssl2"] # the first orders (ULA $337M, SpaceX $316M); about 34 missions in all
    term_years: 7
    contract: idiq
    awards: 2
    clearance: secret
    winners: [United Launch Alliance, SpaceX]
  - key: sda_t1_transport
    title: SDA Tranche 1 Transport Layer
    government: us
    area: space
    announced: "2021-08" # A
    closes: "2021-11" # A
    awarded: "2022-02"
    value_usd_m: [1800, 2022, "S:sda"]
    term_years: 4
    contract: fixed_price
    awards: 3
    clearance: secret
    winners: [Lockheed Martin, Northrop Grumman, York Space Systems]
  - key: jwcc
    title: Joint Warfighting Cloud Capability (JWCC)
    government: us
    area: cloud
    announced: "2021-11" # A: solicitations to the four in November 2021
    closes: "2022-03" # A
    awarded: "2022-12"
    value_usd_m: [9000, 2022, "S:jwcc"]
    term_years: 6 # a 3-year base and options to June 2028
    contract: idiq
    awards: 4
    clearance: top_secret
    winners: [Amazon Web Services, Google Cloud, Microsoft Azure, Oracle]
  - key: sda_t2_tracking
    title: SDA Tranche 2 Tracking Layer
    government: us
    area: space
    announced: "2023-06" # A
    closes: "2023-09" # A
    awarded: "2024-01"
    value_usd_m: [2500, 2024, "S:sda"]
    term_years: 4
    contract: fixed_price
    awards: 3
    clearance: secret
    winners: [L3Harris, Lockheed Martin, Sierra Space]
  - key: nssl_phase3_lane1
    title: National Security Space Launch Phase 3 Lane 1
    government: us
    area: space
    announced: "2023-10" # A
    closes: "2024-01" # A
    awarded: "2024-06"
    value_usd_m: [5600, 2024, "S:nssl3"]
    term_years: 5
    contract: idiq
    awards: 3
    clearance: secret
